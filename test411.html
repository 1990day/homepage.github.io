<!DOCTYPE html>
<html lang="ko">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5522499110435321" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">

  <title>테스트잇 사주 성향 보고서 테스트</title>
  <meta name="description" content="테스트잇 사주 성향 보고서 테스트">
  <meta name="keywords" content="테스트잇,사주테스트,사주성격,사주성향,사주보고서,오행,십성">
  <meta property="og:type" content="website">
  <meta property="og:title" content="테스트잇 사주 성향 보고서 테스트">
  <meta property="og:description" content="생년월일시로 알아보는 나의 사주 성향 보고서">
  <meta property="og:url" content="https://test-it.co.kr/test411">
  <meta property="og:image" content="https://test-it.co.kr/img_main411.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- 만세력 계산과 결과 이미지 생성 -->
  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: 'Galmuri14';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri14.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --ink: #171717;
      --muted: #6f6c67;
      --bg: #f5f2ec;
      --paper: #fffdf9;
      --yellow: #ffe16f;
      --yellow-soft: #fff3b8;
      --pink: #ffb8c5;
      --mint: #b7e2d2;
      --blue: #acd7f5;
      --line: #222222;
      --wood: #7db68a;
      --earth: #d8ab64;
      --metal: #989da8;
      --water: #69a5cc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Galmuri14', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Galmuri14', sans-serif;
      letter-spacing: -.6px;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .site-header {
      width: 100%;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e4e0d8;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      width: min(100%, 600px);
      height: 56px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #555;
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.4px;
    }

    .nav a {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 18px 10px 42px;
    }

    .screen {
      display: none;
      overflow-anchor: none;
    }
    .screen.active { display: block; }

    .btn {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 900;
    }

    .btn.white {
      margin-top: 8px;
      background: #fff;
      color: var(--ink);
    }

    .btn:active { transform: translateY(1px); }

    /* 메인·입력·로딩 공통 파스텔 비주얼 */
    .hero {
      width: 100%;
      background: transparent;
    }

    .main-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .pastel-corners {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .pastel-corner {
      position: absolute;
      display: block;
    }

    .corner-yellow {
      width: 225px;
      height: 205px;
      left: -70px;
      top: -58px;
      border-radius: 34% 66% 51% 49% / 45% 43% 57% 55%;
      background: var(--yellow);
      transform: rotate(8deg);
    }

    .corner-blue {
      width: 185px;
      height: 150px;
      right: -73px;
      top: 36px;
      border-radius: 56% 44% 38% 62% / 54% 48% 52% 46%;
      background: var(--blue);
      transform: rotate(-8deg);
    }

    .corner-mint {
      width: 190px;
      height: 180px;
      left: -73px;
      bottom: -55px;
      border-radius: 54% 46% 54% 46% / 42% 58% 42% 58%;
      background: var(--mint);
      transform: rotate(11deg);
    }

    .corner-pink {
      width: 215px;
      height: 175px;
      right: -66px;
      bottom: -49px;
      border-radius: 55% 45% 38% 62% / 52% 40% 60% 48%;
      background: var(--pink);
      transform: rotate(-7deg);
    }

    /* 입력 */
    .form-card,
    .loading-card {
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }

    .form-card { padding: 42px 20px 24px; }

    .form-content {
      position: relative;
      z-index: 2;
    }

    .form-head {
      padding-bottom: 19px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--ink);
      text-align: center;
    }

    .form-kicker {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -.4px;
    }

    .form-title {
      margin: 0;
      font-size: 29px;
      line-height: 1.2;
      letter-spacing: -1.7px;
    }

    .form-desc {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
    }

    .field { margin-bottom: 18px; }

    .field-label,
    .field > label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 900;
    }

    .text-input,
    select {
      width: 100%;
      height: 50px;
      padding: 0 12px;
      border: 1.7px solid var(--ink);
      border-radius: 0;
      background: #fff;
      outline: none;
      font-size: 14px;
      font-weight: 750;
    }

    .text-input:focus,
    select:focus { box-shadow: 0 0 0 3px var(--yellow-soft); }

    .calendar-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .radio-box input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio-box label {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.7px solid var(--ink);
      border-radius: 0;
      background: #fff;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .radio-box input:checked + label { background: var(--yellow); }

    .date-row {
      display: grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      gap: 7px;
    }

    .leap-wrap {
      display: none;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .leap-wrap.show { display: flex; }

    .time-note {
      margin: 8px 1px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      font-weight: 700;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 11px 12px;
      border: 1.5px solid #b94e48;
      border-radius: 0;
      background: #fff0ef;
      color: #8a302a;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 800;
    }

    .error.show { display: block; }

    /* 로딩 */
    .loading-card {
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .form-card .pastel-corner,
    .loading-card .pastel-corner {
      transform: scale(.72);
    }

    .form-card .corner-yellow,
    .loading-card .corner-yellow { left: -92px; top: -82px; }

    .form-card .corner-blue,
    .loading-card .corner-blue { right: -88px; top: 14px; }

    .form-card .corner-mint,
    .loading-card .corner-mint { left: -91px; bottom: -74px; }

    .form-card .corner-pink,
    .loading-card .corner-pink { right: -89px; bottom: -74px; }

    .loading-content { position: relative; z-index: 2; }

    .loading-circles {
      width: 104px;
      height: 68px;
      margin: 0 auto 20px;
      position: relative;
    }

    .loading-circles span {
      position: absolute;
      top: 4px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .loading-circles span:first-child {
      left: 0;
      background: var(--yellow);
      animation: circle-left 1.5s ease-in-out infinite;
    }

    .loading-circles span:last-child {
      right: 0;
      background: var(--pink);
      animation: circle-right 1.5s ease-in-out infinite;
    }

    @keyframes circle-left {
      0%, 100% { transform: translateX(0) scale(1); }
      50% { transform: translateX(42px) scale(.88); }
    }

    @keyframes circle-right {
      0%, 100% { transform: translateX(0) scale(.88); }
      50% { transform: translateX(-42px) scale(1); }
    }

    .loading-title {
      margin: 0 0 9px;
      font-size: 27px;
      letter-spacing: -1.4px;
    }

    .loading-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      font-weight: 700;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .loading-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ink);
      animation: dot 1.1s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: .18s; background: var(--pink); }
    .loading-dots span:nth-child(3) { animation-delay: .36s; background: var(--blue); }

    @keyframes dot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* 결과 */
    .result-capture {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 10px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
    }

    .result-inner {
      overflow: hidden;
      border: 1.5px solid var(--ink);
      border-radius: 0;
      background: #fff;
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 7px 10px;
      border-bottom: 1.5px solid var(--ink);
      background: var(--paper);
    }

    .result-head-main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .result-head-main::before,
    .result-head-main::after {
      flex: 0 0 auto;
      border: 0;
      background: none;
      font-size: 15px;
      line-height: 1;
      font-weight: 900;
    }

    .result-head-main::before {
      content: '[';
    }

    .result-head-main::after {
      content: ']';
    }

    .result-doc-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: -1px;
      font-weight: 950;
      white-space: nowrap;
    }

    .result-main {
      padding: 17px 12px 13px;
      background:
        radial-gradient(circle at 88% 15%, var(--yellow) 0 44px, transparent 45px),
        radial-gradient(circle at 8% 82%, var(--mint) 0 34px, transparent 35px),
        #fff;
    }

    .result-name {
      display: none;
    }

    .result-type {
      margin: 0 auto;
      max-width: 330px;
      text-align: center;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -1.4px;
      font-weight: 900;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-left: 1.5px solid var(--ink);
      border-top: 1.5px solid var(--ink);
      margin: 0 12px 13px;
    }

    .feature {
      min-height: 174px;
      padding: 11px 10px;
      border-right: 1.5px solid var(--ink);
      border-bottom: 1.5px solid var(--ink);
    }

    .feature.full { grid-column: 1 / -1; min-height: 0; }

    .feature-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .feature-no {
      flex: 0 0 auto;
      width: 23px;
      height: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.3px solid var(--ink);
      border-radius: 0;
      font-size: 8px;
      font-weight: 900;
    }

    .feature:nth-child(4n+1) .feature-no { background: var(--yellow); }
    .feature:nth-child(4n+2) .feature-no { background: var(--pink); }
    .feature:nth-child(4n+3) .feature-no { background: var(--mint); }
    .feature:nth-child(4n) .feature-no { background: var(--blue); }

    .feature h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.3;
    }

    .feature p {
      margin: 0;
      color: #3f3d39;
      font-size: 11.8px;
      line-height: 1.62;
      font-weight: 720;
    }

    .feature p .trait-line {
      display: block;
    }

    .feature p .trait-line + .trait-line {
      margin-top: 6px;
    }

    .feature p .trait-label {
      font-weight: 950;
      color: var(--ink);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .chips span {
      padding: 4px 6px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: #fff;
      font-size: 8.5px;
      font-weight: 900;
    }

    .element-bars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .element-col { text-align: center; }
    .element-col b { display: block; margin-bottom: 4px; font-size: 9px; }
    .bar-track { height: 58px; display: flex; align-items: flex-end; background: #f1eee8; border-radius: 0; overflow: hidden; }
    .bar-fill { width: 100%; min-height: 3px; }
    .element-col em { display: block; margin-top: 4px; font-size: 8px; font-style: normal; font-weight: 900; }

    .result-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-top: 1.5px solid var(--ink);
      color: var(--muted);
      font-size: 7px;
      line-height: 1.35;
      font-weight: 800;
    }

    .result-buttons {
      display: grid;
      gap: 0;
      margin-top: 13px;
    }

    /* 광고 */
    .ad-wrap {
      width: 100%;
      margin: 18px auto 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }

    .ad-wrap iframe,
    .ad-wrap div,
    .ad-wrap ins {
      max-width: 100%;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    /* 저장 팝업 */
    .save-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 18px 12px;
      align-items: center;
      justify-content: center;
      background: rgba(18,18,18,.82);
    }

    .save-modal.active { display: flex; }

    .save-modal-box {
      width: 100%;
      max-width: 320px;
      padding: 13px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
      text-align: center;
    }

    .save-modal-title {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 900;
    }

    .save-modal-desc {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 750;
    }

    .save-preview {
      width: 170px;
      max-width: 58%;
      max-height: 58vh;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
      border: 1.5px solid var(--ink);
      border-radius: 0;
      background: #fff;
      -webkit-touch-callout: default;
      user-select: auto;
    }

    .modal-close {
      width: 100%;
      height: 45px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
    }

    @media (max-width: 430px) {
      .wrap { padding: 12px 7px 34px; }
      .header-inner { padding: 0 11px; }
      .logo { font-size: 19px; }
      .nav { gap: 11px; font-size: 15px; }
      .form-card { padding: 38px 14px 21px; }
      .date-row { gap: 5px; }
      .date-row select { padding: 0 8px; }
      .result-capture { padding: 8px; }
      .result-head { min-height: 38px; padding: 6px 7px; }
      .result-head-main { gap: 6px; }
      .result-head-main::before,
      .result-head-main::after { font-size: 13px; }
      .result-doc-title { font-size: 14px; letter-spacing: -.9px; }
      .result-main { padding: 15px 9px 11px; }
      .result-type { font-size: 17px; }
      .feature-grid { margin: 0 9px 10px; }
      .feature { min-height: 170px; padding: 11px 9px; }
      .feature p { font-size: 11.4px; }
    }

    @media (max-width: 360px) {
      .nav a:nth-child(2), .nav a:nth-child(3) { display: none; }
      .date-row { grid-template-columns: 1fr 1fr; }
      .date-row select:first-child { grid-column: 1 / -1; }
      .feature-grid { grid-template-columns: 1fr; }
      .feature.full { grid-column: 1; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="https://test-it.co.kr/" class="logo">테스트잇</a>
      <nav class="nav">
        <a href="https://test-it.co.kr/test.html">성격</a>
        <a href="https://test-it.co.kr/face.html">얼굴</a>
        <a href="https://test-it.co.kr/etc.html">그외</a>
        <a href="https://test-it.co.kr/saju.html">사주</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- 메인 -->
    <section id="mainScreen" class="screen active">
      <div class="hero">
        <img class="main-image" src="img_main411.png" alt="테스트잇 사주 성향 보고서 테스트">
      </div>
      <button class="btn" type="button" onclick="goInput()">테스트 시작하기</button>
    </section>

    <!-- 정보 입력 -->
    <section id="inputScreen" class="screen">
      <div class="form-card">
        <div class="pastel-corners" aria-hidden="true">
          <span class="pastel-corner corner-yellow"></span>
          <span class="pastel-corner corner-blue"></span>
          <span class="pastel-corner corner-mint"></span>
          <span class="pastel-corner corner-pink"></span>
        </div>
        <div class="form-content">
          <div class="form-head">
            <p class="form-kicker">테스트잇</p>
            <h2 class="form-title">정보를 입력해주세요</h2>
            <p class="form-desc">입력한 정보는 결과 계산에만 사용됩니다.</p>
          </div>

          <form id="sajuForm" novalidate>
          <div class="field">
            <label for="nicknameInput">이름 또는 닉네임</label>
            <input id="nicknameInput" class="text-input" type="text" maxlength="12" autocomplete="off" placeholder="최대 12자">
          </div>

          <div class="field">
            <span class="field-label">생일 기준</span>
            <div class="calendar-row">
              <div class="radio-box">
                <input id="solarType" name="calendarType" type="radio" value="solar" checked>
                <label for="solarType">양력</label>
              </div>
              <div class="radio-box">
                <input id="lunarType" name="calendarType" type="radio" value="lunar">
                <label for="lunarType">음력</label>
              </div>
            </div>
            <label id="leapWrap" class="leap-wrap"><input id="isLeap" type="checkbox"> 윤달</label>
          </div>

          <div class="field">
            <span class="field-label">생년월일</span>
            <div class="date-row">
              <select id="birthYear" aria-label="출생 연도"></select>

    function showScreen(screen) {

    function addOptions(select, values, formatter, placeholder) {
      select.innerHTML = placeholder ? `<option value="">${placeholder}</option>` : '';
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = formatter(value);
        select.appendChild(option);
      });
    }

    function initForm() {
      const now = new Date();
      const years = [];
      for (let year = now.getFullYear(); year >= 1920; year--) years.push(year);
      addOptions(document.getElementById('birthYear'), years, value => `${value}년`, '연도');
      addOptions(document.getElementById('birthMonth'), Array.from({length:12}, (_,i) => i + 1), value => `${value}월`, '월');
      document.getElementById('birthTime').innerHTML = TIME_OPTIONS.map(item => `<option value="${item.value}">${item.label}</option>`).join('');
      updateDays();
    }

    function updateDays() {
      const year = Number(document.getElementById('birthYear').value) || new Date().getFullYear();
      const month = Number(document.getElementById('birthMonth').value) || 1;
      const isLunar = document.querySelector('input[name="calendarType"]:checked').value === 'lunar';
      const daySelect = document.getElementById('birthDay');
      const previous = daySelect.value;
      const max = isLunar ? 30 : new Date(year, month, 0).getDate();
      addOptions(daySelect, Array.from({length:max}, (_,i) => i + 1), value => `${value}일`, '일');
      if (previous && Number(previous) <= max) daySelect.value = previous;
    }

    function toKoreanGanZhi(gz) {
      if (!gz || gz.length < 2) return '';
      return `${STEM[gz[0]]?.ko || gz[0]}${BRANCH[gz[1]]?.ko || gz[1]}`;
    }

    function tenGod(dayStem, targetStem) {
      const day = STEM[dayStem];
      const target = STEM[targetStem];
      const samePolarity = day.polarity === target.polarity;
      if (day.element === target.element) return samePolarity ? '비견' : '겁재';
      if (GENERATES[day.element] === target.element) return samePolarity ? '식신' : '상관';
      if (CONTROLS[day.element] === target.element) return samePolarity ? '편재' : '정재';
      if (CONTROLS[target.element] === day.element) return samePolarity ? '편관' : '정관';
      if (GENERATES[target.element] === day.element) return samePolarity ? '편인' : '정인';
      return '비견';
    }

    function getElementScores(pillars) {
      const score = { '목':0, '화':0, '토':0, '금':0, '수':0 };
      pillars.forEach((pillar, index) => {
        score[STEM[pillar.gan].element] += 10;
        const branch = BRANCH[pillar.zhi];
        score[branch.element] += 7;
        branch.hidden.forEach((stem, hiddenIndex) => {
          score[STEM[stem].element] += [5,2.5,1.5][hiddenIndex] || 1;
        });
        if (index === 1) score[branch.element] += 12;
      });
      const total = Object.values(score).reduce((a,b) => a + b, 0);
      const percent = {};
      Object.entries(score).forEach(([key,value]) => percent[key] = Math.round(value / total * 100));
      const highest = Object.keys(percent).sort((a,b) => percent[b] - percent[a])[0];
      percent[highest] += 100 - Object.values(percent).reduce((a,b) => a + b, 0);
      return percent;
    }

    function getTenGodData(pillars, dayStem) {
      const score = { '비견':0, '겁재':0, '식신':0, '상관':0, '편재':0, '정재':0, '편관':0, '정관':0, '편인':0, '정인':0 };
      pillars.forEach((pillar, index) => {
        if (index !== 2) score[tenGod(dayStem, pillar.gan)] += 2;
        BRANCH[pillar.zhi].hidden.forEach((stem, hiddenIndex) => {
          score[tenGod(dayStem, stem)] += hiddenIndex === 0 ? 1.4 : .7;
        });
      });
      const familyScore = { '비겁':0, '식상':0, '재성':0, '관성':0, '인성':0 };
      Object.entries(score).forEach(([god,value]) => familyScore[GOD[god].family] += value);
      const gods = Object.keys(score).sort((a,b) => score[b] - score[a]);
      const families = Object.keys(familyScore).sort((a,b) => familyScore[b] - familyScore[a]);
      return { score, familyScore, topGod:gods[0], secondGod:gods[1], topFamily:families[0], secondFamily:families[1] };
    }

    function includesPair(values, a, b) { return values.includes(a) && values.includes(b); }

    function getInteractions(pillars) {
      const branches = pillars.map(item => item.zhi);
      const stems = pillars.map(item => item.gan);
      const found = [];

      [
        { set:['申','子','辰'], name:'신자진 삼합' },
        { set:['亥','卯','未'], name:'해묘미 삼합' },
        { set:['寅','午','戌'], name:'인오술 삼합' },
        { set:['巳','酉','丑'], name:'사유축 삼합' }
      ].forEach(item => {
        if (item.set.every(zhi => branches.includes(zhi))) found.push({type:'삼합', name:item.name});
      });

      [['子','丑'],['寅','亥'],['卯','戌'],['辰','酉'],['巳','申'],['午','未']].forEach(pair => {
        if (includesPair(branches, ...pair)) found.push({type:'합', name:`${BRANCH[pair[0]].ko}${BRANCH[pair[1]].ko}합`});
      });
      [['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']].forEach(pair => {
        if (includesPair(branches, ...pair)) found.push({type:'충', name:`${BRANCH[pair[0]].ko}${BRANCH[pair[1]].ko}충`});
      });
      [['子','卯'],['寅','巳'],['巳','申'],['寅','申'],['丑','戌'],['戌','未'],['丑','未']].forEach(pair => {
        if (includesPair(branches, ...pair)) found.push({type:'형', name:`${BRANCH[pair[0]].ko}${BRANCH[pair[1]].ko}형`});
      });
      ['辰','午','酉','亥'].forEach(zhi => {
        if (branches.filter(item => item === zhi).length >= 2) found.push({type:'형', name:`${BRANCH[zhi].ko}자형`});
      });
      [['子','未'],['丑','午'],['寅','巳'],['卯','辰'],['申','亥'],['酉','戌']].forEach(pair => {
        if (includesPair(branches, ...pair)) found.push({type:'해', name:`${BRANCH[pair[0]].ko}${BRANCH[pair[1]].ko}해`});
      });
      [['甲','己'],['乙','庚'],['丙','辛'],['丁','壬'],['戊','癸']].forEach(pair => {
        if (includesPair(stems, ...pair)) found.push({type:'합', name:`${STEM[pair[0]].ko}${STEM[pair[1]].ko}합`});
      });

      return found.filter((item,index,array) => array.findIndex(value => value.type === item.type && value.name === item.name) === index);
    }

    function getStrength(dayStem, scores) {
      const self = STEM[dayStem].element;
      const support = scores[self] + scores[GENERATED_BY[self]];
      if (support >= 56) return { mode:'strong', label:'주관이 확고함' };
      if (support >= 45) return { mode:'strong', label:'스스로의 중심이 강함' };
      if (support >= 34) return { mode:'weak', label:'상황 변화에 민감함' };
      return { mode:'weak', label:'스트레스에 취약함' };
    }

    function withSubjectParticle(text) {
      const last = text.charCodeAt(text.length - 1);
      const hasFinalConsonant = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 !== 0;
      return `${text}${hasFinalConsonant ? '이' : '가'}`;
    }

    function withTopicParticle(text) {
      const last = text.charCodeAt(text.length - 1);
      const hasFinalConsonant = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 !== 0;
      return `${text}${hasFinalConsonant ? '은' : '는'}`;
    }

    function getBalanceText(pillars, scores) {
      const visibleCount = { '목':0, '화':0, '토':0, '금':0, '수':0 };
      pillars.forEach(pillar => {
        visibleCount[STEM[pillar.gan].element] += 1;
        visibleCount[BRANCH[pillar.zhi].element] += 1;
      });

      const visibleMax = Math.max(...Object.values(visibleCount));
      const visibleHigh = Object.keys(visibleCount).filter(element => visibleCount[element] === visibleMax);
      const scoreMax = Math.max(...Object.values(scores));
      const scoreHigh = Object.keys(scores).filter(element => scores[element] === scoreMax);
      const scoreMin = Math.min(...Object.values(scores));
      const scoreLow = Object.keys(scores).filter(element => scores[element] === scoreMin);

      const visibleNames = visibleHigh.join('·');
      const visibleText = visibleHigh.length === 1
        ? `${withSubjectParticle(visibleNames)} ${visibleMax}개로 가장 많음.`
        : `${withSubjectParticle(visibleNames)} 각각 ${visibleMax}개로 가장 많음.`;

      let weightedText;
      if (scoreHigh.length > 1) {
        const scoreNames = scoreHigh.join('·');
        weightedText = `태어난 달의 힘과 각 글자 안에 숨은 기운까지 더하면 ${withSubjectParticle(scoreNames)} 각각 ${scoreMax}%로 가장 강하게 계산됨.`;
      } else if (!visibleHigh.includes(scoreHigh[0])) {
        const high = scoreHigh[0];
        weightedText = `하지만 ${withTopicParticle(high)} 겉으로 ${visibleCount[high]}개이며, 태어난 달의 힘과 각 글자 안에 숨은 기운이 더해져 ${scoreMax}%로 가장 강하게 계산됨.`;
      } else {
        const high = scoreHigh[0];
        weightedText = `태어난 달의 힘과 각 글자 안에 숨은 기운까지 더해도 ${withSubjectParticle(high)} ${scoreMax}%로 가장 강하게 계산됨.`;
      }

      const lowNames = scoreLow.join('·');
      const lowText = scoreLow.length === 1
        ? `${withTopicParticle(lowNames)} ${scoreMin}%로 가장 약함.`
        : `${withTopicParticle(lowNames)} 각각 ${scoreMin}%로 가장 약함.`;

      return `겉으로 보이는 사주 글자만 세면 ${visibleText} ${weightedText} ${lowText}`;
    }

    function getInteractionResult(interactions) {
      if (!interactions.length) {
        return {
          title:'무난하고 안정적인 구조',
          text:'기운이 크게 부딪히는 일 없이 상황이 부드럽게 흘러가는 편임. 다만 익숙한 것을 바꾸는 데 시간이 다소 걸릴 수 있으며, 납득할 만한 확실한 이유가 있어야 안정적으로 변화를 받아들임.',
          chips:['안정 추구','경험 중시','확실한 이유']
        };
      }
      const primary = interactions[0];
      return {
        title:`${interactions.slice(0,2).map(item => item.name).join('·')} 작용`,
        text:INTERACTION_TEXT[primary.type],
        chips:interactions.slice(0,3).map(item => item.name)
      };
    }

    function buildResult(input, lunar, solar, eightChar) {
      const pillars = [
        {label:'년주', gan:eightChar.getYearGan(), zhi:eightChar.getYearZhi()},
        {label:'월주', gan:eightChar.getMonthGan(), zhi:eightChar.getMonthZhi()},
        {label:'일주', gan:eightChar.getDayGan(), zhi:eightChar.getDayZhi()}
      ];
      if (input.timeKnown) pillars.push({label:'시주', gan:eightChar.getTimeGan(), zhi:eightChar.getTimeZhi()});

      const dayStem = pillars[2].gan;
      const dayBranch = pillars[2].zhi;
      const dayGz = dayStem + dayBranch;
      const scores = getElementScores(pillars);
      const ten = getTenGodData(pillars, dayStem);
      const interactions = getInteractions(pillars);
      const interaction = getInteractionResult(interactions);
      const strength = getStrength(dayStem, scores);
      const yearGod = tenGod(dayStem, pillars[0].gan);
      const monthGod = tenGod(dayStem, pillars[1].gan);
      const dayInnerGod = tenGod(dayStem, BRANCH[dayBranch].hidden[0]);
      const sortedElements = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
      const highElement = sortedElements[0];
      const lowElement = sortedElements[sortedElements.length - 1];
      const title = `${input.name}님의 사주 성향 분석`;
      const chartCode = pillars.map(item => toKoreanGanZhi(item.gan + item.zhi)).join(' · ');
      const solarText = `${solar.getYear()}.${String(solar.getMonth()).padStart(2,'0')}.${String(solar.getDay()).padStart(2,'0')}`;
      const lunarText = `${lunar.getYear()}년 ${Math.abs(lunar.getMonth())}월 ${lunar.getDay()}일${lunar.getMonth() < 0 ? ' 윤달' : ''}`;
      const hashSource = `${pillars.map(item => item.gan + item.zhi).join('')}-${input.calendarType}-${input.timeKey}`;
      let hash = 0;
      for (let i = 0; i < hashSource.length; i++) hash = (hash * 31 + hashSource.charCodeAt(i)) % 1000;

      const yearGz = pillars[0].gan + pillars[0].zhi;

      const features = [
        {
          title:'찐 성격 분석',
          text:`${STEM[dayStem].simple}. ${BRANCH[dayBranch].trait} ${INNER_BY_GOD[dayInnerGod]}`,
          chips:[]
        },
        {
          title:'남들이 보는 내 첫인상',
          text:OUTER_BY_GOD[yearGod],
          chips:[`${toKoreanGanZhi(yearGz)} 년주`, `첫인상 ${yearGod}`, GOD[yearGod].short]
        },
        {
          title:'연애할 때 특징',
          text:`${LOVE_BY_STEM[dayStem]} ${LOVE_BY_GOD[dayInnerGod]}`,
          chips:[]
        },
        {
          title:'여럿이 있을 때 특징',
          text:`${SOCIAL_BY_BRANCH[pillars[1].zhi]} ${SOCIAL_BY_GOD[monthGod]}`,
          chips:[`월지 ${BRANCH[pillars[1].zhi].ko}`, `사회 ${monthGod}`, GOD[monthGod].short]
        },
        {
          title:'스트레스 받을 때',
          text:`${PRESSURE_BY_FAMILY[ten.topFamily][strength.mode]} ${interaction.text}`,
          chips:[strength.label, ...interaction.chips.slice(0,2)]
        },
        {
          title:'성격 장단점 요약',
          text:`<span class="trait-line"><span class="trait-label">장점 :</span> ${ELEMENT_STRENGTH[highElement]}.</span><span class="trait-line"><span class="trait-label">단점 :</span> ${ELEMENT_CAUTION[lowElement]}.</span>`,
          chips:[`${highElement} 강점`, `${lowElement} 보완`, '장점·단점']
        }
      ];

      features.push({
        title:'오행 한눈에 보기',
        text:getBalanceText(pillars, scores),
        chips:[],
        full:true,
        bars:true
      });

      return {
        ...input,
        pillars,
        scores,
        ten,
        features,
        title,
        chartCode,
        solarText,
        lunarText,
        hash:String(hash).padStart(3,'0')
      };
    }

    function barsHTML(scores) {
      return `<div class="element-bars">${Object.keys(ELEMENT).map(element => `
        <div class="element-col">
          <b>${element}</b>
          <div class="bar-track"><span class="bar-fill" style="height:${Math.max(scores[element],5)}%;background:${ELEMENT[element].color}"></span></div>
          <em>${scores[element]}%</em>
        </div>`).join('')}</div>`;
    }

    function renderResult(data) {
      lastResult = data;
      document.getElementById('resultName').textContent = `${data.name}님의 사주 분석 보고서`;
      document.getElementById('resultType').innerHTML = data.title;
      document.getElementById('featureGrid').innerHTML = data.features.map((item,index) => `
        <article class="feature${item.full ? ' full' : ''}">
          <div class="feature-top"><span class="feature-no">0${index + 1}</span><h3>${item.title}</h3></div>
          <p>${item.text}</p>
          ${item.chips.length ? `<div class="chips">${item.chips.map(chip => `<span>${chip}</span>`).join('')}</div>` : ''}
          ${item.bars ? barsHTML(data.scores) : ''}
        </article>`).join('');
      showScreen(resultScreen);
    }

    function parseInput() {
      const errorBox = document.getElementById('formError');
      errorBox.classList.remove('show');

      if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') {
        throw new Error('사주 계산 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.');
      }

      const name = document.getElementById('nicknameInput').value.trim();
      const year = Number(document.getElementById('birthYear').value);
      const month = Number(document.getElementById('birthMonth').value);
      const day = Number(document.getElementById('birthDay').value);
      const calendarType = document.querySelector('input[name="calendarType"]:checked').value;
      const leap = calendarType === 'lunar' && document.getElementById('isLeap').checked;
      const timeKey = document.getElementById('birthTime').value;
      const timeOption = TIME_OPTIONS.find(item => item.value === timeKey);
      const timeKnown = timeKey !== 'unknown';
      const hour = timeKnown ? timeOption.hour : 12;
      const minute = timeKnown ? timeOption.minute : 0;

      if (!name) throw new Error('이름 또는 닉네임을 입력해주세요.');
      if (!year || !month || !day) throw new Error('생년월일을 모두 선택해주세요.');

      if (calendarType === 'solar') {
        const check = new Date(year, month - 1, day);
        if (check.getFullYear() !== year || check.getMonth() !== month - 1 || check.getDate() !== day) {
          throw new Error('존재하지 않는 양력 날짜입니다. 날짜를 다시 확인해주세요.');
        }
      }

      let solar;
      let lunar;
      if (calendarType === 'solar') {
        solar = Solar.fromYmdHms(year, month, day, hour, minute, 0);
        lunar = solar.getLunar();
      } else {
        if (leap && typeof LunarYear !== 'undefined') {
          const actualLeapMonth = LunarYear.fromYear(year).getLeapMonth();
          if (actualLeapMonth !== month) {
            const guide = actualLeapMonth ? `이 해의 윤달은 ${actualLeapMonth}월입니다.` : '이 해에는 윤달이 없습니다.';
            throw new Error(`선택한 ${month}월은 윤달이 아닙니다. ${guide}`);
          }
        }
        lunar = Lunar.fromYmdHms(year, leap ? -month : month, day, hour, minute, 0);
        if (leap && lunar.getMonth() !== -month) {
          throw new Error('윤달 날짜를 올바르게 변환하지 못했습니다. 날짜를 다시 확인해주세요.');
        }
        solar = lunar.getSolar();
      }

      const eightChar = lunar.getEightChar();
      if (typeof eightChar.setSect === 'function') eightChar.setSect(2);

      return buildResult({
        name,
        calendarType,
        leap,
        timeKey,
        timeKnown,
        timeBranch:timeKnown ? timeOption.branch : '',
        hour:timeKnown ? hour : null,
        minute:timeKnown ? minute : null
      }, lunar, solar, eightChar);
    }

    function restartTest() {
      document.getElementById('sajuForm').reset();
      document.getElementById('leapWrap').classList.remove('show');
      document.getElementById('birthYear').value = '';
      document.getElementById('birthMonth').value = '';
      updateDays();
      document.getElementById('birthTime').value = 'unknown';
      document.getElementById('formError').classList.remove('show');
      lastResult = null;
      showScreen(mainScreen);
    }

    async function saveResultImage() {
      try {
        const canvas = await html2canvas(document.getElementById('resultCapture'), {
          scale:2,
          useCORS:true,
          backgroundColor:'#fffdf9',
          scrollX:0,
          scrollY:-window.scrollY,
          logging:false
        });
        document.getElementById('savePreview').src = canvas.toDataURL('image/png');
        document.getElementById('saveModal').classList.add('active');
        document.body.style.overflow = 'hidden';
      } catch (error) {
        console.error('결과 이미지 생성 오류:', error);
        alert('이미지를 만들지 못했습니다. 다시 시도해주세요.');
      }
    }

    function closeSaveModal() {
      document.getElementById('saveModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    async function shareTest() {
      const shareData = { title:TEST_TITLE, url:TEST_URL };
      try {
        if (navigator.share) await navigator.share(shareData);
        else {
          await navigator.clipboard.writeText(`${TEST_TITLE}\n${TEST_URL}`);
          alert('테스트 제목과 링크가 복사됐어요!');
        }
      } catch (error) {
        if (error.name !== 'AbortError') console.log(error);
      }
    }

    document.getElementById('birthYear').addEventListener('change', updateDays);
    document.getElementById('birthMonth').addEventListener('change', updateDays);

    document.querySelectorAll('input[name="calendarType"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isLunar = document.getElementById('lunarType').checked;
        document.getElementById('leapWrap').classList.toggle('show', isLunar);
        if (!isLunar) document.getElementById('isLeap').checked = false;
        updateDays();
      });
    });

    document.getElementById('sajuForm').addEventListener('submit', event => {
      event.preventDefault();
      try {
        const data = parseInput();
        showScreen(loadingScreen);
        setTimeout(() => renderResult(data), 3000);
      } catch (error) {
        let message = error && error.message ? error.message : '입력 정보를 다시 확인해주세요.';
        if (message.includes('wrong lunar') || message.includes('only')) {
          message = '선택한 음력 날짜 또는 윤달이 실제 달력과 맞지 않습니다. 날짜를 다시 확인해주세요.';
        }
        const errorBox = document.getElementById('formError');
        errorBox.textContent = message;
        errorBox.classList.add('show');
      }
    });

    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') closeSaveModal();
    });

    initForm();
  </script>
</body>
