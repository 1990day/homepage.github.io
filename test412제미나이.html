<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>테스트잇 그냥 그런 성격 테스트</title>
  <meta name="description" content="평소 내 성격을 16가지 유형으로 알아보는 테스트">
  <meta property="og:title" content="테스트잇 그냥 그런 성격 테스트">
  <meta property="og:description" content="나는 그냥 어떤 성격일까?">
  <meta property="og:url" content="https://test-it.co.kr/test412">
  <link rel="canonical" href="https://test-it.co.kr/test412">

  <style>
    @font-face {
      font-family: 'Galmuri14';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri14.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --ink: #151515;
      --paper: #ffffff;
      --soft: #f5f5f3;
      --line: 1px solid var(--ink);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #fff;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #fff;
      color: var(--ink);
      font-family: 'Galmuri14', 'Malgun Gothic', sans-serif;
      letter-spacing: -0.25px;
      word-break: keep-all;
      text-align: center;
      font-weight: 400;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .site-header {
      width: 100%;
      border-bottom: var(--line);
      background: #fff;
    }

    .header-inner {
      width: min(100%, 660px);
      min-height: 58px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .logo {
      color: var(--ink);
      text-decoration: none;
      font-size: 22px;
      line-height: 1;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 13px;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav a {
      color: var(--ink);
      text-decoration: none;
    }

    .page-shell {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 26px 14px 70px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .paper-box {
      border: var(--line);
      background: var(--paper);
    }

    /* 시작 화면 */
    .start-card {
      width: min(100%, 520px);
      margin: 10px auto 0;
      border: var(--line);
      background: #fff;
    }

    .start-title {
      padding: 25px 16px 22px;
      border-bottom: var(--line);
      text-align: center;
    }

    .start-title h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: normal;
      line-height: 1.48;
      letter-spacing: -1px;
    }

    .start-title p {
      margin: 13px 0 0;
      color: #444;
      font-size: 14px;
      line-height: 1.65;
    }

    .main-drawing {
      position: relative;
      height: 310px;
      margin: 12px;
      overflow: hidden;
      border: var(--line);
      background:
        linear-gradient(to right, transparent calc(50% - .5px), var(--ink) calc(50% - .5px), var(--ink) calc(50% + .5px), transparent calc(50% + .5px)),
        linear-gradient(to bottom, transparent calc(50% - .5px), var(--ink) calc(50% - .5px), var(--ink) calc(50% + .5px), transparent calc(50% + .5px));
    }

    .doodle-cell {
      position: absolute;
      width: 50%;
      height: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 14px;
      text-align: center;
    }

    .doodle-cell:nth-child(1) { left: 0; top: 0; }
    .doodle-cell:nth-child(2) { right: 0; top: 0; }
    .doodle-cell:nth-child(3) { left: 0; bottom: 0; }
    .doodle-cell:nth-child(4) { right: 0; bottom: 0; }

    .mini-icon {
      width: 76px;
      height: 76px;
    }

    .line-icon,
    .mini-icon {
      display: block;
      color: var(--ink);
    }

    .line-icon *:not(text),
    .mini-icon *:not(text) {
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }

    .start-action {
      padding: 0 12px 14px;
    }

    .primary-btn,
    .result-btn {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }

    .primary-btn:active,
    .result-btn:active {
      transform: translateY(1px);
    }

    /* 질문 화면 */
    .question-wrap {
      width: min(100%, 540px);
      margin: 5px auto 0;
    }

    .progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
      font-size: 13px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border: var(--line);
      background: #fff;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--ink);
      transition: width .22s ease;
    }

    .question-card {
      min-height: 402px;
      margin-top: 18px;
      border: var(--line);
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .question-number {
      padding: 12px 14px;
      border-bottom: var(--line);
      font-size: 13px;
    }

    .question-text {
      min-height: 152px;
      padding: 35px 22px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(19px, 5.2vw, 24px);
      line-height: 1.62;
    }

    .answer-list {
      margin-top: auto;
      border-top: var(--line);
    }

    .answer-btn {
      width: 100%;
      min-height: 76px;
      padding: 16px 18px;
      border: 0;
      border-bottom: var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
    }

    .answer-btn:last-child {
      border-bottom: 0;
    }

    @media (hover: hover) {
      .answer-btn:hover {
        background: var(--soft);
      }
      .nav a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    }

    .answer-btn:disabled {
      cursor: default;
    }

    .answer-btn.selected {
      background: var(--ink);
      color: #fff;
    }

    /* 결과 화면 */
    .result-area {
      width: min(100%, 592px);
      margin: 0 auto;
    }

    .result-sheet {
      width: 100%;
      padding: 12px;
      border: var(--line);
      background: #fff;
    }

    .result-main-title {
      min-height: 57px;
      padding: 13px 10px;
      border: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(20px, 5.2vw, 27px);
      line-height: 1.35;
      letter-spacing: -0.7px;
    }

    .result-top {
      display: grid;
      grid-template-columns: 136px 194px 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .identity-box {
      min-height: 181px;
      padding: 8px 6px 7px;
      border: var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .type-label {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 18px;
      line-height: 1.2;
    }

    .result-icon {
      width: 92px;
      height: 92px;
      margin: 2px auto;
    }

    .quick-boxes {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
    }

    .quick-box {
      border: var(--line);
      display: grid;
      grid-template-columns: 62px 1fr;
      align-items: stretch;
      min-height: 87px;
    }

    .box-label {
      padding: 8px 6px;
      border-right: var(--line);
      background: #f7f7f5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
    }

    .box-value {
      padding: 8px 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.52;
    }

    .summary-box {
      min-height: 181px;
      border: var(--line);
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      padding: 8px 10px;
      border-bottom: var(--line);
      background: #f7f7f5;
      text-align: center;
      font-size: 13px;
    }

    .summary-text {
      flex: 1;
      padding: 14px 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.65;
    }

    .trait-list {
      margin-top: 9px;
      border: var(--line);
    }

    .trait-row {
      min-height: 47px;
      border-bottom: var(--line);
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: stretch;
    }

    .trait-row:last-child {
      border-bottom: 0;
    }

    .trait-number {
      border-right: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      font-size: 12px;
    }

    .trait-text {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.55;
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .match-box {
      min-height: 104px;
      border: var(--line);
    }

    .match-title {
      padding: 8px 10px;
      border-bottom: var(--line);
      background: #f7f7f5;
      text-align: center;
      font-size: 13px;
    }

    .match-types {
      min-height: 62px;
      padding: 10px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
    }

    .match-chip + .match-chip::before {
      content: '·';
      margin-right: 8px;
    }

    .result-actions {
      width: min(100%, 520px);
      margin: 22px auto 0;
      display: grid;
      gap: 9px;
    }

    .result-btn.secondary {
      background: #fff;
      color: var(--ink);
    }

    .save-note {
      margin: 12px 0 0;
      color: #555;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    /* 이미지 저장 팝업 */
    .save-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.72);
    }

    .save-modal.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 420px);
      max-height: 92vh;
      overflow: auto;
      padding: 12px;
      border: 1px solid #fff;
      background: #fff;
    }

    .modal-guide {
      margin: 0 0 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .saved-image {
      display: block;
      width: 100%;
      height: auto;
      border: var(--line);
      -webkit-touch-callout: default;
    }

    .modal-close {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: var(--line);
      border-radius: 0;
      background: #fff;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10000;
      min-width: 210px;
      max-width: calc(100% - 32px);
      padding: 12px 15px;
      border: var(--line);
      background: #fff;
      text-align: center;
      font-size: 13px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      .page-shell {
        padding: 20px 10px 58px;
      }

      .header-inner {
        min-height: 54px;
        padding: 0 11px;
      }

      .logo {
        font-size: 20px;
      }

      .nav {
        gap: 9px;
        font-size: 12px;
      }

      .result-sheet {
        padding: 7px;
      }

      .result-top {
        grid-template-columns: 105px 1fr;
        gap: 6px;
        margin-top: 7px;
      }

      .identity-box {
        min-height: 180px;
      }

      .type-label {
        font-size: 15px;
      }

      .result-icon {
        width: 79px;
        height: 79px;
      }

      .quick-boxes {
        gap: 5px;
      }

      .quick-box {
        grid-template-columns: 54px 1fr;
      }

      .box-label,
      .box-value {
        font-size: 11px;
      }

      .summary-box {
        grid-column: 1 / -1;
        min-height: 114px;
      }

      .summary-text {
        padding: 11px 12px;
        font-size: 12px;
      }

      .trait-list {
        margin-top: 7px;
      }

      .trait-row {
        min-height: 48px;
        grid-template-columns: 31px 1fr;
      }

      .trait-text {
        padding: 8px 9px;
        font-size: 11.5px;
        line-height: 1.5;
      }

      .match-grid {
        gap: 6px;
        margin-top: 7px;
      }

      .match-title,
      .match-types {
        font-size: 11.5px;
      }

      .match-types {
        padding: 9px 5px;
        gap: 4px;
      }

      .match-chip + .match-chip::before {
        margin-right: 4px;
      }
    }

    @media (max-width: 370px) {
      .nav {
        gap: 7px;
        font-size: 11px;
      }

      .logo {
        font-size: 18px;
      }

      .trait-text {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="https://test-it.co.kr/">테스트잇</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="https://test-it.co.kr/test.html">성격</a>
        <a href="https://test-it.co.kr/face.html">얼굴</a>
        <a href="https://test-it.co.kr/etc.html">그외</a>
        <a href="https://test-it.co.kr/saju.html">사주</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section id="startScreen" class="screen active" aria-label="테스트 시작 화면">
      <div class="start-card">
        <div class="start-title">
          <h1>테스트잇<br>그냥 그런 성격 테스트</h1>
          <p>별거 아닌 것 같지만<br>은근 정확한 내 성격 결과표</p>
        </div>

        <div class="main-drawing" aria-hidden="true">
          <div class="doodle-cell">
            <svg class="mini-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 70 79 30l9 51Z"/><path d="M28 61c7 3 12 9 13 17M48 49c8 2 15 8 18 16"/>
              <circle cx="53" cy="62" r="5"/><circle cx="70" cy="48" r="4"/><path d="M18 71c-5 12 7 18 15 8 7 11 18 5 18-2"/>
            </svg>
            <span>낭만적인 사색가</span>
          </div>
          <div class="doodle-cell">
            <svg class="mini-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M24 78h52M30 71h40l-4-35H34Z"/><path d="m35 36 5-15 10 13 10-13 5 15"/><circle cx="50" cy="52" r="7"/>
            </svg>
            <span>독립적인 전략가</span>
          </div>
          <div class="doodle-cell">
            <svg class="mini-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M39 68h22M42 75h16M35 57c-7-6-11-13-10-22 1-13 11-23 25-23s25 10 25 24c0 9-4 15-10 21-4 4-5 7-5 11H40c0-4-1-7-5-11Z"/><path d="m50 1 0 7M14 19l6 4M86 19l-6 4M8 48l8-1M92 48l-8-1"/>
            </svg>
            <span>호기심 많은 탐구자</span>
          </div>
          <div class="doodle-cell">
            <svg class="mini-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 67c9-18 18-29 31-29s22 11 31 29"/><path d="M18 68h64v10H18zM28 37c0-13 9-23 22-23s22 10 22 23"/><path d="m23 35 8-7M77 35l-8-7M41 52h18"/>
            </svg>
            <span>유쾌한 분위기 메이커</span>
          </div>
        </div>

        <div class="start-action">
          <button id="startBtn" class="primary-btn" type="button">테스트 시작하기</button>
        </div>
      </div>
    </section>

    <section id="questionScreen" class="screen" aria-label="성격 질문">
      <div class="question-wrap">
        <div class="progress-head">
          <span>그냥 그런 성격 테스트</span>
          <span id="progressCount">1 / 12</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="question-card">
          <div id="questionNumber" class="question-number">질문 01</div>
          <div id="questionText" class="question-text"></div>
          <div id="answerList" class="answer-list"></div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen" aria-label="테스트 결과">
      <div class="result-area">
        <div id="resultSheet" class="result-sheet">
          <div class="result-main-title">테스트잇 그냥 그런 성격 테스트</div>

          <div class="result-top">
            <div class="identity-box">
              <div id="resultName" class="type-label"></div>
              <div id="resultIcon" class="result-icon"></div>
            </div>

            <div class="quick-boxes">
              <div class="quick-box">
                <div class="box-label">첫인상</div>
                <div id="firstImpression" class="box-value"></div>
              </div>
              <div class="quick-box">
                <div class="box-label">실제 모습</div>
                <div id="realSelf" class="box-value"></div>
              </div>
            </div>

            <div class="summary-box">
              <div class="summary-label">한눈에 보는 성격</div>
              <div id="resultSummary" class="summary-text"></div>
            </div>
          </div>

          <div id="traitList" class="trait-list"></div>

          <div class="match-grid">
            <div class="match-box">
              <div class="match-title">시너지가 좋은 유형</div>
              <div id="goodMatch" class="match-types"></div>
            </div>
            <div class="match-box">
              <div class="match-title">서로 맞춰가야 할 유형</div>
              <div id="badMatch" class="match-types"></div>
            </div>
          </div>
        </div>

        <div class="result-actions">
          <button id="saveBtn" class="result-btn" type="button">결과 이미지 저장하기</button>
          <button id="retryBtn" class="result-btn secondary" type="button">다시 해보기</button>
          <button id="otherBtn" class="result-btn secondary" type="button">다른 테스트 해보기</button>
          <button id="shareBtn" class="result-btn secondary" type="button">테스트 공유하기</button>
        </div>
        <p class="save-note">결과 이미지는 팝업에서 꾹 눌러 저장할 수 있어요.</p>
      </div>
    </section>
  </main>

  <div id="saveModal" class="save-modal" role="dialog" aria-modal="true" aria-label="결과 이미지 저장">
    <div class="modal-card">
      <p class="modal-guide">아래 이미지를 꾹 눌러 저장해 주세요.</p>
      <img id="savedImage" class="saved-image" alt="그냥 그런 성격 테스트 결과 이미지">
      <button id="modalClose" class="modal-close" type="button">닫기</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const TEST_URL = 'https://test-it.co.kr/test412';

      maze: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M25 21h60v68H25z"/><path d="M25 37h16V27h18v19h15V33h11M25 59h26V49M39 59v15h18V62h16v27M25 82h18M57 74h9M85 54H73"/><circle cx="31" cy="30" r="2" fill="currentColor"/><path d="M78 84l7 5-7 5"/></svg>`,
      clipboard: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="19" width="60" height="76"/><path d="M43 19v-7h24v7M38 36h34M38 49h34M38 62h18"/><path d="M63 77c4-8 14-5 14 2 0 6-7 10-14 16-7-6-14-10-14-16 0-7 10-10 14-2Z"/></svg>`,
      eye: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 56s17-27 45-27 45 27 45 27-17 27-45 27S10 56 10 56Z"/><circle cx="55" cy="56" r="14"/><circle cx="55" cy="56" r="5" fill="currentColor"/><path d="M55 13v8M20 23l7 8M90 23l-7 8"/></svg>`,
      confetti: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 91 20-49 29 29Z"/><path d="M27 73c11 0 22 5 28 13M32 59c10 0 18 3 28 12M72 18l-3 12M91 35l-12 4M52 12l5 11M85 61l10 6"/><circle cx="84" cy="16" r="4"/><path d="m45 31 7-9 8 8M89 83l-5-9-8 7"/></svg>`,
      ruler: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 72 56-56 21 21-56 56Z"/><path d="m63 26 10 10M52 37l7 7M41 48l10 10M30 59l7 7M19 70l10 10"/></svg>`,
      checklist: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="12" width="67" height="86"/><path d="m33 34 5 5 9-11M54 34h23M33 58l5 5 9-11M54 58h23M33 82l5 5 9-11M54 82h23"/></svg>`,
      camera: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 38h24l6-11h27l6 11h23v52H12Z"/><circle cx="55" cy="64" r="18"/><circle cx="55" cy="64" r="8"/><path d="M20 48h10M82 49h7"/></svg>`,
      notebook: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 12h61v86H29zM20 12h9v86h-9zM17 25h17M17 43h17M17 61h17M17 79h17M43 32h32M43 48h32M43 64h24M43 80h29"/></svg>`,
      lightning: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M64 9 24 63h27l-6 38 41-58H61Z"/><path d="M16 27l12 8M91 75l10 7M13 82l12-6M87 19l-11 9"/></svg>`,
      wrench: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M68 15c-12-4-25 3-28 15-2 7 0 14 4 19L15 78c-6 6-6 15 0 21s15 6 21 0l29-29c6 4 13 6 20 4 12-3 19-16 15-28L82 64 67 49l18-18c-5-8-11-13-17-16Z"/><circle cx="25" cy="89" r="5"/></svg>`,
      disco: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="55" cy="58" r="30"/><path d="M25 58h60M31 41h48M31 75h48M55 28v60M40 32c7 18 7 36 0 52M70 32c-7 18-7 36 0 52M55 8v12M20 20l9 9M90 20l-9 9M8 58h10M102 58H92"/></svg>`,
      headphones: `<svg class="line-icon" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 59V48c0-22 16-39 38-39s38 17 38 39v11"/><rect x="12" y="55" width="18" height="37" rx="2"/><rect x="80" y="55" width="18" height="37" rx="2"/><path d="M30 64h7v20h-7M80 64h-7v20h7"/></svg>`
    };

    const screens = {
      start: document.getElementById('startScreen'),
      question: document.getElementById('questionScreen'),
      result: document.getElementById('resultScreen')
    };

    const state = {
      current: 0,
      scores: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 },
      locked: false,
      resultType: ''
    };

    function showScreen(name, moveTop = true) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
      if (moveTop) window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function resetTest() {
      state.current = 0;
      state.scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      state.locked = false;
      state.resultType = '';
    }

    function startTest() {
      resetTest();
      showScreen('question');
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[state.current];
      const displayNumber = String(state.current + 1).padStart(2, '0');
      document.getElementById('questionNumber').textContent = `질문 ${displayNumber}`;
      document.getElementById('questionText').innerHTML = question.text;
      document.getElementById('progressCount').textContent = `${state.current + 1} / ${questions.length}`;
      document.getElementById('progressBar').style.width = `${((state.current + 1) / questions.length) * 100}%`;

      const answerList = document.getElementById('answerList');
      answerList.innerHTML = '';
      question.answers.forEach(answer => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-btn';
        button.textContent = answer.text;
        button.addEventListener('click', () => selectAnswer(answer.letter, button));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(letter, selectedButton) {
      if (state.locked) return;
      state.locked = true;
      state.scores[letter] += 1;

      document.querySelectorAll('.answer-btn').forEach(button => button.disabled = true);
      selectedButton.classList.add('selected');

      window.setTimeout(() => {
        state.current += 1;
        state.locked = false;

        if (state.current < questions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 170);
    }

    function getResultType() {
      const first = state.scores.E >= state.scores.I ? 'E' : 'I';
      const second = state.scores.S >= state.scores.N ? 'S' : 'N';
      const third = state.scores.T >= state.scores.F ? 'T' : 'F';
      const fourth = state.scores.J >= state.scores.P ? 'J' : 'P';
      return first + second + third + fourth;
    }

    function makeMatchHtml(items) {
      return items.map(item => {
        const nameOnly = item.replace(/^[A-Z]{4}\s*/, '');
        return `<span class="match-chip">${nameOnly}</span>`;
      }).join('');
    }

    function showResult() {
      state.resultType = getResultType();
      const result = results[state.resultType];

      document.getElementById('resultName').textContent = result.name;
      document.getElementById('resultIcon').innerHTML = iconSvgs[result.icon];
      document.getElementById('firstImpression').textContent = result.first;
      document.getElementById('realSelf').textContent = result.real;
      document.getElementById('resultSummary').textContent = result.summary;

      document.getElementById('traitList').innerHTML = result.traits.map((trait, index) => `
        <div class="trait-row">
          <div class="trait-number">${String(index + 1).padStart(2, '0')}</div>
          <div class="trait-text">${trait}</div>
        </div>
      `).join('');

      document.getElementById('goodMatch').innerHTML = makeMatchHtml(result.good);
      document.getElementById('badMatch').innerHTML = makeMatchHtml(result.bad);

      showScreen('result');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1900);
    }

    async function saveResultImage() {
      const saveButton = document.getElementById('saveBtn');
      const originalText = saveButton.textContent;
      saveButton.disabled = true;
      saveButton.textContent = '이미지 만드는 중...';

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const target = document.getElementById('resultSheet');
        const canvas = await html2canvas(target, {
          backgroundColor: '#ffffff',
          scale: Math.min(window.devicePixelRatio * 1.5, 3),
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: -window.scrollY
        });

        const image = document.getElementById('savedImage');
        image.src = canvas.toDataURL('image/png');
        document.getElementById('saveModal').classList.add('open');
        document.body.style.overflow = 'hidden';
      } catch (error) {
        showToast('이미지를 만들지 못했어요. 다시 시도해 주세요.');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = originalText;
      }
    }

    function closeModal() {
      document.getElementById('saveModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    async function shareTest() {
      const shareData = {
        title: '테스트잇 그냥 그런 성격 테스트',
        text: '테스트잇 그냥 그런 성격 테스트',
        url: TEST_URL
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }

      try {
        await navigator.clipboard.writeText(`테스트잇 그냥 그런 성격 테스트\n${TEST_URL}`);
        showToast('테스트 주소를 복사했어요.');
      } catch (error) {
        const temporary = document.createElement('textarea');
        temporary.value = `테스트잇 그냥 그런 성격 테스트\n${TEST_URL}`;
        temporary.style.position = 'fixed';
        temporary.style.opacity = '0';
        document.body.appendChild(temporary);
        temporary.select();
        document.execCommand('copy');
        temporary.remove();
        showToast('테스트 주소를 복사했어요.');
      }
    }

    document.getElementById('startBtn').addEventListener('click', startTest);
    document.getElementById('retryBtn').addEventListener('click', () => {
      resetTest();
      showScreen('start');
    });
    document.getElementById('otherBtn').addEventListener('click', () => {
      window.location.href = 'https://test-it.co.kr/';
    });
    document.getElementById('saveBtn').addEventListener('click', saveResultImage);
    document.getElementById('shareBtn').addEventListener('click', shareTest);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') closeModal();
    });
  </script>
</body>
</html>
