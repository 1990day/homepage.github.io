        _getYearNineStar:function(yearInGanZhi){
          var indexExact = LunarUtil.getJiaZiIndex(yearInGanZhi) + 1;
          var index = LunarUtil.getJiaZiIndex(this.getYearInGanZhi()) + 1;
          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);
        },
        getYearNineStar:function(sect){
          var yearInGanZhi;
          switch (sect) {

              yearInGanZhi = this.getYearInGanZhi();

            case 3:
              yearInGanZhi = this.getYearInGanZhiExact();
              break;
            default:
              yearInGanZhi = this.getYearInGanZhiByLiChun();

          return this._getYearNineStar(yearInGanZhi);

        getMonthNineStar:function(sect){
          var yearZhiIndex;
          var monthZhiIndex;
          switch (sect) {
            case 1:
              yearZhiIndex = this._p.yearZhiIndex;
              monthZhiIndex = this._p.monthZhiIndex;
              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);
        },
        getTimeNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var asc = false;
          if((solarYmd >= this._getJieQiSolar(I18n.getMessage('jq.dongZhi')).toYmd() && solarYmd < this._getJieQiSolar(I18n.getMessage('jq.xiaZhi')).toYmd()) || solarYmd >= this._getJieQiSolar('DONG_ZHI').toYmd()){

          var start = offset[this.getDayZhiIndex() % 3];

          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);

        _buildJieQi:function(name, solar){
          var jie=false;
          var qi=false;
          for(var i=0,j=LunarUtil.JIE_QI.length;i<j;i++){
            if(LunarUtil.JIE_QI[i]===name){
              if(i%2===0){
                qi = true;
              }else{
                jie = true;
              }
              break;
            }
          }
          return {
            _p: {
              name: name,
              solar: solar,
              jie: jie,
              qi: qi
            },
            getName: function(){return this._p.name;},
            getSolar: function(){return this._p.solar;},

        _getNearJieQi:function(forward, conditions, wholeDay){
          var name = null;
          var near = null;
          var filters = {};
          var filter = false;
          if(null!=conditions){
            for(var i=0,j=conditions.length;i<j;i++){
              filters[conditions[i]] = true;
              filter = true;
            }
          }
          var today = this._p.solar[wholeDay ? 'toYmd' : 'toYmdHms']();
          for(var key in this._p.jieQi){
            var jq = this._convertJieQi(key);
            if(filter){
              if(!filters[jq]){
                continue;
              }
            }
            var solar = this._getJieQiSolar(key);
            var day = solar[wholeDay ? 'toYmd' : 'toYmdHms']();
            if(forward){
              if(day<=today){
                continue;
              }
              if(null == near || day < near[wholeDay ? 'toYmd' : 'toYmdHms']()){
                name = jq;
                near = solar;
              }
            }else{
              if(day>today){
                continue;
              }
              if(null == near || day > near[wholeDay ? 'toYmd' : 'toYmdHms']()) {
                name = jq;
                near = solar;
              }
            }
          }
          if(null==near){
            return null;
          }
          return this._buildJieQi(name, near);
        },

        getShuJiu:function(){
          var currentDay = Solar.fromYmd(this._p.solar.getYear(), this._p.solar.getMonth(), this._p.solar.getDay());
          var start = this._getJieQiSolar('DONG_ZHI');
          var startDay = Solar.fromYmd(start.getYear(), start.getMonth(), start.getDay());
          if (currentDay.isBefore(startDay)) {
            start = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
            startDay = Solar.fromYmd(start.getYear(), start.getMonth(), start.getDay());
          }
          var endDay = Solar.fromYmd(start.getYear(), start.getMonth(), start.getDay()).next(81);
          if (currentDay.isBefore(startDay) || (!currentDay.isBefore(endDay))) {
            return null;
          }
          var days = currentDay.subtract(startDay);
          return this._buildNameAndIndex(LunarUtil.NUMBER[Math.floor(days / 9) + 1] + '九', days % 9 + 1);
        },
        getFu:function(){
          var currentDay = Solar.fromYmd(this._p.solar.getYear(), this._p.solar.getMonth(), this._p.solar.getDay());
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var liQiu = this._getJieQiSolar(I18n.getMessage('jq.liQiu'));
          var startDay = Solar.fromYmd(xiaZhi.getYear(), xiaZhi.getMonth(), xiaZhi.getDay());

          // 第1个庚日
          var add = 6 - xiaZhi.getLunar().getDayGanIndex();
          if (add < 0) {
            add += 10;
          }
          // 第3个庚日，即初伏第1天
          add += 20;
          startDay = startDay.next(add);

          // 初伏以前
          if (currentDay.isBefore(startDay)) {
            return null;
          }

          var days = currentDay.subtract(startDay);
          if (days < 10) {
            return this._buildNameAndIndex('初伏', days + 1);
          }

          // 第4个庚日，中伏第1天
          startDay = startDay.next(10);

          days = currentDay.subtract(startDay);
          if (days < 10) {
            return this._buildNameAndIndex('中伏', days + 1);
          }

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'

const STEMS='甲乙丙丁戊己庚辛壬癸', BRANCHES='子丑寅卯辰巳午未申酉戌亥';
const KSTEMS=['갑','을','병','정','무','기','경','신','임','계'], KBRANCHES=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const LIBRARY_GOD_NAMES=['比肩','劫财','食神','伤官','偏财','正财','七杀','正官','偏印','正印'];
const HIDDEN=[...BRANCHES].map(branch=>LunarUtil.ZHI_HIDE_GAN[branch].map(stem=>STEMS.indexOf(stem)));
function koreanPillar(p){return p ? KSTEMS[STEMS.indexOf(p[0])]+KBRANCHES[BRANCHES.indexOf(p[1])] : '미상';}
function deity(day,stem){
 const name=LunarUtil.SHI_SHEN[STEMS[day]+STEMS[stem]],id=LIBRARY_GOD_NAMES.indexOf(name);
 if(id<0)throw Error('십신 계산 자료를 확인할 수 없습니다.');
 return id;
}
function shifted(input, minutes){const d=new Date(Date.UTC(input.year,input.month-1,input.day,input.hour||0,(input.minute||0)+minutes,input.second||0));return Solar.fromYmdHms(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds());}
function termsAt(input){ // 6tail 的节气表采用 UTC+8；韩国出生时刻减一小时后比较节入。
 const e=shifted(input,-60).getLunar().getEightChar();return [e.getYear(),e.getMonth()];
}
function chartFor(input){
 const correction=input.correction===30?30:0;
 let y,m,d,t=null,uncertain=[];
 if(Number.isInteger(input.timeBranch)){
   const z=input.timeBranch;
   if(z<0||z>11)throw Error('invalid time branch');
   const start=(1410+z*120)%1440,end=(start+119)%1440;
   const from=termsAt({...input,hour:z===0?0:Math.floor(start/60),minute:z===0?0:start%60});
   const to=termsAt({...input,hour:z===0?23:Math.floor(end/60),minute:z===0?59:end%60,second:59});
   y=from[0]===to[0]?from[0]:null;m=from[1]===to[1]?from[1]:null;
   if(!y)uncertain.push('년주');if(!m)uncertain.push('월주');
   const civil=Solar.fromYmdHms(input.year,input.month,input.day,12,0,0).getLunar().getEightChar();civil.setSect(2);d=civil.getDay();
   const g=(STEMS.indexOf(d[0])%5*2+z)%10;t=STEMS[g]+BRANCHES[z];
 }else if(input.unknown){
   const start=termsAt({...input,hour:0,minute:0}),end=termsAt({...input,hour:23,minute:59,second:59});
   y=start[0]===end[0]?start[0]:null;m=start[1]===end[1]?start[1]:null;
   if(!y)uncertain.push('년주');if(!m)uncertain.push('월주');
   // 날짜 경계에 영향을 주는 보정은 시간 미상일 때 적용하지 않습니다.
   const civil=Solar.fromYmdHms(input.year,input.month,input.day,12,0,0).getLunar().getEightChar();civil.setSect(2);d=civil.getDay();
 }else{
   [y,m]=termsAt(input);
   const corrected=shifted(input,-correction),e=corrected.getLunar().getEightChar();e.setSect(2);d=e.getDay();
   const z=Math.floor((corrected.getHour()+1)/2)%12, g=(STEMS.indexOf(d[0])%5*2+z)%10;
   t=STEMS[g]+BRANCHES[z];
 }
 return {pillars:[y,m,d,t],dayStem:STEMS.indexOf(d[0]),uncertain,unknown:input.unknown,correction};
}

function elementDistribution(chart){
 const counts=[0,0,0,0,0],occurrences=[];
 chart.pillars.forEach((pillar,pos)=>{
  if(!pillar)return;
  for(const [kind,char,lookup]of [['천간',pillar[0],LunarUtil.WU_XING_GAN],['지지',pillar[1],LunarUtil.WU_XING_ZHI]]){
   const element='木火土金水'.indexOf(lookup[char]);if(element<0)throw Error('오행 자료가 없습니다.');
   counts[element]++;occurrences.push({pos,kind,char,element});
  }
 });
 const maximum=Math.max(...counts),dominant=counts.map((n,i)=>n===maximum?i:-1).filter(i=>i>=0);
 return {counts,dominant,occurrences,missing:counts.map((n,i)=>n===0?i:-1).filter(i=>i>=0)};
}

function compositionFacts(chart){
 const elements=elementDistribution(chart),counts=elements.counts;
 // 6/8글자를 다섯 오행에 정확히 같은 개수로 나눌 수 없으므로, 모두 있고 차이가 1 이하면 고른 분포.
 elements.balanced=counts.every(n=>n>0)&&Math.max(...counts)-Math.min(...counts)<=1;
 const godCounts=Array(10).fill(0),entries=[],hidden=[];
 const day=STEMS.indexOf(chart.pillars[2][0]);
 chart.pillars.forEach((pillar,pos)=>{
  if(!pillar)return;
  if(pos!==2){const stem=STEMS.indexOf(pillar[0]),god=deity(day,stem);godCounts[god]++;entries.push({pos,kind:'천간',stem,god});}
  HIDDEN[BRANCHES.indexOf(pillar[1])].forEach((stem,i)=>{
   const god=deity(day,stem);hidden.push({pos,stem,god,main:i===0});
   if(i===0){godCounts[god]++;entries.push({pos,kind:'지지 본기',stem,god});}
  });
 });
 const max=Math.max(...godCounts);
 // 공동 최다는 전부 반영. 차이가 하나인 차순위도 두 자리 이상 반복되면 함께 반영합니다.
 const strong=godCounts.map((n,i)=>n===max||(n>=2&&n===max-1)?i:-1).filter(i=>i>=0);
 return {elements,gods:{counts:godCounts,strong,entries,hidden,method:'known-stems-except-day-plus-branch-main'}};
}

// 문장을 만들기 위해 출생일 해시·난수·다른 일주의 공통 후보를 사용하지 않습니다.
function dayProfile(pillar){const row=DAY_READINGS[pillar];if(!row)throw Error('일주 문장표가 없습니다.');return row;}
function readingSlots(facts){
 const {elements:el,gods}=facts,slots=[];
 const push=(key,source,condition)=>slots.push({key,source,condition,pool:SUPPLEMENT_READINGS[key]});
 const n=el.balanced?3:Math.max(3,el.dominant.length);
 for(let i=0;i<n;i++){const element=el.dominant[i%el.dominant.length];push(el.balanced?'balanced':'element'+element,el.balanced?'element-balance':'element-dominant',{element:el.balanced?null:element});}
 for(const god of gods.strong)push('god'+god,'ten-god',{god,count:gods.counts[god]});
 for(const element of el.missing)push('absent'+element,'element-absent',{element,hiddenPresent:gods.hidden.some(x=>'木火土金水'.indexOf(LunarUtil.WU_XING_GAN[STEMS[x.stem]])===element)});
 return slots;
}
function interpretChart(chart){
 const pillar=chart.pillars[2],core=dayProfile(pillar),facts=compositionFacts(chart),slots=readingSlots(facts),baseCount=16-slots.length;
 const chosen=Array(slots.length),used=new Set(),order=slots.map((s,i)=>i).sort((a,b)=>slots[a].pool.length-slots[b].pool.length||a-b);
 let basic=null,visits=0;
 function search(depth){
  if(++visits>100000)throw Error('문장 조합을 확인할 수 없습니다.');
  if(depth===order.length){basic=core.filter(t=>!used.has(t.facet));return basic.length>=baseCount;}
  const index=order[depth];
  for(const entry of slots[index].pool){if(used.has(entry.facet))continue;used.add(entry.facet);chosen[index]=entry;if(search(depth+1))return true;used.delete(entry.facet);}
  return false;
 }
 if(!search(0))throw Error('서로 다른 성격으로 16칸을 채울 수 없습니다.');
 const traits=basic.slice(0,baseCount).map(t=>({...t,source:'day-pillar',statementId:t.id,ruleId:t.id,evidence:[`일주 ${koreanPillar(pillar)}(${pillar})`,DAY_READING_BASIS[pillar],'이 일주에 따로 작성한 기본 문장']}));
 chosen.forEach((t,i)=>traits.push({...t,source:slots[i].source,condition:slots[i].condition,statementId:t.id,ruleId:t.id,evidence:[JSON.stringify(slots[i].condition),'조건에 맞춰 따로 작성한 보충 문장']}));
 return {chart,traits,analysis:{model:'authored-60-day-readings',baseCount,dayPillar:pillar,elements:facts.elements,gods:facts.gods,sources:traits.reduce((a,t)=>(a[t.source]=(a[t.source]||0)+1,a),{}),emptyCells:0},references:REFERENCES};
}

const currentYear=Number(new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'Asia/Seoul'}).format(new Date()));
options('year',1900,currentYear,'년',true);options('month',1,12,'월');
function updateDays(){const old=$('day').value,y=Number($('year').value)||2000,m=Number($('month').value)||1;$('day').replaceChildren();options('day',1,new Date(Date.UTC(y,m,0)).getUTCDate(),'일');if([...$('day').options].some(o=>o.value===old))$('day').value=old;}
updateDays();$('year').addEventListener('change',updateDays);$('month').addEventListener('change',updateDays);

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));}
$('startButton').addEventListener('click',()=>show('inputScreen'));
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function readInput(){
 const selected=$('birthTime').value;
 const input={name:$('nickname').value.trim(),year:Number($('year').value),month:Number($('month').value),day:Number($('day').value),unknown:selected==='unknown',timeBranch:selected!==''&&selected!=='unknown'?Number(selected):null};
 if(!input.name)throw {message:'이름 또는 닉네임을 입력해주세요.',field:'nickname'};
 if(!input.year||!input.month||!input.day)throw {message:'생년월일을 모두 선택해주세요.',field:!input.year?'year':!input.month?'month':'day'};
 if(selected==='')throw {message:'태어난 시간대를 선택해주세요. 모르면 시간 모름을 골라주세요.',field:'birthTime'};
 input.timeLabel=$('birthTime').selectedOptions[0].textContent;
 const now=new Date(),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(now),date=[input.year,String(input.month).padStart(2,'0'),String(input.day).padStart(2,'0')].join('-');
 if(date>today)throw {message:'생년월일을 다시 확인해주세요.',field:'year'};
 return input;
}
function render(input,result){
 $('resultName').textContent=input.name+'님의 숨겨진 성격';
 $('traits').replaceChildren();for(let i=0;i<16;i++){const item=result.traits[i],cell=document.createElement('div');cell.className='trait';if(item){cell.setAttribute('role','listitem');cell.dataset.rule=item.ruleId;cell.dataset.basis=item.evidence.join(' / ');cell.textContent=item.text;}else{cell.classList.add('trait-empty');cell.setAttribute('aria-hidden','true');}$('traits').append(cell);}
}
$('birthForm').addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;$('formError').textContent='';
 let input;try{input=readInput();}catch(err){$('formError').textContent=err.message;if(err.field)$(err.field).focus({preventScroll:true});return;}
 busy=true;$('submitButton').disabled=true;
 try{const result=interpret(input);if(result.traits.length===0){$('formError').textContent='사주 계산은 완료됐지만, 이 구성에 적용할 성격 풀이 조건이 아직 충분하지 않아요.';return;}render(input,result);show('loading');await new Promise(r=>setTimeout(r,3000));show('result');}
 catch(err){show('inputScreen');$('formError').textContent='사주 계산을 완료하지 못했어요. 입력한 정보를 확인하고 다시 시도해주세요.';console.error(err);}
 finally{busy=false;$('submitButton').disabled=false;}
});
$('retryButton').addEventListener('click',()=>{show('home');$('saveStatus').textContent='';$('formError').textContent='';});
$('shareButton').addEventListener('click',async()=>{
 try{if(navigator.share){await navigator.share({title:TITLE,url:SHARE_URL});return;}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(SHARE_URL);notify('테스트 주소를 복사했어요.');return;}throw Error('clipboard');}
 catch(e){if(e.name==='AbortError')return;const ta=document.createElement('textarea');ta.value=SHARE_URL;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const copied=document.execCommand('copy');ta.remove();if(copied)notify('테스트 주소를 복사했어요.');else window.prompt('테스트 주소를 복사해주세요.',SHARE_URL);}
});
function closeModal(){$('saveModal').hidden=true;document.body.style.overflow='';lastFocus?.focus({preventScroll:true});}
$('closeModal').addEventListener('click',closeModal);$('saveModal').addEventListener('click',e=>{if(e.target===$('saveModal'))closeModal();});
document.addEventListener('keydown',e=>{if($('saveModal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();$('closeModal').focus({preventScroll:true});}});
$('saveButton').addEventListener('click',async()=>{
 const btn=$('saveButton');if(btn.disabled)return;btn.disabled=true;$('saveStatus').textContent='이미지를 만드는 중이에요…';
 try{
  if(typeof html2canvas!=='function')throw Error('capture');
  await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,5000))]);
  const card=$('resultCapture'),rect=card.getBoundingClientRect();
  const canvas=await html2canvas(card,{scale:Math.min(3,Math.max(2,1800/rect.width)),backgroundColor:null,useCORS:true,logging:false,scrollX:0,scrollY:-window.scrollY,onclone:doc=>{doc.getElementById('resultCapture').style.margin='0';}});
  const data=canvas.toDataURL('image/png');await new Promise((resolve,reject)=>{const img=$('saveImage');img.onload=resolve;img.onerror=reject;img.src=data;});
  lastFocus=document.activeElement;$('saveModal').hidden=false;document.body.style.overflow='hidden';$('closeModal').focus({preventScroll:true});$('saveStatus').textContent='이미지를 꾹 눌러 저장해주세요.';
 }catch(e){$('saveStatus').textContent='이미지를 만들지 못했어요. 잠시 후 다시 눌러주세요.';}
 finally{btn.disabled=false;}
});
function drawAvatar(canvas,style=0){
 if(typeof style==='number')style={hair:style%6,eyes:(style+2)%6,shirt:(style+1)%6,accessory:style%6,mouth:style%6,color:style%5};
 const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.save();ctx.scale(canvas.width/40,canvas.height/45);
 const hair=['#8b7568','#7b8085','#a18d7b','#6c7073','#aa9684'][style.color],outfit=['#dbdfe1','#eedbd0','#dedbd6','#dce3e5','#e6dfd2','#dedfd7'][style.shirt];
 const r=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};

 for(const q of shapes[style.hair])r(...q,hair);
 r(10,14,20,15,'#ffdfce');r(13,11,14,6,'#ffdfce');r(13,29,14,3,'#ffdfce');r(17,31,6,4,'#ffdfce');
 if(style.hair===0){r(10,9,20,6,hair);r(10,14,5,3,hair);}if(style.hair===1){r(10,10,20,6,hair);r(19,14,3,4,hair);}if(style.hair===2){r(10,9,18,5,hair);r(10,13,10,3,hair);r(10,16,4,3,hair);}if(style.hair===3){r(10,10,7,7,hair);r(26,10,4,8,hair);}if(style.hair===4){r(10,9,20,4,hair);r(10,12,4,6,hair);}if(style.hair===5){r(10,10,5,7,hair);r(17,10,4,6,hair);r(24,10,6,5,hair);}
 const ink='#49413e';
 if(style.eyes===0){r(13,21,4,2,ink);r(24,21,4,2,ink);}else if(style.eyes===1){r(13,20,3,3,ink);r(24,20,3,3,ink);r(13,19,4,1,ink);r(24,19,4,1,ink);}else if(style.eyes===2){r(13,22,4,1,ink);r(24,22,4,1,ink);r(13,21,1,1,ink);r(24,21,1,1,ink);}else if(style.eyes===3){r(13,20,3,4,ink);r(24,20,3,4,ink);r(13,20,1,1,'#ffffff');r(24,20,1,1,'#ffffff');}else if(style.eyes===4){r(13,21,5,1,ink);r(24,21,5,1,ink);r(15,22,2,2,ink);r(26,22,2,2,ink);}else{r(13,20,4,1,ink);r(12,21,1,2,ink);r(24,20,4,1,ink);r(28,21,1,2,ink);}
 r(10,25,5,2,'#edb7ad');r(26,25,5,2,'#edb7ad');
 if(style.mouth<=1)r(19,28,3,1,'#aa7c73');else if(style.mouth<=3){r(18,27,1,1,'#aa7c73');r(19,28,3,1,'#aa7c73');r(22,27,1,1,'#aa7c73');}else{r(18,27,5,2,'#aa7c73');r(19,27,3,1,'#ffffff');}
 r(10,35,21,10,outfit);r(7,38,4,7,outfit);r(31,38,4,7,outfit);
 if(style.shirt===0){r(18,35,5,10,'#ffffff');r(14,35,2,6,'#afb5b9');r(25,35,2,6,'#afb5b9');}else if(style.shirt===1){r(16,35,9,3,'#ffffff');r(18,38,5,3,'#ffffff');r(20,42,1,1,'#b69d8e');}else if(style.shirt===2){r(11,35,4,7,'#ffffff');r(26,35,4,7,'#ffffff');r(19,35,3,3,'#ffffff');}else if(style.shirt===3){r(15,35,11,3,'#ffffff');r(14,38,2,5,'#ffffff');r(25,38,2,5,'#ffffff');r(16,43,10,1,'#aab9be');}else if(style.shirt===4){r(13,35,3,10,'#ffffff');r(25,35,3,10,'#ffffff');r(13,40,15,5,'#ffffff');}else{r(12,37,17,1,'#bfc3b6');r(12,40,17,1,'#bfc3b6');r(12,43,17,1,'#bfc3b6');}
 if(style.accessory===1){r(8,19,24,1,ink);r(10,19,9,7,ink);r(11,20,7,5,'#ffdfce');r(22,19,9,7,ink);r(23,20,7,5,'#ffdfce');r(19,21,3,1,ink);}else if(style.accessory===2){r(29,12,4,2,'#ebcdb9');r(30,11,2,4,'#ebcdb9');}else if(style.accessory===3){r(6,16,2,12,'#afbabd');r(33,16,2,12,'#afbabd');r(8,7,24,2,'#afbabd');}else if(style.accessory===4){r(9,30,3,2,'#d0b291');r(29,30,3,2,'#d0b291');}else if(style.accessory===5){r(12,34,16,3,'#d3b8a7');r(23,36,4,7,'#d3b8a7');}
 ctx.restore();

function drawScene(canvas){const ctx=canvas.getContext('2d');const r=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};ctx.imageSmoothingEnabled=false;r(0,0,360,158,'#ffffff');for(let y=8;y<155;y+=16)for(let x=8;x<360;x+=16)r(x,y,1,1,'#eeeeee');
 r(40,32,90,91,'#949494');r(41,33,88,89,'#edf1f3');r(230,32,90,91,'#949494');r(231,33,88,89,'#fff0e8');r(51,43,68,69,'#ffffff');r(241,43,68,69,'#ffffff');

 r(166,72,27,2,'#aaaaaa');r(187,68,2,10,'#aaaaaa');r(189,70,2,6,'#aaaaaa');
 for(const [x,y] of [[20,20],[337,55],[152,30],[204,125]]){r(x-4,y,9,2,'#c5aa98');r(x,y-4,2,9,'#c5aa98');}
 r(32,130,104,4,'#d4d4d4');r(224,130,104,4,'#dbc4b5');
