function expression(figure, mood, radius) {
  if (mood === 'calm') return figure;
  let eye = 0;
  return figure.replace(new RegExp('<circle cx="(\\d+)" cy="(\\d+)" r="' + radius + '" fill="#47382f"/>', 'g'), (original, x, y) => {
    eye++;
    if (mood === 'wink' && eye === 1) return original;
    const bend = mood === 'sleepy' ? 4 : -5;
    return `<path d="M${Number(x)-4} ${y}q4 ${bend} 8 0" fill="none" stroke="#47382f" stroke-width="2.3" stroke-linecap="round"/>`;
  });
}

function drawScene({santa, deer, hand, item, face = 'calm', swap = false}, animated) {
  const [handX, handY] = hand;
  const santaStart = art.indexOf('<rect x="106"');
  const deerStart = art.indexOf('<path d="M266 61');
  const parcelsStart = art.indexOf('<rect x="340"');

  const figure = (name, [x, y, angle], cx, cy, content) =>
    `<g class="${animated ? 'quiz' : 'result'}-${name}"><g transform="translate(${x} ${y}) rotate(${angle} ${cx} ${cy})">${content}</g></g>`;
  const mitten = `<path d="M182 109 Q195 104 ${handX} ${handY}" fill="none" stroke="#7d4038" stroke-width="17" stroke-linecap="round"/>
    <path d="M182 109 Q195 104 ${handX} ${handY}" fill="none" stroke="#b63b40" stroke-width="14" stroke-linecap="round"/>
    <circle cx="${handX}" cy="${handY}" r="7" fill="#fff3d8"/>`;
  const prop = `<g transform="translate(${handX + 10} ${handY - 5})">${resultProps[item] ?? quizProps[item]}</g>`;
  const flakes = '<g class="quiz-flakes" fill="#fff1cf"><circle cx="90" cy="45" r="2"/><circle cx="217" cy="35" r="2"/><circle cx="333" cy="39" r="1.8"/><circle cx="54" cy="51" r="1.6"/><circle cx="383" cy="57" r="1.5"/></g>';
  let santaArt = expression(art.slice(santaStart, deerStart), face, 3) + mitten + prop;
  const deerArt = expression(art.slice(deerStart, parcelsStart), face, 4);
  if (swap) santaArt = `<g transform="translate(310 0) scale(-1 1)">${santaArt}</g>`;
  const santaPose = swap ? [santa[0]+131, santa[1], santa[2]] : santa;
  const deerPose = swap ? [deer[0]-131, deer[1], deer[2]] : deer;

  return art.slice(0, santaStart)
    + figure('santa', santaPose, 155, 112, santaArt)
    + figure('deer', deerPose, 286, 111, deerArt)
    + art.slice(parcelsStart).replace('</svg>', flakes.replace('quiz-flakes', animated ? 'quiz-flakes' : 'result-flakes') + '</svg>');
}

function renderQuizArt(step) {
  $('quizart').innerHTML = drawScene(quizScenes[step], true);
}
