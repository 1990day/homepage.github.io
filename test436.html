*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f8edda;color:var(--ink);font:400 16px/1.5 var(--dotum);word-break:keep-all}
a{color:inherit;text-decoration:none}
p,h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.site-header{background:var(--green-dark);color:var(--cream);border-bottom:3px double var(--yellow)}
.header-inner{width:min(100% - 24px,820px);margin:auto;min-height:49px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:clamp(22px,6vw,29px);letter-spacing:.06em;white-space:nowrap}
nav{display:flex;gap:clamp(8px,2.6vw,23px);font-size:clamp(17px,4.9vw,23px);white-space:nowrap}
.site-header a:focus-visible{outline-color:var(--yellow)}
nav a:hover{text-decoration:underline;text-underline-offset:.2em}
main{width:min(100% - 24px,608px);margin:clamp(16px,4vw,36px) auto 0}

.cover-art{display:block;width:100%;height:auto;border:3px double var(--green-dark)}
.action{width:100%;display:flex;justify-content:center;align-items:center;text-align:center;min-height:49px;padding:8px 10px;border:3px double var(--green);background:var(--cream);color:var(--green);font-size:clamp(18px,4.9vw,23px);letter-spacing:.035em;line-height:1.3}
.action.primary{background:var(--green-dark);color:var(--cream);border-color:var(--yellow)}
.action:hover{text-decoration:none;border-style:solid}
#start,#details>.action{margin-top:11px;min-height:54px;font-size:clamp(23px,5.8vw,28px)}
#start{background:var(--yellow);color:var(--green-dark);border-color:var(--green-dark)}
#submit{background:var(--red);border-color:var(--cream)}

.board,.result-card{background:var(--paper) var(--grain);border:5px double var(--green);padding:clamp(5px,1.4vw,9px)}
.inset,.result-sheet{--sheet-padding:clamp(10px,3.15vw,21px);padding:var(--sheet-padding);border:1px solid var(--line)}
.form-mast,.result-mast{container-type:inline-size;margin-inline:calc(3px - var(--sheet-padding));background:var(--green) var(--grain);border:3px double var(--yellow);padding:clamp(5px,1.4vw,9px) 2px;text-align:center}
.form-kicker,.result-mast h2{margin:auto;padding:clamp(7px,2vw,13px) 0;border:1px solid var(--green);border-radius:45% / 30%;background:var(--cream) var(--grain);color:var(--green-dark);font:400 min(38px,5.2vw)/1.25 var(--dotum);font-size:min(38px,6.55cqi);letter-spacing:.025em;white-space:nowrap}
#details{font-size:clamp(22px,5.8vw,27px);line-height:1.35;letter-spacing:.04em}
.form-title{color:var(--red);font:400 clamp(36px,9.1vw,54px)/1.15 var(--dotum);letter-spacing:.055em;text-align:center;margin:17px 0 24px}
fieldset{border:0;margin:0 0 20px;padding:0;min-width:0}
legend,.field-label{display:table;width:max-content;max-width:100%;background:var(--yellow);color:var(--green-dark);margin:0 0 8px;padding:3px 13px;border:1px solid var(--line);border-radius:50% / 45%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.choices label{position:relative;cursor:pointer}
.choices input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.choices span,.control{display:block;min-height:54px;padding:8px;border:1px solid var(--green);border-radius:0;background:var(--cream);color:var(--green-dark)}
.choices span{display:grid;place-items:center;text-align:center}
.choices input:checked + span{background:var(--green);color:var(--cream);outline:1px solid var(--yellow);outline-offset:-4px}
.choices input:focus-visible + span{outline:2px solid var(--red);outline-offset:3px}
.control{width:100%;min-width:0}
.date-fields{display:grid;grid-template-columns:minmax(0,1.55fr) repeat(2,minmax(0,1fr));gap:5px}
.date-fields .control{padding-inline:3px}
.check-row{display:flex;gap:7px;align-items:center;margin-top:10px;font-size:clamp(19px,5vw,23px)}
.check-row input{accent-color:var(--green);width:17px;height:17px}
.field{margin-bottom:5px}
.error{color:var(--red);font-size:clamp(18px,4.8vw,22px);margin:10px 0 0}

.loading-sign{padding:clamp(9px,3vw,18px);border:5px double var(--yellow);background:var(--green-dark) var(--grain);text-align:center}
.loading-panel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(6px,2.5vw,18px);min-height:clamp(228px,60vw,352px);padding:clamp(16px,5vw,32px) clamp(10px,3.5vw,24px);border:4px double var(--green);border-radius:46% / 30%;background:var(--paper) var(--grain)}
.loading-seal{display:grid;place-items:center;width:clamp(36px,12vw,72px);height:clamp(68px,21vw,117px);border:1px solid var(--line);border-radius:50%;background:var(--yellow) var(--grain);color:var(--green-dark);font:400 clamp(19px,5.4vw,33px)/1.12 var(--display);animation:seal-pulse 1.5s ease-in-out 2}
.loading-seal:last-child{animation-delay:.18s}
.loading-title{color:var(--red);font:400 clamp(31px,8.8vw,56px)/1.12 var(--display);letter-spacing:.025em}
.loading-track{height:11px;max-width:200px;margin:14px auto 0;padding:2px;background:var(--cream);border:1px solid var(--green);border-radius:20px}
.loading-track span{display:block;width:100%;height:100%;background:var(--red);border-radius:20px;transform-origin:left;animation:uncover-result 3s linear both}
@keyframes uncover-result{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes seal-pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.loading-track span,.loading-seal{animation:none}}
.result-hero{text-align:center;background:var(--cream) var(--grain);color:var(--green-dark);border:1px solid var(--line);margin-top:9px;padding:clamp(10px,3vw,19px) 5px}
.result-title{color:var(--red);font:400 clamp(43px,13vw,74px)/1.04 var(--display);letter-spacing:.035em;margin:0 0 7px}
#result-line{font-size:clamp(18px,4.6vw,23px);line-height:1.4}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0 13px}
.count-tile{text-align:center;color:var(--red);border:1px solid var(--line);background:#f5d9ab var(--grain);padding:8px 4px}
.count-tile.yin{color:var(--green-dark);background:#dce3bf var(--grain)}
.count-tile h3{display:table;margin:0 auto 3px;padding:2px 10px;background:var(--yellow);color:var(--green-dark);border:1px solid var(--line);border-radius:50% / 45%;font-size:clamp(17px,4.6vw,23px);font-weight:400}
.count-tile strong{display:block;font:400 clamp(29px,8vw,48px)/1.05 var(--display);white-space:nowrap}
.count-tile strong small{font:inherit;font-size:.55em;margin-left:2px}
.count-tile p{font-size:clamp(15px,3.8vw,19px);margin-top:2px}
.profile-features{border:1px solid var(--green)}
.profile-features h3{background:var(--green);color:var(--cream);border-bottom:3px double var(--yellow);font-size:clamp(27px,7.2vw,38px);font-weight:400;line-height:1.25;padding:7px 5px;text-align:center;letter-spacing:.08em}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));list-style:none;margin:0;padding:0}
.feature-tile{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;min-height:clamp(92px,26vw,140px);padding:7px 3px;background:var(--cream);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;overflow-wrap:anywhere}
.feature-tile:nth-child(3n){border-right:0}
.feature-tile:nth-last-child(-n+3){border-bottom:0}
.feature-tile:nth-child(even){background:#efddb3}
.feature-tile:nth-child(5){background:#f4cf70}
.feature-tile h4{color:var(--red);font-size:clamp(19px,5.2vw,29px);font-weight:400;line-height:1.2;margin:0}
.feature-tile p{font-size:clamp(17px,4.7vw,24px);line-height:1.25;color:var(--ink)}
.count-note{margin-top:8px;color:var(--green-dark);font-size:clamp(13px,3.5vw,16px)}
.result-actions{display:grid;gap:7px;margin:11px 0 0}
#restart{background:#f1d691}
#share{background:var(--red);color:var(--cream);border-color:var(--cream)}
.caption{font-size:15px;line-height:1.5}

.ad-slot{width:min(100% - 16px,350px);margin:22px auto 14px;overflow:hidden}
.ad-inner{width:350px}
dialog{width:min(91%,390px);max-height:88vh;padding:14px;border:5px double var(--green);background:var(--paper) var(--grain);color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:#10291f99}
dialog h2{color:var(--red);font-size:25px;font-weight:400;line-height:1.2}
dialog p{font-size:16px;margin:6px 0 8px}
#save-dialog h2,#save-dialog p{text-align:center}
dialog img{display:block;margin:0 auto 9px;max-width:100%;max-height:55vh;object-fit:contain}
dialog .action{margin-top:9px}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="https://test-it.co.kr/">테스트잇</a>
    <nav aria-label="카테고리">
      <a href="https://test-it.co.kr/test.html">성격</a>
      <a href="https://test-it.co.kr/face.html">얼굴</a>
      <a href="https://test-it.co.kr/etc.html">그외</a>
      <a href="https://test-it.co.kr/saju.html">사주</a>
    </nav>
  </div>
</header>
<main>
  <section id="cover">
    <img class="cover-art" src="img_main436.png" width="1254" height="1254" alt="테스트잇 양기 음기 사주 테스트">
    <button id="start" class="action primary" type="button">테스트 시작하기</button>
  </section>

  <section id="details" hidden>
    <div class="board">
      <div class="inset">
        <header class="form-mast">
          <p class="form-kicker">테스트잇 양기 음기 사주 테스트</p>
        </header>
        <h2 id="form-title" class="form-title" tabindex="-1">언제 태어났나요?</h2>
        <form id="birth">
          <fieldset>
            <legend>달력 구분</legend>
            <div class="choices">
              <label><input type="radio" name="calendar" value="solar" checked><span>양력</span></label>
              <label><input type="radio" name="calendar" value="lunar"><span>음력</span></label>
            </div>
            <label id="leap-row" class="check-row" hidden><input id="leap" type="checkbox">윤달에 태어남</label>
          </fieldset>
          <fieldset>
            <legend>태어난 날짜</legend>
            <div class="date-fields">
              <select class="control" id="year" aria-label="태어난 연도" required><option value="">연도</option></select>
              <select class="control" id="month" aria-label="태어난 달" required><option value="">월</option></select>
              <select class="control" id="day" aria-label="태어난 일" required><option value="">일</option></select>
            </div>
          </fieldset>
          <div class="field">
            <label class="field-label" for="hour">태어난 시간</label>
            <select class="control" id="hour" required>
              <option value="">시간 선택</option>
              <option value="unknown">모름</option>
            </select>
          </div>
          <p id="form-error" class="error" role="alert" hidden></p>
        </form>
      </div>
    </div>
    <button id="submit" class="action primary" type="submit" form="birth">내 양기 음기 알아보기</button>
  </section>

  <section id="loading" class="board loading-sign" hidden>
    <div class="loading-panel">
      <span class="loading-seal" aria-hidden="true">양<br>기</span>
      <div>
        <h2 id="loading-title" class="loading-title" tabindex="-1">사주 풀이 중</h2>
        <div class="loading-track" aria-hidden="true"><span></span></div>
      </div>
      <span class="loading-seal" aria-hidden="true">음<br>기</span>
    </div>
  </section>

  <section id="result" hidden>
    <article id="result-card" class="result-card">
      <div class="result-sheet">
        <header class="result-mast">
          <h2>테스트잇 양기 음기 사주 테스트</h2>
        </header>
        <div class="result-hero">
          <h3 id="result-title" class="result-title" tabindex="-1"></h3>
          <p id="result-line"></p>
        </div>
        <div class="counts">
          <section class="count-tile">
            <h3>양기</h3>
            <strong><span id="yang-count"></span><small>개</small></strong>
            <p id="yang-percent"></p>
          </section>
          <section class="count-tile yin">
            <h3>음기</h3>
            <strong><span id="yin-count"></span><small>개</small></strong>
            <p id="yin-percent"></p>
          </section>
        </div>
        <section class="profile-features">
          <h3 id="features-title"></h3>
          <ul id="features-list" class="feature-grid"></ul>
        </section>
        <p id="method-note" class="count-note" hidden>출생 시간 모름 · 생년월일 6글자 기준</p>
      </div>
    </article>
    <div class="result-actions">
      <button id="save" class="action primary" type="button">결과 이미지 저장하기</button>
      <button id="restart" class="action" type="button">다시 해보기</button>
      <a href="https://test-it.co.kr/" class="action">다른 테스트 해보기</a>
      <button id="share" class="action" type="button">테스트 공유하기</button>
      <p id="action-status" class="caption" role="status" hidden></p>
    </div>
  </section>
</main>

<dialog id="save-dialog" aria-labelledby="save-heading">
  <h2 id="save-heading">결과 이미지 저장하기</h2>
  <p>이미지를 꾹 눌러 저장해 주세요.</p>
  <img id="saved-image" alt="테스트잇 양기 음기 사주 테스트 결과 PNG">
  <form method="dialog"><button class="action">닫기</button></form>
</dialog>
<dialog id="share-dialog" aria-labelledby="share-heading">
  <h2 id="share-heading">테스트 공유하기</h2>
  <p>아래 문구를 복사해 공유해 주세요.</p>
  <textarea id="share-text" class="control" aria-label="공유할 제목과 링크" rows="3" readonly></textarea>
  <form method="dialog"><button class="action">닫기</button></form>
</dialog>

<div class="ad-slot" aria-label="광고">
  <div class="ad-inner">
    <script src="https://ads-partners.coupang.com/g.js"></script>
    <script>
    if (typeof window.PartnersCoupang?.G === 'function') {
      new window.PartnersCoupang.G({id:798186, trackingCode:'AF4391881', subId:null, template:'carousel', width:'350', height:'150'});
    }
    </script>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.3.6/dist/korean-lunar-calendar.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
'use strict';
const byId = (id) => document.getElementById(id);
const form = byId('birth');
const yearField = byId('year');
const monthField = byId('month');
const dayField = byId('day');
const hourField = byId('hour');
const resultCard = byId('result-card');
const saveDialog = byId('save-dialog');
const savedImage = byId('saved-image');
const title = '테스트잇 양기 음기 사주 테스트';
const url = 'https://test-it.co.kr/test436';
const yangCharacters = new Set('甲丙戊庚壬子寅辰午申戌');
const yinCharacters = new Set('乙丁己辛癸丑卯巳未酉亥');
const timeSlots = [
  [0,30,'자시 (00:00~01:29)'], [2,30,'축시 (01:30~03:29)'],
  [4,30,'인시 (03:30~05:29)'], [6,30,'묘시 (05:30~07:29)'],
  [8,30,'진시 (07:30~09:29)'], [10,30,'사시 (09:30~11:29)'],
  [12,30,'오시 (11:30~13:29)'], [14,30,'미시 (13:30~15:29)'],
  [16,30,'신시 (15:30~17:29)'], [18,30,'유시 (17:30~19:29)'],
  [20,30,'술시 (19:30~21:29)'], [22,30,'해시 (21:30~23:29)'],
  [23,45,'자시 (23:30~23:59)']
];
const results = {
  yang: {
    title:'양기형',
    line:'밝고 에너지가 넘쳐서 일단 움직이는 편',
    features:[
      ['생각보다 행동','고민만 하기보다 일단 해보고 봄.'],
      ['분위기 메이커','조용한 자리에서 먼저 말을 꺼냄.'],
      ['솔직하고 쿨함','속에 담아두지 않고 바로 털어냄.'],
      ['낮에 더 팔팔함','해 뜬 낮에 기분과 힘이 올라옴.'],
      ['겁이 적은 편','새로운 일도 일단 부딪혀 봄.'],
      ['표정에 다 나옴','좋고 싫은 티가 얼굴에 바로 남.'],
      ['연애도 직진','좋아하면 숨기지 않고 먼저 다가감.'],
      ['결정이 빠름','끌리는 게 있으면 바로 골라 버림.'],
      ['무리하기 쉬움','신나서 달리다 한 번에 지칠 때 있음.']
    ]
  },
  yin: {
    title:'음기형',
    line:'차분하고 생각이 깊어서 속이 꽉 찬 편',
    features:[
      ['눈치가 빠름','말투나 표정만 봐도 속마음을 앎.'],
      ['차분한 분위기','말이 많지 않아도 묘하게 끌림.'],
      ['밤에 더 잘됨','조용한 밤이나 새벽에 집중이 잘됨.'],
      ['끝까지 해냄','겉은 조용해도 한 번 잡으면 오래 감.'],
      ['신중하게 움직임','상황을 다 살펴본 뒤에 결정함.'],
      ['혼자 쉬어야 함','조용히 내 시간을 보내야 힘이 남.'],
      ['오래가는 연애','천천히 마음 열고 한 사람만 봄.'],
      ['작은 것도 기억','남이 흘리듯 한 말을 잘 챙겨 둠.'],
      ['혼자 삭이는 편','속상해도 말 안 하고 혼자 고민함.']
    ]
  },
  balance: {
    title:'균형형',
    line:'활발함과 차분함을 상황에 맞게 조절하는 편',
    features:[
      ['온·오프 확실','나설 땐 나서고 쉴 땐 푹 쉼.'],
      ['어디든 잘 어울림','낯선 곳에서도 금방 편해짐.'],
      ['반전 매력 있음','친하면 활발, 처음엔 조용한 편.'],
      ['사이에서 잘 맞춤','성격 다른 사람들 사이를 편하게 함.'],
      ['때에 따라 다름','확실하면 바로, 애매하면 좀 더 봄.'],
      ['사람도 혼자도 OK','놀 땐 잘 놀고 쉴 시간도 잘 챙김.'],
      ['상대에 맞춘 연애','먼저 다가갈 때와 기다릴 때를 앎.'],
      ['일 처리가 안정적','큰 건 빠르게, 중요한 건 꼼꼼히 함.'],
      ['고민이 길어질 때','이쪽저쪽 다 이해돼서 결정이 늦음.']
    ]
  }
};

const todayParts = Object.fromEntries(
  new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Seoul', year:'numeric', month:'numeric', day:'numeric'
  }).formatToParts(new Date()).map(({type,value}) => [type,value])
);
const today = Date.UTC(+todayParts.year, +todayParts.month - 1, +todayParts.day);
for (let year = +todayParts.year; year >= 1900; year -= 1) {
  yearField.add(new Option(year + '년', year));
}
for (let month = 1; month <= 12; month += 1) {
  monthField.add(new Option(month + '월', month));
}
for (const [index, slot] of timeSlots.entries()) {
  hourField.add(new Option(slot[2], String(index)));
}

function syncCalendar() {
  const lunar = form.elements.calendar.value === 'lunar';
  byId('leap-row').hidden = !lunar;
  byId('leap').disabled = !lunar;
  const selected = dayField.value;
  const maxDay = lunar ? 30 : yearField.value && monthField.value
    ? new Date(Date.UTC(+yearField.value, +monthField.value, 0)).getUTCDate()
    : 31;
  dayField.replaceChildren(new Option('일', ''));
  for (let day = 1; day <= maxDay; day += 1) {
    dayField.add(new Option(day + '일', day));
  }
  if (selected && +selected <= maxDay) dayField.value = selected;
}

function changeScreen(screen, focusTarget) {
  for (const id of ['cover','details','loading','result']) byId(id).hidden = id !== screen;
  byId(focusTarget).focus({preventScroll:true});
}

function solarDate() {
  const year = +yearField.value;
  const month = +monthField.value;
  const day = +dayField.value;
  if (form.elements.calendar.value !== 'lunar') return {year,month,day};
  const calendar = new KoreanLunarCalendar();
  const leap = byId('leap').checked;
  if (!calendar.setLunarDate(year, month, day, leap) || calendar.getLunarCalendar().intercalation !== leap) {
    throw new Error(leap ? '입력한 연도와 월의 윤달 날짜를 확인해 주세요.' : '입력한 음력 날짜를 확인해 주세요.');
  }
  return calendar.getSolarCalendar();
}

function chartAt({year,month,day}, hour, minute) {
  // The solar-term tables use UTC+8. Compare them to the selected birth time in KST.
  const termTime = new Date(Date.UTC(year, month - 1, day, hour - 1, minute));
  const terms = Solar.fromYmdHms(
    termTime.getUTCFullYear(), termTime.getUTCMonth() + 1, termTime.getUTCDate(),
    termTime.getUTCHours(), termTime.getUTCMinutes(), 0
  ).getLunar();
  // Shift the day/hour lookup so its 07:00–08:59 branch uses 07:30–09:29 in the form.
  // Keep the solar-term lookup on the actual birth time.
  const pillarTime = new Date(Date.UTC(year, month - 1, day, hour, minute - 30));
  const lunar = Solar.fromYmdHms(
    pillarTime.getUTCFullYear(), pillarTime.getUTCMonth() + 1, pillarTime.getUTCDate(),
    pillarTime.getUTCHours(), pillarTime.getUTCMinutes(), 0
  ).getLunar();
  return [
    terms.getYearInGanZhiExact(),
    terms.getMonthInGanZhiExact(),
    lunar.getDayInGanZhiExact(),
    lunar.getTimeInGanZhi()
  ];
}

function renderResult(date) {
  const unknown = hourField.value === 'unknown';
  const [hour, minute] = unknown ? [12,0] : timeSlots[Number(hourField.value)];
  const pillars = chartAt(date, hour, minute);
  const characters = (unknown ? pillars.slice(0,3) : pillars).join('');
  const symbols = Array.from(characters);
  const yang = symbols.filter((character) => yangCharacters.has(character)).length;
  const yin = symbols.filter((character) => yinCharacters.has(character)).length;
  if (yang + yin !== (unknown ? 6 : 8)) throw new Error('사주를 계산하지 못했어요. 입력한 날짜와 시간을 확인해 주세요.');
  const yangPercent = Math.round(yang * 1000 / symbols.length) / 10;
  const yinPercent = Math.round((100 - yangPercent) * 10) / 10;
  const type = yang === yin ? 'balance' : yang > yin ? 'yang' : 'yin';
  const profile = results[type];
  byId('result-title').textContent = profile.title;
  byId('result-line').textContent = profile.line;
  byId('yang-percent').textContent = yangPercent + '%';
  byId('yin-percent').textContent = yinPercent + '%';
  byId('yang-count').textContent = yang;
  byId('yin-count').textContent = yin;
  byId('features-title').textContent = profile.title + ' 특징';
  const items = profile.features.map(([heading, description]) => {
    const tile = document.createElement('li');
    tile.className = 'feature-tile';
    const headline = document.createElement('h4');
    headline.textContent = heading;
    const detail = document.createElement('p');
    detail.textContent = description;
    tile.append(headline, detail);
    return tile;
  });
  byId('features-list').replaceChildren(...items);
  byId('method-note').hidden = !unknown;
  byId('action-status').hidden = true;
  changeScreen('result','result-title');
}

form.addEventListener('change', (event) => {
  if (['calendar','year','month'].includes(event.target.name || event.target.id)) syncCalendar();
  byId('form-error').hidden = true;
});
byId('start').addEventListener('click', () => changeScreen('details','form-title'));
byId('restart').addEventListener('click', () => {
  form.reset();
  syncCalendar();
  byId('form-error').hidden = true;
  changeScreen('cover','start');
});
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = byId('submit');
  if (button.disabled) return;
  const formError = byId('form-error');
  formError.hidden = true;
  try {
    if (typeof Solar === 'undefined' || (form.elements.calendar.value === 'lunar' && typeof KoreanLunarCalendar === 'undefined')) {
      throw new Error('달력 데이터를 불러오지 못했어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.');
    }
    const date = solarDate();
    if (Date.UTC(date.year, date.month - 1, date.day) > today) throw new Error('미래 날짜는 선택할 수 없어요.');
    button.disabled = true;
    changeScreen('loading','loading-title');
    await new Promise((resolve) => setTimeout(resolve, 3000));
    renderResult(date);
  } catch (error) {
    if (!byId('loading').hidden) changeScreen('details','form-title');
    formError.textContent = error.message || '입력한 날짜와 시간을 확인해 주세요.';
    formError.hidden = false;
  } finally {
    button.disabled = false;
  }
});

function showStatus(message) {
  const status = byId('action-status');
  status.textContent = message;
  status.hidden = false;
}

byId('save').addEventListener('click', async () => {
  const button = byId('save');
  byId('action-status').hidden = true;
  button.disabled = true;
  try {
    if (typeof html2canvas !== 'function') throw new Error('이미지 저장 기능을 불러오지 못했어요.');
    if (document.fonts) await document.fonts.ready;
    const canvas = await html2canvas(resultCard, {
      scale:Math.min(2.5, 1000 / resultCard.offsetWidth),
      backgroundColor:null,
      logging:false
    });
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('결과 이미지가 만들어지지 않았어요.');
    let previewUrl;
    try {
      previewUrl = URL.createObjectURL(new File([blob], 'test-it-yang-yin.png', {type:'image/png'}));
    } catch {
      previewUrl = canvas.toDataURL('image/png');
    }
    if (byId('result').hidden) {
      if (previewUrl.startsWith('blob:')) URL.revokeObjectURL(previewUrl);
      return;
    }
    savedImage.src = previewUrl;
    saveDialog.showModal();
  } catch {
    showStatus('이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.');
  } finally {
    button.disabled = false;
  }
});
saveDialog.addEventListener('close', () => {
  if (savedImage.src.startsWith('blob:')) URL.revokeObjectURL(savedImage.src);
  savedImage.removeAttribute('src');
});
byId('share').addEventListener('click', async () => {
  const text = title + '\n' + url;
  byId('action-status').hidden = true;
  if (navigator.share) {
    try {
      await navigator.share({text});
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showStatus('테스트 링크를 복사했어요.');
  } catch {
    const shareText = byId('share-text');
    shareText.value = text;
    byId('share-dialog').showModal();
    shareText.select();
  }
});

syncCalendar();
</script>
</body>
