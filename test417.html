    let currentQuestion = 0;
    let locked = false;
    let currentResultKey = "";
    let scores = {};

    function resetScores() {
      scores = { I: 0, E: 0, C: 0, W: 0, O: 0, X: 0 };
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function startTest() {
      currentQuestion = 0;
      currentResultKey = "";
      locked = false;
      resetScores();
      showScreen("questionScreen");
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[currentQuestion];
      document.getElementById("currentNumber").textContent = currentQuestion + 1;
      document.getElementById("progressBar").style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      document.getElementById("subjectLabel").textContent = question.subject;
      document.getElementById("questionNumber").textContent = `문항 ${currentQuestion + 1}`;
      document.getElementById("questionText").innerHTML = question.text;

      const answerList = document.getElementById("answerList");
      answerList.innerHTML = "";
      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-btn";
        button.innerHTML = `<span class="answer-num">${index === 0 ? "①" : "②"}</span>${answer.text}`;
        button.addEventListener("click", () => selectAnswer(answer.value));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(value) {
      if (locked) return;
      locked = true;
      document.querySelectorAll(".answer-btn").forEach(button => button.disabled = true);

      const question = questions[currentQuestion];
      scores[value] += question.weight;

      window.setTimeout(() => {
        currentQuestion += 1;
        locked = false;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showLoading();
        }
      }, 120);
    }

    function showLoading() {
      showScreen("loadingScreen");
      window.setTimeout(showResult, 3000);
    }

    function showResult() {
      const standard = scores.I > scores.E ? "I" : "E";
      const defense = scores.C > scores.W ? "C" : "W";
      const drive = scores.O > scores.X ? "O" : "X";
      currentResultKey = standard + defense + drive;
      const result = results[currentResultKey];
      const strengths = [scores[standard], scores[defense], scores[drive]];
      const detailedResult = getDetailedResult(standard, defense, drive, strengths);

      document.getElementById("resultTitle").textContent = result.name;
      document.getElementById("resultSummary").textContent = result.summary;
      document.getElementById("detailAnalysis").textContent = detailedResult.text;
      document.getElementById("coreNeed").textContent = result.need;
      document.getElementById("mainFear").textContent = result.fear;
      document.getElementById("defenseMethod").textContent = result.defense;
      document.getElementById("strength").textContent = result.strength;
      document.getElementById("weakness").textContent = result.weakness;
      document.getElementById("relationship").textContent = result.relationship;
      document.getElementById("workStyle").textContent = result.work;
      document.getElementById("advice").textContent = result.advice;

      setAxis("standard", standard === "I" ? "절대 권력" : "외부 인정", standard === "I" ? scores.I : scores.E);
      setAxis("defense", defense === "C" ? "정면 돌파" : "무시 배제", defense === "C" ? scores.C : scores.W);
      setAxis("drive", drive === "O" ? "현상 유지" : "영역 확장", drive === "O" ? scores.O : scores.X);
      showScreen("resultScreen");
    }

    function getDetailedResult(standard, defense, drive, strengths) {
      const axisNames = ["판단 기준", "권력 방식", "목표 성향"];
      const maxScore = Math.max(...strengths);
      const highestAxes = strengths
        .map((score, index) => score === maxScore ? index : -1)
        .filter(index => index !== -1);

      const tieKey = highestAxes.join("");
      const typeNames = {
        "0": "통제력 극대화형",
        "1": "권력 방식 극대화형",
        "2": "목표 달성 극대화형",
        "01": "통제·권력 공동 지배형",
        "02": "통제·목표 공동 지배형",
        "12": "권력·목표 공동 지배형",
        "012": "모든 욕구 밸런스형"
      };
      const strengthName = maxScore === 5 ? "절대적" : maxScore === 4 ? "확고한" : "치밀한";

let scoreSentence = "";

if (highestAxes.length === 3) {
  scoreSentence = "세 영역이 같은 강도로 나타남.";
} else if (highestAxes.length === 2) {
  scoreSentence = `${axisNames[highestAxes[0]]}과 ${axisNames[highestAxes[1]]}이 공동으로 가장 높게 나타남.`;
} else {
  scoreSentence = `가장 높은 영역은 ${axisNames[highestAxes[0]]}임.`;
}
      const standardText = standard === "I"
        ? "타인의 시선 따위는 무시하며 오직 자기 기준으로 세상을 통제하려 함."
        : "타인의 평가와 인정을 삶을 움직이는 가장 큰 원동력으로 삼음.";
      const defenseText = defense === "C"
        ? "반대하는 자는 피하지 않고 정면으로 들이받아 박살 내는 타입임."
        : "피곤한 상황은 굳이 상대하지 않고 내 인생에서 조용히 치워버림.";
      const driveText = drive === "O"
        ? "불안정한 변화를 혐오하며 내 통제하의 안전한 상태를 유지하려 함."
        : "현상 유지에 만족하지 않고 수단 방법을 가리지 않고 영역을 넓히려 함.";

      return {
        name: `${strengthName} ${typeNames[tieKey]}`,
        text: `${scoreSentence} ${standardText} ${defenseText} ${driveText}`
      };
    }

    function setAxis(id, label, score) {
      const percent = Math.round((score / 5) * 100);
      document.getElementById(`${id}Label`).textContent = label;
      document.getElementById(`${id}Percent`).textContent = `${percent}%`;
      document.getElementById(`${id}Bar`).style.width = `${percent}%`;
    }

    }

    async function shareTest() {
      const resultName = currentResultKey ? results[currentResultKey].name : "";
      const shareData = {
        title: "테스트잇 자아찾기 모의고사 테스트",
        text: resultName
          ? `내 안의 권력자는 ${resultName}! 냉혹한 자아를 확인해보세요.`
          : "가장 직관적이고 본능적인 당신의 권력 욕구를 확인해보세요.",
        url: TEST_URL
      };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(TEST_URL);
          showToast("테스트 주소를 복사했습니다.");
        }
      } catch (error) {
        if (error && error.name !== "AbortError") {
          try {
            await navigator.clipboard.writeText(TEST_URL);
            showToast("테스트 주소를 복사했습니다.");
          } catch (clipboardError) {
            showToast("주소를 복사하지 못했습니다.");
          }
        }
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.getElementById("imageModal").addEventListener("click", event => {
      if (event.target.id === "imageModal") closeModal();
    });
  </script>
</body>
</html>
