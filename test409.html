<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8df" />

  <title>테스트잇 삐에로 성격 테스트</title>
  <meta name="description" content="나와 닮은 삐에로는 누구일까? 테스트잇 삐에로 성격 테스트" />
  <meta property="og:title" content="테스트잇 삐에로 성격 테스트" />
  <meta property="og:description" content="나와 닮은 삐에로는 누구일까?" />
  <meta property="og:url" content="https://test-it.co.kr/test409" />
  <meta property="og:type" content="website" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

    @font-face {
      font-family: 'Galmuri11';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri11-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --cream: #fff8df;
      --paper: #fffdf6;
      --red: #e84b43;
      --red-dark: #bd342f;
      --blue: #467fc5;
      --blue-soft: #eaf2ff;
      --yellow: #f3d45b;
      --yellow-soft: #fff0a8;
      --pink: #f7c8c1;
      --ink: #272522;
      --muted: #736d63;
      --line: #2d2a26;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Galmuri11', monospace;
      -webkit-font-smoothing: none;
      text-rendering: optimizeSpeed;
      font-synthesis: none;
      background:
        radial-gradient(circle at 12px 12px, rgba(232,75,67,.07) 0 2px, transparent 2.5px) 0 0 / 24px 24px,
        var(--cream);
      color: var(--ink);
    }

    button {
      font: inherit;
      font-family: 'Galmuri11', monospace;
    }

    .site-header {
      width: 100%;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #e8e0cf;
    }

    .site-header-inner {
      width: min(100%, 760px);
      height: 58px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #222;
      text-decoration: none;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 16px;
      font-weight: normal;
    }

    .nav a,
    .nav a.active {
      color: #3f3b36;
      text-decoration: none;
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 20px 14px 56px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* =========================
       START
    ========================= */

    .start-card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 2px solid var(--line);
    }

    .circus-awning {
      height: 54px;
      display: flex;
      border-bottom: 2px solid var(--line);
      background: #fff;
    }

    .circus-awning span {
      flex: 1;
      position: relative;
    }

    .circus-awning span:nth-child(odd) {
      background: var(--red);
    }

    .circus-awning span:nth-child(even) {
      background: #fff4c4;
    }

    .circus-awning span::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -13px;
      width: 24px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: inherit;
      border-bottom: 2px solid var(--line);
    }

    .start-stage {
      position: relative;
      padding: 48px 28px 36px;
      min-height: 520px;
      text-align: center;
    }

    .start-stage::before,
    .start-stage::after {
      content: "";
      position: absolute;
      width: 96px;
      height: 170px;
      top: 120px;
      background:
        repeating-linear-gradient(
          135deg,
          transparent 0 12px,
          rgba(70,127,197,.12) 12px 24px
        );
      pointer-events: none;
    }

    .start-stage::before {
      left: -38px;
      transform: rotate(-8deg);
    }

    .start-stage::after {
      right: -38px;
      transform: rotate(8deg);
    }

    .ticket-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px 7px;
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      transform: rotate(-1.5deg);
    }

    .ticket-label::before,
    .ticket-label::after {
      content: "✦";
      color: var(--yellow);
      font-size: 10px;
    }

    .start-title {
      margin: 26px 0 0;
      font-size: clamp(35px, 9vw, 50px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -3px;
    }

    .start-title .accent {
      color: var(--red);
    }

    .start-title .blue {
      color: var(--blue);
    }

    .clown-emblem {
      position: relative;
      width: 188px;
      height: 188px;
      margin: 34px auto 25px;
    }

    .clown-emblem::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(
          var(--yellow) 0 12.5%,
          #fff 12.5% 25%,
          var(--blue) 25% 37.5%,
          #fff 37.5% 50%,
          var(--pink) 50% 62.5%,
          #fff 62.5% 75%,
          var(--yellow) 75% 87.5%,
          #fff 87.5% 100%
        );
      border: 2px solid var(--line);
    }

    .clown-face {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: #fffef9;
    }

    .clown-hat {
      position: absolute;
      left: 50%;
      top: 8px;
      width: 92px;
      height: 54px;
      transform: translateX(-50%);
      z-index: 3;
    }

    .clown-hat::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 0;
      width: 62px;
      height: 42px;
      background: var(--red);
      border: 2px solid var(--line);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .clown-hat::after {
      content: "";
      position: absolute;
      left: 4px;
      bottom: 0;
      width: 84px;
      height: 14px;
      background: var(--blue);
      border: 2px solid var(--line);
    }

    .eye {
      position: absolute;
      top: 64px;
      width: 12px;
      height: 15px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 41px; }
    .eye.right { right: 41px; }

    .nose {
      position: absolute;
      top: 79px;
      left: 50%;
      width: 30px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 2px solid var(--line);
      background: var(--red);
    }

    .cheek {
      position: absolute;
      top: 96px;
      width: 24px;
      height: 10px;
      border-radius: 50%;
      background: var(--pink);
    }

    .cheek.left { left: 25px; }
    .cheek.right { right: 25px; }

    .mouth {
      position: absolute;
      left: 50%;
      top: 111px;
      width: 55px;
      height: 25px;
      transform: translateX(-50%);
      border-bottom: 3px solid var(--ink);
      border-radius: 0 0 50% 50%;
    }

    .start-copy {
      margin: 0 auto;
      max-width: 330px;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 700;
      color: #625c53;
      word-break: keep-all;
    }

    .star-line {
      margin: 26px auto 0;
      width: 72%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--red);
      font-size: 11px;
    }

    .star-line::before,
    .star-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #bdb4a5;
    }

    .start-btn,
    .action-btn {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 0;
      cursor: pointer;
      font-weight: 700;
      transition: transform .08s ease, filter .15s ease;
    }

    .start-btn:active,
    .action-btn:active,
    .answer-btn:active {
      transform: translateY(1px);
    }

    .start-btn {
      margin-top: 14px;
      padding: 17px 14px;
      background: var(--red);
      color: #fff;
      font-size: 17px;
    }

    .start-btn:hover,
    .action-btn:hover {
      filter: brightness(.98);
    }

    /* =========================
       QUIZ
    ========================= */

    .quiz-wrap {
      overflow: hidden;
      background: var(--paper);
      border: 2px solid var(--line);
    }

    .quiz-head {
      position: relative;
      padding: 22px 22px 19px;
      background: #fff3be;
      border-bottom: 1px solid #d7caa4;
    }

    .quiz-head::before {
      content: '';
      display: block;
      margin-bottom: 12px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      background: #fff;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background:
        repeating-linear-gradient(
          90deg,
          var(--red) 0 18px,
          var(--red) 18px 36px,
          var(--blue) 36px 54px,
          var(--blue) 54px 72px,
          var(--yellow) 72px 90px,
          var(--yellow) 90px 108px
        );
      transition: width .25s ease;
    }

    .progress-count {
      min-width: 40px;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: #544e45;
    }

    .quiz-body {
      padding: 31px 22px 28px;
    }

    .question-label {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .question-text {
      min-height: 118px;
      margin: 12px 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(20px, 5.3vw, 25px);
      line-height: 1.48;
      letter-spacing: -1px;
      font-weight: 700;
      word-break: keep-all;
    }

    .answer-list {
      display: grid;
      gap: 11px;
    }

    .answer-btn {
      position: relative;
      width: 100%;
      min-height: 78px;
      padding: 16px 18px 16px 54px;
      border: 1.5px solid #6f675c;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-size: 15px;
      line-height: 1.48;
      font-weight: 700;
      cursor: pointer;
      word-break: keep-all;
      transition: background-color .15s ease, transform .08s ease;
    }

    .answer-btn::before {
      content: "●";
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red);
      font-size: 18px;
    }

    .answer-btn:nth-child(2)::before {
      color: var(--blue);
    }

    .answer-btn:hover {
      background: #fff8d9;
    }

    .quiz-bottom {
      padding: 0 22px 22px;
      text-align: center;
      color: #948b7c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    /* =========================
       CLEAN PIXEL STYLE
    ========================= */

    body {
      background-color: #fff8e8;
      background-image:
        linear-gradient(rgba(232,75,67,.10) 2px, transparent 2px),
        linear-gradient(90deg, rgba(70,127,197,.08) 2px, transparent 2px);
      background-size: 24px 24px;
      background-position: 7px 7px;
    }

    .start-card,
    .quiz-wrap {
      background: #fff;
      border: 2px solid var(--line);
    }

    .circus-awning {
      height: 18px;
      display: block;
      border-bottom: 2px solid var(--line);
      background:
        repeating-linear-gradient(
          90deg,
          var(--red) 0 22px,
          var(--red) 22px 44px,
          var(--yellow) 44px 66px,
          var(--yellow) 66px 88px,
          var(--blue) 88px 110px,
          var(--blue) 110px 132px,
          #fff 132px 154px,
          #fff 154px 176px
        );
    }

    .circus-awning span {
      display: none;
    }

    .start-stage {
      min-height: 490px;
      padding: 40px 28px 32px;
      background: #fff;
    }

    .start-stage::before,
    .start-stage::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      top: 20px;
      background: var(--red);
      transform: none;
      box-shadow:
        9px 0 0 var(--yellow),
        18px 0 0 var(--blue),
        0 9px 0 var(--blue),
        9px 9px 0 var(--red);
    }

    .start-stage::before {
      left: 18px;
    }

    .start-stage::after {
      left: auto;
      right: 36px;
      transform: scaleX(-1);
    }

    .ticket-label {
      padding: 7px 10px 6px;
      border: 2px solid var(--line);
      background: #fff1ae;
      color: var(--ink);
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 0;
      transform: none;
    }

    .ticket-label::before,
    .ticket-label::after {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--red);
    }

    .ticket-label::after {
      background: var(--blue);
    }

    .start-title {
      margin-top: 22px;
      font-weight: normal;
      letter-spacing: -2px;
    }

    .clown-emblem {
      width: 178px;
      height: 178px;
      margin: 30px auto 23px;
    }

    .clown-emblem::before {
      border-radius: 0;
      border: 2px solid var(--line);
      background:
        linear-gradient(90deg, rgba(243,212,91,.42) 50%, transparent 50%) 0 0 / 16px 16px,
        linear-gradient(rgba(70,127,197,.18) 50%, transparent 50%) 0 0 / 16px 16px,
        #fff;
    }

    .clown-face {
      inset: 20px;
      border-width: 2px;
      background: #fff;
    }

    .start-copy {
      font-weight: normal;
    }

    .star-line {
      margin-top: 21px;
      color: var(--red);
    }

    .start-btn,
    .action-btn {
      font-weight: normal;
      border-width: 2px;
    }

    .quiz-wrap {
      overflow: hidden;
    }

    .quiz-head {
      padding: 16px 19px 15px;
      background: #fff;
      border-bottom: 2px solid var(--line);
    }

    .quiz-head::before {
      content: none;
      display: none;
    }

    .progress-track {
      height: 10px;
      border: 2px solid var(--line);
      background: #fff;
    }

    .progress-bar {
      background:
        repeating-linear-gradient(
          90deg,
          var(--red) 0 16px,
          var(--red) 16px 32px,
          var(--yellow) 32px 48px,
          var(--yellow) 48px 64px,
          var(--blue) 64px 80px,
          var(--blue) 80px 96px
        );
    }

    .progress-count,
    .question-label {
      font-weight: normal;
    }

    .quiz-body {
      padding-top: 26px;
      background: #fff;
    }

    .question-text {
      min-height: 108px;
      font-weight: normal;
    }

    .answer-btn {
      min-height: 72px;
      border: 2px solid var(--line);
      background: #fff;
      font-weight: normal;
    }

    .answer-btn::before {
      content: '';
      left: 21px;
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: var(--red);
    }

    .answer-btn:nth-child(2)::before {
      background: var(--blue);
    }

    .answer-btn:hover {
      background: #fff5c9;
    }

    /* =========================
       RESULT
    ========================= */

    #captureArea {
      background: #fff;
    }

    .result-paper {
      overflow: hidden;
      background: #fff;
      border: 2px solid var(--line);
    }

    .result-banner {
      position: relative;
      padding: 15px 16px 14px;
      text-align: center;
      background: #fff;
      border-bottom: 2px solid var(--line);
    }

    .result-banner::before,
    .result-banner::after {
      content: '';
      position: absolute;
      top: 10px;
      width: 6px;
      height: 6px;
      background: var(--red);
      box-shadow:
        8px 0 0 var(--yellow),
        16px 0 0 var(--blue),
        0 8px 0 var(--blue),
        8px 8px 0 var(--red);
    }

    .result-banner::before { left: 13px; }
    .result-banner::after { right: 29px; transform: scaleX(-1); }

    .result-main-title {
      font-size: clamp(16px, 4.2vw, 20px);
      line-height: 1.25;
      font-weight: normal;
      letter-spacing: 1.8px;
      color: var(--ink);
    }

    .result-hero {
      display: grid;
      grid-template-columns: 35% 65%;
      align-items: stretch;
      min-height: 148px;
      border-bottom: 2px solid var(--line);
      background: #fff;
    }

    .result-image-area {
      position: relative;
      min-height: 148px;
      padding: 3px 6px 3px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    .result-image {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      max-width: 138px;
      max-height: 136px;
      object-fit: contain;
      object-position: center center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .result-copy-area {
      position: relative;
      transform: none;
      padding: 10px 12px 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #fff;
    }

    .result-copy-area::before,
    .result-copy-area::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      opacity: .85;
    }

    .result-copy-area::before {
      top: 12px;
      right: 16px;
      background: var(--blue);
      box-shadow: -6px 0 0 var(--yellow);
    }

    .result-copy-area::after {
      bottom: 12px;
      right: 16px;
      background: var(--red);
      box-shadow: -6px 0 0 var(--blue);
    }


    .result-prefix {
      margin: 0 0 7px;
      color: #665f56;
      font-size: clamp(11px, 2.8vw, 13px);
      line-height: 1.35;
      font-weight: normal;
      letter-spacing: .5px;
    }

    .result-name {
      margin: 0;
      color: var(--red);
      font-size: clamp(24px, 6.1vw, 31px);
      line-height: 1.1;
      font-weight: normal;
      letter-spacing: -.6px;
    }

    .result-name.small-name {
      font-size: clamp(21px, 5.4vw, 27px);
    }

    .bingo-section {
      position: relative;
      padding: 14px 14px 10px;
      background: #fff;
    }


    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1.5px solid var(--line);
      border-left: 1.5px solid var(--line);
      background: #fff;
    }

    .bingo-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      min-height: 76px;
      padding: 7px 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-right: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.35;
      font-weight: normal;
      word-break: keep-all;
    }

    .bingo-cell:nth-child(4n+1)::after {
      content: '';
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 3px;
      height: 3px;
      background: rgba(45,42,38,.32);
    }

    .bingo-cell:nth-child(8n+1),
    .bingo-cell:nth-child(8n+4),
    .bingo-cell:nth-child(8n+6),
    .bingo-cell:nth-child(8n+7) {
      background: #fff2bf;
    }

    .bingo-cell:nth-child(8n+2),
    .bingo-cell:nth-child(8n+5) {
      background: #eaf2ff;
    }

    .bingo-cell:nth-child(8n+3),
    .bingo-cell:nth-child(8n) {
      background: #ffe9e5;
    }

    .compat-section {
      padding: 5px 14px 17px;
      background: #fff;
    }

    .compat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding-top: 10px;
    }

    .compat-card {
      position: relative;
      min-height: 112px;
      border: 2px solid var(--line);
      background: #fff;
    }

    .compat-card::after {
      content: '';
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 4px;
      height: 4px;
      background: var(--blue);
    }

    .compat-card.bad::after {
      background: var(--red);
    }

    .compat-title {
      margin: 0;
      padding: 10px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      font-weight: normal;
      border-bottom: 2px solid var(--line);
      background: #eef4ff;
    }

    .compat-card.bad .compat-title {
      background: #fff0eb;
    }

    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');

    const startBtn = document.getElementById('startBtn');

    const currentCount = document.getElementById('currentCount');
    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const answersWrap = document.getElementById('answers');

    const resultName = document.getElementById('resultName');
    const resultImage = document.getElementById('resultImage');
    const bingoGrid = document.getElementById('bingoGrid');
    const goodMatchList = document.getElementById('goodMatchList');
    const badMatchList = document.getElementById('badMatchList');

    const saveBtn = document.getElementById('saveBtn');
    const retryBtn = document.getElementById('retryBtn');
    const otherBtn = document.getElementById('otherBtn');
    const shareBtn = document.getElementById('shareBtn');

    const saveModal = document.getElementById('saveModal');
    const savePreview = document.getElementById('savePreview');
    const saveModalClose = document.getElementById('saveModalClose');

    let currentQuestion = 0;
    let latestResultCode = '';
    let scores = {
      E: 0, I: 0,
      S: 0, N: 0,
      T: 0, F: 0,
      J: 0, P: 0
    };

    function showOnly(target) {
      [startScreen, quizScreen, resultScreen].forEach(el => el.classList.remove('active'));
      target.classList.add('active');
    }

    function resetTest() {
      currentQuestion = 0;
      latestResultCode = '';
      scores = {
        E: 0, I: 0,
        S: 0, N: 0,
        T: 0, F: 0,
        J: 0, P: 0
      };

      saveModal.classList.remove('show');
      saveModal.setAttribute('aria-hidden', 'true');
      savePreview.removeAttribute('src');
    }

    function startTest() {
      resetTest();
      showOnly(quizScreen);
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderQuestion() {
      const q = questions[currentQuestion];

      currentCount.textContent = currentQuestion + 1;
      questionNumber.textContent = 'QUESTION ' + String(currentQuestion + 1).padStart(2, '0');
      questionText.innerHTML = q.text;
      progressBar.style.width = ((currentQuestion / questions.length) * 100) + '%';

      answersWrap.innerHTML = '';

      q.answers.forEach(answer => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer-btn';
        btn.innerHTML = answer.text;
        btn.addEventListener('click', () => chooseAnswer(answer.letter));
        answersWrap.appendChild(btn);
      });
    }

    function chooseAnswer(letter) {
      scores[letter] += 1;
      currentQuestion += 1;

      if (currentQuestion < questions.length) {
        renderQuestion();
        return;
      }

      progressBar.style.width = '100%';
      showResult();
    }

    function getResultCode() {
      return [
        scores.E > scores.I ? 'E' : 'I',
        scores.S > scores.N ? 'S' : 'N',
        scores.T > scores.F ? 'T' : 'F',
        scores.J > scores.P ? 'J' : 'P'
      ].join('');
    }

    function showResult() {
      latestResultCode = getResultCode();
      const data = results[latestResultCode];

      resultName.textContent = data.name;
      resultName.classList.toggle('small-name', data.name === '꿀잠삐');

      const imagePath = 'img_' + latestResultCode.toLowerCase() + '409.png';
      resultImage.style.display = 'none';
      resultImage.alt = data.name + ' 이미지';

      resultImage.onload = () => {
        resultImage.style.display = 'block';
      };

      resultImage.onerror = () => {
        resultImage.style.display = 'none';
      };

      resultImage.src = imagePath;

      bingoGrid.innerHTML = '';
      data.bingo.forEach(item => {
        const cell = document.createElement('div');
        cell.className = 'bingo-cell';
        cell.textContent = item;
        bingoGrid.appendChild(cell);
      });

      const compat = compatibilityMap[latestResultCode];
      goodMatchList.innerHTML = '';
      badMatchList.innerHTML = '';

      compat.good.forEach(name => {
        const chip = document.createElement('div');
        chip.className = 'compat-chip';
        chip.textContent = name;
        goodMatchList.appendChild(chip);
      });

      compat.bad.forEach(name => {
        const chip = document.createElement('div');
        chip.className = 'compat-chip';
        chip.textContent = name;
        badMatchList.appendChild(chip);
      });

      showOnly(resultScreen);
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    async function saveResultImage() {
      if (typeof html2canvas !== 'function') {
        alert('이미지 저장 기능을 불러오지 못했습니다.');
        return;
      }

      try {
        saveBtn.disabled = true;
        saveBtn.textContent = '이미지 만드는 중...';

        const canvas = await html2canvas(document.getElementById('captureArea'), {
          backgroundColor: '#ffffff',
          scale: 1.45,
          useCORS: true,
          allowTaint: false,
          logging: false
        });

        savePreview.src = canvas.toDataURL('image/png', 0.95);
        saveModal.classList.add('show');
        saveModal.setAttribute('aria-hidden', 'false');
      } catch (error) {
        console.error(error);
        alert('이미지 저장 중 오류가 발생했습니다.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '결과 이미지 저장하기';
      }
    }

    function closeSaveModal() {
      saveModal.classList.remove('show');
      saveModal.setAttribute('aria-hidden', 'true');
    }

    async function shareTest() {
      const text = SHARE_TITLE + '\n' + TEST_URL;

      try {
        if (navigator.share) {
          await navigator.share({
            title: SHARE_TITLE,
            text: SHARE_TITLE,
            url: TEST_URL
          });
          return;
        }

        await navigator.clipboard.writeText(text);
        alert('테스트 주소가 복사되었습니다.');
      } catch (error) {
        if (error && error.name === 'AbortError') return;

        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
        alert('테스트 주소가 복사되었습니다.');
      }
    }

    saveModalClose.addEventListener('click', closeSaveModal);

    saveModal.addEventListener('click', (event) => {
      if (event.target === saveModal) closeSaveModal();
    });

    startBtn.addEventListener('click', startTest);

    retryBtn.addEventListener('click', () => {
      resetTest();
      showOnly(startScreen);
      window.scrollTo({ top: 0, behavior: 'auto' });
    });

    otherBtn.addEventListener('click', () => {
      window.location.href = 'https://test-it.co.kr/';
    });

    saveBtn.addEventListener('click', saveResultImage);
    shareBtn.addEventListener('click', shareTest);
  </script>
