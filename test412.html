      text-align: center;
      font-size: 14px;

      margin-top: 9px;

    .match-box {

      border: var(--line);
    }

    .match-title {
      padding: 8px 10px;
      border-bottom: var(--line);
      background: var(--point);
      text-align: center;
      font-size: 14px;
    }

    .match-types {
      min-height: 88px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      font-size: 13.5px;
      line-height: 1.45;

    .match-chip {

      min-height: 44px;
      padding: 8px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .match-chip + .match-chip {
      border-top: var(--line);
    }

    .result-actions {
      width: min(100%, 520px);
      margin: 22px auto 0;
      display: grid;
      gap: 9px;
    }

    .result-btn.secondary {
      background: #fff;
      color: var(--ink);
    }

    .coupang-ad {
      width: min(100%, 350px);
      min-height: 140px;
      margin: 22px auto 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .coupang-ad-inner {
      width: 350px;
      height: 140px;
      flex: 0 0 350px;
    }

    /* 이미지 저장 팝업 */
    .save-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.72);
    }

    .save-modal.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 300px);
      max-height: 92vh;
      overflow: auto;
      padding: 12px;
      border: 1px solid #fff;
      background: #fff;
    }

    .modal-guide {
      margin: 0 0 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .saved-image {

      width: 250px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border: var(--line);

    }

    .modal-close {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: var(--line);
      border-radius: 0;
      background: #fff;
      cursor: pointer;

    .toast {
      position: fixed;
      left: 50%;

      max-width: calc(100% - 32px);

    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      .page-shell {

      .logo {
        font-size: 17px;
      }

      .nav {
        gap: 9px;
        font-size: 15px;
      }

      .result-sheet {
        padding: 7px;
      }

      .result-top {
        grid-template-columns: 105px 1fr;

      .identity-box {
        min-height: 180px;

      .type-label {
        font-size: 16px;

      .result-icon {

      .quick-boxes {
        gap: 5px;

      .box-label {

      .box-value {

      .trait-list {

      .trait-row {
        min-height: 48px;

      .trait-text {

        line-height: 1.5;

        gap: 6px;

      }

      .match-title,

      .match-types {

    @media (max-width: 370px) {
      .nav {

</head>

              <div id="goodMatch" class="match-types"></div>

    const screens = {
      start: document.getElementById('startScreen'),
      question: document.getElementById('questionScreen'),
      result: document.getElementById('resultScreen')
    };

    const state = {
      current: 0,
      scores: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 },
      locked: false,
      resultType: ''
    };

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function resetTest() {
      state.current = 0;
      state.scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
      state.locked = false;
      state.resultType = '';
    }

    function startTest() {
      resetTest();
      showScreen('question');
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[state.current];
      const displayNumber = String(state.current + 1).padStart(2, '0');
      document.getElementById('questionNumber').textContent = `질문 ${displayNumber}`;
      document.getElementById('questionText').innerHTML = question.text;
      document.getElementById('progressCount').textContent = `${state.current + 1} / ${questions.length}`;
      document.getElementById('progressBar').style.width = `${((state.current + 1) / questions.length) * 100}%`;

      const answerList = document.getElementById('answerList');
      answerList.innerHTML = '';
      question.answers.forEach(answer => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-btn';
        button.innerHTML = answer.text;
        button.addEventListener('click', () => selectAnswer(answer.letter, button));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(letter, selectedButton) {
      if (state.locked) return;
      state.locked = true;
      state.scores[letter] += 1;

      document.querySelectorAll('.answer-btn').forEach(button => button.disabled = true);
      selectedButton.classList.add('selected');

      window.setTimeout(() => {
        state.current += 1;
        state.locked = false;

        if (state.current < questions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 35);
    }

    function getResultType() {
      const first = state.scores.E >= state.scores.I ? 'E' : 'I';
      const second = state.scores.S >= state.scores.N ? 'S' : 'N';
      const third = state.scores.T >= state.scores.F ? 'T' : 'F';
      const fourth = state.scores.J >= state.scores.P ? 'J' : 'P';
      return first + second + third + fourth;
    }

    function makeMatchHtml(items) {
      return items.map(item => {
        const nameOnly = item.replace(/^[A-Z]{4}\s*/, '');
        return `<span class="match-chip">${nameOnly}</span>`;
      }).join('');
    }

    function showResult() {
      state.resultType = getResultType();
      const result = results[state.resultType];

      const nameLines = resultNameLines[state.resultType];
      document.getElementById('resultNameTop').textContent = nameLines[0];
      document.getElementById('resultNameBottom').textContent = nameLines[1];
      const resultIcon = document.getElementById('resultIcon');
      resultIcon.innerHTML = iconSvgs[result.icon];
      resultIcon.dataset.icon = result.icon;
      resultIcon.style.setProperty('--icon-accent', iconColors[state.resultType]);
      document.getElementById('firstImpression').innerHTML = result.first;
      document.getElementById('realSelf').innerHTML = result.real;

      document.getElementById('traitList').innerHTML = result.traits.map(trait => `
        <div class="trait-row">
          <div class="trait-text">${trait}</div>
        </div>
      `).join('');

      document.getElementById('goodMatch').innerHTML = makeMatchHtml(result.good);
      document.getElementById('badMatch').innerHTML = makeMatchHtml(result.bad);

      showScreen('result');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1900);
    }

      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;

        const target = document.getElementById('resultSheet');
        const canvas = await html2canvas(target, {
          backgroundColor: '#ffffff',
          scale: Math.min(window.devicePixelRatio * 1.2, 2),
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: -window.scrollY
        });

        const compactCanvas = document.createElement('canvas');
        const compactWidth = Math.min(480, canvas.width);
        const compactRatio = compactWidth / canvas.width;
        compactCanvas.width = Math.round(compactWidth);
        compactCanvas.height = Math.round(canvas.height * compactRatio);
        const compactContext = compactCanvas.getContext('2d');
        compactContext.fillStyle = '#ffffff';
        compactContext.fillRect(0, 0, compactCanvas.width, compactCanvas.height);
        compactContext.imageSmoothingEnabled = true;
        compactContext.imageSmoothingQuality = 'high';
        compactContext.drawImage(canvas, 0, 0, compactCanvas.width, compactCanvas.height);

        const image = document.getElementById('savedImage');
        image.src = compactCanvas.toDataURL('image/png');
        document.getElementById('saveModal').classList.add('open');
        document.body.style.overflow = 'hidden';
      } catch (error) {
        showToast('이미지를 만들지 못했어요. 다시 시도해 주세요.');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = originalText;
      }
    }

    function closeModal() {
      document.getElementById('saveModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    async function shareTest() {
      const shareData = {
        title: '테스트잇 그냥 그런 성격 테스트',
        text: '테스트잇 그냥 그런 성격 테스트',
        url: TEST_URL
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }

      try {
        await navigator.clipboard.writeText(`테스트잇 그냥 그런 성격 테스트\n${TEST_URL}`);
        showToast('테스트 주소를 복사했어요.');
      } catch (error) {
        const temporary = document.createElement('textarea');
        temporary.value = `테스트잇 그냥 그런 성격 테스트\n${TEST_URL}`;
        temporary.style.position = 'fixed';
        temporary.style.opacity = '0';
        document.body.appendChild(temporary);
        temporary.select();
        document.execCommand('copy');
        temporary.remove();
        showToast('테스트 주소를 복사했어요.');
      }
    }

    document.getElementById('startBtn').addEventListener('click', startTest);
    document.getElementById('retryBtn').addEventListener('click', () => {
      resetTest();
      showScreen('start');
    });
    document.getElementById('otherBtn').addEventListener('click', () => {
      window.location.href = 'https://test-it.co.kr/';
    });
    document.getElementById('saveBtn').addEventListener('click', saveResultImage);
    document.getElementById('shareBtn').addEventListener('click', shareTest);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') closeModal();
    });
  </script>
</body>
</html>
