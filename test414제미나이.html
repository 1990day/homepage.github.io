<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>테스트잇 성격 난이도 종합 평가 테스트</title>
  <meta name="description" content="나와 친해지고 오래 지내는 난이도를 확인하는 성격 종합 평가 테스트">
  <meta property="og:title" content="테스트잇 성격 난이도 종합 평가 테스트">
  <meta property="og:description" content="내 성격은 몇 단계 난이도일까?">
  <meta property="og:url" content="https://test-it.co.kr/test414">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://test-it.co.kr/img_main414.png">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: 'Galmuri14';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri14.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #181818;
      --muted: #676767;
      --line: #181818;
      --paper: #fffef9;
      --page: #ffffff;
      --point: #a9e4bd;
      --point-dark: #3d7350;
      --soft: #edf8f0;
      --page-width: 590px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: 'Galmuri14', monospace;
      letter-spacing: -0.3px;
      word-break: keep-all;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: none;
      font-synthesis: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      width: min(100%, var(--page-width));
      height: 58px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .logo {
      font-size: 19px;
      letter-spacing: -0.8px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 15px;
    }

    .app {
      width: min(100%, var(--page-width));
      min-height: calc(100vh - 58px);
      margin: 0 auto;
      padding: 24px 14px 48px;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    .start-screen {
      width: min(100%, 500px);
      margin: 0 auto;
      text-align: center;
    }

    .main-visual {
      position: relative;
      width: 500px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .main-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .main-fallback {
      display: none;
      position: absolute;
      inset: 0;
      padding: 28px;
      border: 1px solid var(--line);
      background: var(--paper);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .main-fallback.show {
      display: flex;
    }

    .fallback-label {
      margin-bottom: 15px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .fallback-title {
      margin: 0;
      font-size: 30px;
      line-height: 1.45;
    }

    .fallback-line {
      width: 74%;
      margin: 21px 0 18px;
      border-top: 1px dashed var(--line);
    }

    .fallback-subtitle {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .primary-button,
    .action-button {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      transition: background .12s ease, color .12s ease;
    }

    .start-screen > .primary-button {
      width: min(100%, 500px);
      margin-top: 12px;
      background: var(--ink);
      color: #fff;
    }

    .primary-button:active,
    .action-button:active {
      background: var(--ink);
      color: #fff;
    }

    .quiz-wrap {
      width: min(100%, 500px);
      margin: 0 auto;
    }

    .quiz-head {
      margin-bottom: 18px;
    }

    .quiz-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .quiz-part {
      font-size: 12px;
      color: var(--muted);
    }

    .quiz-count {
      font-size: 13px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--point);
      transition: width .18s ease;
    }

    .question-paper {
      position: relative;
      min-height: 390px;
      padding: 34px 24px 26px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .question-paper::before {
      content: '';
      position: absolute;
      top: 17px;
      left: 18px;
      right: 18px;
      border-top: 1px dashed #9b9b9b;
    }

    .question-number {
      display: block;
      margin-bottom: 14px;
      color: var(--point-dark);
      font-size: 13px;
    }

    .question-text {
      min-height: 62px;
      margin: 0 0 25px;
      font-size: 19px;
      font-weight: normal;
      line-height: 1.65;
    }

    .answer-list {
      display: grid;
      gap: 10px;
    }

    .answer-button {
      position: relative;
      width: 100%;
      min-height: 62px;
      padding: 13px 14px 13px 42px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      line-height: 1.55;
      text-align: left;
    }

    .answer-button::before {
      content: attr(data-label);
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: var(--point-dark);
      font-size: 13px;
    }

    .answer-button:active,
    .answer-button.selected {
      background: var(--soft);
    }

    .answer-button:disabled {
      color: var(--ink);
      opacity: 1;
    }

    .loading-screen {
      width: min(100%, 500px);
      margin: 0 auto;
    }

    .loading-card {
      min-height: 430px;
      padding: 72px 24px 44px;
      border: 1px solid var(--line);
      background: var(--paper);
      text-align: center;
    }

    .loading-sheet {
      position: relative;
      width: 92px;
      height: 116px;
      margin: 0 auto 28px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .loading-sheet::before,
    .loading-sheet::after {
      content: '';
      position: absolute;
      left: 15px;
      right: 15px;
      border-top: 1px solid #777;
    }

    .loading-sheet::before {
      top: 42px;
      box-shadow: 0 17px 0 #777, 0 34px 0 #777;
    }

    .loading-check {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--point-dark);
      font-size: 20px;
      animation: blink .7s steps(2, end) infinite;
    }

    @keyframes blink {
      50% { opacity: .25; }
    }

    .loading-title {
      margin: 0 0 12px;
      font-size: 19px;
      font-weight: normal;
    }

    .loading-text {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .loading-bar {
      width: min(100%, 300px);
      height: 8px;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .loading-bar-fill {
      width: 0;
      height: 100%;
      background: var(--point);
    }

    .loading-bar-fill.run {
      animation: loading 3s linear forwards;
    }

    @keyframes loading {
      from { width: 0; }
      to { width: 100%; }
    }

    .result-section {
      width: min(100%, 500px);
      margin: 0 auto;
    }

    .result-paper {
      position: relative;
      width: 100%;
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .result-paper::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .result-paper > * {
      position: relative;
      z-index: 1;
    }

    .result-header {
      padding: 13px 10px 16px;
      border-bottom: 2px solid var(--line);
      text-align: center;
    }

    .result-kicker {
      margin: 0 0 9px;
      font-size: 11px;
      letter-spacing: 1.1px;
    }

    .result-title {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      line-height: 1.45;
    }

    .score-area {
      display: grid;
      grid-template-columns: 42% 1fr;
      min-height: 154px;
      border-bottom: 1px solid var(--line);
    }

    .total-score-box {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 18px 8px;
      border-right: 1px solid var(--line);
      text-align: center;
    }

    .score-label {
      margin-bottom: 6px;
      font-size: 12px;
    }

    .score-number-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    .score-number {
      font-size: 50px;
      line-height: 1;
      color: var(--point-dark);
    }

    .score-unit {
      margin-left: 3px;
      font-size: 14px;
    }

    .level-box {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      padding: 18px;
    }

    .level-stamp {
      margin-bottom: 11px;
      padding: 5px 8px;
      border: 1px solid var(--point-dark);
      color: var(--point-dark);
      font-size: 12px;
    }

    .level-name {
      margin: 0 0 9px;
      font-size: 19px;
      font-weight: normal;
      line-height: 1.45;
    }

    .level-summary {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
    }

    .section-heading {
      margin: 0;
      padding: 10px 12px 9px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: 13px;
      font-weight: normal;
      text-align: center;
    }

    .category-list {
      border-bottom: 1px solid var(--line);
    }

    .category-row {
      display: grid;
      grid-template-columns: 104px 1fr 38px;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px dashed #a3a3a3;
    }

    .category-row:last-child {
      border-bottom: 0;
    }

    .category-name {
      font-size: 12px;
    }

    .category-track {
      height: 9px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .category-fill {
      height: 100%;
      background: var(--point);
    }

    .category-score {
      font-size: 11px;
      text-align: right;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--line);
    }

    .analysis-box {
      min-height: 155px;
      padding: 14px 13px;
    }

    .analysis-box + .analysis-box {
      border-left: 1px solid var(--line);
    }

    .analysis-label {
      display: inline-block;
      margin-bottom: 10px;
      padding-bottom: 3px;
      border-bottom: 5px solid var(--point);
      font-size: 12px;
      line-height: .55;
    }

    .analysis-title {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: normal;
      line-height: 1.45;
    }

    .analysis-text {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.65;
    }

    .result-footer {
      padding: 13px 12px 12px;
      text-align: center;
    }

    .result-footer p {
      margin: 0;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .4px;
    }

    .actions {
      width: 100%;
      margin: 18px auto 0;
      display: grid;
      gap: 9px;
    }

    .action-button:first-child {
      background: var(--ink);
      color: #fff;
    }

    .coupang-ad {
      width: 350px;
      max-width: 100%;
      min-height: 140px;
      margin: 22px auto 0;
      overflow: hidden;
      text-align: center;
    }

    .save-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 18px;
      background: rgba(0, 0, 0, .72);
      align-items: center;
      justify-content: center;
    }

    .save-modal.show {
      display: flex;
    }

    .save-modal-inner {
      width: min(78vw, 280px);
      max-height: 92vh;
      overflow: auto;
      padding: 13px;
      background: #fff;
      text-align: center;
    }

    .save-modal-inner p {
      margin: 2px 0 11px;
      font-size: 13px;
    }

    .save-preview {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
      touch-action: auto;
    }

    .modal-close {
      width: 100%;
      height: 45px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 1100;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 15px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (hover: hover) {
      .answer-button:hover {
        background: var(--soft);
      }

      .primary-button:hover,
      .action-button:hover {
        background: var(--ink);
        color: #fff;
      }
    }

    @media (max-width: 520px) {
      .site-header {
        height: 54px;
        padding: 0 12px;
      }

      .logo {
        font-size: 18px;
      }

      .site-nav {
        gap: 12px;
        font-size: 14px;
      }

      .app {
        min-height: calc(100vh - 54px);
        padding: 19px 8px 42px;
      }

      .question-paper {
        min-height: 382px;
        padding: 32px 16px 20px;
      }

      .question-text {
        min-height: 58px;
        margin-bottom: 20px;
        font-size: 17px;
      }

      .answer-button {
        min-height: 64px;
        padding: 12px 11px 12px 38px;
        font-size: 13px;
      }

      .answer-button::before {
        left: 12px;
      }

      .loading-card {
        min-height: 390px;
        padding: 58px 18px 36px;
      }

      .result-paper {
        padding: 14px;
      }

      .result-paper::before {
        top: 7px;
        left: 7px;
        right: 7px;
        bottom: 7px;
      }

      .result-header {
        padding: 12px 7px 14px;
      }

      .result-title {
        font-size: 19px;
      }

      .score-area {
        grid-template-columns: 39% 1fr;
      }

      .total-score-box {
        padding: 15px 5px;
      }

      .score-number {
        font-size: 43px;
      }

      .level-box {
        padding: 15px 12px;
      }

      .level-name {
        font-size: 16px;
      }

      .level-summary {
        font-size: 11px;
      }

      .category-row {
        grid-template-columns: 88px 1fr 35px;
        gap: 7px;
        padding: 10px 9px;
      }

      .category-name {
        font-size: 11px;
      }

      .analysis-box {
        min-height: 164px;
        padding: 12px 10px;
      }

      .analysis-title {
        font-size: 13px;
      }

      .analysis-text {
        font-size: 10.5px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="https://test-it.co.kr/">테스트잇</a>
    <nav class="site-nav" aria-label="주요 메뉴">
      <a href="https://test-it.co.kr/">성격</a>
      <a href="https://test-it.co.kr/">얼굴</a>
      <a href="https://test-it.co.kr/">그외</a>
      <a href="https://test-it.co.kr/">사주</a>
    </nav>
  </header>

  <main class="app">
    <section id="startScreen" class="screen active start-screen">
      <div class="main-visual">
        <img id="mainImage" src="img_main414.png" alt="테스트잇 성격 난이도 종합 평가 테스트 메인 이미지">
        <div id="mainFallback" class="main-fallback" aria-hidden="true">
          <span class="fallback-label">PERSONALITY REPORT</span>
          <h1 class="fallback-title">인간관계 난이도<br>종합 평가</h1>
          <div class="fallback-line"></div>
          <p class="fallback-subtitle">나와 친해지고 오래 지내려면<br>어느 정도의 노력이 필요할까?</p>
        </div>
      </div>
      <button id="startButton" class="primary-button" type="button">테스트 시작하기</button>
    </section>

    <section id="quizScreen" class="screen">
      <div class="quiz-wrap">
        <div class="quiz-head">
          <div class="quiz-meta">
            <span id="quizPart" class="quiz-part"></span>
            <span id="quizCount" class="quiz-count"></span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>
        <div class="question-paper">
          <span id="questionNumber" class="question-number"></span>
          <h2 id="questionText" class="question-text"></h2>
          <div id="answerList" class="answer-list"></div>
        </div>
      </div>
    </section>

    <section id="loadingScreen" class="screen loading-screen" aria-live="polite">
      <div class="loading-card">
        <div class="loading-sheet" aria-hidden="true">
          <span class="loading-check">✓</span>
        </div>
        <h2 class="loading-title">답안을 분석하고 있습니다</h2>
        <p class="loading-text">인간관계에서 나타나는 성향과<br>난이도를 종합적으로 계산 중입니다</p>
        <div class="loading-bar" aria-hidden="true">
          <div id="loadingBarFill" class="loading-bar-fill"></div>
        </div>
      </div>
    </section>

    <section id="resultScreen" class="screen result-section">
      <div id="resultPaper" class="result-paper">
        <header class="result-header">
          <p class="result-kicker">테스트잇 인간관계 난이도 종합 평가 테스트</p>
          <h2 class="result-title">인간관계 난이도 평가표</h2>
        </header>

        <div class="score-area">
          <div class="total-score-box">
            <span class="score-label">최종 난이도</span>
            <div class="score-number-wrap">
              <strong id="totalScore" class="score-number">0</strong>
              <span class="score-unit">%</span>
            </div>
          </div>
          <div class="level-box">
            <span id="levelStamp" class="level-stamp"></span>
            <h3 id="levelName" class="level-name"></h3>
            <p id="levelSummary" class="level-summary"></p>
          </div>
        </div>

        <h3 class="section-heading">영역별 난이도 분석</h3>
        <div id="categoryList" class="category-list"></div>

        <div class="analysis-grid">
          <section class="analysis-box">
            <span class="analysis-label">관계 특성</span>
            <h3 id="cautionTitle" class="analysis-title"></h3>
            <p id="cautionText" class="analysis-text"></p>
          </section>
          <section class="analysis-box">
            <span class="analysis-label">친해지는 법</span>
            <h3 id="tipTitle" class="analysis-title"></h3>
            <p id="tipText" class="analysis-text"></p>
          </section>
        </div>

        <footer class="result-footer">
          <p>TEST-IT.CO.KR / TEST414</p>
        </footer>
      </div>

      <div class="actions">
        <button id="saveButton" class="action-button" type="button">결과 이미지 저장하기</button>
        <button id="retryButton" class="action-button" type="button">다시 해보기</button>
        <button id="otherButton" class="action-button" type="button">다른 테스트 해보기</button>
        <button id="shareButton" class="action-button" type="button">테스트 공유하기</button>
      </div>
    </section>

    <div class="coupang-ad" aria-label="쿠팡 광고">
      <script src="https://ads-partners.coupang.com/g.js"></script>
      <script>
        new PartnersCoupang.G({
          id: 798186,
          template: 'carousel',
          width: '350',
          height: '140'
        });
      </script>
    </div>
  </main>

    const screens = document.querySelectorAll('.screen');
    const startButton = document.getElementById('startButton');
    const quizPart = document.getElementById('quizPart');
    const quizCount = document.getElementById('quizCount');
    const progressFill = document.getElementById('progressFill');
    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const answerList = document.getElementById('answerList');
    const loadingBarFill = document.getElementById('loadingBarFill');

    let currentQuestion = 0;
    let scores = createEmptyScores();
    let answerLocked = false;
    let loadingTimer = null;

    function createEmptyScores() {
      return { entry: 0, maintain: 0, conflict: 0, recovery: 0 };
    }

    function showScreen(id) {
      screens.forEach(screen => screen.classList.toggle('active', screen.id === id));
    }

    function renderQuestion() {
      const question = questions[currentQuestion];
      answerLocked = false;
      quizPart.textContent = question.part;
      quizCount.textContent = `${currentQuestion + 1} / ${questions.length}`;
      questionNumber.textContent = `Q${String(currentQuestion + 1).padStart(2, '0')}`;
      questionText.textContent = question.text;
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      answerList.innerHTML = '';

      const answerOrders = [
        [0, 1, 2],
        [2, 0, 1],
        [1, 2, 0]
      ];
      const orderedAnswers = answerOrders[currentQuestion % 3].map(index => question.answers[index]);

      orderedAnswers.forEach((answer, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-button';
        button.dataset.label = String.fromCharCode(65 + index);
        button.textContent = answer.text;
        button.addEventListener('click', () => selectAnswer(button, question.category, answer.score));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(button, category, score) {
      if (answerLocked) return;
      answerLocked = true;
      scores[category] += score;
      button.classList.add('selected');
      answerList.querySelectorAll('button').forEach(item => { item.disabled = true; });

      setTimeout(() => {
        currentQuestion += 1;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          startLoading();
        }
      }, 180);
    }

    function startLoading() {
      showScreen('loadingScreen');
      loadingBarFill.classList.remove('run');
      void loadingBarFill.offsetWidth;
      loadingBarFill.classList.add('run');
      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(showResult, 3000);
    }

    function getBand(score) {
      if (score <= 2) return 0;
      if (score <= 4) return 1;
      return 2;
    }

    function showResult() {
      const rawTotal = Object.values(scores).reduce((sum, value) => sum + value, 0);
      const total = Math.round((rawTotal / 24) * 100);
      const level = levels.find(item => total <= item.max) || levels[levels.length - 1];

      document.getElementById('totalScore').textContent = total;
      document.getElementById('levelStamp').textContent = level.stamp;
      document.getElementById('levelName').textContent = level.name;
      document.getElementById('levelSummary').textContent = level.summary;

      const categoryList = document.getElementById('categoryList');
      categoryList.innerHTML = '';

      Object.keys(categoryNames).forEach(key => {
        const converted = Math.round((scores[key] / 6) * 100);
        const row = document.createElement('div');
        row.className = 'category-row';
        row.innerHTML = `
          <span class="category-name">${categoryNames[key]}</span>
          <div class="category-track"><div class="category-fill" style="width:${converted}%"></div></div>
          <span class="category-score">${converted}</span>
        `;
        categoryList.appendChild(row);
      });

      const ordered = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const hardestKey = ordered[0];
      const caution = categoryResults[hardestKey][getBand(scores[hardestKey])];
      const tip = categoryTips[hardestKey][getBand(scores[hardestKey])];

      document.getElementById('cautionTitle').textContent = caution.title;
      document.getElementById('cautionText').textContent = caution.text;
      document.getElementById('tipTitle').textContent = `${categoryNames[hardestKey]} 공략법`;
      document.getElementById('tipText').textContent = tip;

      showScreen('resultScreen');
    }

    function resetTest() {
      currentQuestion = 0;
      scores = createEmptyScores();
      answerLocked = false;
      clearTimeout(loadingTimer);
      loadingBarFill.classList.remove('run');
      progressFill.style.width = '0';
      showScreen('startScreen');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function captureResult() {
      if (!window.html2canvas) {
        showToast('저장 기능을 불러오지 못했습니다');
        return null;
      }

      try {
        await document.fonts.ready;
        const scale = Math.min(4, Math.max(3, window.devicePixelRatio || 1));
        return await html2canvas(document.getElementById('resultPaper'), {
          scale,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#fffef9',
          logging: false,
          imageTimeout: 15000,
          scrollX: 0,
          scrollY: -window.scrollY
        });
      } catch (error) {
        showToast('이미지 저장 중 오류가 발생했습니다');
        return null;
      }
    }

    document.getElementById('mainImage').addEventListener('error', event => {
      event.currentTarget.style.display = 'none';
      document.getElementById('mainFallback').classList.add('show');
    });

    startButton.addEventListener('click', () => {
      currentQuestion = 0;
      scores = createEmptyScores();
      showScreen('quizScreen');
      renderQuestion();
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      const button = document.getElementById('saveButton');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '이미지 만드는 중...';
      const canvas = await captureResult();
      button.disabled = false;
      button.textContent = originalText;
      if (!canvas) return;

      document.getElementById('savePreview').src = canvas.toDataURL('image/png', 1);
      document.getElementById('saveModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('saveModal').classList.remove('show');
      document.body.style.overflow = '';
    });

    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') {
        document.getElementById('saveModal').classList.remove('show');
        document.body.style.overflow = '';
      }
    });

    document.getElementById('retryButton').addEventListener('click', resetTest);

    document.getElementById('otherButton').addEventListener('click', () => {
      location.href = 'https://test-it.co.kr/';
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
      const shareData = {
        title: '테스트잇 성격 난이도 종합 평가 테스트',
        text: '내 성격은 몇 단계 난이도일까?',
        url: TEST_URL
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(TEST_URL);
          showToast('링크가 복사되었습니다');
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = TEST_URL;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          showToast('링크가 복사되었습니다');
        }
      } catch (error) {
        if (error.name !== 'AbortError') showToast('공유하지 못했습니다');
      }
    });
  </script>
</body>
</html>
