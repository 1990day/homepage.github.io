  <header class="header">

    <section id="mainScreen" class="screen active">

        <div class="librarian"><div class="face">• ᴗ •</div></div>
      </div>
      <div class="paper">
        <h1>테스트잇<br>오늘의 도서관 테스트</h1>
        <p class="sub">지금 내 취향과 기분을 알려주면<br>사서가 오늘 읽을 책을 골라드려요.</p>
      </div>
      <button class="primary" onclick="startTest()">도서관 입장하기</button>
      <p class="notice">12개의 질문을 통해 등록된 도서 80권 중<br>잘 맞는 책 5권을 추천합니다.</p>
      <div class="ad">광고 영역</div>
    </section>

    <section id="questionScreen" class="screen">

        <div id="questionText" class="question"></div>
        <div id="answers"></div>
      </div>
      <div class="ad">광고 영역</div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="paper">
        <div class="result-head"><div class="stamp">오늘의 대출 승인</div><h2 id="resultType"></h2><p id="resultDesc"></p></div>

        <div id="recommendList" class="recommend-list"></div>
        <div id="receipt" class="receipt"></div>
      </div>
      <button class="primary" onclick="recommendAgain()">같은 취향으로 다른 책 찾기</button>
      <button class="secondary" onclick="restartTest()">다시 해보기</button>
      <button class="secondary" onclick="shareTest()">테스트 공유하기</button>
      <div class="ad">광고 영역</div>
    </section>

      B('엔드 오브 타임','브라이언 그린','science','wonder','deep','long','slow','knowledge','foreign','hidden'),

      B('이토록 뜻밖의 뇌과학','리사 펠드먼 배럿','science','practical','medium','medium','fast','knowledge','foreign','popular'),

      B('돈의 심리학','모건 하우절','economy','practical','easy','medium','fast','growth','foreign','popular'),
      B('부의 추월차선','엠제이 드마코','economy','practical','easy','long','fast','growth','foreign','popular'),
      B('경제학 콘서트','팀 하포드','economy','practical','easy','medium','fast','knowledge','foreign','classic'),
      B('넛지','리처드 탈러·캐스 선스타인','economy','thoughtful','medium','long','slow','knowledge','foreign','classic'),
      B('제로 투 원','피터 틸','economy','practical','easy','short','fast','growth','foreign','classic'),
      B('린 스타트업','에릭 리스','economy','practical','medium','medium','fast','growth','foreign','classic'),
      B('브랜드 설계자','러셀 브런슨','economy','practical','easy','long','fast','growth','foreign','popular'),
      B('마케팅 설계자','러셀 브런슨','economy','practical','easy','long','fast','growth','foreign','popular')
    ];

    function B(title,author,genre,mood,depth,length,pace,purpose,origin,fame){return{title,author,genre,mood,depth,length,pace,purpose,origin,fame}}

    const genreGroup={novel:'fiction',classic:'fiction',mystery:'fiction',fantasy:'fiction',sf:'fiction',essay:'emotion',poetry:'emotion',psychology:'practical',self:'practical',economy:'practical',humanities:'knowledge',science:'knowledge'};
    const genreName={novel:'소설',classic:'고전',mystery:'추리',fantasy:'판타지',sf:'SF',essay:'에세이',psychology:'심리',self:'자기계발',humanities:'인문',science:'과학',economy:'경제'};
    const moodName={warm:'따뜻함',emotional:'감정 중심',thoughtful:'생각할 거리',tense:'긴장감',wonder:'새로운 세계',heavy:'묵직함',practical:'실용적'};
    const purposeName={fun:'몰입과 재미',comfort:'위로와 여운',knowledge:'지식과 관점',growth:'변화와 성장',thoughtful:'깊은 사색'};
    const typeInfo={
      fun:['이야기 수집가','재미와 몰입을 가장 먼저 찾는 독서 취향임'],
      comfort:['마음 휴게실 단골','편안한 문장과 오래 남는 감정을 좋아하는 취향임'],
      knowledge:['호기심 서가 탐험가','새로운 사실과 관점을 발견할 때 만족하는 취향임'],
      growth:['내일을 바꾸는 독서가','읽은 내용을 생활에 적용하고 싶은 취향임']
    };
    let current=0,answers=[],lastRanked=[];

    function startTest(){current=0;answers=[];show('questionScreen');renderQuestion()}
    function renderQuestion(){
      const item=questions[current];
      document.getElementById('progressText').textContent=`${current+1} / ${questions.length}`;
      document.getElementById('progressFill').style.width=`${(current+1)/questions.length*100}%`;
      document.getElementById('questionNo').textContent=`LIBRARY QUESTION ${String(current+1).padStart(2,'0')}`;
      document.getElementById('questionText').textContent=item.q;
      const box=document.getElementById('answers');box.innerHTML='';
      item.a.forEach(option=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=option.t;btn.onclick=()=>selectAnswer(option.w);box.appendChild(btn)});
    }
    function selectAnswer(weight){answers.push(weight);current++;if(current<questions.length)renderQuestion();else makeResult(false)}
    function makeResult(randomize){
      const pref={};
      answers.forEach(a=>Object.entries(a).forEach(([k,v])=>{if(k!=='avoid')pref[k]=(pref[k]||{}),pref[k][v]=(pref[k][v]||0)+1}));
      lastRanked=books.map((book,index)=>({book,index,score:scoreBook(book,pref)+(randomize?Math.random()*3:0)})).sort((a,b)=>b.score-a.score);
      const topPool=lastRanked.slice(0,randomize?18:12);
      const picks=randomize?shuffle(topPool).slice(0,5):topPool.slice(0,5);
      const mainPurpose=topKey(pref.purpose)||'fun';
      showResult(picks.map(x=>x.book),mainPurpose);
      show('resultScreen');
    }
    function scoreBook(book,pref){
      let s=0;
      const checks=[['genre',book.genre,4],['group',genreGroup[book.genre],6],['mood',book.mood,5],['depth',book.depth,4],['length',book.length,3],['pace',book.pace,4],['purpose',book.purpose,7],['origin',book.origin,2],['fame',book.fame,2]];
      checks.forEach(([key,val,point])=>{if(pref[key]&&pref[key][val])s+=pref[key][val]*point});
      if(pref.fame&&pref.fame.any)s+=1;
      return s;
    }
    function showResult(picks,purpose){
      const info=typeInfo[purpose]||typeInfo.fun;
      document.getElementById('resultType').textContent=info[0];document.getElementById('resultDesc').textContent=info[1];
      const best=picks[0];
      document.getElementById('bestBook').innerHTML=`<div class="label">사서가 고른 오늘의 책</div><div class="best-title">${best.title}</div><div class="author">${best.author}</div><div class="reason">${reasonFor(best)}</div><div class="chips"><span class="chip">${genreName[best.genre]||best.genre}</span><span class="chip">${moodName[best.mood]||best.mood}</span><span class="chip">${purposeName[best.purpose]||best.purpose}</span></div>`;
      document.getElementById('recommendList').innerHTML=picks.slice(1).map((b,i)=>`<div class="recommend"><div class="num">대출 후보 0${i+2}</div><div class="title">${b.title}</div><div class="writer">${b.author}<br>${genreName[b.genre]||b.genre} · ${moodName[b.mood]||b.mood}</div></div>`).join('');
      document.getElementById('receipt').innerHTML=`대출 권수　5권<br>대표 취향　${purposeName[purpose]}<br>도서 데이터　총 ${books.length}권<br>반납 기한　마음에 오래 남을 때까지`;
    }
    function reasonFor(b){
      const parts=[];
      if(b.purpose==='fun')parts.push('빠르게 몰입할 수 있는 재미를 원한 답변과 잘 맞아요.');
      if(b.purpose==='comfort')parts.push('지금의 마음을 편하게 다독일 책을 찾는 답변과 잘 맞아요.');
      if(b.purpose==='knowledge')parts.push('새로운 사실과 관점을 얻고 싶은 답변과 잘 맞아요.');
      if(b.purpose==='growth')parts.push('읽은 뒤 작은 변화를 시작하고 싶은 답변과 잘 맞아요.');
      if(b.length==='short')parts.push('분량 부담이 적어 비교적 빠르게 읽기 좋아요.');
      else if(b.depth==='deep')parts.push('시간을 두고 깊게 읽을수록 생각할 거리가 많은 책이에요.');
      else if(b.pace==='fast')parts.push('전개나 구성이 빨라 흐름을 이어가기 좋은 책이에요.');
      else parts.push('서두르지 않고 천천히 읽기 좋은 책이에요.');
      return parts.join(' ');
    }
    function recommendAgain(){makeResult(true)}
    function restartTest(){current=0;answers=[];show('mainScreen')}
    function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
    function topKey(obj){if(!obj)return null;return Object.entries(obj).sort((a,b)=>b[1]-a[1])[0]?.[0]}
    function shuffle(arr){return[...arr].sort(()=>Math.random()-.5)}
    async function shareTest(){
      const data={title:'테스트잇 오늘의 도서관 테스트',text:'지금 나에게 잘 맞는 책은 무엇일까?\n도서관 사서가 내 취향에 맞는 책을\n한 권씩 골라주는 테스트!\n오늘 대출할 책을 확인해보자📚',url:location.href};
      try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);toast('테스트 주소를 복사했어요.')}}catch(e){}
    }
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
  </script>
