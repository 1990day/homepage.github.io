<script>
let tossWidgets; 

function populateDateSelectors() {
    const yearSelect = document.getElementById("birthYear");
    const monthSelect = document.getElementById("birthMonth");
    const daySelect = document.getElementById("birthDay");
    const currentYear = new Date().getFullYear();

    for (let y = 1995; y <= currentYear; y++) {
        const option = document.createElement("option");
        option.value = y;
        option.text = y;
        yearSelect.add(option);
    }

    for (let m = 1; m <= 12; m++) {
        const option = document.createElement("option");
        option.value = m;
        option.text = m;
        monthSelect.add(option);
    }

    for (let d = 1; d <= 31; d++) {
        const option = document.createElement("option");
        option.value = d;
        option.text = d;
        daySelect.add(option);
    }
}

function escapeSajuHtml(x) { return String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function showPage(pageId) {
  const pages = document.querySelectorAll('.page');
  pages.forEach(page => page.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  
  if (pageId === 'paymentPage') {
    const userName = document.getElementById("userName").value;
    const userGender = document.getElementById("userGender").value;
    const birthType = document.getElementById("birthType").value;
    const birthYear = document.getElementById("birthYear").value;
    const birthMonth = document.getElementById("birthMonth").value;
    const birthDay = document.getElementById("birthDay").value;
    const birthDate = `${birthYear}-${String(birthMonth).padStart(2, '0')}-${String(birthDay).padStart(2, '0')}`;
    const birthHour = document.getElementById("birthHour").value;
    const userEmail = document.getElementById("userEmail").value;
    
    if (!userName || !birthYear || !birthMonth || !birthDay || !birthHour || !userEmail) {
      alert("모든 정보를 입력해 주세요!");
      showPage('infoPage');
      return;
    }

    const emailConfirmMessage = "입력하신 이메일 주소가 맞는지 확인해 주세요.\n\n" + userEmail + "\n\n이 주소로 신년 운세 결과가 발송됩니다.";
    if (!confirm(emailConfirmMessage)) {
      showPage('infoPage');
      return;
    }
    
    document.getElementById("userInfo").innerHTML = `
      <h2>입력 정보 확인</h2>
      <p>이름: ${escapeSajuHtml(userName)}</p>
      <p>생년월일: ${escapeSajuHtml(birthDate)} (${escapeSajuHtml(birthType)})</p>
      <p>태어난 시간: ${escapeSajuHtml(birthHour)}</p>
      <p>이메일: ${escapeSajuHtml(userEmail)}</p>
    `;
    
    const userData = {
      name: userName,
      gender: userGender,
      birth: birthDate,
      birthType: birthType,
      time: birthHour,
      email: userEmail,
      paymentItem: "신년운세" 
    };
    
    renderTossWidgets(9900).catch(err => console.error("토스 위젯 렌더링 오류:", err));
  }
}

window.onload = function () {
    populateDateSelectors();
};

async function renderTossWidgets(price) {
  const tossPayments = TossPayments("live_gck_6bJXmgo28e9AaeqYMave8LAnGKWx");
  tossWidgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });
  
  await tossWidgets.setAmount({
    currency: "KRW",
    value: price,
  });
  
  await Promise.all([
    tossWidgets.renderPaymentMethods({
      selector: "#payment-method",
      variantKey: "DEFAULT",
    }),
    tossWidgets.renderAgreement({
      selector: "#agreement",
      variantKey: "AGREEMENT",
    }),
  ]);
}


    // 공통 결제 서버: 서버에서 상품/금액/주문번호를 검증합니다.
    const TOSS_SERVER_URL = "https://script.google.com/macros/s/AKfycbwNo04OutnyZoy6LxzCBXn0ApxfUELXrYm03NJpLABqBmCTPG1R2Nwcw_Xjs6an-oFTMA/exec";
    let paymentStarting = false;
    const value = id => document.getElementById(id).value.trim();
    const dateOf = suffix => `${value('birthYear'+suffix)}-${value('birthMonth'+suffix).padStart(2,'0')}-${value('birthDay'+suffix).padStart(2,'0')}`;

    async function startTossPay(itemName, price) {
      if (paymentStarting) return;
      if (!tossWidgets) { alert('결제창이 아직 준비되지 않았습니다.'); return; }
      const button = document.getElementById('tossPayButton');
      paymentStarting = true;
      if (button) button.disabled = true;
      try {
        const user = {
        name: value('userName'), gender: value('userGender'),
        birth: dateOf(''), birthType: value('birthType'), time: value('birthHour'),
        email: value('userEmail')
      };
        const response = await fetch(TOSS_SERVER_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'createOrder', productId: 'saju06', user }),
          redirect: 'follow'
        });
        if (!response.ok) throw new Error('주문 서버에 연결할 수 없습니다.');
        const order = await response.json();
        if (order.result !== 'success') throw new Error(order.message || '주문을 생성하지 못했습니다.');
        if (!/^saju06_[a-f0-9]{32}$/.test(order.orderId) ||
            Number(order.amount) !== 9900 || order.productName !== '신년운세') {
          throw new Error('상품이나 결제금액이 일치하지 않습니다.');
        }
        sessionStorage.setItem('sajuPendingOrderId', order.orderId);
        await tossWidgets.requestPayment({
          orderId: order.orderId, orderName: order.productName,
          successUrl: 'https://test-it.co.kr/saju-success.html',
          failUrl: 'https://test-it.co.kr/payment-fail1',
          customerName: user.name, customerEmail: user.email
        });
      } catch (error) {
        console.error('결제 요청 오류:', error);
        alert(error.message || '결제 요청 중 오류가 발생했습니다.');
      } finally {
        paymentStarting = false;
        if (button) button.disabled = false;
      }
    }

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
