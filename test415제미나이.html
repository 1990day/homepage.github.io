<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="나와 가장 닮은 가을 아이템을 알아보는 테스트잇 가을 아이템 성격 테스트">
  <meta property="og:title" content="테스트잇 가을 아이템 성격 테스트">
  <meta property="og:description" content="나와 가장 닮은 가을 아이템은 무엇일까?">
  <meta property="og:image" content="https://test-it.co.kr/img_main415.png">
  <title>테스트잇 가을 아이템 성격 테스트</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #f8f3e8;
      color: #3e2b20;
      font-family: "Galmuri14", "Galmuri11", sans-serif;
      letter-spacing: -0.4px;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .site-header {
      width: 100%;
      height: 58px;
      background: #fffdf8;
      border-bottom: 1px solid #cbbba5;
    }

    .header-inner {
      width: min(100%, 600px);
      height: 100%;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #4b3326;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .nav a {
      color: #594438;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .app {
      width: min(100%, 560px);
      min-height: calc(100vh - 58px);
      margin: 0 auto;
      padding: 22px 14px 50px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .main-card {
      width: 100%;
      padding: 14px;
      background: #fffdf8;
      border: 1px solid #8c6e58;
    }

    .main-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #e9d8b9;
    }

    .main-copy {
      padding: 18px 8px 8px;
      text-align: center;
    }

    .main-copy h1 {
      margin: 0 0 12px;
      font-size: 21px;
      line-height: 1.45;
      font-weight: 700;
    }

    .main-copy p {
      margin: 0;
      color: #765d4c;
      font-size: 13px;
      line-height: 1.75;
    }

    .primary-btn,
    .action-btn {
      width: 100%;
      min-height: 52px;
      border: 1px solid #6f4b34;
      border-radius: 0;
      font-weight: 700;
    }

    .primary-btn {
      margin-top: 14px;
      background: #6f4b34;
      color: #fffdf8;
      font-size: 16px;
    }

    .primary-btn:active,
    .action-btn:active,
    .answer-btn:active {
      transform: translateY(1px);
    }

    .ad-area {
      width: 350px;
      max-width: 100%;
      min-height: 22px;
      margin: 22px auto 0;
      overflow: hidden;
      text-align: center;
    }

    .question-wrap {
      padding-top: 5px;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #765d4c;
      font-size: 12px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      margin-bottom: 38px;
      background: #e5d7c3;
      border: 1px solid #aa9078;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #b45d3d;
      transition: width 0.2s ease;
    }

    .question-number {
      margin-bottom: 12px;
      color: #b45d3d;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .question-text {
      min-height: 76px;
      margin: 0 0 25px;
      font-size: 19px;
      line-height: 1.65;
      text-align: center;
      word-break: keep-all;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      min-height: 74px;
      padding: 16px 18px;
      background: #fffdf8;
      color: #3e2b20;
      border: 1px solid #8c6e58;
      border-radius: 0;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      word-break: keep-all;
    }

    .answer-btn.selected {
      background: #ead7ba;
      border-color: #6f4b34;
    }

    .loading-box {
      padding-top: 150px;
      text-align: center;
    }

    .leaf-loader {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 0 auto 26px;
      animation: spin 1.5s linear infinite;
    }

    .leaf-loader span {
      position: absolute;
      width: 25px;
      height: 16px;
      background: #bc6a42;
      border: 1px solid #704833;
      border-radius: 85% 12% 85% 12%;
    }

    .leaf-loader span:nth-child(1) {
      top: 3px;
      left: 17px;
      transform: rotate(45deg);
    }

    .leaf-loader span:nth-child(2) {
      top: 27px;
      left: 3px;
      background: #d49c45;
      transform: rotate(145deg);
    }

    .leaf-loader span:nth-child(3) {
      top: 30px;
      right: 2px;
      background: #8c7c45;
      transform: rotate(245deg);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .loading-text {
      margin: 0;
      color: #765d4c;
      font-size: 13px;
      line-height: 1.7;
    }

    .capture-card {
      width: 100%;
      padding: 0 20px 20px;
      background: #fffdf8;
      border: 1px solid #765744;
    }

    .test-title-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(100% + 40px);
      min-height: 58px;
      margin: 0 -20px 22px;
      padding: 10px 12px;
      color: #4c3428;
      background: #f1e4cf;
      border-bottom: 1px solid #765744;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      letter-spacing: 1.2px;
    }

    .result-label {
      margin: 0 0 7px;
      color: #8b6a52;
      font-size: 12px;
      text-align: center;
    }

    .result-name {
      margin: 0;
      color: #542f20;
      font-size: 25px;
      line-height: 1.35;
      text-align: center;
    }

    .result-image-wrap {
      position: relative;
      width: 46%;
      max-width: 190px;
      margin: 15px auto 20px;
      aspect-ratio: 1 / 1;
      background: #f2e8d7;
      border: 1px solid #c5ad92;
      overflow: hidden;
    }

    .result-image {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-summary {
      margin: 0 0 18px;
      padding: 13px 12px;
      background: #f1e4cf;
      color: #523a2c;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
      word-break: keep-all;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 19px 0 11px;
      color: #6a3f2c;
      font-size: 14px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #c8b39b;
    }

    .trait-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trait-list li {
      position: relative;
      margin-bottom: 9px;
      padding-left: 16px;
      color: #463229;
      font-size: 13px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .trait-list li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: #b45d3d;
    }

    .match-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #a78c73;
    }

    .match-item {
      padding: 12px 8px;
      text-align: center;
    }

    .match-item + .match-item {
      border-left: 1px solid #a78c73;
    }

    .match-item span {
      display: block;
      margin-bottom: 6px;
      color: #8b6a52;
      font-size: 10px;
    }

    .match-item strong {
      font-size: 13px;
    }

    .capture-footer {
      margin-top: 20px;
      color: #957965;
      font-size: 9px;
      text-align: center;
      letter-spacing: 1.2px;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .action-btn {
      background: #fffdf8;
      color: #533827;
      font-size: 14px;
    }

    .action-btn.save {
      background: #6f4b34;
      color: #fffdf8;
    }

    .save-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(35, 25, 19, 0.7);
    }

    .save-modal.open {
      display: flex;
    }

    .save-modal-box {
      width: min(100%, 430px);
      max-height: 92vh;
      padding: 14px;
      background: #fffdf8;
      border: 1px solid #51392b;
      overflow-y: auto;
    }

    .save-guide {
      margin: 2px 0 11px;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .saved-preview {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #b9a38b;
    }

    .modal-close {
      width: 100%;
      height: 46px;
      margin-top: 10px;
      background: #6f4b34;
      color: #fff;
      border: 0;
      border-radius: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10000;
      display: none;
      padding: 11px 15px;
      background: #3e2b20;
      color: #fff;
      font-size: 12px;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 420px) {
      .nav { gap: 9px; }
      .nav a { font-size: 14px; }
      .app { padding-left: 12px; padding-right: 12px; }
      .capture-card { padding: 0 15px 18px; }
      .test-title-box {
        width: calc(100% + 30px);
        margin-right: -15px;
        margin-left: -15px;
      }
      .result-name { font-size: 23px; }
      .result-image-wrap { width: 48%; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="https://test-it.co.kr/">테스트잇</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="https://test-it.co.kr/category/personality">성격</a>
        <a href="https://test-it.co.kr/category/face">얼굴</a>
        <a href="https://test-it.co.kr/category/etc">그외</a>
        <a href="https://test-it.co.kr/category/saju">사주</a>
      </nav>
    </div>
  </header>

  <main class="app">
    <section id="mainScreen" class="screen active">
      <div class="main-card">
        <img class="main-image" src="img_main415.png" alt="테스트잇 가을 아이템 성격 테스트 메인 이미지">
        <div class="main-copy">
          <h1>테스트잇<br>가을 아이템 성격 테스트</h1>
          <p>나의 성격과 가장 닮은<br>가을 아이템을 확인해보세요!</p>
        </div>
      </div>
      <button id="startBtn" class="primary-btn" type="button">테스트 시작하기</button>

      <div class="ad-area">
        <!-- 기존 쿠팡 광고 코드를 이곳에 넣어주세요. -->
      </div>
    </section>

    <section id="questionScreen" class="screen">
      <div class="question-wrap">
        <div class="progress-info">
          <span>가을 아이템을 찾는 중</span>
          <span id="progressText">1 / 12</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="questionNumber" class="question-number">Q1</div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="answers" class="answers"></div>
      </div>

      <div class="ad-area">
        <!-- 기존 쿠팡 광고 코드를 이곳에 넣어주세요. -->
      </div>
    </section>

    <section id="loadingScreen" class="screen">
      <div class="loading-box">
        <div class="leaf-loader" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <h2 class="loading-title">가을 아이템을 찾고 있어요</h2>
        <p class="loading-text">선택한 답변을 하나씩 살펴보는 중입니다.</p>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div id="captureCard" class="capture-card">
        <div class="test-title-box">테스트잇 가을 아이템 성격 테스트</div>
        <p class="result-label">나와 가장 닮은 가을 아이템은</p>
        <h1 id="resultName" class="result-name"></h1>

        <div class="result-image-wrap">
          <img id="resultImage" class="result-image" src="" alt="">
        </div>

        <p id="resultSummary" class="result-summary"></p>

        <h3 class="section-title">성격 특징</h3>
        <ul id="traitList" class="trait-list"></ul>

        <h3 class="section-title">가을 아이템 궁합</h3>
        <div class="match-box">
          <div class="match-item">
            <span>같이 있으면 편한</span>
            <strong id="goodMatch"></strong>
          </div>
          <div class="match-item">
            <span>서로 다른 매력이 있는</span>
            <strong id="differentMatch"></strong>
          </div>
        </div>

        <div class="capture-footer">테스트잇 가을 아이템 성격 테스트 / TEST415</div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="action-btn save" type="button">결과 이미지 저장하기</button>
        <button id="retryBtn" class="action-btn" type="button">다시 해보기</button>
        <button id="otherBtn" class="action-btn" type="button">다른 테스트</button>
        <button id="shareBtn" class="action-btn" type="button">테스트 공유</button>
      </div>

      <div class="ad-area">
        <!-- 기존 쿠팡 광고 코드를 이곳에 넣어주세요. -->
      </div>
    </section>
  </main>

  <div id="saveModal" class="save-modal" role="dialog" aria-modal="true" aria-label="결과 이미지 저장">
    <div class="save-modal-box">
      <p class="save-guide">아래 이미지를 꾹 눌러 저장해주세요.</p>
      <img id="savedPreview" class="saved-preview" src="" alt="저장할 결과 이미지">
      <button id="modalClose" class="modal-close" type="button">닫기</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const TEST_URL = "https://test-it.co.kr/test415";

    const questions = [
      {
        text: "선선한 가을 저녁, 퇴근(하교) 후 나의 모습은?",
        answers: [
          { text: "친구에게 연락해 맛있는 저녁을 먹고 들어간다.", value: "E" },
          { text: "집으로 곧장 가서 편한 옷으로 갈아입고 쉰다.", value: "I" }
        ]
      },
      {
        text: "사람이 북적이는 가을 축제에 갔을 때 나는?",
        answers: [
          { text: "푸드트럭도 구경하고 시끌벅적한 축제 분위기를 신나게 즐긴다.", value: "E" },
          { text: "조용히 경치를 볼 수 있는 한적한 장소부터 찾는다.", value: "I" }
        ]
      },
      {
        text: "주말에 친구가 '뭐해?'라고 물어볼 때 내 마음은?",
        answers: [
          { text: "'아무것도 안 해! 만날까?'라며 반가워한다.", value: "E" },
          { text: "'제발 나오라고 하지 마라...' 속으로 생각하며 '그냥 쉬고 있어'라고 답한다.", value: "I" }
        ]
      },
      {
        text: "길가에 떨어지는 낙엽을 볼 때 드는 생각은?",
        answers: [
          { text: "아이고, 낙엽이 엄청 떨어지네. 청소하기 힘들겠다.", value: "S" },
          { text: "나뭇잎도 떨어지고... 왠지 쓸쓸하고 감성적인 기분이 든다.", value: "N" }
        ]
      },
      {
        text: "새 가을 코트를 사려고 할 때 나는?",
        answers: [
          { text: "가격, 소재, 그리고 지금 내 옷들에 잘 어울리는지 꼼꼼히 따진다.", value: "S" },
          { text: "이 코트를 입고 분위기 있게 낙엽 길을 걷는 내 모습을 상상해 본다.", value: "N" }
        ]
      },
      {
        text: "가을 분위기의 노래를 들을 때 나는?",
        answers: [
          { text: "이 노래 멜로디 진짜 좋다. 가수 목소리도 좋네.", value: "S" },
          { text: "가사가 완전 내 이야기잖아... 눈물 날 것 같아.", value: "N" }
        ]
      },
      {
        text: "친구가 '날씨가 추워지니까 왠지 우울하네'라고 할 때 내 대답은?",
        answers: [
          { text: "보일러는 틀었어? 따뜻한 차라도 끓여 마셔봐.", value: "T" },
          { text: "맞아, 날씨가 이러니까 기분도 쳐지지. 괜찮아?", value: "F" }
        ]
      },
      {
        text: "친구가 하던 일을 망쳤다며 속상해할 때 나는?",
        answers: [
          { text: "어디서 실수했어? 원인을 찾아서 다음엔 잘하자.", value: "T" },
          { text: "너 진짜 열심히 했는데 속상하겠다. 훌훌 털고 맛있는 거 먹으러 가자!", value: "F" }
        ]
      },
      {
        text: "가을 여행 중 친구들끼리 의견이 부딪혔을 때 나는?",
        answers: [
          { text: "누구의 말이 더 맞고 합리적인지 따져서 상황을 확실히 정리한다.", value: "T" },
          { text: "누구 하나 마음 상하는 사람이 없도록 기분부터 풀어주려 노력한다.", value: "F" }
        ]
      },
      {
        text: "주말 가을 소풍을 가기로 했다! 나의 준비는?",
        answers: [
          { text: "몇 시에 만나서 어떻게 이동하고 뭐 먹을지 미리 다 찾아둔다.", value: "J" },
          { text: "'이번 주말에 공원 가자!' 하고 당일에 끌리는 대로 움직인다.", value: "P" }
        ]
      },
      {
        text: "여름옷을 넣고 가을옷을 꺼내야 할 때 나는?",

    let currentResultType = "";

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function startTest() {
      currentQuestion = 0;
      answerLocked = false;
      currentResultType = "";
      Object.keys(scores).forEach(key => scores[key] = 0);
      showScreen("question");
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[currentQuestion];
      const number = currentQuestion + 1;

      document.getElementById("progressText").textContent = `${number} / ${questions.length}`;
      document.getElementById("progressBar").style.width = `${(number / questions.length) * 100}%`;
      document.getElementById("questionNumber").textContent = `Q${number}`;
      document.getElementById("questionText").innerHTML = question.text;

      const answers = document.getElementById("answers");
      answers.innerHTML = "";

      question.answers.forEach(answer => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-btn";
        button.innerHTML = answer.text;
        button.addEventListener("click", () => selectAnswer(answer.value, button));
        answers.appendChild(button);
      });
    }

    function selectAnswer(value, button) {
      if (answerLocked) return;
      answerLocked = true;
      button.classList.add("selected");
      scores[value] += 1;

      setTimeout(() => {
        currentQuestion += 1;

        if (currentQuestion < questions.length) {
          answerLocked = false;
          renderQuestion();
        } else {
          showLoading();
        }
      }, 180);
    }

    function showLoading() {
      showScreen("loading");
      setTimeout(showResult, 3000);
    }

    function calculateType() {
      return [
        scores.E > scores.I ? "E" : "I",
        scores.S > scores.N ? "S" : "N",
        scores.T > scores.F ? "T" : "F",
        scores.J > scores.P ? "J" : "P"
      ].join("");
    }

    function showResult() {
      currentResultType = calculateType();
      const result = results[currentResultType];

      document.getElementById("resultName").textContent = result.name;
      document.getElementById("resultSummary").innerHTML = result.summary;
      document.getElementById("goodMatch").textContent = result.good;
      document.getElementById("differentMatch").textContent = result.different;

      const resultImage = document.getElementById("resultImage");
      resultImage.style.display = "block";
      resultImage.src = `img_${currentResultType.toLowerCase()}415.png`;
      resultImage.alt = `${result.name} 결과 이미지`;
      resultImage.onerror = function () {
        this.style.display = "none";
      };

      const traitList = document.getElementById("traitList");
      traitList.innerHTML = "";
      result.traits.forEach(trait => {
        const li = document.createElement("li");
        li.textContent = trait;
        traitList.appendChild(li);
      });

      showScreen("result");
    }

    async function saveResult() {
      const saveBtn = document.getElementById("saveBtn");
      const originalText = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = "이미지 만드는 중...";

      try {
        const canvas = await html2canvas(document.getElementById("captureCard"), {
          scale: 3,
          useCORS: true,
          backgroundColor: "#fffdf8",
          logging: false
        });

        const imageUrl = canvas.toDataURL("image/png", 1);
        document.getElementById("savedPreview").src = imageUrl;
        document.getElementById("saveModal").classList.add("open");
      } catch (error) {
        showToast("이미지를 만들지 못했어요. 다시 시도해주세요.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    }

    async function shareTest() {
      const resultName = currentResultType ? results[currentResultType].name : "";
      const shareData = {
        title: "테스트잇 가을 아이템 성격 테스트",
        text: resultName
          ? `나의 가을 아이템은 ${resultName}! 나와 닮은 가을 아이템을 확인해봐!`
          : "나와 가장 닮은 가을 아이템을 확인해봐!",
        url: TEST_URL
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(TEST_URL);
          showToast("테스트 주소를 복사했어요.");
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          fallbackCopy(TEST_URL);
        }
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast("테스트 주소를 복사했어요.");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.getElementById("startBtn").addEventListener("click", startTest);
    document.getElementById("retryBtn").addEventListener("click", () => showScreen("main"));
    document.getElementById("otherBtn").addEventListener("click", () => {
      location.href = "https://test-it.co.kr/";
    });
    document.getElementById("shareBtn").addEventListener("click", shareTest);
    document.getElementById("saveBtn").addEventListener("click", saveResult);
    document.getElementById("modalClose").addEventListener("click", () => {
      document.getElementById("saveModal").classList.remove("open");
    });
    document.getElementById("saveModal").addEventListener("click", event => {
      if (event.target.id === "saveModal") {
        event.currentTarget.classList.remove("open");
      }
    });
  </script>
</body>
</html>
