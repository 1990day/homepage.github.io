      showPage('gamePage'); renderMatch();
    }
    const STICK_ART = {"stick-think": "\n      <path d=\"M20 116H104M59 67L57 105M57 78L35 97L47 58M60 78L84 96L91 79M57 105L39 124M57 105L76 123\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n      <circle cx=\"58\" cy=\"40\" r=\"28\" fill=\"#f7f7f4\" stroke=\"currentColor\" stroke-width=\"2.1\"/>\n      <g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"48\" cy=\"43\" r=\"7\"/><circle cx=\"67\" cy=\"43\" r=\"7\"/><path d=\"M55 43H60M36 43H41M74 43H80\"/></g>\n      <path d=\"M94 18L100 11M99 29L110 28\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n    ", "stick-heart": "\n      <circle cx=\"64\" cy=\"36\" r=\"27\" fill=\"#f7f7f4\" stroke=\"currentColor\" stroke-width=\"2.1\"/>\n      <path d=\"M64 63V103M64 103L44 125M64 103L87 124M64 75L36 94M64 77L89 91L58 96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\"/>\n      <path d=\"M43 108C22 92 11 80 20 68C27 59 38 63 43 71C49 61 61 60 67 68C78 82 61 98 43 108Z\" fill=\"#e9bec5\" stroke=\"currentColor\" stroke-width=\"2\"/>\n      <path d=\"M19 37C8 29 14 20 20 26C27 17 34 26 19 37Z\" fill=\"#e9bec5\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n    ", "stick-friends": "\n      <circle cx=\"33\" cy=\"42\" r=\"22\" fill=\"#f7f7f4\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"88\" cy=\"45\" r=\"22\" fill=\"#f7f7f4\" stroke=\"currentColor\" stroke-width=\"2\"/>\n      <path d=\"M33 64V102L17 121M33 102L49 121M88 67V104L72 121M88 104L104 121M33 77L15 95M33 77L59 86L88 80M88 80L107 93\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n      <path d=\"M48 13L56 5M65 15L67 5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/>\n    ", "stick-cup": "\n      <circle cx=\"37\" cy=\"55\" r=\"24\" fill=\"#f7f7f4\" stroke=\"currentColor\" stroke-width=\"2\"/>\n      <path d=\"M37 79V106L22 125M37 106L54 125M37 88L17 99M37 87L72 56M47 85L86 52\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\"/>\n      <path d=\"M70 9H99V29Q99 44 85 45Q70 44 70 29ZM70 15H62V25Q62 34 73 34M99 15H108V25Q108 34 97 34M85 45V57M75 58H96\" fill=\"#e8d49b\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n      <path d=\"M72 2L68 -3M99 3L104 -2\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n    "};
    function stickDrawing(symbol){return '<svg viewBox="0 0 120 130" aria-hidden="true">'+STICK_ART[symbol]+'</svg>';}
    function card(id) {
      const d=DATA[id]; const [good,bad]=d[mode];
      const btn=document.createElement('button'); btn.type='button'; btn.className='type-card'; btn.style.setProperty('--type-color',TYPE_COLORS[id]); btn.dataset.mbti=id; btn.setAttribute('aria-label',id+' 선택');
      const top=document.createElement('div'); top.className='card-top';
      const mbti=document.createElement('strong'); mbti.className='mbti'; mbti.textContent=id;
      const nick=document.createElement('span'); nick.className='nickname'; nick.textContent=d.nick; top.append(mbti,nick);
      const doodle=document.createElement('span');doodle.className='candidate-doodle';doodle.setAttribute('aria-hidden','true');doodle.innerHTML=stickDrawing(TYPES.indexOf(id)%3===0?'stick-think':TYPES.indexOf(id)%3===1?'stick-heart':'stick-friends');top.append(doodle);
      const body=document.createElement('div'); body.className='card-body';
      [[mode==='love'?'연인으로 좋은 점':'친구로 좋은 점',good,''],['아쉬울 수 있는 점',bad,'weak']].forEach(([title,value,extra])=>{
        const p=document.createElement('p');p.className='point'; const s=document.createElement('span'); s.className='point-label '+extra;s.textContent=title;p.append(s,document.createTextNode(value));body.append(p);
      });
      const choose=document.createElement('span'); choose.className='choose';choose.textContent='✓ 선택하기';
      btn.append(top,body,choose);btn.addEventListener('click',()=>chooseType(id));return btn;
    }
    function renderMatch() {
      $('modeLabel').textContent=labels[mode]+' 가장 끌리는 MBTI 고르기';
      $('roundTitle').textContent=roundSize===2?'결승':roundSize+'강';
      $('matchNumber').textContent=(matchIndex+1)+' / '+(roundSize/2)+'번째 대결';
      $('progressFill').style.width=(completed/15*100)+'%';
      const grid=$('matchGrid');grid.replaceChildren(card(entrants[matchIndex*2]),card(entrants[matchIndex*2+1]));
    }
    function chooseType(id) {
      if(busy) return; busy=true;
      winners.push(id); completed++;
      if(matchIndex+1 < roundSize/2) {matchIndex++; busy=false; renderMatch(); return;}
      if(roundSize===2) {showResult(winners[0],entrants.find(type=>type!==winners[0]));return;}
      entrants=[...winners]; winners=[]; roundSize=entrants.length;matchIndex=0;transitionRound();
    }
    function showResult(winner,runner) {
      $('winnerBlock').style.setProperty('--type-color',TYPE_COLORS[winner]);
      $('runnerBlock').style.setProperty('--type-color',TYPE_COLORS[runner]);

      $('winnerType').textContent=winner; $('runnerType').textContent=runner;
      $('winnerNick').textContent=DATA[winner].nick; $('runnerNick').textContent=DATA[runner].nick;
      $('winnerDesc').textContent=DATA[winner][mode][0]; $('runnerDesc').textContent=DATA[runner][mode][0];
      $('winnerNoteType').textContent=winner;
      $('runnerNoteType').textContent=runner;
      $('winnerNote').textContent=DATA[winner][mode][1];
      $('runnerNote').textContent=DATA[runner][mode][1];
      $('winnerNoteType').style.backgroundColor=TYPE_COLORS[winner];
      $('runnerNoteType').style.backgroundColor=TYPE_COLORS[runner];
      showPage('resultPage');
    }
    function resetAll() {dismissRound();mode=null;busy=false;showPage('intro');}
    async function showImage() {
      const btn=$('saveBtn'); if(btn.disabled)return;btn.disabled=true;
      try {
        if(typeof window.html2canvas!=='function') throw new Error('이미지 생성 라이브러리를 불러오지 못했습니다.');
        if(document.fonts) await document.fonts.ready;
        const canvas=await window.html2canvas($('captureArea'),{backgroundColor:'#ffffff',scale:Math.min(2,Math.max(1.5,window.devicePixelRatio||1)),useCORS:true,logging:false});
        previewReturnFocus=document.activeElement; $('previewImg').src=canvas.toDataURL('image/png');$('previewOverlay').hidden=false; $('closePreview').focus({preventScroll:true});
      } catch(err) {alert('이미지를 만드는 중 문제가 발생했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');}
      finally {btn.disabled=false;}
    }
    async function share() {
      const url='https://test-it.co.kr/test433';
      const text='테스트잇 MBTI 성격 선호도 테스트\n'+url;
      if(navigator.share){try{await navigator.share({title:'테스트잇 MBTI 성격 선호도 테스트',text:'테스트잇 MBTI 성격 선호도 테스트',url});return;}catch(e){if(e.name==='AbortError')return;}}
      try{await navigator.clipboard.writeText(text);alert('테스트 링크를 복사했어요!');}
      catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();alert(ok?'테스트 링크를 복사했어요!':'링크: '+url);}
    }
    $('startBtn').addEventListener('click',()=>showPage('modePage'));
    $('backToIntro').addEventListener('click',resetAll);
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>beginGame(btn.dataset.mode)));
    $('restartGame').addEventListener('click',resetAll);
    $('retryBtn').addEventListener('click',resetAll);
    $('otherBtn').addEventListener('click',()=>window.location.assign('/'));
    $('saveBtn').addEventListener('click',showImage);
    $('shareBtn').addEventListener('click',share);
    let previewReturnFocus=null;
    function closePreview(){ $('previewOverlay').hidden=true; previewReturnFocus?.focus({preventScroll:true}); }
    $('closePreview').addEventListener('click',closePreview);
    $('previewOverlay').addEventListener('click',e=>{if(e.target===$('previewOverlay'))closePreview();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('previewOverlay').hidden)closePreview(); if(e.key==='Tab'&&!$('previewOverlay').hidden){e.preventDefault();$('closePreview').focus({preventScroll:true});}});
  </script>
</body>
</html>
