      @font-face {

        src: url("https://cdn.jsdelivr.net/npm/galmuri/dist/Galmuri14.woff2") format("woff2");

      :root {
        --cream: #fbf5e9;
        --green: #294b13;
        --lime: #b8d56d;
        --line: #829556;
        --orange: #ed8e3d;
        --pink: #ef6684;
        --yellow: #f8d657;

      * {

      }
      body {
        margin: 0;
        background: #fff;
        color: var(--green);
        font-family: Galmuri14, "Malgun Gothic", sans-serif;
        font-size: 14px;
        line-height: 1.7;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px dashed #b36539;
        outline-offset: 4px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .site-header {
        border-bottom: 1px solid #d7decc;
        background: #fff;
      }
      .header-inner {
        max-width: 740px;
        min-height: 58px;
        margin: auto;
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .brand,
      .nav a {
        font-size: 14px;
        font-weight: 400;
      }
      .nav {
        display: flex;
        gap: 17px;
      }
      main {
        width: min(100% - 30px, 510px);
        margin: 27px auto 36px;
      }
      .main-cover {
        display: block;
        border: 1px solid var(--line);
        background: var(--cream);
      }
      .main-cover img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
      }
      .home-actions {
        margin-top: 17px;
      }
      .primary,
      .secondary {
        width: 100%;
        min-height: 52px;
        padding: 14px 10px;
        border: 1px solid var(--green);
        border-radius: 0;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .primary {
        background: var(--green);
        color: var(--cream);
        font-size: 16px;
      }
      .primary:hover {
        background: #3c5e24;
      }
      .primary:active,
      .answer:active {
        transform: translateY(1px);
      }
      .secondary {
        background: var(--cream);
      }
      .secondary:hover {
        background: #edf1d6;
      }
      .window {
        border: 1px solid var(--line);
        background: var(--cream);
        overflow: hidden;
      }
      .titlebar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: var(--green);
        color: var(--cream);
        min-height: 43px;
        padding: 11px 17px;
        font-size: 13px;
      }
      .titlebar small {
        font-size: 11px;
      }
      .question-body {
        padding: 23px 24px 28px;
      }
      .progress-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 9px;
      }
      .progress {
        height: 8px;
        background: #e5e6ce;
        border: 0;
      }
      .progress-fill {
        height: 100%;
        width: 0;
        background: var(--green);
        transition: width 0.2s;
      }
      .q-icon {
        width: 58px;
        height: 58px;
        margin: 26px auto 15px;
      }
      .q-number {
        text-align: center;
        font-size: 12px;
        letter-spacing: 1px;
        margin-bottom: 6px;
        color: #56713b;
      }
      h2 {
        font-size: 20px;
        line-height: 1.85;
        letter-spacing: -0.5px;
        font-weight: 400;
        margin: 0 0 25px;
        text-align: center;
        word-break: keep-all;
        white-space: pre-line;
      }
      .answers {
        display: grid;
        gap: 12px;
      }
      .answer {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 86px;
        background: #fffcf6;
        border: 1px solid #92a16e;
        border-radius: 0;
        padding: 16px 13px;
        text-align: left;
        font-size: 14px;
        line-height: 1.85;
      }
      .answer:hover {
        border-color: #4a6b30;
        background: #e9efcf;
      }
      .choice-key {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 29px;
        border: 1px solid #8b9c62;
        background: #e6edca;
        font-size: 13px;
      }
      .answer:nth-child(2) .choice-key {
        background: #f5dbb5;
      }
      .answer > span:last-child {
        min-width: 0;
      }
      .bottomline {
        border-top: 1px solid #b9c49d;
        padding: 10px 14px;
        font-size: 11px;
        text-align: center;
        color: #54693d;
        background: #eef0dc;
      }
      .loading {
        padding: 62px 20px;
        text-align: center;
      }
      .loading-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        animation: grow 0.9s steps(2) infinite;
      }
      .loading p {
        font-size: 15px;
        margin: 0;
      }
      .loading small {
        display: block;
        font-size: 12px;
        margin-top: 10px;
      }
      @keyframes grow {
        50% {
          transform: translateY(-5px);
        }
      }
      .result-card {
        border: 1px solid #668344;
        background: var(--cream);
        overflow: hidden;
        padding: 15px;
      }
      .result-sheet-title {
        border-bottom: 1px solid #93a76f;
        padding: 0 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--green);
        font-size: 16px;
        letter-spacing: -0.6px;
      }
      .result-sheet-title .sheet-brand {
        font-size: 12px;
        letter-spacing: 0;
      }
      .result-summary {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        align-items: center;
        gap: 15px;
        margin: 15px 0 18px;
      }
      .result-art-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 82px;
        height: 82px;
        background: #f1e6c8;
      }
      .result-art {
        width: 75px;
        height: 75px;
      }
      .result-heading-box {
        min-width: 0;
        text-align: left;
      }
      .result-kicker {
        font-size: 13px;
        margin: 0 0 5px;
        color: #526a3b;
      }
      .result-name {
        color: var(--green);
        font-size: 25px;
        font-weight: 700;
        line-height: 1.6;
        letter-spacing: -1px;
        margin: 0;
        text-align: left;
        white-space: normal;
      }
      .bingo {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        container-type: inline-size;
        gap: 6px;
      }
      .cell {
        aspect-ratio: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(4px, 1.7cqw, 8px);
        padding: clamp(4px, 1.7cqw, 8px);
        border: 1px solid #a5b184;
        background: #e8efcf;
      }
      .cell:nth-child(4n + 2) {
        background: #f9e6e5;
        border-color: #c9a59e;
      }
      .cell:nth-child(4n + 3) {
        background: #fcf1c5;
        border-color: #c6b67d;
      }
      .cell:nth-child(4n + 4) {
        background: #f4ead7;
        border-color: #bfae8c;
      }
      .cell-emoji {
        width: clamp(22px, 8.5cqw, 38px);
        height: clamp(22px, 8.5cqw, 38px);
        flex: none;
      }
      .cell-text {
        width: 100%;
        color: #2c4120;
        font-size: clamp(9px, 3.7cqw, 14px);
        line-height: 1.55;
        letter-spacing: 0;
        text-align: center;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 13px;
        padding-top: 10px;
        border-top: 1px solid #a5b184;
        color: #526a3b;
        font-size: 10px;
      }
      .actions {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }
      .note {
        text-align: center;
        color: #687858;
        font-size: 11px;
        margin: 16px 0;
      }
      .ad {

        justify-content: center;
        min-height: 150px;
        width: 100%;
        overflow: hidden;
        margin: 30px auto 0;
      }
      .footer {
        text-align: center;
        font-size: 11px;
        color: #728064;
        margin-top: 27px;
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        background: #203b20dc;
      }
      .modal-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: var(--cream);
        border: 1px solid #8a9f69;
        padding: 14px;
        width: min(100%, 380px);
        max-height: calc(100dvh - 28px);
      }
      .modal-title {
        font-size: 12px;
        line-height: 1.8;
        text-align: center;
        margin: 0;
      }
      .preview {
        display: block;
        max-width: 100%;
        width: auto;
        max-height: calc(100dvh - 180px);
        min-height: 0;
        object-fit: contain;
        -webkit-touch-callout: default;
        user-select: auto;
      }
      .modal-close {
        border: 1px solid var(--green);
        background: var(--green);
        color: var(--cream);
        padding: 8px 24px;
        border-radius: 0;
        font-size: 13px;
        flex: none;
      }
      .share-input {
        font: inherit;
        font-size: 12px;
        width: 100%;
        border: 1px solid #8a9f69;
        background: white;
        padding: 10px;
      }
      .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 90%;
        padding: 11px 17px;
        background: var(--green);
        color: var(--cream);
        z-index: 1200;
        font-size: 12px;
        text-align: center;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      @media (max-width: 380px) {
        main {

        .result-art-box {

        .result-kicker {

        .result-name {

        }
        .bingo {
          gap: 5px;
        }
        .card-footer {
          font-size: 9px;
        }
        .primary {

        }

      const $ = (id) => document.getElementById(id);
      const SHARE_TITLE = "테스트잇 제철 성격 테스트";
      const SHARE_URL = "https://test-it.co.kr/test433.html";
      const answerHistory = [];
      let current = 0,
        locked = false,
        resultType = "",
        loadingTimer = null,
        lastFocus = null,
        toastTimer = null;
      // 화면 전환과 테스트 진행
      function showScreen(id) {
        ["home", "quiz", "loading", "result"].forEach((key) => ($(key).hidden = key !== id));
      }
      function focusWithoutScroll(element) {
        element.focus({ preventScroll: true });
      }
      function start() {
        clearTimeout(loadingTimer);
        answerHistory.length = 0;
        current = 0;
        locked = false;
        resultType = "";
        showScreen("quiz");
        renderQuestion();
      }
      function renderQuestion() {
        const q = QUESTIONS[current];
        $("question").innerHTML = q[1];
        $("count").textContent = current + 1 + " / 12";
        $("q-number").textContent = "QUESTION " + String(current + 1).padStart(2, "0");
        $("q-icon").innerHTML =
          PIXEL_ICONS[
            [
              "flowerpot",
              "bag",
              "heart",
              "flag",
              "people",
              "bulb",
              "cup",
              "list",
              "star",
              "game",
              "chat",
              "cloud",
            ][current]
          ];
        $("fill").style.width = (current / 12) * 100 + "%";
        $("progress").setAttribute("aria-valuenow", current);
        $("answers").replaceChildren();
        q[2].forEach((text, index) => {
          const button = document.createElement("button");
          button.className = "answer";
          const key = document.createElement("span");
          key.className = "choice-key";
          key.textContent = index === 0 ? "A" : "B";
          const label = document.createElement("span");
          label.innerHTML = text;
          button.append(key, label);
          button.onclick = () => choose(index);
          $("answers").append(button);
        });
        locked = false;
        focusWithoutScroll($("question"));
      }
      function choose(index) {
        if (locked) return;
        locked = true;
        answerHistory[current] = index;
        if (current < 11) {
          current++;
          renderQuestion();
        } else {
          showScreen("loading");
          loadingTimer = setTimeout(() => showResult(calculateType()), 1400);
        }
      }
      function calculateType() {
        return ["EI", "SN", "TF", "JP"]
          .map((pair) => {
            let first = 0;
            QUESTIONS.forEach((q, i) => {
              if (q[0] === pair && answerHistory[i] === 0) first++;
            });
            return first >= 2 ? pair[0] : pair[1];
          })
          .join("");
      }
      function showResult(type) {
        resultType = type;
        const data = RESULTS[type];
        $("result-art").innerHTML = RESULT_FRUIT_ART[type];
        $("result-name").textContent = data[1];
        $("bingo").replaceChildren();
        data[3].forEach((item, index) => {
          const [emoji, text] = item.split("|");
          const cell = document.createElement("div");
          cell.className = "cell";
          const icon = document.createElement("span");
          icon.className = "cell-emoji";
          icon.innerHTML = RESULT_PIXEL_ICONS[BINGO_ICONS[type][index]];
          const label = document.createElement("span");
          label.className = "cell-text";
          label.textContent = text;
          cell.append(icon, label);
          $("bingo").append(cell);
        });
        showScreen("result");
        locked = false;
        focusWithoutScroll($("result-name"));
      }
      function toast(text) {
        clearTimeout(toastTimer);
        $("toast").textContent = text;
        $("toast").hidden = false;
        toastTimer = setTimeout(() => ($("toast").hidden = true), 2500);
      }
      function openModal(id) {
        lastFocus = document.activeElement;
        $(id).hidden = false;
        document.body.style.overflow = "hidden";
        focusWithoutScroll($(id).querySelector("button"));
      }
      function closeModal(modal) {
        modal.hidden = true;
        document.body.style.overflow = "";
        if (lastFocus) focusWithoutScroll(lastFocus);
      }
      // 결과 이미지 미리보기와 저장
      async function saveImage() {
        const button = $("save");
        button.disabled = true;
        button.textContent = "이미지 만드는 중…";
        try {
          if (!window.html2canvas) throw Error("capture unavailable");
          await document.fonts.ready;
          const card = $("result-card");
          const exportWidth = 1000;
          const exportScale = exportWidth / card.getBoundingClientRect().width;
          const canvas = await html2canvas(card, {
            scale: exportScale,
            backgroundColor: "#fbfff4",
            useCORS: true,
            logging: false,
            scrollX: window.scrollX,
            scrollY: window.scrollY,
            onclone: (doc) => {
              doc.getElementById("result-card").style.margin = "0";
            },
          });
          $("preview").src = canvas.toDataURL("image/png");
          $("preview").alt = "테스트잇_제철성격테스트결과_" + resultType + ".png";
          openModal("image-modal");
        } catch (e) {
          toast("이미지를 만들지 못했어요. 잠시 후 다시 눌러 주세요.");
        } finally {
          button.disabled = false;
          button.textContent = "결과 이미지 저장하기";
        }
      }
      async function share() {
        if (navigator.share) {
          try {
            await navigator.share({ title: SHARE_TITLE, text: SHARE_TITLE, url: SHARE_URL });
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(SHARE_TITLE + "\n" + SHARE_URL);
          toast("테스트 주소를 복사했어요!");
        } catch (e) {
          $("share-url").value = SHARE_TITLE + " " + SHARE_URL;
          openModal("share-modal");
          $("share-url").select();
        }
      }
      $("start").onclick = start;
      $("restart").onclick = () => {
        clearTimeout(loadingTimer);
        answerHistory.length = 0;
        current = 0;
        resultType = "";
        locked = false;
        showScreen("home");
        focusWithoutScroll($("start"));
      };
      $("save").onclick = saveImage;
      $("share").onclick = share;
      document
        .querySelectorAll("[data-close]")
        .forEach((button) => (button.onclick = () => closeModal(button.closest(".modal"))));
      document.querySelectorAll(".modal").forEach((modal) => {
        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeModal(modal);
        });
        modal.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeModal(modal);
            return;
          }
          if (event.key === "Tab") {
            const items = [...modal.querySelectorAll("button,input")];
            const first = items[0],
              last = items[items.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
        });
      });
