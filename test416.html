      '무인': ['마음에 드는 연인을 자신이 직접 리드하고 듬직하게 보호하려는 성향이 강함', '스케일이 크고 추진력이 있어 여행이나 큰 기념일 데이트를 주도적으로 잘 준비함', '목표가 뚜렷해 썸 단계에서 흐지부지되지 않고 연인 관계로 관계를 확실하게 발전시킴', '돌려 말하거나 밀당하지 않고 솔직하고 시원시원하게 애정을 표현해 오해가 적음', '연애 중 찾아오는 외부의 방해나 어려운 상황에서도 쉽게 흔들리지 않고 중심을 잡음', '자존심을 지나치게 내세워 사소한 다툼이 연인과의 기싸움으로 번지지 않도록 주의', '데이트 코스나 메뉴를 독단적으로 결정하여 연인을 억압한다는 느낌을 주지 말 것', '다정한 애정 표현이 부족하고 무뚝뚝하여 연인이 외로움을 느끼지 않게 신경 쓸 것', '현실적인 해결책만 제시하느라 연인의 서운한 감정을 공감해 주는 타이밍을 놓치지 말 것', '자신의 연애 방식만 정답이라 믿는 융통성 없는 태도로 타협을 거부하지 않도록 조심할 것'],
      '기묘': ['데이트 중 갈등이 생길 조짐이 보이면 대화로 부드럽고 유연하게 상황을 무마함', '연인이 무엇을 필요로 하는지 눈치껏 파악해 부담스럽지 않고 세심하게 챙겨줌', '예측 불가능한 이벤트보다 안정적이고 평화로운 일상적인 만남을 최우선으로 함', '데이트 매너가 좋고 예의가 발라 선을 넘는 거친 장난이나 행동을 극도로 싫어함', '상황 판단이 빨라 연인이 당황할 수 있는 데이트 중의 돌발 상황에 대처를 잘함', '스트레스를 받으면 연인에게 매사에 매우 예민하고 날카로운 말투를 쓰지 않도록 주의', '연인의 눈치를 너무 많이 보느라 자신이 가고 싶은 데이트 장소를 솔직히 말하지 못함', '서운한 점을 빙빙 돌려 말해 연인이 진짜 이유를 모른 채 오해만 쌓이게 만들지 말 것', '소심한 성격 탓에 관계를 한 단계 발전시켜야 할 중요한 타이밍에 망설이지 말 것', '연인의 작은 행동에 끊임없이 의심과 불안을 품어 서로를 피곤하게 만들지 않도록 조심할 것'],
      '경진': ['밀당이나 어장관리를 혐오하며 마음에 드는 연인에게 자신의 마음을 직진으로 표현함', '한 번 사귀기로 한 연인에게는 굳건한 의리를 보이며 끝까지 믿고 관계를 이어감', '연인의 실수를 쩨쩨하게 따지기보다 스케일 크고 너그러운 포용력으로 감싸주는 편임', '거짓말이나 가식 없는 솔직하고 꾸밈없는 성격으로 연애 초반 빠르게 신뢰를 형성함', '데이트 약속이나 연락 규칙을 정하면 예외를 두지 않고 철저하게 지키려는 성향이 강함', '자기주장이 너무 강해 다툼이 생겼을 때 한 치의 양보도 없이 타협을 거부하지 말 것', '데이트 코스를 정할 때 연인의 의견을 묻지 않고 독단적으로 결정하여 통보하지 말 것', '화가 났을 때 지나치게 직설적인 폭언으로 연인의 마음에 씻을 수 없는 상처를 주지 말 것', '연인의 사생활이나 옷차림에까지 지나치게 간섭하여 독립성을 훼손하는 행동을 주의', '상황에 따라 데이트 일정을 변경해야 할 때 융통성 없이 화부터 내는 뻣뻣한 태도를 조심할 것'],
      '신사': ['연인을 선택할 때 도덕성이나 예의, 깔끔한 매너를 매우 중요하고 엄격하게 따짐', '데이트 코스가 완벽하게 짜여 있고 정돈된 형태의 고급스러운 만남을 선호함', '자신이 원하는 애정 표현의 방식과 싫어하는 행동을 명확하고 분명하게 연인에게 전달함', '연락 문제나 데이트 시간 등 연인과 맺은 약속은 철저한 책임감을 가지고 이행함', '감정에만 휩쓸리지 않고 냉철한 이성으로 관계의 현실적인 미래를 정확하게 판단함', '데이트 내내 자신의 계획대로만 움직이려는 완벽주의로 연인을 숨 막히게 하지 말 것', '감정 표현에 인색하고 차갑고 계산적인 태도를 보여 정이 없는 사람으로 오해받지 말 것', '데이트 중 연인이 무심코 한 사소한 말실수에 지나치게 예민하고 차갑게 반응하지 말 것', '연인의 일거수일투족을 통제하려는 성향 때문에 큰 다툼이 발생하지 않도록 주의', '서운한 점을 이야기하는 연인에게 공감 대신 논리와 팩트만 앞세워 가르치려 들지 말 것'],
      '임오': ['특유의 넓은 포용력과 다정함으로 연인의 실수나 짜증을 따뜻하게 잘 받아줌', '사교적이고 센스가 넘쳐 연애 초반 어색한 분위기를 유연하고 즐겁게 이끌어감', '애정 표현이 풍부하고 유머러스하여 항상 웃음이 끊이지 않는 유쾌한 데이트를 함', '이상적인 낭만과 현실적인 데이트 비용 사이에서 능숙하게 균형을 맞추는 능력이 뛰어남', '데이트 중 돌발 상황이 생겨도 당황하지 않고 능력 있게 대안을 찾아 해결함', '속마음을 너무 감추고 늘 좋은 얼굴만 하여 연인이 당신의 진짜 진심을 헷갈리게 하지 말 것', '기분 변화가 잦고 변덕스러워 데이트 도중 갑자기 표정이 굳어 연인을 당황하게 하지 말 것', '관계가 심각해지거나 책임을 져야 할 중요한 상황에서 농담으로 회피하고 도망치지 말 것', '자신도 모르게 다른 이성들에게도 친절을 베풀어 연인에게 쓸데없는 질투와 오해를 사지 말 것', '각자의 자유를 지나치게 추구하다 연인 관계 특유의 끈끈한 안정감을 해치지 않도록 주의'],
      '계미': ['조심스럽고 다정한 태도로 연인의 컨디션과 기분을 최우선으로 세심하게 배려함', '변덕 부리지 않고 끈기 있고 성실하게 애정을 쏟아 연인에게 굳건한 신뢰를 줌', '예민한 직관력으로 연인이 무엇 때문에 서운해하는지 굳이 말하지 않아도 빠르게 파악함', '화려하고 충동적인 만남보다는 둘만의 안정적이고 조용한 데이트 기반을 다지는 것을 중시함', '요란하게 사랑을 과시하기보다 조용히 내실을 다지며 관계를 깊고 진지하게 발전시킴', '연인의 작은 연락 지연에도 애정이 식었다고 지나치게 의심하여 스스로를 피곤하게 만들지 말 것', '과도한 예민함으로 인해 데이트 중 사소한 의견 충돌에도 불같이 화를 내지 않도록 주의', '불만이 생겨도 꾹꾹 참으며 속으로만 쌓아두다가 어느 순간 소통을 완전히 단절해 버리지 말 것', '관계를 끝내거나 발전시켜야 할 때 결단력이 부족해 이러지도 저러지도 못하는 태도를 주의', '자신의 불안한 감정을 연인에게 온전히 기대고 지나치게 의존하여 부담을 주지 않도록 할 것'],
      '갑신': ['결단력이 뛰어나 썸을 타다가도 확실하게 고백하여 주도적으로 관계를 이끎', '다방면에 호기심이 많아 매번 뻔한 밥-카페 코스 대신 이색적이고 재밌는 데이트를 기획함', '자신의 감정을 돌려 말하지 않고 솔직하고 시원시원하게 애정을 표현하는 스타일임', '연애 중에도 각자의 커리어나 자기 계발을 존중하며 함께 성장하는 만남을 선호함', '데이트 중 갈등이 생기면 문제를 미루지 않고 빠르게 타협점을 찾아 쿨하게 해결함', '데이트 일정을 짤 때 연인의 체력이나 취향을 고려하지 않고 자기중심적으로 밀어붙이지 말 것', '성급하게 상대의 감정을 넘겨짚어 오해를 만들고 돌이킬 수 없는 말실수를 하지 않도록 주의', '새로운 것에 빨리 끌리는 만큼 쉽게 싫증을 내어 장기 연애로 이어지는 뒷심이 부족해질 수 있음', '연인의 섬세한 감정 표현을 오글거린다고 무시하거나 놓쳐 상대에게 상처를 주지 말 것', '다툴 때 자신의 직설적이고 거친 언행이 연인의 마음에 깊은 흉터를 남기지 않도록 조심할 것'],
      '을유': ['부드럽게 연인에게 맞춰주는 듯하면서도 결국 데이트의 주도권은 자신이 쥐는 외유내강형임', '위생과 예의를 매우 중요시하여 청결하고 정돈된 핫플레이스나 깔끔한 분위기의 데이트를 선호함', '섬세한 관찰력으로 연인의 습관을 기억했다가 필요한 순간에 챙겨주는 조용한 배려에 능함', '공공장소에서의 지나친 스킨십이나 선을 넘는 무례한 농담 등 예의에 어긋나는 행동을 극도로 꺼림', '다툼이 생기면 감정적으로 소리치기보다 차분한 논리로 대응하며 자신의 기준을 단호하게 지킴', '이성을 평가하는 기준이 너무 깐깐하고 엄격하여 연인이 데이트 내내 눈치를 보며 피곤해할 수 있음', '불만이 생기면 팩트 폭력이라는 이름으로 연인의 뼈를 때리는 날카로운 지적을 해 큰 상처를 줌', '평소에는 잘 참다가도 스트레스가 한계에 달하면 데이트 중 갑자기 신경질적으로 돌변할 수 있음', '겉으로는 연인의 데이트 제안에 동의하면서 속으로는 불만을 차곡차곡 쌓아두는 답답한 태도를 주의', '자신만의 철저한 데이트 룰을 연인에게 강요하여 관계 자체를 통제하고 억압하려 들지 않도록 조심할 것'],
      '병술': ['한 번 마음을 연 상대에게는 계산 없이 열정적이고 매우 솔직한 애정 표현을 쏟아냄', '연인 관계에 대한 책임감이 유독 강해 힘든 일이 생겨도 쉽게 손을 놓지 않고 곁을 든든히 지킴', '직관력이 뛰어나 연인의 기분 변화를 빨리 알아채고 넓은 포용력으로 따뜻하게 위로해 줌', '기념일을 챙겨주거나 선물을 주는 등 연인에게 아낌없이 베풀며 챙겨주는 행위 자체를 즐거워함', '얕고 가벼운 썸보다는 서로의 미래까지 굳게 약속하는 진지하고 깊이 있는 연애를 끝까지 유지하려 함', '다툼 시 자신의 논리만 정답이라 믿고 지나치게 고집을 부려 융통성 없는 꽉 막힌 사람으로 보이지 말 것', '상대를 챙겨준다는 명목으로 옷차림이나 일상에 지나친 참견을 하여 연인의 독립성을 훼손하지 말 것', '다정하다가도 갑자기 차가워지는 극단적인 감정 기복으로 연인이 안정감을 느끼기 어렵게 만들지 말 것', '자존심을 지나치게 앞세워 본인의 잘못이 명백함에도 먼저 사과하거나 굽히지 않는 고집스러운 태도 주의', '데이트 코스나 메뉴를 고를 때 연인의 의견을 묻지 않고 매번 독단적으로 결정해 통보하지 말 것'],
      '정해': ['거친 스킨십이나 자극적인 이벤트보다 부드럽고 섬세한 감정이 오가는 낭만적인 데이트를 중시함', '연인이 서운함을 토로할 때 반박하기보다 넓은 포용력으로 먼저 이해하고 안아주려 노력함', '시끄럽고 사람 많은 곳보다는 둘만의 감성적인 교감을 나눌 수 있는 조용한 카페나 산책 데이트를 즐김', '자신만의 확고한 연애관이 있으면서도 연인의 취향을 존중하며 유연하게 맞춰주려는 배려심이 깊음', '예민한 직관력으로 상대방의 거짓말이나 미세한 표정 변화를 누구보다 빠르게 캐치하는 능력이 있음', '상처받는 것이 두려워 진짜 속마음을 끝까지 숨겨 연인에게 거리감과 불안감을 주지 않도록 주의할 것', '연인의 주변 이성 친구에게 과도한 질투심을 느끼고 은근히 집착하여 상대를 숨 막히게 하지 말 것', '관계에 문제가 생겼을 때 결단력이 부족하여 맺고 끊음을 확실히 하지 못해 서로에게 상처를 길게 남김', '소극적인 태도로 항상 연인이 먼저 데이트를 제안하고 연락하기만을 기다리며 관계 발전을 지연시키지 말 것', '혼자만의 지나친 상상과 의심을 키워 평화로운 연애를 스스로 망치고 상처받는 패턴을 조심할 것'],
      '무자': ['요란한 애정 표현보다는 변함없는 듬직한 태도로 연인에게 깊은 심리적인 안정감을 줌', '낭만적인 환상보다는 데이트 비용이나 현실적인 조건들을 꼼꼼하게 따져가며 실용적인 연애를 함', '데이트 약속 장소나 시간을 정할 때 변수가 생기지 않도록 사전에 신중하고 차분하게 동선을 분석함', '한 번 맺은 연인과의 약속이나 기념일 등은 잊지 않고 철저하게 챙기며 강한 책임감을 보임', '연인이 사소한 투정을 부리거나 짜증을 내어도 넓은 포용력으로 웬만한 일은 무던하게 참고 넘겨줌', '다정하고 오글거리는 애정 표현이 턱없이 부족하고 너무 무뚝뚝하여 연인이 짝사랑하는 기분이 들게 함', '모든 데이트 코스와 선물을 가성비와 계산에만 맞추어 진행하다 정이 없고 차가운 사람으로 오해받음', '갈등이 생겼을 때 절대 자신의 의견을 굽히지 않는 황소고집 때문에 타협점을 찾지 못하고 소통이 단절됨', '새로운 장소를 시도하는 것을 싫어하고 늘 가던 곳만 고집하여 연인이 데이트를 지루하고 단조롭게 느낌', '연인의 의견보다 무조건 자신의 생각과 계획만 옳다고 맹신하며 강요하는 독단적인 태도를 극히 주의할 것'],
      '기축': ['썸에서 연인으로 발전하기까지 시간이 꽤 걸리지만 한결같이 성실하게 신뢰를 쌓으며 관계를 발전시킴', '데이트 일정을 짤 때 오차가 없도록 세밀하고 치밀하게 계획하여 연인을 편안하게 이끌어줌', '책임감이 남달라 한 번 내 사람이라고 믿으면 힘든 일이 생겨도 끝까지 연인의 곁을 지킴', '갑작스러운 서프라이즈 이벤트보다는 안정적이고 템포가 일정한 예측 가능한 만남을 훨씬 선호함', '자신의 감정을 요란하게 생색내지 않고 조용히 묵묵하게 연인 뒷바라지를 하며 헌신하는 편임', '섭섭한 일이 있어도 겉으로 내색하지 않아 연인 입장에서는 속마음을 전혀 알 수 없어 속이 터질 수 있음', '다툼 시 한 번 토라지면 절대 먼저 말을 걸지 않는 지독한 고집 때문에 소통이 완전히 단절될 수 있음', '연인의 아주 사소한 말실수 하나에 혼자 꽁해있거나 며칠씩 연락을 씹는 답답한 태도를 주의할 것', '평소 의심이 많아 연인의 휴대폰이나 SNS를 몰래 확인하거나 꼬치꼬치 캐물어 상대를 피곤하게 만듦', '애정 표현에 너무 소극적이고 인색하여 연인이 자신을 사랑하는지 끊임없이 확인하고 싶게 만들지 말 것'],
      '경인': ['연애를 시작하면 망설이지 않고 데이트를 주도하며 강한 추진력으로 텐션 높게 관계를 이끌어감', '밀당을 싫어하며 불만이 생기든 호감이 생기든 솔직하고 당당하게 털어놓아 오해의 소지를 없앰', '조용히 영화만 보는 데이트보다는 함께 땀 흘리거나 돌아다니는 활동적이고 진취적인 데이트를 몹시 즐김', '자신의 사람이라는 인식이 강해 연인 사이의 의리를 목숨처럼 중요하게 여기고 바람피우는 것을 극혐함', '아니다 싶으면 질척거리지 않고 미련 없이 쿨하게 이별을 고하는 칼 같은 결단력과 맺고 끊음을 보임', '데이트 코스부터 메뉴 통일 등 연인의 취향까지 자신의 통제하에 두려는 강한 성향으로 큰 갈등을 유발함', '자기중심적인 사고가 강해 무심코 던진 말로 연인의 취향이나 의견을 깎아내리고 무시하는 우를 범함', '다툼 시 팩트만 내세우는 지나치게 직설적인 언행으로 연인의 마음에 회복하기 힘든 깊은 상처를 남김', '상황에 따라 유연하게 데이트 계획을 변경해야 할 때도 융통성 없이 원래 계획만 밀어붙여 분위기를 깸', '자존심이 살짝이라도 상하면 순식간에 공격적인 말투로 변해 연인을 윽박지르고 기를 죽이는 태도를 조심할 것'],
      '신묘': ['외모와 매너가 세련되고 깔끔한 상대를 매우 선호하며 데이트 장소 역시 인테리어와 분위기를 깐깐하게 따짐', '예민하고 섬세한 관찰력으로 연인이 말하기 전에 먼저 기분을 파악해 센스 있게 배려하고 맞춰줌', '연인 사이라도 사생활과 개인 시간을 침해받는 것을 싫어하며 명확하게 자신만의 바운더리를 설정함', '예의 바른 태도를 연애의 기본 덕목이라 여겨 길거리에서 크게 싸우거나 무례한 언행을 하는 것을 견디지 못함', '평소에는 다정하고 부드럽지만 연인이 결정적인 잘못을 했을 때는 뒤도 안 돌아보고 끊어내는 결단력이 있음', '연인을 평가하는 마음속 기준이 너무 까다로워 조금만 실망해도 애정이 급격히 식어버려 상대를 지치게 함', '다툼 시 비속어를 쓰진 않지만 논리적이고 차갑게 폐부를 찌르는 말로 연인의 자존심에 큰 상처를 남김', '컨디션이 안 좋거나 연락이 늦어질 때 지나치게 신경질적이고 예민한 반응을 보여 연인을 당황하게 만듦', '완벽한 데이트를 완성하려는 집착 때문에 조금이라도 엇나가면 티를 내어 연애 자체를 숨 막히게 만들지 말 것', '주변 친구들의 평가나 시선에 지나치게 얽매여 자신의 진짜 감정을 무시하고 섣불리 이별을 고민하지 말 것'],
      '임진': ['연인의 사소한 흠이나 단점을 꼬투리 잡기보다 넓은 마음과 넉넉한 포용력으로 따뜻하게 껴안아 주는 스타일임', '매번 반복되는 동네 데이트보다 스케일이 크고 진취적인 목표를 함께 나누는 동반자적 연애를 몹시 원함', '데이트 중 예상치 못한 비가 오거나 가게가 문을 닫는 돌발 상황에서도 스트레스받지 않고 유연하게 대처함', '타고난 재치와 리더십으로 연애의 분위기를 주도하며 어색한 기류를 금세 화기애애하게 바꾸는 능력이 있음', '낭만적인 애정 표현과 현실적인 데이트 계획을 모두 놓치지 않는 균형 잡힌 연애 감각을 가지고 있음', '자존심 때문에 속마음을 지나치게 감추고 괜찮은 척만 하여 연인이 당신의 진짜 의중을 파악하기 힘들게 함', '다툼이 생기면 무조건 자신의 말이 맞다고 우기며 굽히지 않는 강한 고집 때문에 절대 원만한 타협이 되지 않음', '기분이 좋을 땐 한없이 다정하다가 갑자기 기운이 빠지는 등 변덕스러운 기분 변화로 연애의 안정감을 크게 깸', '자신이 리더라는 생각에 취해 연인의 사생활이나 가치관까지 지배하고 억지로 뜯어고치려 간섭하지 말 것', '화가 나면 욱하는 마음에 다소 거칠고 직선적인 언행이 튀어나와 연인을 무섭게 만들 수 있으니 감정 조절에 유의할 것'],
      '계사': ['연애 초반부터 조심스럽고 다정다감한 매너로 접근하여 이성의 마음을 편안하게 열게 만드는 데 탁월함', '결혼이나 동거 등 연인과의 미래를 꿈꿀 때 경제적 조건이나 현실적인 기준을 매우 명확하게 따지고 들어감', '예민한 직관력으로 데이트 중 분위기가 싸해지는 타이밍을 귀신같이 눈치채고 애교나 재치로 상황을 잘 모면함', '연락 빈도나 만나는 횟수 등 연인과 처음 정해둔 규칙과 약속을 절대 어기지 않고 성실히 지키는 모범적인 연인임', '복잡하고 시끄러운 데이트보다는 정돈되고 깔끔한 핫플레이스에서 분위기를 즐기며 감정을 교류하는 것을 좋아함', '기본적으로 타인에 대한 의심과 경계심이 많아 연인의 과거사나 이성 친구 문제를 끝없이 캐물어 상대를 피곤하게 함', '데이트 동선이나 시간 배분에 지나치게 완벽을 추구하여 여유가 없고 계획이 틀어지면 극도로 스트레스를 받음', '연인의 아주 사소한 단어 선택 하나에 꽂혀서 과민 반응하여 큰 싸움으로 번지는 피곤한 성격을 주의할 것', '진짜 섭섭한 속마음을 끝까지 숨기며 돌려 말하다가 상대가 못 알아채면 혼자 실망하고 소통을 단절하지 말 것', '데이트 비용을 낼 때 1원 단위까지 지나치게 정확히 계산하려는 태도로 정 없고 쪼잔한 사람으로 보이지 않도록 주의'],
      '갑오': ['썸을 길게 끌지 않고 호감이 생기면 숨기지 못한 채 자유롭고 열정적인 직진 연애를 시작하는 불꽃 같은 성향임', '연인에게 바라는 점이나 자신의 섭섭한 감정을 담아두지 않고 솔직하고 시원하게 다 쏟아내어 뒤끝이 없는 편임', '데이트 장소나 메뉴를 주도적으로 정하며 진취적으로 관계를 이끌어 연인에게 지루할 틈을 주지 않는 리더 격임', '호기심이 풍부해 뻔한 데이트 코스를 거부하고 늘 방탈출, 공방 등 새롭고 활동적인 이색 경험을 함께하길 즐김', '데이트 중 지치는 기색 없이 늘 밝고 활기찬 에너지로 분위기를 방방 띄워 연인에게도 긍정적인 에너지를 전파함', '감정 기복이 매우 심해 좋을 땐 한없이 다정하다가 화날 땐 불같이 화를 내어 연인에게 치명적인 불안감을 줌', '다툼이 생기면 끝까지 문제를 풀려는 인내심이 부족해 "그냥 헤어져"라고 쉽게 포기하는 말을 내뱉지 않도록 주의', '상대의 기분은 전혀 고려하지 않고 자신의 감정만 필터링 없이 내뱉는 직설적인 언행으로 큰 상처를 주지 말 것', '융통성이 부족하여 자신이 꽂힌 데이트 코스나 방식만 고집하며 상대의 의견을 무시하는 독재자처럼 굴지 말 것', '누군가에게 연락이나 일정을 구속받는 것을 극도로 싫어해 연인이 조금만 챙겨도 간섭으로 여기고 짜증 내지 말 것'],
      '을미': ['연인이 실수를 하거나 의견이 다를 때 유연하고 부드러운 태도로 먼저 양보하며 상대의 기분을 편안하게 맞춰줌', '연애의 낭만보다 경제적 안정이나 생활 패턴이 서로 얼마나 잘 맞는지를 더 중요하게 살피는 지극히 현실적인 타입임', '세심한 관찰력으로 연인이 무심코 지나가는 말로 흘린 취향이나 필요를 기억했다가 감동적인 서프라이즈로 잘 챙김', '열정이 금방 타오르고 식는 냄비 같은 연애보다는 끈기 있고 성실하게 오랜 기간 잔잔히 이어가는 장기 연애를 지향함', '포용력이 남달라 다툼이 발생할 것 같으면 자신이 먼저 고집을 꺾고 마찰을 피해 평화로운 타협을 이끌어내는 데 능함', '섭섭한 일이 생겨도 그 자리에서 말하지 못하고 속으로만 켜켜이 불만을 쌓아두다 엉뚱한 날 한 번에 터뜨려 당황시킴', '자기주장이 너무 약해 데이트 메뉴 하나 고를 때도 연인에게 "아무거나"를 연발하여 결단력 없고 줏대 없는 사람으로 보임', '평화주의자인 척하지만 속으로는 의심이 많아 연인의 핸드폰을 몰래 보거나 혼자 소설을 쓰며 스스로를 피곤하게 만듦', '연애 초반 관계를 리드해야 할 순간에도 소극적인 태도로 눈치만 보느라 썸이 연애로 발전하는 속도를 크게 늦출 수 있음', '불만을 명확한 언어로 전달하지 않고 삐진 티만 팍팍 내며 돌려 말하는 버릇 탓에 연인과 큰 오해를 사지 않도록 주의할 것'],
      '병신': ['재치 있는 말솜씨와 남다른 유머 감각으로 연애 내내 지루할 틈을 주지 않고 다방면에 재능이 많아 데이트가 풍성함', '낯을 가리지 않는 극강의 사교성으로 데이트 분위기를 쾌활하게 이끌며 연인의 지인들에게도 싹싹하게 매우 잘함', '갑자기 차가 막히거나 식당이 닫는 상황에서도 스트레스받지 않고 임기응변을 발휘해 다른 재밌는 코스로 유연하게 대처함', '호기심이 넘치고 열정적이어서 주말마다 집에 있기보다는 핫플레이스 탐방이나 새로운 액티비티를 찾아 나서는 만남을 선호함', '자신의 감정에 솔직하고 뒤끝이 없어 다툼이 끝난 후에는 미련 없이 털어버리고 다시 시원시원하게 애정 표현을 퍼부음', '데이트 상대의 말을 끝까지 듣기 전에 성급하게 판단하고 자신의 생각대로만 넘겨짚어 큰 오해를 낳지 않도록 극도로 주의', '초반의 불타는 애정이 금방 식어버리는 부족한 인내심 탓에 권태기가 빨리 오고 마무리와 맺고 끊음이 확실하지 않아 답답함', '자신의 감정 기복이 표정에 필터 없이 그대로 드러나 롤러코스터 같은 분위기를 만들어 연인이 항상 눈치 보게 만들지 말 것', '천성이 다정하고 유쾌해 여러 이성 친구들에게도 과하게 친절을 베풀어 연인에게 극심한 질투와 불안감이라는 오해를 삼', '연애의 진지하고 무거운 미래 이야기를 해야 할 순간에도 진지함 없이 가벼운 농담으로만 회피하여 신뢰감을 떨어뜨리지 말 것'],
      '정유': ['섬세한 미적 감각을 지녀 데이트 코스나 선물을 고를 때 아무거나 하지 않고 깔끔하고 분위기 있는 감성적인 만남을 선호함', '연인의 아주 미세한 표정 변화나 목소리 톤만으로도 현재 기분이 어떤지 기가 막히게 읽어내어 완벽한 타이밍에 위로를 건넴', '명확하고 분명한 선을 그어두어 연락 시간이나 이성 친구 문제 등 연인 사이 지켜야 할 기본 예의를 철저하게 고수함', '평소에는 무척 다정하고 달콤한 애정 표현을 아끼지 않으면서도 한 번 정한 둘만의 원칙 앞에서는 절대 물러서지 않는 강단이 있음', '배려심이 깊어 데이트 중 동선을 짜거나 메뉴를 고를 때 연인이 가장 편안하고 기분 좋게 즐길 수 있도록 세심하게 판을 깔아줌', '연인에 대한 질투심과 소유욕이 평균 이상으로 강해 연락이 조금만 안 되어도 꼬치꼬치 캐묻고 집착하여 상대를 숨 막히게 만듦', '다툴 때 감정적으로 욕하기보다는 팩트를 기반으로 날카롭고 차갑게 정곡을 찔러 연인의 자존심에 평생 남을 상처를 남기지 말 것', '이상형의 기준이 비현실적으로 까다로워 연인의 작은 단점 하나만 발견해도 정이 뚝 떨어져 상대방을 끊임없이 평가하는 태도 주의', '천성이 너무 예민하여 데이트 중 덥거나 춥거나 음식이 맛없는 사소한 상황에도 극도로 신경질을 부려 데이트 분위기를 박살 내지 말 것', '직접적으로 서운하다 말하지 않고 빙빙 돌려 말하며 연인이 알아서 기어주길 바라는 피곤하고 수동적인 소통 방식을 가장 조심할 것'],
      '무술': ['가벼운 썸이나 단기 연애를 극도로 싫어하며 한 번 만나면 결혼까지 염두에 둘 정도로 연인에 대한 책임감이 무척 강하고 듬직함', '한 번 맺은 인연은 절대 배신하지 않는 굳건한 의리를 지녔으며 연인이 힘든 상황에 처하면 물불 가리지 않고 진지하게 지켜냄', '연애의 외적인 조건이나 화려함보다는 서로간의 명예와 신의를 중요하게 여기며 한 입 가지고 두말하지 않는 무거운 신뢰감을 줌', '충동적인 여행이나 지출보다는 미래를 위한 저축과 안정적인 데이트 패턴을 차곡차곡 쌓아가며 현실적인 굳건한 기반을 다져나감', '연인이 웬만한 짜증을 부리거나 억지를 써도 화내지 않고 넓은 포용력으로 묵묵히 받아주며 곁을 굳건하게 지키는 바위 같은 존재임', '자신의 가치관이 너무 굳건한 나머지 다툼 시 절대 타협하지 않는 꽉 막힌 황소고집을 부려 연인과 대화가 벽에 막히는 상황이 빈번함', '애정 표현이 너무 메말라 있고 무뚝뚝하여 데이트 내내 연인이 "나를 사랑하긴 하는 걸까?"라는 심각한 오해와 외로움을 느끼게 만듦', '늘 가던 식당, 늘 가던 카페만 고집하는 융통성 제로의 성향 탓에 데이트가 너무 단조롭고 설렘이 없어져 권태기를 유발하기 십상임', '본인이 무조건 맞다는 똥고집과 자존심을 무쓸모하게 앞세워 명백히 자신이 잘못했음에도 불구하고 절대 먼저 화해의 손길을 내밀지 않음', '연인의 섬세한 감정 호소나 낭만적인 이벤트를 쓸데없는 짓으로 치부하며 감정선을 무참히 밟아버리는 무심한 행동을 가장 주의할 것'],
      '기해': ['상황에 따라 데이트 코스를 바꾸거나 연인의 변덕스러운 요구에도 화내지 않고 물 흐르듯 유연하고 부드럽게 대처하는 센스가 탁월함', '포용력이 넓고 마음이 따뜻하여 연인이 데이트 중 실수하거나 짜증을 부려도 날카롭게 지적하지 않고 너그러운 마음으로 다 받아줌', '세심한 관찰력으로 연인의 식성, 취향, 옷차림을 모두 기억해두었다가 꼭 필요한 순간에 다정하게 챙겨주는 섬세한 애정 표현에 능함', '갈등과 언성을 높이는 싸움을 극도로 싫어해 웬만하면 자신이 참고 맞춰주며 늘 조용하고 평화로운 안정적인 연애를 유지하려 노력함', '직관력이 발달해 눈빛만 봐도 연인이 지금 피곤한지 즐거운지 기분을 기가 막히게 파악하고 그에 맞춰 행동을 조절하는 능력이 좋음', '다툼을 피하려다 보니 매사에 우유부단하여 점심 메뉴 하나 시원하게 정하지 못해 답답함을 유발하고 중요한 결정을 내리지 못함', '상대를 100% 믿지 못하고 틈만 나면 핸드폰 검사를 하거나 연락에 집착하며 의심의 싹을 틔워 스스로 불안감을 키우는 습관을 버릴 것', '기분 나쁜 일이 있어도 겉으론 웃고 속으로 썩히다가 속마음을 명확히 표현하지 않아 연인은 전혀 영문도 모른 채 큰 오해를 낳게 됨', '데이트를 리드하거나 관계의 진전을 이끌어야 할 때 소심하고 방어적인 태도로 일관하여 연애가 제자리에 머무는 소극성을 고칠 것', '주변 환경이나 타인의 말 한마디에 지나치게 예민하게 반응하여 우울해지는 탓에 덩달아 연인까지 텐션 떨어지고 피곤하게 만들지 말 것'],
      '경자': ['사귀는 사이라도 각자의 일과 사생활의 영역을 명확히 구분하여 집착 없이 깔끔하고 쿨하게 결단력 있는 선을 유지하며 연애함', '사랑해, 서운해 같은 감정 표현을 빙빙 돌려 말하지 않고 직설적이고 솔직하게 속내를 다 털어놓아 오해 없는 투명한 소통을 추구함', '데이트 약속 시간 엄수, 바람피우지 않기 등 기본 원칙과 둘만의 규칙을 어기는 것을 극혐하며 강박적일 정도로 이를 지키려 노력함', '연인의 아주 미세한 거짓말이나 태도 변화를 단번에 잡아내는 예리하고 예민한 촉을 지녀 상대방이 허튼수작을 부릴 엄두를 못 내게 함', '자신이 선택한 연인에 대한 의리를 매우 중요하게 여겨 한 번 신뢰가 쌓이면 어떤 유혹이 와도 흔들리지 않고 끝까지 곁을 든든히 지킴', '싸울 때 감정보다는 팩트 폭격에 집중하여 차갑고 날 선 언행으로 연인의 자존심을 밑바닥까지 끌어내려 돌이킬 수 없는 상처를 줌', '연인의 옷차림이나 일상 습관까지 하나하나 자신의 통제하에 두고 지적하려는 성향이 억압과 집착으로 느껴지지 않도록 각별히 주의할 것', '데이트 일정이 조금만 틀어져도 융통성 없이 극도로 스트레스를 받고 화를 내어 분위기를 망치는 사소한 똥고집을 버려야 관계가 유지됨', '티끌 하나 없는 완벽주의 연애를 추구하느라 연인의 작은 단점조차 현미경으로 확대 해석하여 서로를 숨 막히고 피곤하게 만들지 말 것', '연인의 감정 섞인 위로 요청에 "그건 네가 잘못했네" 식의 직설적이고 기계적인 해결책만 들이대지 말고 말투를 다정하게 순화할 것'],
      '신축': ['시끄러운 번화가보다는 인테리어가 깔끔하고 프라이빗하게 정돈된 조용한 공간에서 밀도 높은 대화를 나누는 데이트 분위기를 몹시 중시함', '쉽게 금방 타오르는 냄비 같은 연애가 아니라 성실하고 끈기 있게 한 사람 곁에서 묵묵히 내실을 다지며 신뢰를 쌓아가는 장기 연애 특화형임', '연락 빈도나 만나는 횟수에 있어 명확한 자기 기준이 있으며 예의와 매너를 깍듯이 지켜 상대의 가족이나 지인에게 소개하기 가장 좋은 연인임', '데이트 중 발생하는 문제 상황이나 상대의 성향을 세심하고 치밀하게 분석하여 갈등이 커지기 전에 논리적으로 차분하게 상황을 진압함', '평소에는 한없이 다정하고 져주는 듯하지만 자신이 긋어 놓은 선을 연인이 넘는 순간 차갑게 돌변하여 관계를 싹둑 자르는 단호한 결단력이 있음', '이성을 고르는 기준과 데이트 매너에 대한 커트라인이 너무 까다로워 연인이 항상 시험받는 기분을 느끼게 하여 숨 막히게 할 위험이 농후함', '서운한 점이 생겨도 절대 겉으로 내색하지 않고 포커페이스를 유지하여 연인 입장에서는 진심을 알 길이 없어 답답해 미칠 지경에 이르게 됨', '다툼 시 상대방의 논리적 허점을 정확하게 찾아내어 날카롭고 비꼬는 비판으로 연인의 멘탈을 가루로 만들어버리는 잔인한 화법을 멈출 것', '한 번 화가 나거나 토라지면 절대 자신이 먼저 타협점을 찾지 않는 불도저 같은 융통성 부족과 쇠고집 때문에 사소한 싸움이 이별로 치달음', '연인에 대한 기본 베이스가 의심과 경계심으로 깔려 있어 온전히 마음을 열지 못하니 제발 쓸데없는 방어 기제를 풀고 편안하게 연애에 임할 것'],
      '임인': ['자신의 영역을 고집하기보다 넓은 포용력으로 연인의 취향과 의견을 스펀지처럼 흡수하며 얽매임 없는 자유롭고 개방적인 연애를 추구함', '집 데이트보다는 매주 새로운 지역이나 핫플레이스를 탐험하고 친구들 모임에 연인을 동반하는 사교적이고 매우 활동적인 데이트를 선호함', '어색한 썸 단계에서도 뛰어난 재치와 화려한 언변으로 대화를 주도하여 분위기를 솜사탕처럼 부드럽고 달콤하게 녹여버리는 마성이 있음', '갑자기 데이트 코스가 휴무이거나 차가 고장 나는 위기 상황에서도 당황하지 않고 재빨리 유쾌한 플랜 B를 꺼내 드는 임기응변이 뛰어남', '지혜롭고 직관력이 발달해 복잡하게 얽힌 갈등 상황에서도 상황 판단을 빠르게 마치고 서로 윈윈할 수 있는 명쾌한 타협점을 아주 잘 찾아냄', '평소엔 수다스럽지만 자신이 불리한 진짜 속마음이나 상처는 철저히 감추어 연인이 볼 때 진정성 없고 일관성 없는 가벼운 태도로 보일 수 있음', '진지하게 두 사람의 미래를 상의하거나 잘못을 책임져야 하는 무거운 상황이 오면 농담으로 회피하고 쏙 빠져나가려는 무책임한 습관을 버릴 것', '아침엔 사랑이 넘치다 저녁엔 갑자기 시큰둥해지는 변덕스러운 감정 널뛰기 탓에 연인이 눈치를 보며 연애의 심리적 안정감을 박살 내지 말 것', '호기심이 뻗쳐 취미나 친구 모임 등 다른 여러 가지에 관심을 쏟느라 정작 연인과의 데이트나 연락에는 집중력이 현저히 떨어지는 것을 주의할 것', '자신의 쿨한 연애 방식만 고집하다 보니 정작 칭얼거리고 기대고 싶어 하는 연인의 세심한 감정선을 무심하게 방치하는 큰 실수를 저지르지 말 것'],
      '계묘': ['말 한마디도 예쁘게 포장해서 건네는 다정하고 부드러운 태도로 팍팍한 일상에 지친 연인의 마음을 사르르 녹여주며 세심하게 배려함', '마치 독심술사처럼 예민한 감각 안테나를 세우고 있어 연인의 미세한 표정 변화나 한숨만으로도 기분을 단번에 눈치채고 맞춤형 애교를 부림', '싸워서 이기기보다는 평화를 지키는 것이 100배 낫다고 여기며 언성을 높이는 갈등 자체를 극도로 혐오하여 평화로운 관계 유지를 최우선으로 함', '비싼 선물이나 화려한 이벤트보다 둘만의 조용한 공간에서 손을 잡고 속 깊은 대화를 나누는 섬세한 정서적 교감과 안정감을 데이트의 핵심으로 샘', '예상치 못한 데이트 변수가 생겨도 화를 내지 않고 유연하게 상황에 대처하며 연인이 당황하지 않도록 부드럽게 마찰을 흡수하는 완충제 역할을 함', '연인에 대해 지나치게 집착하고 상상의 나래를 펴 잊을 만하면 바람피우는 거 아니냐며 의심하여 서로의 멘탈을 갉아먹는 피곤한 행동을 당장 멈출 것', '연인의 사소한 지적이나 농담에도 세상 무너진 것처럼 상처받고 며칠씩 꽁해있는 과도한 예민함으로 데이트 분위기를 지옥으로 만들지 않도록 주의', '데이트 메뉴 고를 때 매번 "난 다 좋아, 네가 골라"라며 우유부단하게 미루어 연인이 혼자 멱살 잡고 연애를 이끄는 듯한 억울함을 느끼게 하지 말 것', '서운한 게 생기면 그때그때 말하지 않고 보살처럼 참기만 하다가 엉뚱한 날 돌연 이별을 통보하거나 화산처럼 분노를 터뜨려 상대를 아연실색하게 함', '남들이 우리 커플을 어떻게 볼까 하는 타인의 평가와 시선에 지나치게 얽매여 둘만의 온전하고 행복한 관계를 망치고 본질을 잃어버리는 우를 범하지 말 것'],
      '갑진': ['썸 단계의 미적지근함을 견디지 못하고 주도적이고 폭발적인 추진력으로 단숨에 데이트 약속을 잡고 확고한 연인 관계로 밀어붙이는 돌격대장임', '눈앞의 짧은 즐거움보다는 두 사람의 직업, 미래, 결혼 등 묵직하고 현실적인 감각이 뛰어나 관계의 뼈대를 매우 튼튼하고 안정적으로 설계함', '연인이 힘든 일에 처하면 자신이 직접 팔을 걷어붙이고 나서서 듬직하게 방어막을 쳐주는 가장 책임감 있고 의지하기 좋은 보호자 같은 태도를 보임', '뒤에서 호박씨 까거나 돌려 말하는 밀당 따위는 질색하며 솔직하고 당당하게 "나는 네가 좋다"고 겉과 속이 똑같은 투명한 애정 표현을 퍼부음', '아무리 큰 시련이나 주변의 반대가 있어도 자신이 선택한 연인을 굳건하게 보호하며 넉넉한 포용력으로 품고 직진하는 상남자/상여자 스타일임', '자존심이 하늘을 찔러 싸움이 났을 때 자신이 명백히 틀렸어도 절대 굽히거나 먼저 미안하다고 타협하지 않아 연애가 피 말리는 기싸움으로 변질됨', '연인의 데이트 시간, 옷차림, 심지어 진로까지 챙겨준다는 명목하에 통제하려는 지나친 지배욕으로 상대에게 구속과 억압의 감옥을 만들지 않도록 주의', '감정을 몽글몽글하게 어루만져야 할 타이밍에 군대 조교처럼 무뚝뚝하고 뼈 때리는 직설적인 화법을 던져 연인의 눈물샘을 터뜨리지 않도록 입단속 할 것', '데이트 코스를 정할 때 무조건 자신의 취향과 동선만이 가장 완벽한 정답이라고 맹신하여 연인의 소소한 취향 제안을 번번이 깔아뭉개지 말 것', '가끔은 즉흥적인 여행이나 소소한 일탈도 필요한데 융통성 없이 너무 꽉 막힌 루틴만 고집하여 데이트 방식이 군대 행군처럼 경직되고 지루해질 수 있음'],
      '을사': ['사교계의 여우처럼 능수능란하고 부드러운 태도로 첫 데이트부터 상대의 철벽을 가볍게 허물고 친밀한 관계로 훅 치고 들어가는 친화력의 끝판왕임', '데이트 중 예기치 못한 사고나 꼬이는 상황이 발생해도 당황은커녕 빛보다 빠른 상황 판단과 임기응변으로 위기를 로맨틱한 기회로 둔갑시킴', '사랑의 감정에만 눈이 멀어 퍼주기보다는 데이트 비용의 분담이나 서로 간의 조건 등 현실적이고 실용적인 관점을 결코 놓치지 않는 냉철함이 공존함', '유들유들하게 연인의 기분을 한껏 맞춰주면서도 결정적인 순간에는 교묘하게 자신의 이익과 원하는 데이트 코스를 다 챙기는 똑똑한 여우 같은 면모를 뽐냄', '만나면 항상 웃음이 끊이지 않게 대화를 주도하며 긍정적이고 밝은 에너지로 텐션을 팍팍 올려주어 데이트 내내 지루할 틈이 없는 최고의 엔터테이너임', '오전에는 천사였다가 오후에는 돌연 짜증을 내는 롤러코스터 급의 심한 감정 기복 탓에 연인이 데이트 내내 폭탄 제거반처럼 당신의 눈치만 보게 만듦', '속마음은 철저히 숨긴 채 겉보기엔 맞춰주는 척 철저히 계산적으로 행동하다가 연인에게 진정성이 1도 없는 비즈니스 연애라는 치명적인 오해를 살 수 있음', '상대의 성향을 제대로 파악하기도 전에 성급하게 금방 썸을 끝내고 사귀었다가 생각과 다르면 가차 없이 뒤돌아버려 짧은 연애만 반복하는 실수를 주의', '쉽게 끓어오른 만큼 쉽게 식어버려 연애의 깊이가 깊어지기도 전에 짜릿하고 새로운 다른 자극을 찾아 환승이나 이별을 고민하는 가벼운 태도를 뜯어고칠 것', '연인에 대한 기본 탑재값이 의심이어서 카톡 답장 늦는 1분을 못 참고 꼬치꼬치 행적을 캐물어 상대를 피 말리게 하는 의부증/의처증 급의 집착을 버릴 것'],
      '병오': ['마음에 드는 이성을 발견하면 뒤도 돌아보지 않고 직진하며 감정을 숨길 줄 모르는 매우 열정적이고 화산 폭발 같은 화끈한 애정 표현을 과시함', '답답한 썸이나 밀당을 극도로 혐오하며 불도저 같은 엄청난 추진력으로 만남부터 스킨십까지 템포 빠르게 데이트를 주도적으로 이끌어가는 상남자/상여자임', '내숭이나 가식이라고는 1도 찾아볼 수 없는 솔직하고 투명한 성격으로 뒤끝 없이 시원시원하여 연애 과정에서 최소한 음흉한 오해가 생길 일은 절대 없음', '어디를 가나 시선을 즐기고 자신감이 넘치며 특유의 리더십으로 연인의 사소한 일상까지 듬직하게 끌어안고 리드하는 매력적인 마초/걸크러쉬 스타일임', '매번 똑같은 카페나 영화관 데이트는 질색하며 스포츠, 야외 활동, 대형 이벤트 등 에너지가 넘치고 스케일이 크며 화끈한 동적인 만남을 몹시 선호함', '욱하는 성질과 분노 조절 실패로 데이트 중 사소한 말다툼이 길거리 대판 싸움으로 번져 순간의 감정에 이별을 내뱉고 뼈저리게 후회하는 패턴을 매우 조심', '데이트 장소부터 식사 메뉴까지 연인의 의견은 묵살하고 오직 기분 내키는 대로 독단적으로 결정하고 끌고 다녀 상대를 수동적인 인형으로 만들지 말 것', '본인의 불타는 감정 속도를 상대가 못 맞춰주거나 조금만 미적지근한 반응을 보이면 인내심을 잃고 홧김에 이별을 통보하는 최악의 조급함을 버릴 것', '연인에 대한 지나친 소유욕과 독점욕으로 상대의 인간관계 싹을 다 잘라버리려 들고 24시간 연락을 강요하여 숨 막히는 감옥 같은 연애를 만들지 않도록 주의', '화가 났을 때 브레이크 고장 난 트럭처럼 필터 없이 쏟아내는 거칠고 공격적인 말투는 연인의 마음에 씻을 수 없는 큰 상처를 주니 의식적으로 입을 닫고 순화할 것'],
      '정미': ['거창하고 소란스러운 이벤트보다는 섬세하고 다정한 배려로 연인의 아주 작고 사소한 일상까지 놓치지 않고 챙겨주는 보호자 같은 따뜻한 연애를 지향함', '한번 사랑을 시작하면 쉽게 흔들리지 않고 끈기 있고 묵묵하게 성실한 태도로 곁을 지켜주어 연인에게 하늘이 두 쪽 나도 내 편이라는 굳건한 신뢰를 줌', '기가 막힐 정도로 예민한 직관력을 타고나 연인이 말없이 한숨만 쉬어도 지금 기분이 어떤지 단박에 파악하고 맞춤형 위로를 건네는 독심술사 같은 능력을 보임', '핫하고 번잡한 데이트 장소보다는 조명 온도가 따뜻하고 조용히 손을 잡고 둘만의 오붓한 감정을 나눌 수 있는 포근한 분위기의 데이트 공간을 훨씬 사랑함', '가벼운 썸이나 자극적인 단기 연애는 시간 낭비라 여기며 훗날까지 함께 그릴 수 있는 안정적이고 지속적인 깊은 관계 유지를 연애의 가장 핵심 가치로 삼음', '속으로는 사랑하면서도 겉으로는 상대의 일거수일투족에 지나친 질투심과 소유욕의 촉을 세워 연인에게 피곤하고 집착하는 사람이라는 인상을 심어주지 말 것', '데이트 중 서운한 포인트가 있어도 그 자리에서 쿨하게 말하지 못하고 속으로만 음침하게 불만을 쌓아두다 엉뚱한 날 시한폭탄처럼 폭발하는 최악의 버릇을 고칠 것', '자신만의 단단한 가치관과 똥고집이 있어 다툼이 났을 때 상대가 논리적으로 설득해도 끝까지 자기 의견만 우기고 타협점을 절대 찾지 않는 꽉 막힌 태도를 주의', '타고난 예민함이 부정적으로 폭발하면 데이트 중 음식 맛이 조금만 없거나 온도가 안 맞아도 온갖 짜증과 과민 반응을 쏟아내 데이트 분위기를 지옥으로 만들지 말 것', '내심 상대를 열렬히 사랑하면서도 자존심과 소심함 때문에 애정 표현과 스킨십에 인색하게 굴어 연인이 나만 너를 짝사랑하는 것 아니냐는 치명적인 오해를 사지 말 것'],
      '무신': ['문제가 생기면 당황하기보다는 다방면에 타고난 똘똘한 재능과 기가 막힌 문제 해결 능력을 발휘하여 데이트 중 닥친 위기를 즉각 해결해 주는 맥가이버 같은 연인임', '무게감 있고 듬직한 모습으로 든든한 방패막이가 되어 주면서도 필요할 땐 융통성 있게 싹싹하게 굴며 위기 상황을 유연하게 모면하는 겉바속촉의 매력을 지님', '평소 과묵해 보이지만 의외로 재치 있는 언변과 타이밍을 아는 유머 감각을 장착하고 있어 어색한 분위기를 단숨에 즐겁고 화기애애하게 반전시키는 능력이 탁월함', '뜬구름 잡는 비싼 이벤트나 명품 선물보다는 연인의 일상생활에 실질적으로 100% 필요한 것을 챙겨주거나 가성비 좋은 데이트를 척척 기획하는 매우 현실적인 타입임', '연인이 다소 철없는 행동을 하거나 실수를 연발해도 불같이 화내기보다는 드넓은 바다 같은 포용력으로 허허 웃어넘기며 상대를 부드럽게 감싸주는 아량 넓은 태도를 보임', '모든 데이트 코스와 기념일을 철저히 엑셀 표 같은 이해득실과 가성비로만 따져서 연인에게 로맨스나 낭만이라고는 1도 찾아볼 수 없는 건조하고 정 없는 사람으로 찍히지 말 것', '갈등이 생겼을 때 연인의 감정에 공감하고 위로해주기보다 너무 자기중심적이고 이성적인 팩트와 해결책만 들이밀어 상대를 벽과 대화하는 기분이 들게 하지 않도록 주의', '시작은 거창하고 추진력 있게 데이트를 리드하지만 막상 귀찮아지면 뒷심과 끈기가 급격히 부족해져 연애 후반부로 갈수록 관계를 방치하고 귀찮아하는 무책임함을 버릴 것', '둘만의 미래나 진지하게 깊은 감정을 나누어야 할 타이밍조차 무겁고 오글거린다는 이유로 실없는 농담이나 딴소리로 휙 회피해 버려 연인의 신뢰도를 바닥으로 치닫게 하지 말 것', '가슴속으로는 상대를 열렬히 아끼면서도 이를 겉으로 예쁘게 표현하는 기술이 심각하게 서툴고 무뚝뚝하여 결국 연인에게 내가 사랑받고 있지 않다는 서운함을 뼈저리게 느끼게 함'],
      '기유': ['데이트 일정을 짤 때 오차가 발생하지 않도록 시간 단위로 세밀하고 깔끔하게 상황을 쪼개서 분석하고 파악하여 연인을 아주 편안하게 이끌어가는 인간 플래너임', '연락 빈도, 데이트 매너, 이성 친구와의 선 긋기 등 연인 사이에 마땅히 지켜야 할 명확한 규칙과 기본 예의를 칼같이 지키는 것을 연애의 제1덕목으로 삼음', '시끄럽고 지저분한 환경을 질색하며 항상 인테리어가 깔끔하게 정돈되고 분위기 있는 쾌적한 핫플레이스나 프라이빗한 장소에서의 안정적인 데이트를 매우 선호함', '소름 돋을 정도로 세심한 관찰력을 가져 연인의 식성, 향수 취향, 심지어 입맛 없는 날의 컨디션까지 꼼꼼하게 다 기억해 두었다가 맞춤형으로 챙겨주는 애정에 능함', '시끄럽게 나서서 불만을 토로하지는 않지만 자신이 절대 양보할 수 없는 명확한 연애의 마지노선을 굳게 지키며 부드러운 카리스마로 상대방이 선을 넘지 못하게 함', '연인을 평가하는 마음속 기준표가 너무 가혹하고 깐깐하여 데이트 중 연인이 조금만 삐끗해도 숨이 턱턱 막히게 압박하여 결국 상대방을 피곤함에 나가떨어지게 만들 위험이 있음', '데이트 중 생긴 사소한 마찰이나 연인의 가벼운 농담조차 그냥 넘기지 못하고 속으로 꽁해있거나 지나치게 뾰족하게 예민한 반응을 보여 그날의 분위기를 얼어붙게 만들지 말 것', '상대에게 직설적으로 불만을 말하기를 꺼려 빙빙 돌려 말하거나 틱틱대는 수동 공격적인 태도를 취해 연인은 이유도 모른 채 오해와 짜증만 가득 쌓이게 만드는 소통 방식을 고칠 것', '옷차림부터 밥 먹는 순서까지 데이트의 A to Z를 완벽하게 통제하려는 극강의 완벽주의 성향 때문에 연애가 편안한 휴식이 아니라 시험을 치르는 듯 경직되게 만들지 않도록 각별히 주의', '상처받는 것이 두려워 진짜 속마음을 겹겹이 꽁꽁 숨겨두는 탓에 연인 입장에서는 벽을 보고 연애하는 답답함을 느끼게 되어 결국 의사소통 불가로 인한 이별을 맞이하지 않도록 마음을 열 것'],
      '경술': ['연애를 한낱 가벼운 유희가 아니라 목숨처럼 무겁게 여기며 한 번 사귄 연인에 대한 책임감과 흔들림 없는 굳건한 의리를 인생의 가장 중요한 가치관으로 삼고 지켜냄', '데이트 중 외부에서 연인이 곤란한 상황에 부닥치거나 부당한 일을 당하면 앞뒤 가리지 않고 가장 먼저 듬직하게 나서서 강력한 방패막이가 되어 상대를 철저히 보호함', '마음에 들면 재지 않고 고백하며 아니면 칼같이 끊어내는 성격으로 어장 관리나 지저분한 환승 연애 따위는 절대 용납하지 않는 명쾌하고 단호한 결단력의 소유자임', '가식과 내숭을 세상에서 제일 싫어하여 좋으면 좋다 싫으면 싫다 속마음을 필터 없이 당당하고 솔직하게 다 드러내어 연인에게 최소한 거짓말은 안 한다는 굳은 신뢰를 줌', '데이트 횟수나 이성 문제 등 둘만의 연애 규칙과 원칙을 한 번 정하면 무슨 일이 있어도 타협하지 않고 철저하게 지켜내는 군인 같은 올곧은 성향을 맹렬히 발휘함', '연인을 끔찍이 아끼고 보호하겠다는 마음이 지나치게 왜곡되어 상대의 복장, 통금 시간, 인간관계까지 샅샅이 통제하고 지배하려는 억압적인 집착으로 변질되지 않도록 각별히 조심할 것', '다툼 시 상대방의 변명이나 사정은 듣지도 않고 원칙만 앞세우는 지독하게 융통성 없는 꽉 막힌 태도 때문에 아주 가볍게 끝날 싸움도 도저히 타협점을 찾지 못하고 이별로 치달음', '감정을 세심하게 어루만져야 할 분위기에서도 타고난 무뚝뚝함과 팩트만 후벼파는 직설적이고 차가운 화법을 사용하여 본의 아니게 연인의 가슴에 평생 남을 비수를 꽂지 않도록 입단속 할 것', '자신이 무조건 옳다는 자존심을 목숨보다 높게 앞세워 본인이 먼저 잘못을 저지른 명백한 상황에서도 절대 화해의 손길을 먼저 내밀거나 굽히지 않는 고집불통의 이기적인 태도를 뜯어고칠 것', '자신의 굳건하고 보수적인 신념과 데이트 방식만을 진리라고 믿고 연인에게 끊임없이 강요하고 훈계하여 상대방이 연애를 하는 건지 선생님을 만나는 건지 피곤함을 느끼게 하지 말 것'],
      '신해': ['단순히 외모가 뛰어난 이성보다는 대화의 핑퐁이 잘 맞고 예리한 직관력으로 자신의 내면을 깊이 꿰뚫어 보는 지적이고 깊이 있는 분위기의 상대를 기가 막히게 선별함', '화려하고 북적이는 핫플레이스를 전전하기보다는 인테리어가 깔끔하고 프라이빗한 장소에서 서로의 감정과 가치관을 섬세하고 세련되게 나누는 하이엔드 만남을 추구함', '연애의 목적을 육체적이거나 가벼운 즐거움이 아닌 서로의 정신세계를 탐구하는 조용하고 감성적인 교감에 두어 밤새도록 속 깊은 대화를 나누는 데이트를 가장 중요하게 생각함', '연인 사이의 프라이버시와 예의를 무엇보다 강조하여 연락 빈도와 개인 시간에 대한 명확하고 분명한 자신만의 기준을 세워두고 절대 이 바운더리가 침해받는 것을 허락하지 않음', '상황이 불리하게 돌아가도 억지 부리지 않고 부드럽고 유연하게 대처하는 여유를 보이면서도 자신이 정한 마지노선은 절대 넘지 않게 하는 외유내강의 우아한 선 긋기에 능함', '이성을 평가하는 잣대와 데이트 매너에 대한 기준치가 비현실적으로 너무 높아 연인이 데이트 내내 평가받는 기분에 질려버려 금방 지치고 도망가게 만들 위험이 매우 농후함', '다툼이 생겼을 때 육두문자를 쓰진 않지만 세상에서 가장 차갑고 이성적인 말투와 날카롭고 예리한 논리로 연인의 자존심을 난도질하여 마음에 씻을 수 없는 큰 상처를 남기지 말 것', '기본적으로 타인에 대한 끝없는 의심과 지나친 경계심을 품고 있어 연인이 아무리 진심을 다해 애정을 표현해도 이를 순수하게 믿지 못해 편안하고 포근한 연애의 진입을 스스로 차단함', '관계가 틀어져 정리를 해야 하거나 결단이 필요한 중요한 시점임에도 불구하고 결단력이 부족하고 우유부단하게 굴어 맺고 끊음이 질척거려 서로의 시간만 낭비하게 만들지 말 것', '상처받는 것을 극도로 두려워한 나머지 진짜 자신의 속마음은 겹겹이 꽁꽁 숨긴 채 돌려 말하며 연인과의 솔직한 의사소통 창구를 아예 닫아버려 오해만 눈덩이처럼 키우지 않도록 주의'],
      '임자': ['상대방의 어설픈 단점이나 실수조차 크게 나무라지 않고 스펀지처럼 전부 흡수해 버리려는 태평양 같이 넓은 포용력으로 모든 것을 너그럽게 껴안아 주는 대인배 연애를 함', '어색한 소개팅 자리나 썸 단계에서도 극강의 친화력과 사교성으로 분위기를 유연하고 유쾌하게 주도하여 순식간에 상대방의 경계를 풀고 마음을 사로잡는 데이트 스킬이 탁월함', '서로의 일거수일투족을 옥죄는 구속을 질색하며 각자의 취미와 인간관계를 철저히 인정하고 얽매임 없이 쿨하게 믿어주는 물 흐르듯 자유로운 어른의 연애를 가장 이상적으로 추구함', '데이트 계획이 갑자기 틀어져 당황스러운 멘붕 상황이 와도 불평 한마디 없이 특유의 여유로움과 대범함으로 새로운 맛집이나 재밌는 코스를 뚝딱 찾아내어 상황을 매끄럽게 대처함', '지혜롭고 직관력이 매우 뛰어나 상대가 무엇 때문에 기분이 상했는지 말하지 않아도 단번에 꿰뚫어 보며 깊은 이해심을 발휘해 싸움이 커지기 전에 부드럽게 무마시키는 능력이 있음', '평소에는 유쾌하지만 자신의 진짜 어두운 속마음이나 치부는 수심 깊은 바다처럼 지나치게 감추어 연인 입장에서는 "이 사람이 진짜 나를 사랑하긴 할까?"라는 깊은 의중을 짐작할 수 없음', '아침엔 한없이 다정하다가 저녁엔 갑자기 동굴로 들어가 버리는 등 날씨보다 더 변덕이 심해 일관성 없는 태도로 연인의 심리적 안정감을 흔들어 불안증을 유발하지 않도록 각별히 조심할 것', '다툼 시 상대방의 논리 정연한 지적을 수용하지 못하고 갑자기 강한 똥고집을 부려 귓등으로도 안 들으며 소통 창구를 아예 단절시켜 버려 작은 다툼을 파국으로 치닫게 만들지 말 것', '천성이 너무 사람을 좋아하고 다정다감하여 내 연인뿐만 아니라 주변의 여러 이성 친구들에게도 과하게 친절을 남발해 연인에게 쓸데없는 질투 폭탄과 환승 의혹이라는 오해를 사기 십상임', '진지하게 두 사람의 미래를 책임져야 하는 결단의 순간이나 끈기 있게 관계를 회복해야 할 타이밍에 특유의 흘러가는 대로 살자는 무책임한 태도를 보여 연인의 굳건한 신뢰를 바닥치게 하지 말 것'],
      '계축': ['첫눈에 불타오르는 가벼운 만남을 극도로 꺼리며 호감이 생겨도 쉽게 다가가지 않고 오랜 시간 상대의 인성과 매너를 조심스럽고 차분하게 관찰한 뒤에야 천천히 관계를 발전시킴', '연애 초반에는 무뚝뚝해 보여도 시간이 지날수록 초심을 잃지 않고 묵묵히 데이트 약속과 연락을 챙기며 성실하고 끈기 있는 태도로 연인에게 바위 같은 굳건한 신뢰감을 형성함', '남들은 무심코 지나칠 법한 연인의 아주 미세한 표정 변화, 앞머리 길이, 옷차림의 변화까지 눈치채는 소름 돋게 예민한 감각으로 필요한 순간에 센스 있게 칭찬하고 기분을 맞춰줌', '인스타 감성의 요란한 이벤트나 남들에게 과시하기 위한 데이트보다는 조용한 단골 식당이나 집에서 편안하게 맛있는 것을 먹으며 묵묵히 둘만의 사랑의 내실을 다지는 편을 훨씬 선호함', '책임감이 남달라 한 번 내 사람이라고 굳게 믿고 마음을 주면 상대가 큰 병에 걸리거나 파산하는 등 최악의 위기가 와도 끝까지 의리를 버리지 않고 곁을 지키는 지고지순한 연인임', '자신이 상처받을까 봐 두려워 연인의 아주 사소한 거짓말이나 행동 하나하나에 의미를 부여하고 지나치게 의심의 촉을 세워 스스로 멘탈을 갉아먹고 피곤한 연애를 자처하지 말 것', '데이트 중 섭섭한 점이나 불만이 생겨도 그 자리에서 쿨하게 말하지 않고 "아니야 괜찮아"라며 꾹꾹 참기만 하다가 나중에 용암처럼 갑자기 분노를 폭발시켜 상대를 혼비백산하게 만들지 않도록 주의', '자신만의 확고한 데이트 루틴이나 연애관이 너무 세서 한 번 다툼이 발생하면 웬만해서는 타협점을 찾지 못하고 끝까지 꺾이지 않는 쇠고집을 부려 결국 소통 불가로 이별을 자초할 위험이 큼', '내심 상대를 열렬히 좋아하면서도 소극적이고 수동적인 태도로 일관하며 애정 표현을 극도로 아껴 관계의 진전 속도를 거북이처럼 늦추고 상대가 지쳐 나가떨어지게 만들지 말 것', '데이트 장소가 조금 시끄럽거나 연인이 무심코 한 장난 섞인 농담에도 갑자기 정색하고 지나치게 예민하고 차갑게 반응하여 화기애애하던 데이트 분위기를 순식간에 얼음장으로 만들어 상대를 당황시키지 말 것'],
      '갑인': ['누군가에게 기대거나 끌려다니는 연애를 질색하며 남녀 불문하고 데이트 코스를 직접 다 기획하고 비용까지 화끈하게 지출하며 주도적으로 관계의 진도를 팍팍 이끌어 나가는 보스 기질이 충만함', '밀당, 어장 관리, 애매한 썸을 세상에서 제일 극혐하여 마음에 드는 상대를 발견하면 묻지도 따지지도 않고 솔직하고 당당하게 직진하여 속 시원하게 "사귀자"고 애정을 표현하는 사이다 같은 매력이 있음', '집콕 데이트나 조용한 산책보다는 등산, 스포츠, 드라이브 등 에너지를 분출할 수 있고 스케일이 큰 진취적이고 활동적인 만남을 선호하여 연애 내내 지루할 틈이 없는 스펙타클한 경험을 선사함', '의리와 책임감을 몹시 중시하여 연인이 억울한 일을 당하면 자신의 일보다 더 크게 분노하며 앞장서서 싸워주고 한 번 약속한 데이트나 규칙은 하늘이 무너져도 철저히 지키는 강직함을 보임', '자신감이 넘치고 특유의 듬직한 리더십으로 갈등이 생기든 위기가 오든 피하지 않고 정면 돌파하여 행동으로 상황을 수습해 주어 연인에게 "이 사람과 함께라면 굶어 죽진 않겠다"는 든든함을 줌', '자존심이 우주를 뚫고 나갈 정도로 너무 세서 다툼이 났을 때 자신이 명백히 100% 잘못한 상황임에도 불구하고 절대 먼저 고개를 굽히거나 "미안해"라며 타협하려 들지 않아 연인의 속을 까맣게 태움', '데이트 장소나 메뉴를 고를 때 연인의 취향이나 컨디션은 묻지도 않고 오직 자신이 꽂힌 계획대로만 밀어붙이는 독단적인 행동으로 상대방을 숨 막히게 하고 무시당한다는 느낌을 주지 말 것', '융통성이 전혀 없어 사소한 약속 변경이나 유연한 상황 대처가 필요할 때도 무조건 원리원칙과 똥고집을 부려 분위기를 싸하게 만들고 작은 문제도 큰 싸움으로 번지게 하는 태도를 뜯어고칠 것', '화가 나면 브레이크 없는 기관차처럼 직설적이고 거친 언행을 필터 없이 내뱉어 본의 아니게 연인의 가슴에 칼을 꽂아 회복 불가능한 상처를 주지 않도록 반드시 입단속을 하고 심호흡을 할 것', '사랑이라는 명목하에 연인의 통금 시간, 인간관계, 직장 생활까지 샅샅이 지휘하려 드는 지나친 통제욕을 부려 연인을 구속의 감옥에 가두어 질려버리게 만들지 않도록 각별히 릴렉스할 것'],
      '을묘': ['상대방과 의견이 충돌할 것 같으면 자신의 고집을 먼저 부드럽게 꺾고 연인의 취향에 기꺼이 맞춰주며 데이트 내내 싸울 일 없이 물 흐르듯 편안하게 상대를 배려하는 최상의 매너를 장착함', '눈치가 백 단이라 연인이 데이트 중 다리가 아픈지, 배가 고픈지, 기분이 상했는지 말하지 않아도 귀신같이 상황을 파악하고 임기응변을 발휘해 능숙하게 분위기를 전환하고 맞춰주는 재주가 있음', '거창한 선물이나 과장된 이벤트보다는 평소 데이트 중 상대가 무심코 쳐다본 물건을 기억했다가 사주거나 식당에서 물을 챙겨주는 등 세심한 관찰력을 바탕으로 꼭 필요한 것을 챙기는 센스가 넘침', '하루가 멀다고 롤러코스터를 타는 자극적인 연애보다는 사계절 내내 늘 같은 자리에서 조용하게 손잡고 걸을 수 있는 안정적이고 평화로운 장기적인 관계 유지를 연애의 가장 큰 행복으로 중시함', '선을 넘는 무례한 농담이나 공공장소에서의 과한 스킨십을 극도로 꺼리며 항상 단정하고 예의 바른 태도를 고수하여 상대방의 부모님이나 지인들에게 소개했을 때 가장 환영받는 프리패스 상임', '관계에서 주도권을 잡기보다는 항상 양보만 하다 보니 줏대가 약해 보여 데이트 메뉴 하나 고를 때도 한세월이 걸려 결단력 없고 미적지근한 사람으로 비칠 수 있으니 주관을 뚜렷이 세울 것', '데이트 중 몹시 기분 나쁘고 서운한 점이 생겨도 그 자리에서 팩트를 짚어 말하지 않고 혼자 꾹꾹 참다가 연인에게 묘하게 틱틱거리며 오해만 눈덩이처럼 키우는 수동 공격적인 화법을 버릴 것', '평소에는 한없이 보살 같다가도 한 번 예민 스위치가 켜지면 데이트 중 음식이 늦게 나오거나 날씨가 안 좋은 사소한 일에도 온갖 짜증을 내어 연인을 가시방석에 앉혀두지 않도록 마인드 컨트롤할 것', '다툼을 회피하고 평화를 지키려는 강박 때문에 화가 났으면서도 겉으로는 "다 네 말이 맞다"며 영혼 없이 맞춰주는 척하고 속으로는 절대 굽히지 않는 이중적인 태도를 멈추고 진솔하게 대화할 것', '고백을 받아줄지 말지, 이 관계를 계속할지 말지 중대한 갈등의 기로에 섰을 때조차 타인에게 미움을 살까 두려워 소심한 태도로 중요한 결정을 내리지 못하고 질질 끌어 상대방을 미치게 하지 말 것'],
      '병진': ['데이트를 시작하는 순간부터 헤어질 때까지 입가에 미소가 떠나지 않으며 특유의 밝고 긍정적인 오라클(에너지)로 연인에게 쌓인 스트레스와 피로를 단숨에 날려주는 인간 비타민 같은 역할을 톡톡히 해냄', '자신이 사랑하는 연인이 실수하거나 좀 모자란 행동을 해도 꼬투리 잡아 비난하기보다는 태평양 같이 넓은 포용력으로 "그럴 수도 있지"라며 다정하게 안아주고 자존감을 한껏 끌어올려 주는 이해심이 깊음', '애정 표현을 부끄러워하거나 아끼지 않으며 사람들 앞에서도 당당하고 열정적으로 연인에 대한 사랑을 적극적으로 뿜어내어 상대방이 세상에서 가장 사랑받는 특별한 존재라는 확신을 뼛속 깊이 심어줌', '데이트 중 길을 잃거나 갑자기 비가 쏟아지는 짜증 나는 돌발 상황에서도 신경질을 내기보다는 "오히려 좋아!"를 외치며 상황에 맞게 유연하고 긍정적으로 대처하는 능력치가 만렙에 수렴함', '주말 내내 집에만 틀어박혀 넷플릭스만 보는 데이트보다는 맛집 탐방, 드라이브, 캠핑 등 활동적이고 호기심이 넘치는 핫플레이스를 쉴 새 없이 찾아다니며 연애의 텐션을 항시 최고조로 유지하려 노력함', '감정의 고저가 너무 심해 오전에는 하늘을 찌를 듯 다정하다가 오후에 사소한 일로 갑자기 지하 암반수까지 기운이 다운되는 극심한 감정 기복 탓에 연인이 불안감을 느끼고 덩달아 롤러코스터를 타지 않게 주의할 것', '어떤 문제가 생겼을 때 연인의 입장을 끝까지 들어보지도 않고 성급하게 자신의 직관대로만 판단해 버려 엉뚱한 오해를 낳고 일을 돌이킬 수 없이 그르쳐 관계에 찬물을 끼얹지 않도록 제발 한 템포 쉬어갈 것', '자기주장이 굉장히 강하고 승부욕이 있어서 다툼이 생기면 연인의 논리적인 설득에도 절대 고집을 꺾지 않고 끝까지 이겨 먹으려 드는 피곤한 똥고집을 부려 작은 싸움을 이별 전쟁으로 키우지 말 것', '상대를 챙겨준다는 좋은 의도에서 시작하지만 옷차림부터 인간관계, 커리어까지 사사건건 훈수를 두고 참견하려는 잔소리꾼 기질 때문에 연인이 피곤함을 호소하고 도망가고 싶게 만들지 말 것', '연애 초반에는 우주 끝까지 사랑할 것처럼 활활 타오르다가 막상 연애가 궤도에 오르고 편안해지면 인내심이 바닥나 마무리가 흐지부지되고 금세 다른 자극을 찾는 부족한 뒷심을 고치고 책임감을 가질 것'],
      '정사': ['연인의 미세한 눈썹 움직임, 목소리의 미세한 떨림 하나만으로도 그날의 기분과 숨겨진 고민을 소름 끼치도록 정확히 짚어내는 초정밀 레이더급 세밀한 관찰력으로 데이트 상황을 완벽하게 통제하고 파악함', '겉보기에는 불같이 화끈하고 다혈질일 것 같지만 막상 연애를 시작하면 한 사람만 깊이 파고들며 차분하고 진지하게 관계의 기반을 단단하게 다져나가는 묵직한 열정과 치밀함을 동시에 발휘함', '연인 사이라도 함부로 선을 넘는 농담이나 무례한 행동을 하는 것을 극도로 혐오하여 애초에 명확하고 분명하게 자신이 허용할 수 있는 바운더리를 쳐두고 이를 지키는 사람에게만 곁을 내줌', '데이트 중 뱉은 가벼운 약속 한마디, 1분 1초의 약속 시간조차 절대 허투루 넘기지 않고 철저하게 이행하는 놀라운 책임감을 지녀 연인에게 한 치의 의심도 허락하지 않는 굳건한 신뢰의 탑을 쌓음', '상황에 따라 부드럽게 져주는 다정함과 달콤함을 보여주다가도 연인이 큰 잘못을 하거나 선을 넘으면 그 자리에서 얼음장처럼 차갑게 돌변하여 관계를 정리해 버리는 서슬 퍼런 결단력을 동시에 품고 있음', '자신이 선택한 연인에 대한 질투심과 소유욕이 상상을 초월할 정도로 매우 강해 연인이 이성 친구와 밥 한 끼 먹는 것조차 허락하지 않고 24시간 일거수일투족을 캐물어 상대를 옥죄고 숨 막히게 하지 말 것', '평소에는 한없이 다정하다가 한 번 예민 스위치가 잘못 눌리면 정제되지 않은 날카롭고 뾰족한 비수 같은 말들을 폭포수처럼 쏟아내어 연인의 자존심과 마음에 영원히 지워지지 않는 치명적인 상처를 입히지 말 것', '자신만의 확고한 가치관과 데이트 방식이 법이라 생각하여 연인이 아무리 합리적인 대안을 제시해도 지나친 고집으로 귀를 닫고 융통성 없는 태도로 일관하여 데이트를 군대 행군처럼 경직되게 만들지 말 것', '섭섭하거나 서운한 점이 생겨도 속마음을 절대 입 밖으로 내지 않고 용광로처럼 속으로만 부글부글 끓이며 참다가 어느 날 갑자기 사소한 일에 화산 폭발하듯 분노를 터뜨려 연인을 공포에 떨게 하지 않도록 주의', '상대의 안전과 일상을 보호해 주겠다는 명목하에 데이트 동선부터 연락 빈도까지 모든 것을 자신의 입맛대로 완벽하게 통제하려는 성향이 연인에게는 소름 돋는 억압과 가스라이팅으로 느껴지지 않게 조심할 것'],
      '무오': ['치사하게 데이트 비용을 반반 나누거나 연인이 리드해주길 기다리는 것을 답답해하며 데이트 코스 기획부터 비용 결제까지 모든 스케일을 큼직하게 자신이 주도적으로 이끌어가야 직성이 풀리는 대장부 스타일임', '마음에 드는 이성을 발견하면 머리 굴리거나 썸을 질질 끄는 법 없이 당장 다가가 열정적이고 화끈하게 직진 고백을 박아버려 상대방을 헷갈리지 않게 만드는 시원시원한 애정 표현의 1인자임', '내 연인이 다른 사람에게 무시당하거나 힘든 일에 처하면 그 어떤 불이익을 감수하고서라도 앞장서서 강력한 방패막이가 되어 듬직하고 굳건하게 연인을 철통 보호하려는 눈물겨운 의리와 책임감을 보임', '뒤에서 딴주머니 차거나 돌려 말하는 음침함을 극도로 혐오하며 칭찬이든 불만이든 그 자리에서 솔직하고 숨김없는 팩트로 승부하는 시원시원한 성격 덕분에 꼬인 오해 없이 맑고 투명한 연애를 지속할 수 있음', '한낱 엔조이나 가벼운 단기 연애는 시간 낭비로 치부하며 한 번 맺은 인연은 세상이 두 쪽 나도 결혼이나 끝까지 책임지고 가겠다는 무거운 사명감을 바탕으로 연인에게 우주급 신뢰와 묵직한 사랑을 퍼부음', '아무리 자신이 맞더라도 다툼 시 자존심이 에베레스트 정상에 있어 죽어도 "미안해" 한마디를 먼저 하지 않고 타협이나 사과를 극도로 거부해 결국 연인을 지쳐 나가떨어지게 만드는 황소고집을 당장 버릴 것', '데이트 장소를 정하거나 여행 계획을 짤 때 연인의 의견은 "어차피 내 계획이 완벽해"라며 깡그리 무시하고 독단적으로 행동하여 상대방을 짐짝이나 들러리로 전락시키는 기분 나쁜 행동을 하지 말 것', '자신이 세운 웅장한 계획대로만 데이트가 흘러가야 마음이 편한 융통성 제로의 성향 탓에 소소하고 즉흥적인 낭만을 잃어버리고 데이트가 마치 군사 작전처럼 단조롭고 숨 막히게 경직될 수 있으니 릴렉스할 것', '평소 호탕하다가도 연인이 선을 넘거나 예의 없는 행동을 하면 순식간에 불같이 화를 내는 다혈질적인 성향이 폭발하여 데이트 분위기를 쑥대밭으로 만들고 연인을 공포에 떨게 하지 않도록 철저히 감정을 조절할 것', '연인을 끔찍이 아끼는 마음이 도를 넘어 상대의 직장 생활, 금전 관리, 이성 관계까지 모조리 지배하려는 소름 돋는 성향으로 변질되어 결국 연인의 독립성을 철저히 훼손하고 숨통을 조이지 않도록 각별히 주의할 것'],
      '기미': ['클럽이나 유흥가에서의 가벼운 만남이나 찰나의 불타오르는 썸을 극도로 꺼리며 한 사람의 내면을 오랜 시간 지켜보고 인성과 가치관을 철저히 검증한 뒤에야 비로소 마음을 여는 매우 진중하고 묵직한 연애를 선호함', '데이트 일정을 짤 때 1분 1초의 오차도 허용하지 않으려 세밀하고 치밀하게 동선을 분석하고 예약 상황을 이중 삼중으로 체크하여 연인이 데이트 내내 아무런 스트레스 없이 대접받는 기분을 느끼게 해줌', '강한 책임감이 뼛속 깊이 박혀 있어 연인이 경제적으로 파산하거나 중병에 걸리는 등 최악의 인생 밑바닥에 떨어지더라도 절대 도망가지 않고 묵묵히 곁을 지키며 헌신적으로 병간호와 뒷바라지를 도맡아 하는 천사 같은 연인임', '매번 자극적이고 새로운 핫플레이스를 쫓아다니며 탕진하기보다는 조용한 카페나 산책로 등 늘 가던 익숙한 장소에서 안정적이고 예측 가능한 패턴의 만남을 이어가며 잔잔한 사랑의 뿌리를 깊게 내리는 것을 선호함', '요란하게 사랑한다고 동네방네 떠들지 않아도 무심한 듯 툭 챙겨주는 비타민, 비 오는 날 말없이 우산을 씌워주는 어깨 등 조용히 내실을 다지며 신뢰를 눈덩이처럼 굴려가는 은근하고 단단한 애정 표현의 고수임', '자신이 정해놓은 도덕적 잣대나 데이트 방식에서 벗어나면 절대 굽히거나 이해해주려 하지 않는 콘크리트 같은 고집이 매우 강해 다툼이 생기면 도무지 타협점을 찾지 못하고 벽보고 대화하는 듯한 극심한 답답함을 유발함', '연인이 서운하게 하거나 섭섭한 점이 생겨도 그 즉시 풀지 않고 머릿속 살생부에 차곡차곡 불만을 켜켜이 쌓아두다가 어느 날 뜬금없이 과거 10년 치 잘못을 한 번에 터뜨려 상대를 아연실색하게 만드는 폭탄을 안고 삼', '천성이 지나치게 신중한 나머지 끊임없이 연인의 마음을 저울질하고 의심하여 상대방이 아무리 진심으로 다가가도 스스로 불안의 벽을 치고 피곤하게 만들며 결국 썸 단계에서 연애로 골인하지 못하고 끝나는 경우가 허다함', '사소하게 카톡 답장이 늦거나 데이트 중 연인이 다른 곳을 쳐다본 일 하나에 속으로 심하게 꽁해있어 데이트 분위기를 묘하게 싸늘하게 만들고 며칠씩 소통을 단절해 버리는 밴댕이 소갈딱지 같은 태도를 고치도록 주의', '마음속으로는 상대를 우주만큼 사랑하면서도 소극적이고 방어적인 감정 표현 때문에 겉으로는 무뚝뚝해 보여 연인이 "나만 짝사랑하는 거 아니야?"라는 심각한 오해와 외로움에 사무치게 만들지 않도록 애정 표현에 힘쓸 것'],
      '경신': ['복잡하게 밀당하거나 애매모호하게 선을 타는 관계를 세상에서 제일 극혐하며 썸인지 연애인지 구분이 안 갈 바엔 차라리 칼같이 끝내버리고 직진으로 관계를 정리하는 불도저 같은 강단 있고 결단력 있는 태도를 보임', '자신이 선택한 연인에 대한 의리와 충성도를 목숨보다 소중하게 생각하여 한 번 믿음을 주고 사귀기 시작하면 주변에서 어떤 유혹이나 이간질이 들어와도 바위처럼 흔들림 없이 끝까지 믿어주고 보호막이 되어줌', '어색한 분위기에서도 어색함을 깨는 다방면에 재능이 많고 임기응변이 매우 뛰어나 데이트 중 길을 잃거나 가게가 문을 닫는 위기 상황이 와도 1초 만에 플랜 B를 가동해 연인이 전혀 스트레스받지 않게 완벽 케어함', '뒤에서 음침하게 딴맘을 품거나 돌려 말하며 연인을 테스트하는 짓을 질색하며 불만이 있든 사랑이 솟구치든 팩트에 기반하여 솔직하고 명확하게 자신의 의사를 100% 투명하게 전달하여 연인에게 무한한 신뢰를 제공함', '수동적으로 데이트 코스를 기다리기보다는 추진력이 용암처럼 강해 맛집 서치부터 여행 계획까지 모든 관계의 발전을 자신이 주도적으로 이끌고 리드하며 연인에게 "이 사람 참 듬직하다"는 절대적인 안도감을 심어줌', '본인의 방식이 무조건 효율적이고 옳다는 신념에 갇혀 데이트 중 연인의 행동 반경과 취향을 하나하나 간섭하고 통제하려는 성향이 너무 강해 자칫 갈등을 유발하고 연인에게 숨 막히는 구속감과 억압을 느끼게 할 수 있음', '화가 나면 필터 없이 쏟아내는 직설적이고 차가운 언행으로 연인의 가장 아픈 약점과 자존심을 난도질하여 다툼이 끝난 후에도 절대 회복되지 않는 깊은 흉터를 남기지 않도록 대화 시 반드시 세 번 생각하고 말할 것', '자기중심적인 사고방식이 뼛속까지 박혀 있어 본의 아니게 연인의 소중한 취향이나 조심스럽게 낸 의견을 "그건 별로야"라며 무 썰듯 단박에 무시하고 깔아뭉개는 오만하고 재수 없는 우를 범하지 않도록 상대방을 존중할 것', '군인처럼 원리원칙만 고집하느라 융통성이 심각하게 부족하여 상대방이 감정적으로 지쳐 위로를 원할 때조차 차가운 해결책과 타협점만 찾으려 들어 결국 감정적 교류 실패로 인한 극심한 소통 단절을 겪지 않도록 주의', '평소에는 호탕하지만 데이트 중 조금이라도 자신의 자존심이 상하거나 의견이 꺾이면 순식간에 눈빛이 돌변하며 공격적이고 전투적인 태도로 상대를 윽박질러 공포 분위기를 조성하는 분노 조절 실패를 가장 조심할 것'],
      '신유': ['데이트 상대를 고를 때 외모, 옷차림의 센스, 손톱의 청결 상태 등 첫인상과 깔끔함을 병적으로 따지며 잡음이 섞이지 않은 완벽하게 세련되고 정돈된 분위기의 레스토랑이나 전시회 같은 프라이빗한 만남을 집요하게 추구함', '연인의 아주 미세한 표정 변화, 향수의 잔향, 카톡 말투의 미묘한 온도 차이까지 단 1초 만에 캐치해 내는 예리하고 소름 돋는 직관력으로 상황을 정확히 판단하여 상대가 원하기 전에 기막힌 타이밍으로 배려와 센스를 발휘함', '연인 사이라도 함부로 욕설을 하거나 길거리에서 소란을 피우는 무례함을 절대 용납하지 않으며 명확하고 분명하게 자신이 세워둔 깐깐한 도덕적 기준과 선을 칼같이 지켜 연애 내내 흐트러짐 없는 완벽한 귀족 같은 자태를 유지함', '아무리 사랑하는 연인이라 할지라도 최소한의 예의와 매너, 그리고 도덕적인 기준이 어긋나면 그 즉시 차갑게 정이 떨어져 뒤도 돌아보지 않고 관계를 단절해 버리는 서늘한 결단력과 높은 인격적 커트라인을 굳건히 지키고 있음', '요란하게 떠벌리는 이벤트는 싫어하지만 세심한 관찰력으로 연인이 스쳐 지나가며 예쁘다고 했던 물건을 꼼꼼하게 기억했다가 기념일이 아닌 날에도 무심하게 툭 챙겨주어 감동의 눈물을 쏙 빼게 만드는 디테일한 애정 표현의 천재임', '이성을 평가하고 데이트를 채점하는 마음속 커트라인 기준이 우주를 뚫고 나갈 정도로 너무 까다로워 연인이 데이트하는 내내 면접관 앞에서 시험을 치르는 듯한 끔찍한 피로감과 압박감을 느껴 제 풀에 꺾여 도망가게 만들 위험이 큼', '다툼 시 절대로 언성을 높이거나 욕을 하진 않지만 영하 100도의 차가운 눈빛과 함께 상대방의 치명적인 논리적 허점을 바늘로 찌르듯 날카롭게 지적하여 연인의 멘탈과 자존심을 그 자리에서 갈기갈기 찢어놓는 잔인한 화법을 멈출 것', '완벽주의 성향이 데이트에도 고스란히 적용되어 식당 예약 시간 5분 지각이나 데이트 코스의 사소한 오차조차 견디지 못하고 연인을 달달 볶아 관계 자체를 숨 막히고 경직되게 만들어 낭만이라고는 1도 없는 삭막한 연애를 만들지 말 것', '타고난 신경이 유리알처럼 지나치게 예민하여 데이트 중 음식이 조금 식었거나 날씨가 우중충한 사소한 외부 요인에도 금세 짜증을 내고 화를 참지 못해 멀쩡하던 화기애애한 데이트 분위기를 순식간에 초상집으로 만들지 않도록 마인드 컨트롤할 것', '상처받는 것을 극도로 방어하느라 서운한 점이 있어도 절대 먼저 입 밖으로 꺼내지 않고 속마음을 철갑처럼 꽁꽁 숨기며 연인이 혼자 짐작하다 지쳐 떨어지게 만들어 결국 어리석은 의사소통 단절로 인한 씁쓸한 이별을 자초하지 않도록 각별히 주의'],
      '임술': ['연인의 단점이나 과거의 실수조차 꼬투리 잡지 않고 드넓은 태평양 같은 넉넉한 포용력으로 따뜻하게 껴안아 주며 있는 그대로의 모습을 사랑해 주어 상대방이 연애 내내 가장 편안하고 구원받는 듯한 깊은 심리적 안정감을 느끼게 함', '책임감이 남다르게 강하고 의리가 넘쳐 데이트 중 치한을 만나거나 연인이 경제적, 심리적으로 벼랑 끝에 몰리는 최악의 위기가 닥치더라도 절대 도망가지 않고 가장 먼저 듬직하게 몸을 던져 연인을 보호하는 완벽한 방패막이가 되어줌', '예상치 못한 데이트 코스의 휴무나 렌터카 고장 등 짜증 나는 돌발 상황에서도 절대 당황하거나 짜증 내지 않고 뛰어난 상황 대처 능력과 타고난 직관력으로 유쾌하게 문제를 해결하여 데이트의 텐션을 금세 복구시키는 기적을 보여줌', '연인을 깊이 사랑하면서도 24시간 일거수일투족을 옥죄거나 사생활을 간섭하는 구속을 극도로 혐오하여 각자의 인간관계와 커리어를 존중하고 인정해 주면서도 지킬 선은 명확히 지키는 가장 이상적이고 성숙한 형태의 자유로운 연애를 추구함', '허무맹랑한 로맨스나 낭만에만 빠져있지 않고 둘의 미래를 위한 재정 계획이나 현실적인 장벽을 꼼꼼히 계산하는 지혜로움과 현실적인 감각을 고루 갖추고 있어 한 번 사귀면 결혼까지 든든하게 믿고 의지하며 갈 수 있는 최고의 동반자임', '자신의 굳건한 평정심을 유지하느라 섭섭하거나 질투 나는 속마음을 지나치게 바다 깊숙이 감추어 버려 연인 입장에서는 이 사람이 나를 사랑해서 만나는 건지 그냥 정으로 만나는 건지 의중을 전혀 알 수 없어 극심한 외로움과 서운함을 느끼게 함', '한 번 고집이 발동하면 주변에서 아무리 논리적으로 설득해도 바위처럼 꿈쩍도 하지 않는 강한 고집 때문에 다툼 시 융통성 있게 한 발짝 물러서거나 대화로 유연하게 대처하기 어려워 답답한 벽과 싸우는 듯한 끔찍한 피로감을 유발할 수 있음', '호탕하고 긍정적인 평소 모습과 달리 스트레스를 받거나 기분이 상하면 갑자기 말수를 닫아버리고 차갑게 동굴로 숨어버리는 변덕스러운 기분 변화로 인해 연애의 안정감을 박살 내고 연인이 늘 살얼음판을 걷듯 눈치 보게 만들지 않도록 주의할 것', '상대를 챙겨주고 보호하겠다는 좋은 의도가 선을 넘어 연인의 옷차림, 직장 이직 문제, 심지어 식습관까지 사사건건 통제하고 지적하려는 지나친 간섭으로 변질되어 결국 상대의 독립성을 훼손하고 구속이라는 이름으로 숨을 조이지 않도록 명심할 것', '화가 났을 때 감정을 필터링 없이 그대로 내뱉는 다소 거칠고 직선적인 언행과 비속어 섞인 말투로 인해 평소 다정했던 이미지를 한순간에 깎아 먹고 연인의 마음에 치유 불가능한 깊은 상처를 남길 수 있으니 극한 상황에서도 반드시 입단속을 조심할 것'],
      '계해': ['연인이 굳이 말하지 않아도 스쳐 가는 눈빛이나 한숨 소리 하나만으로도 숨겨진 고민과 컨디션을 귀신같이 읽어내는 소름 돋게 예민한 직관력과 깊은 공감 능력으로 상대방의 감정선을 세상에서 가장 따뜻하게 다정하게 어루만져 주는 치유계 연인임', '사소한 다툼이나 연인의 실수 앞에서도 핏대를 세우며 따지기보다는 태평양 같이 넓은 포용력과 자비로움으로 웬만한 일은 "그럴 수 있지"라며 유연하게 웃어넘기며 포용해 주어 연애 내내 큰 소리 날 일 없이 극강의 평화로움을 유지함', '상대의 아주 미세한 감정 변화와 취향을 스캐너처럼 정확히 파악하여 기념일이 아닌 평범한 데이트 날에도 연인이 평소 가지고 싶어 했던 물건이나 먹고 싶어 했던 디저트를 무심하게 챙겨주어 폭풍 감동을 선사하는 세심한 배려의 아이콘임', '시끌벅적한 클럽이나 사람 많은 놀이공원보다는 둘만의 아지트 같은 조용한 카페나 분위기 있는 바에서 밤이 새도록 속 깊은 이야기를 나누며 정신세계와 가치관을 공유하는 깊이 있는 정서적인 교감을 연애의 가장 큰 행복이자 핵심으로 여김', '데이트 일정이 갑자기 꼬이거나 날씨가 엉망이 되어도 짜증 한 번 내지 않고 상황에 맞게 물 흐르듯 융통성 있게 대처하는 능력이 뛰어나며 어떤 환경에서도 연인이 불편하지 않도록 분위기를 부드럽게 주도하는 노련하고 센스 있는 능력을 갖춤', '상대방에게 미움받는 것을 극도로 두려워하고 다툼을 회피하려다 보니 데이트 메뉴 하나 시원하게 결정하지 못하고 "네가 좋을 대로 해"라며 우유부단하게 굴어 결국 연인이 혼자 모든 데이트를 다 책임지고 이끌어야 하는 끔찍한 피로감을 안겨줌', '연인에게 섭섭한 점이 차곡차곡 쌓여도 그 자리에서 명확하게 불만을 말하지 못하고 속마음을 철저히 숨긴 채 빙빙 돌려 말하거나 의미 없는 한숨만 푹푹 쉬어 연인으로 하여금 "대체 왜 저러지?" 하는 지독한 오해와 의사소통 단절을 가져오지 말 것', '천성이 너무 예민하여 연인이 다른 이성 동료와 웃으며 인사만 해도 머릿속으로 온갖 배신과 환승 시나리오를 쓰며 지나친 의심과 망상으로 스스로 불안감을 키워 연인에게 시도 때도 없이 확인받으려 드는 피곤한 집착과 피 말리는 행동을 멈출 것', '관계의 진전을 위해 고백을 받아주거나, 반대로 상처만 주는 연인과 이별을 결단해야 하는 가장 중요한 타이밍에도 특유의 소심하고 방어적인 태도로 질질 끌며 도망쳐 결국 두 사람 모두의 소중한 시간과 감정을 허비하게 만드는 최악의 회피를 주의할 것', '평소에는 한없이 다정하고 천사 같다가도 자신의 기분이 한 번 바닥을 치면 연인의 어떠한 위로나 애교도 다 튕겨내고 며칠씩 우울의 동굴로 파고드는 극단적이고 변덕스러운 감정 널뛰기로 상대를 당황시키고 연애를 지옥으로 만들지 않도록 철저히 감정을 다스릴 것']
    };

    const cycleNames = Object.keys(dayLove);

      const day = dayLove[name];
      const profile = revisedProfiles[name];
      return {

        outer: day[1],

    const branchPairs = {
      '자': { good: '축', distance: '오' },
      '축': { good: '자', distance: '미' },
      '인': { good: '해', distance: '신' },
      '묘': { good: '술', distance: '유' },
      '진': { good: '유', distance: '술' },
      '사': { good: '신', distance: '해' },
      '오': { good: '미', distance: '자' },
      '미': { good: '오', distance: '축' },
      '신': { good: '사', distance: '인' },
      '유': { good: '진', distance: '묘' },
      '술': { good: '묘', distance: '진' },
      '해': { good: '인', distance: '사' }
    };

    const stemElements = {
      '갑': '목', '을': '목',
      '병': '화', '정': '화',
      '무': '토', '기': '토',
      '경': '금', '신': '금',
      '임': '수', '계': '수'
    };

    const stemPairs = {
      '갑': { combine: '기', clash: '경' },
      '을': { combine: '경', clash: '신' },
      '병': { combine: '신', clash: '임' },
      '정': { combine: '임', clash: '계' },
      '무': { combine: '계', clash: null },
      '기': { combine: '갑', clash: null },
      '경': { combine: '을', clash: '갑' },
      '신': { combine: '병', clash: '을' },
      '임': { combine: '정', clash: '병' },
      '계': { combine: '무', clash: '정' }
    };

    const generatesElement = {
      '목': '화', '화': '토', '토': '금', '금': '수', '수': '목'
    };

    const controlsElement = {
      '목': '토', '토': '수', '수': '화', '화': '금', '금': '목'
    };

    const screens = [...document.querySelectorAll('.screen')];
    const startButton = document.getElementById('startButton');
    const birthForm = document.getElementById('birthForm');
    const errorMessage = document.getElementById('errorMessage');
    const yearSelect = document.getElementById('birthYear');
    const monthSelect = document.getElementById('birthMonth');
    const daySelect = document.getElementById('birthDay');
    const leapRow = document.getElementById('leapRow');
    const isLeapMonth = document.getElementById('isLeapMonth');
    const resultImage = document.getElementById('resultImage');
    const imageFallback = document.getElementById('imageFallback');
    const loadingBarFill = document.getElementById('loadingBarFill');
    let loadingTimer = null;

    function fillDateSelects() {
      const thisYear = new Date().getFullYear();
      for (let year = thisYear; year >= 1900; year--) {
        yearSelect.insertAdjacentHTML('beforeend', `<option value="${year}">${year}년</option>`);
      }
      for (let month = 1; month <= 12; month++) {
        monthSelect.insertAdjacentHTML('beforeend', `<option value="${month}">${month}월</option>`);
      }
      for (let day = 1; day <= 31; day++) {
        daySelect.insertAdjacentHTML('beforeend', `<option value="${day}">${day}일</option>`);
      }
    }

    function showScreen(targetId) {
      const current = document.querySelector('.screen.active');
      const target = document.getElementById(targetId);
      if (!current || current === target) return;
      current.classList.remove('active');
      target.classList.add('active');
    }

    function setCalendarType(type) {
      document.querySelectorAll('.calendar-tabs label').forEach(label => {
        label.classList.toggle('selected', label.querySelector('input').value === type);
      });
      leapRow.classList.toggle('show', type === 'lunar');
      if (type !== 'lunar') isLeapMonth.checked = false;
      errorMessage.textContent = '';
    }

    function validGregorianDate(year, month, day) {
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    function lunarToSolar(year, month, day, leap) {
      let formatter;
      try {
        formatter = new Intl.DateTimeFormat('en-u-ca-dangi', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          timeZone: 'Asia/Seoul'
        });
      } catch (error) {
        return null;
      }

      const start = Date.UTC(year, 0, 1, 3);
      const end = Date.UTC(year + 1, 2, 10, 3);

      for (let time = start; time <= end; time += 86400000) {
        const date = new Date(time);
        const parts = formatter.formatToParts(date);
        const relatedYearPart = parts.find(part => part.type === 'relatedYear' || part.type === 'year');
        const monthPart = parts.find(part => part.type === 'month');
        const dayPart = parts.find(part => part.type === 'day');
        if (!relatedYearPart || !monthPart || !dayPart) continue;

        const lunarYear = Number(relatedYearPart.value.replace(/[^0-9]/g, ''));
        const lunarMonth = Number(monthPart.value.replace(/[^0-9]/g, ''));
        const lunarDay = Number(dayPart.value.replace(/[^0-9]/g, ''));
        const isLeap = /bis|윤/i.test(monthPart.value);

        if (lunarYear === year && lunarMonth === month && lunarDay === day && isLeap === leap) {
          return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
        }
      }
      return null;
    }

    function gregorianJdn(year, month, day) {
      const a = Math.floor((14 - month) / 12);
      const y = year + 4800 - a;
      const m = month + 12 * a - 3;
      return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    }

    function getPillarIndex(year, month, day) {
      const jdn = gregorianJdn(year, month, day);
      return ((jdn + 49) % 60 + 60) % 60;
    }

    function getStemRelationScore(currentStem, candidateStem, type) {
      const currentElement = stemElements[currentStem];
      const candidateElement = stemElements[candidateStem];
      const candidateSupportsCurrent = generatesElement[candidateElement] === currentElement;
      const currentSupportsCandidate = generatesElement[currentElement] === candidateElement;
      const candidateControlsCurrent = controlsElement[candidateElement] === currentElement;
      const currentControlsCandidate = controlsElement[currentElement] === candidateElement;
      const sameElement = currentElement === candidateElement;

      if (type === 'good') {
        if (stemPairs[currentStem].combine === candidateStem) return 100;
        if (candidateSupportsCurrent) return 80;
        if (sameElement) return 60;
        if (currentSupportsCandidate) return 40;
        if (currentControlsCandidate) return 20;
        if (candidateControlsCurrent) return 10;
        return 0;
      }

      if (stemPairs[currentStem].clash === candidateStem) return 100;
      if (candidateControlsCurrent) return 80;
      if (currentControlsCandidate) return 70;
      if (sameElement) return 50;
      if (currentSupportsCandidate) return 30;
      if (candidateSupportsCurrent) return 20;
      return 0;
    }

    function getMatches(pillarIndex, type) {
      const currentName = cycleNames[pillarIndex];
      const currentStem = currentName.slice(0, 1);
      const currentBranch = currentName.slice(1);
      const targetBranch = branchPairs[currentBranch][type];

      return cycleNames
        .filter(name => name.slice(1) === targetBranch)
        .map(name => ({
          name,
          score: getStemRelationScore(currentStem, name.slice(0, 1), type),
          order: cycleNames.indexOf(name)
        }))
        .sort((a, b) => b.score - a.score || a.order - b.order)
        .slice(0, 2)
        .map(item => item.name);
    }

    function addMatchNames(element, names) {
      element.innerHTML = names.map(name => `<span class="match-name">${name}일주</span>`).join('');
    }

    function addDescriptionItems(element, items) {
      element.innerHTML = items.map(item => `<li>${item}</li>`).join('');
    }

    function showResult(index, nickname) {
      const data = pillars[index];
      
      document.getElementById('pillarName').textContent = `${data.name}일주`;
      document.getElementById('summaryText').textContent = data.summary;
      document.getElementById('outerText').textContent = data.outer;
      document.getElementById('innerText').textContent = data.inner;
      document.getElementById('ownerLabel').textContent = `${nickname}님의 일주`;

      addDescriptionItems(document.getElementById('personalityList'), data.personality);
      addDescriptionItems(document.getElementById('relationshipList'), data.relationship);
      addMatchNames(document.getElementById('goodMatches'), getMatches(index, 'good'));
      addMatchNames(document.getElementById('distanceMatches'), getMatches(index, 'distance'));

      imageFallback.classList.remove('show');
      imageFallback.textContent = `${data.name}일주`;
      resultImage.style.display = 'block';
      resultImage.alt = `${data.name}일주 결과 이미지`;
      resultImage.src = `img_${data.name}416.png`;

      showScreen('resultScreen');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function captureResult() {
      if (!window.html2canvas) {
        showToast('저장 기능을 불러오지 못했습니다');
        return null;
      }
      const paper = document.getElementById('resultPaper');
      const scale = Math.min(4, Math.max(3, window.devicePixelRatio || 1));
      try {
        await document.fonts.ready;
        return await html2canvas(paper, {
          scale, useCORS: true, allowTaint: false, backgroundColor: '#ffffff', logging: false, imageTimeout: 15000, scrollX: 0, scrollY: -window.scrollY
        });
      } catch (error) {
        showToast('이미지 저장 중 오류가 발생했습니다');
        return null;
      }
    }

    fillDateSelects();

    document.getElementById('mainImage').addEventListener('error', event => {
      event.currentTarget.style.display = 'none';
      document.getElementById('mainFallback').classList.add('show');
    });

    resultImage.addEventListener('error', () => {
      resultImage.style.display = 'none';
      imageFallback.classList.add('show');
    });

    startButton.addEventListener('click', () => showScreen('inputScreen'));

    document.querySelectorAll('input[name="calendarType"]').forEach(input => {
      input.addEventListener('change', () => setCalendarType(input.value));
    });

    birthForm.addEventListener('submit', event => {
      event.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const year = Number(yearSelect.value);
      const month = Number(monthSelect.value);
      const day = Number(daySelect.value);
      const calendarType = document.querySelector('input[name="calendarType"]:checked').value;

      errorMessage.textContent = '';

      if (!nickname) {
        errorMessage.textContent = '이름 또는 닉네임을 입력해주세요';
        return;
      }
      if (!year || !month || !day) {
        errorMessage.textContent = '생년월일을 모두 선택해주세요';
        return;
      }

      let solarDate;
      if (calendarType === 'solar') {
        if (!validGregorianDate(year, month, day)) {
          errorMessage.textContent = '올바른 생년월일을 선택해주세요';
          return;
        }
        solarDate = { year, month, day };
        const selected = Date.UTC(year, month - 1, day);
        const today = new Date();
        const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
        if (selected > todayUtc) {
          errorMessage.textContent = '오늘보다 이전 날짜를 선택해주세요';
          return;
        }
      } else {
        solarDate = lunarToSolar(year, month, day, isLeapMonth.checked);
        if (!solarDate) {
          errorMessage.textContent = '음력 날짜와 윤달 여부를 다시 확인해주세요';
          return;
        }
      }

      const pillarIndex = getPillarIndex(solarDate.year, solarDate.month, solarDate.day);
      showScreen('loadingScreen');
      loadingBarFill.classList.remove('run');
      void loadingBarFill.offsetWidth;
      loadingBarFill.classList.add('run');

      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(() => {
        loadingBarFill.classList.remove('run');
        showResult(pillarIndex, nickname);
      }, 3000);
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      const button = document.getElementById('saveButton');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '이미지 만드는 중...';
      const canvas = await captureResult();
      button.disabled = false;
      button.textContent = originalText;
      if (!canvas) return;
      const dataUrl = canvas.toDataURL('image/png', 1);
      document.getElementById('savePreview').src = dataUrl;
      document.getElementById('saveModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('saveModal').classList.remove('show');
      document.body.style.overflow = '';
    });

    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') {
        document.getElementById('saveModal').classList.remove('show');
        document.body.style.overflow = '';
      }
    });

    document.getElementById('retryButton').addEventListener('click', () => {
      errorMessage.textContent = '';
      showScreen('startScreen');
    });

    document.getElementById('otherButton').addEventListener('click', () => {
      location.href = 'https://test-it.co.kr/';
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
      const shareData = { title: '테스트잇 사주 책갈피 연애 테스트', text: '나의 일주별 연애 성향을 확인해보세요', url: TEST_URL };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(TEST_URL);
          showToast('링크가 복사되었습니다');
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = TEST_URL;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          showToast('링크가 복사되었습니다');
        }
      } catch (error) {
        if (error.name !== 'AbortError') showToast('공유하지 못했습니다');
      }
    });
  </script>
</body>
</html>
