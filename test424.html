        },
        "ISTJ": {
          "name": "코알라",
          "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"코알라 캐릭터\"><circle cx=\"19\" cy=\"37\" r=\"17\"/><circle cx=\"81\" cy=\"37\" r=\"17\"/><circle cx=\"19\" cy=\"37\" r=\"10\" fill=\"var(--tint)\"/><circle cx=\"81\" cy=\"37\" r=\"10\" fill=\"var(--tint)\"/><ellipse cx=\"50\" cy=\"56\" rx=\"31\" ry=\"32\"/><ellipse cx=\"50\" cy=\"61\" rx=\"7\" ry=\"11\" fill=\"#333\"/><circle cx=\"39\" cy=\"53\" r=\"2\" fill=\"#333\" stroke=\"none\"/><circle cx=\"61\" cy=\"53\" r=\"2\" fill=\"#333\" stroke=\"none\"/></svg>"
        }
      };
      const LOADING_CHARACTER = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"로딩 고양이\"><path d=\"M18 39 L20 13 L41 29 Q50 26 59 29 L80 13 L82 39 Q92 84 50 87 Q8 84 18 39 Z\"/><circle cx=\"38\" cy=\"53\" r=\"2\" fill=\"#333\" stroke=\"none\"/><circle cx=\"62\" cy=\"53\" r=\"2\" fill=\"#333\" stroke=\"none\"/><path d=\"M44 64 Q50 70 56 64\" fill=\"none\"/></svg>";
      const TITLE='테스트잇 알림장 성격 테스트';
      const TEST_URL='https://test-it.co.kr/test424';
      const $=id=>document.getElementById(id);
      let answers=[],
      index=0,
      currentType='',
      imageURL='',
      previousFocus=null;
      let loadingTimer = null;
      function show(id){
        ['start',
        'quiz',
        'loading',
        'result'].forEach(x=>$(x).hidden=x!==id);
      }
      function drawQuestion(){
        const q=QUESTIONS[index];
        $('question').textContent=q[0];
        $('answer0').textContent=q[1];
        $('answer1').textContent=q[2];
        $('count').textContent=(index+1)+' / 12';
        $('fill').style.width=(index/12*100)+'%';
        $('progress').setAttribute('aria-valuenow',
        index);
      }
      function calculate(values){
        const score={
          E:0,
          I:0,
          S:0,
          N:0,
          T:0,
          F:0,
          J:0,
          P:0
        };
        values.forEach((v,
        i)=>score[QUESTIONS[i][3+v]]++);
        return[['E',
        'I'],
        ['S',
        'N'],
        ['T',
        'F'],
        ['J',
        'P']].map(([a,
        b])=>score[a]>score[b]?a:b).join('');
      }
      function addText(parent,
      tag,
      value,
      cls){
        const el=document.createElement(tag);
        if(cls)el.className=cls;
        el.textContent=value;
        parent.appendChild(el);
        return el;
      }
      function result(){
        currentType=calculate(answers);
        const r=RESULTS[currentType];
        $('capture').style.setProperty('--tint',
        r.color);
        $('resultTitle').textContent=r.title;
        $('type').textContent=currentType;
        $('resultCharacter').innerHTML = CHARACTERS[currentType].svg.replaceAll('var(--tint)', r.color);
        $('traits').replaceChildren();
        r.traits.forEach(t=>{
          const li=document.createElement('li');
          addText(li,
          'span',
          '✓',
          'check');
          addText(li,
          'span',
          t);
          $('traits').appendChild(li);
        });
        $('strengths').replaceChildren();
        r.strengths.forEach((s,
        i)=>addText($('strengths'),
        'p',
        '0'+(i+1)+'  '+s));
        $('weaknesses').replaceChildren();
        r.weaknesses.forEach(t=>addText($('weaknesses'),
        'li',
        t));
        $('note').textContent=r.note;
        $('status').textContent='';
        show('result');
      }
      function beginLoading() {
        if (loadingTimer !== null) clearTimeout(loadingTimer);
        $('loadingPaper').style.setProperty('--tint', '#D9EDFF');
        $('loadingCharacter').innerHTML = LOADING_CHARACTER;
        $('fill').style.width = '100%';
        $('progress').setAttribute('aria-valuenow', 12);
        show('loading');
        loadingTimer = setTimeout(() => {
          loadingTimer = null;
          result();
        }, 3000);
      }

      $('startBtn').addEventListener('click',
      ()=>{
        if (loadingTimer !== null) clearTimeout(loadingTimer);
        loadingTimer = null;
        answers=[];
        index=0;
        show('quiz');
        drawQuestion();
      });
      [0,
      1].forEach(v=>$('answer'+v).addEventListener('click',
      ()=>{
        if($('quiz').hidden)return;
        answers[index]=v;
        if(index===11){
          beginLoading();
        }
        else{
          index++;
          drawQuestion();
        }
      }));
      $('retryBtn').addEventListener('click',
      ()=>{
        if (loadingTimer !== null) clearTimeout(loadingTimer);
        loadingTimer = null;
        answers=[];
        index=0;
        currentType='';
        show('start');
      });
      async function copyLink(){
        try{
          await navigator.clipboard.writeText(TITLE + '\n' + TEST_URL);
          $('status').textContent='테스트 제목과 주소를 복사했어요.';
        }
        catch(e){
          window.prompt('테스트 제목과 주소를 복사해 주세요.',
          TITLE + '\n' + TEST_URL);
        }
      }
      $('shareBtn').addEventListener('click',
      async()=>{
        if(navigator.share){
          try{
            await navigator.share({
              title:TITLE,
              text:TITLE,
              url:TEST_URL
            });
          }
          catch(e){
            if(e.name!=='AbortError')await copyLink();
          }
        }
        else await copyLink();
      });
      $('saveBtn').addEventListener('click',
      async()=>{
        const btn=$('saveBtn');
        btn.disabled=true;
        try{
          if(!window.html2canvas)throw Error('capture unavailable');
          if(document.fonts)await document.fonts.ready;
          const canvas=await html2canvas($('capture'),
          {
            scale:3,
            backgroundColor:'#ffffff',
            useCORS:true,
            logging:false
          });
          const blob=await new Promise(resolve=>canvas.toBlob(resolve,
          'image/png'));
          if(!blob)throw Error('empty image');
          if(imageURL)URLGlobal.revokeObjectURL(imageURL);
          imageURL=URLGlobal.createObjectURL(blob);
          $('savedImage').src=imageURL;


          previousFocus=document.activeElement;
          $('saveModal').hidden=false;
          $('closeModal').focus();
        }
        catch(e){
          $('status').textContent='이미지 저장 기능을 불러오지 못했어요. 잠시 후 다시 눌러주세요.';
        }
        finally{
          btn.disabled=false;
        }
      });
      const URLGlobal=window.URL;
      function closeModal(){
        $('saveModal').hidden=true;
        if(previousFocus)previousFocus.focus();
      }
      $('closeModal').addEventListener('click',
      closeModal);
      $('saveModal').addEventListener('click',
      e=>{
        if(e.target===$('saveModal'))closeModal();
      });
      document.addEventListener('keydown',
      e=>{
        if($('saveModal').hidden)return;
        if(e.key==='Escape')closeModal();
        if(e.key === 'Tab') {
          e.preventDefault();
          $('closeModal').focus();
        }
      });
    </script>
