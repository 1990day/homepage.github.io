    function showScreen(target) {

    function resetScore() {
      currentIndex = 0;
      score = {
        E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0
      };
    }

    function startTest() {
      resetScore();
      showScreen(questionScreen);
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[currentIndex];

      currentQuestionEl.textContent = currentIndex + 1;
      progressFill.style.width = (((currentIndex + 1) / questions.length) * 100) + '%';
      questionText.innerHTML = question.text;

      answersWrap.innerHTML = '';

      question.answers.forEach(function(answer) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-btn';
        button.innerHTML = answer.text;
        button.onclick = function() {
          selectAnswer(answer.letter);
        };
        answersWrap.appendChild(button);
      });
    }

    function selectAnswer(letter) {
      score[letter] += 1;
      currentIndex += 1;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        calculateResult();
      }
    }

    function calculateResult() {
      const mbti =
        (score.E >= score.I ? 'E' : 'I') +
        (score.S >= score.N ? 'S' : 'N') +
        (score.T >= score.F ? 'T' : 'F') +
        (score.J >= score.P ? 'J' : 'P');

      showScreen(loadingScreen);

      loadingFill.classList.remove('run');
      void loadingFill.offsetWidth;
      loadingFill.classList.add('run');

      setTimeout(function() {
        showResult(mbti);
      }, 3000);
    }

    function showResult(mbti) {
      const result = results[mbti];

      resultName.textContent = result.item;
      goodFriend.innerHTML = '<span class="friend-item-line">' + friendMatch[mbti].good1 + '</span><span class="friend-item-line">' + friendMatch[mbti].good2 + '</span>';
      badFriend.innerHTML = '<span class="friend-item-line">' + friendMatch[mbti].bad1 + '</span><span class="friend-item-line">' + friendMatch[mbti].bad2 + '</span>';
      resultIcon.textContent = result.icon;
      resultTraits.innerHTML = '';

      result.traits.forEach(function(text) {
        const cell = document.createElement('div');
        cell.className = 'bingo-cell';
        cell.textContent = text;
        resultTraits.appendChild(cell);
      });

      resultImage.classList.add('hidden');
      resultIcon.style.display = 'block';

      resultImage.onload = function() {
        resultImage.classList.remove('hidden');
        resultIcon.style.display = 'none';
      };

      resultImage.onerror = function() {
        resultImage.classList.add('hidden');
        resultIcon.style.display = 'block';
      };

      resultImage.src = result.image;
      showScreen(resultScreen);
    }

      }
    }

    saveModalClose.addEventListener('click', function() {
      saveModal.classList.remove('show');
      saveModal.setAttribute('aria-hidden', 'true');
    });

    saveModal.addEventListener('click', function(event) {
      if (event.target === saveModal) {
        saveModal.classList.remove('show');
        saveModal.setAttribute('aria-hidden', 'true');
      }
    });

    saveBtn.addEventListener('click', async function() {
      if (typeof html2canvas === 'undefined') {
        alert('이미지 저장 기능을 불러오지 못했습니다.');
        return;
      }

      try {
        const canvas = await html2canvas(resultCapture, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#fff7c9'
        });

        const dataUrl = canvas.toDataURL('image/png');

        savePreviewImage.src = dataUrl;
        saveModal.classList.add('show');
        saveModal.setAttribute('aria-hidden', 'false');
      } catch (error) {
        console.error(error);
        alert('이미지 저장 중 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
