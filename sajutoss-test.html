
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정통사주 주문 테스트</title>
</head>
<body>
  <h2>정통사주 주문 생성 테스트</h2>
  <p>실제 결제는 진행되지 않습니다.</p>

  <button id="testButton" onclick="createTestOrder()">
    테스트 주문 생성하기
  </button>

  <pre id="result"></pre>

  <script>
    // 기존에 사용하던 Apps Script 웹 앱 /exec 주소
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwNo04OutnyZoy6LxzCBXn0ApxfUELXrYm03NJpLABqBmCTPG1R2Nwcw_Xjs6an-oFTMA/exec";

    async function createTestOrder() {
      const button = document.getElementById("testButton");
      const result = document.getElementById("result");

      button.disabled = true;
      result.textContent = "주문 생성 요청 중...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "createOrder",
            productId: "saju01",
            user: {
              name: "테스트고객",
              gender: "여성",
              birth: "1995-01-01",
              birthType: "양력",
              time: "모름",
              email: "test@example.com"
            }
          })
        });

        const data = await response.json();

        if (data.result !== "success") {
          throw new Error(data.message || "주문 생성 실패");
        }

        result.textContent =
          "주문 생성 성공!\n\n" +
          "주문번호: " + data.orderId + "\n" +
          "상품명: " + data.productName + "\n" +
          "금액: " + data.amount + "원";

      } catch (error) {
        result.textContent = "오류: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
