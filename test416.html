      bottom: 25px;

      padding: 10px 15px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;

      '병신': ['재치 있는 말솜씨와 남다른 유머 감각으로 연애 내내 지루할 틈을 주지 않고 다방면에 재능이 많아 데이트가 풍성함', '낯을 가리지 않는 극강의 사교성으로 데이트 분위기를 쾌활하게 이끌며 연인의 지인들에게도 싹싹하게 매우 잘함', '갑자기 차가 막히거나 식당이 닫는 상황에서도 스트레스받지 않고 임기응변을 발휘해 다른 재밌는 코스로 유연하게 대처함', '호기심이 넘치고 열정적이어서 주말마다 집에 있기보다는 핫플레이스 탐방이나 새로운 액티비티를 찾아 나서는 만남을 선호함', '자신의 감정에 솔직하고 뒤끝이 없어 다툼이 끝난 후에는 미련 없이 털어버리고 다시 시원시원하게 애정 표현을 퍼부음', '데이트 상대의 말을 끝까지 듣기 전에 성급하게 판단하고 자신의 생각대로만 넘겨짚어 큰 오해를 낳지 않도록 극도로 주의', '초반의 불타는 애정이 금방 식어버리는 부족한 인내심 탓에 권태기가 빨리 오고 마무리와 맺고 끊음이 확실하지 않아 답답함', '자신의 감정 기복이 표정에 필터 없이 그대로 드러나 롤러코스터 같은 분위기를 만들어 연인이 항상 눈치 보게 만들지 말 것', '천성이 다정하고 유쾌해 여러 이성 친구들에게도 과하게 친절을 베풀어 연인에게 극심한 질투와 불안감이라는 오해를 삼', '연애의 진지하고 무거운 미래 이야기를 해야 할 순간에도 진지함 없이 가벼운 농담으로만 회피하여 신뢰감을 떨어뜨리지 말 것'],
      '정유': ['섬세한 미적 감각을 지녀 데이트 코스나 선물을 고를 때 아무거나 하지 않고 깔끔하고 분위기 있는 감성적인 만남을 선호함', '연인의 아주 미세한 표정 변화나 목소리 톤만으로도 현재 기분이 어떤지 기가 막히게 읽어내어 완벽한 타이밍에 위로를 건넴', '명확하고 분명한 선을 그어두어 연락 시간이나 이성 친구 문제 등 연인 사이 지켜야 할 기본 예의를 철저하게 고수함', '평소에는 무척 다정하고 달콤한 애정 표현을 아끼지 않으면서도 한 번 정한 둘만의 원칙 앞에서는 절대 물러서지 않는 강단이 있음', '배려심이 깊어 데이트 중 동선을 짜거나 메뉴를 고를 때 연인이 가장 편안하고 기분 좋게 즐길 수 있도록 세심하게 판을 깔아줌', '연인에 대한 질투심과 소유욕이 평균 이상으로 강해 연락이 조금만 안 되어도 꼬치꼬치 캐묻고 집착하여 상대를 숨 막히게 만듦', '다툴 때 감정적으로 욕하기보다는 팩트를 기반으로 날카롭고 차갑게 정곡을 찔러 연인의 자존심에 평생 남을 상처를 남기지 말 것', '이상형의 기준이 비현실적으로 까다로워 연인의 작은 단점 하나만 발견해도 정이 뚝 떨어져 상대방을 끊임없이 평가하는 태도 주의', '천성이 너무 예민하여 데이트 중 덥거나 춥거나 음식이 맛없는 사소한 상황에도 극도로 신경질을 부려 데이트 분위기를 박살 내지 말 것', '직접적으로 서운하다 말하지 않고 빙빙 돌려 말하며 연인이 알아서 기어주길 바라는 피곤하고 수동적인 소통 방식을 가장 조심할 것'],
      '무술': ['가벼운 썸이나 단기 연애를 극도로 싫어하며 한 번 만나면 결혼까지 염두에 둘 정도로 연인에 대한 책임감이 무척 강하고 듬직함', '한 번 맺은 인연은 절대 배신하지 않는 굳건한 의리를 지녔으며 연인이 힘든 상황에 처하면 물불 가리지 않고 진지하게 지켜냄', '연애의 외적인 조건이나 화려함보다는 서로간의 명예와 신의를 중요하게 여기며 한 입 가지고 두말하지 않는 무거운 신뢰감을 줌', '충동적인 여행이나 지출보다는 미래를 위한 저축과 안정적인 데이트 패턴을 차곡차곡 쌓아가며 현실적인 굳건한 기반을 다져나감', '연인이 웬만한 짜증을 부리거나 억지를 써도 화내지 않고 넓은 포용력으로 묵묵히 받아주며 곁을 굳건하게 지키는 바위 같은 존재임', '자신의 가치관이 너무 굳건한 나머지 다툼 시 절대 타협하지 않는 꽉 막힌 황소고집을 부려 연인과 대화가 벽에 막히는 상황이 빈번함', '애정 표현이 너무 메말라 있고 무뚝뚝하여 데이트 내내 연인이 "나를 사랑하긴 하는 걸까?"라는 심각한 오해와 외로움을 느끼게 만듦', '늘 가던 식당, 늘 가던 카페만 고집하는 융통성 제로의 성향 탓에 데이트가 너무 단조롭고 설렘이 없어져 권태기를 유발하기 십상임', '본인이 무조건 맞다는 똥고집과 자존심을 무쓸모하게 앞세워 명백히 자신이 잘못했음에도 불구하고 절대 먼저 화해의 손길을 내밀지 않음', '연인의 섬세한 감정 호소나 낭만적인 이벤트를 쓸데없는 짓으로 치부하며 감정선을 무참히 밟아버리는 무심한 행동을 가장 주의할 것'],
      '기해': ['상황에 따라 데이트 코스를 바꾸거나 연인의 변덕스러운 요구에도 화내지 않고 물 흐르듯 유연하고 부드럽게 대처하는 센스가 탁월함', '포용력이 넓고 마음이 따뜻하여 연인이 데이트 중 실수하거나 짜증을 부려도 날카롭게 지적하지 않고 너그러운 마음으로 다 받아줌', '세심한 관찰력으로 연인의 식성, 취향, 옷차림을 모두 기억해두었다가 꼭 필요한 순간에 다정하게 챙겨주는 섬세한 애정 표현에 능함', '갈등과 언성을 높이는 싸움을 극도로 싫어해 웬만하면 자신이 참고 맞춰주며 늘 조용하고 평화로운 안정적인 연애를 유지하려 노력함', '직관력이 발달해 눈빛만 봐도 연인이 지금 피곤한지 즐거운지 기분을 기가 막히게 파악하고 그에 맞춰 행동을 조절하는 능력이 좋음', '다툼을 피하려다 보니 매사에 우유부단하여 점심 메뉴 하나 시원하게 정하지 못해 답답함을 유발하고 중요한 결정을 내리지 못함', '상대를 100% 믿지 못하고 틈만 나면 핸드폰 검사를 하거나 연락에 집착하며 의심의 싹을 틔워 스스로 불안감을 키우는 습관을 버릴 것', '기분 나쁜 일이 있어도 겉으론 웃고 속으로 썩히다가 속마음을 명확히 표현하지 않아 연인은 전혀 영문도 모른 채 큰 오해를 낳게 됨', '데이트를 리드하거나 관계의 진전을 이끌어야 할 때 소심하고 방어적인 태도로 일관하여 연애가 제자리에 머무는 소극성을 고칠 것', '주변 환경이나 타인의 말 한마디에 지나치게 예민하게 반응하여 우울해지는 탓에 덩달아 연인까지 텐션 떨어지고 피곤하게 만들지 말 것'],
      '경자': ['사귀는 사이라도 각자의 일과 사생활의 영역을 명확히 구분하여 집착 없이 깔끔하고 쿨하게 결단력 있는 선을 유지하며 연애함', '사랑해, 서운해 같은 감정 표현을 빙빙 돌려 말하지 않고 직설적이고 솔직하게 속내를 다 털어놓아 오해 없는 투명한 소통을 추구함', '데이트 약속 시간 엄수, 바람피우지 않기 등 기본 원칙과 둘만의 규칙을 어기는 것을 극혐하며 강박적일 정도로 이를 지키려 노력함', '연인의 아주 미세한 거짓말이나 태도 변화를 단번에 잡아내는 예리하고 예민한 촉을 지녀 상대방이 허튼수작을 부릴 엄두를 못 내게 함', '자신이 선택한 연인에 대한 의리를 매우 중요하게 여겨 한 번 신뢰가 쌓이면 어떤 유혹이 와도 흔들리지 않고 끝까지 곁을 든든히 지킴', '싸울 때 감정보다는 팩트 폭격에 집중하여 차갑고 날 선 언행으로 연인의 자존심을 밑바닥까지 끌어내려 돌이킬 수 없는 상처를 줌', '연인의 옷차림이나 일상 습관까지 하나하나 자신의 통제하에 두고 지적하려는 성향이 억압과 집착으로 느껴지지 않도록 각별히 주의할 것', '데이트 일정이 조금만 틀어져도 융통성 없이 극도로 스트레스를 받고 화를 내어 분위기를 망치는 사소한 똥고집을 버려야 관계가 유지됨', '티끌 하나 없는 완벽주의 연애를 추구하느라 연인의 작은 단점조차 현미경으로 확대 해석하여 서로를 숨 막히고 피곤하게 만들지 말 것', '연인의 감정 섞인 위로 요청에 "그건 네가 잘못했네" 식의 직설적이고 기계적인 해결책만 들이대지 말고 말투를 다정하게 순화할 것'],
      '신축': ['시끄러운 번화가보다는 인테리어가 깔끔하고 프라이빗하게 정돈된 조용한 공간에서 밀도 높은 대화를 나누는 데이트 분위기를 몹시 중시함', '쉽게 금방 타오르는 냄비 같은 연애가 아니라 성실하고 끈기 있게 한 사람 곁에서 묵묵히 내실을 다지며 신뢰를 쌓아가는 장기 연애 특화형임', '연락 빈도나 만나는 횟수에 있어 명확한 자기 기준이 있으며 예의와 매너를 깍듯이 지켜 상대의 가족이나 지인에게 소개하기 가장 좋은 연인임', '데이트 중 발생하는 문제 상황이나 상대의 성향을 세심하고 치밀하게 분석하여 갈등이 커지기 전에 논리적으로 차분하게 상황을 진압함', '평소에는 한없이 다정하고 져주는 듯하지만 자신이 긋어 놓은 선을 연인이 넘는 순간 차갑게 돌변하여 관계를 싹둑 자르는 단호한 결단력이 있음', '이성을 고르는 기준과 데이트 매너에 대한 커트라인이 너무 까다로워 연인이 항상 시험받는 기분을 느끼게 하여 숨 막히게 할 위험이 농후함', '서운한 점이 생겨도 절대 겉으로 내색하지 않고 포커페이스를 유지하여 연인 입장에서는 진심을 알 길이 없어 답답해 미칠 지경에 이르게 됨', '다툼 시 상대방의 논리적 허점을 정확하게 찾아내어 날카롭고 비꼬는 비판으로 연인의 멘탈을 가루로 만들어버리는 잔인한 화법을 멈출 것', '한 번 화가 나거나 토라지면 절대 자신이 먼저 타협점을 찾지 않는 불도저 같은 융통성 부족과 쇠고집 때문에 사소한 싸움이 이별로 치달음', '연인에 대한 기본 베이스가 의심과 경계심으로 깔려 있어 온전히 마음을 열지 못하니 제발 쓸데없는 방어 기제를 풀고 편안하게 연애에 임할 것'],
      '임인': ['자신의 영역을 고집하기보다 넓은 포용력으로 연인의 취향과 의견을 스펀지처럼 흡수하며 얽매임 없는 자유롭고 개방적인 연애를 추구함', '집 데이트보다는 매주 새로운 지역이나 핫플레이스를 탐험하고 친구들 모임에 연인을 동반하는 사교적이고 매우 활동적인 데이트를 선호함', '어색한 썸 단계에서도 뛰어난 재치와 화려한 언변으로 대화를 주도하여 분위기를 솜사탕처럼 부드럽고 달콤하게 녹여버리는 마성이 있음', '갑자기 데이트 코스가 휴무이거나 차가 고장 나는 위기 상황에서도 당황하지 않고 재빨리 유쾌한 플랜 B를 꺼내 드는 임기응변이 뛰어남', '지혜롭고 직관력이 발달해 복잡하게 얽힌 갈등 상황에서도 상황 판단을 빠르게 마치고 서로 윈윈할 수 있는 명쾌한 타협점을 아주 잘 찾아냄', '평소엔 수다스럽지만 자신이 불리한 진짜 속마음이나 상처는 철저히 감추어 연인이 볼 때 진정성 없고 일관성 없는 가벼운 태도로 보일 수 있음', '진지하게 두 사람의 미래를 상의하거나 잘못을 책임져야 하는 무거운 상황이 오면 농담으로 회피하고 쏙 빠져나가려는 무책임한 습관을 버릴 것', '아침엔 사랑이 넘치다 저녁엔 갑자기 시큰둥해지는 변덕스러운 감정 널뛰기 탓에 연인이 눈치를 보며 연애의 심리적 안정감을 박살 내지 말 것', '호기심이 뻗쳐 취미나 친구 모임 등 다른 여러 가지에 관심을 쏟느라 정작 연인과의 데이트나 연락에는 집중력이 현저히 떨어지는 것을 주의할 것', '자신의 쿨한 연애 방식만 고집하다 보니 정작 칭얼거리고 기대고 싶어 하는 연인의 세심한 감정선을 무심하게 방치하는 큰 실수를 저지르지 말 것'],
      '계묘': ['말 한마디도 예쁘게 포장해서 건네는 다정하고 부드러운 태도로 팍팍한 일상에 지친 연인의 마음을 사르르 녹여주며 세심하게 배려함', '마치 독심술사처럼 예민한 감각 안테나를 세우고 있어 연인의 미세한 표정 변화나 한숨만으로도 기분을 단번에 눈치채고 맞춤형 애교를 부림', '싸워서 이기기보다는 평화를 지키는 것이 100배 낫다고 여기며 언성을 높이는 갈등 자체를 극도로 혐오하여 평화로운 관계 유지를 최우선으로 함', '비싼 선물이나 화려한 이벤트보다 둘만의 조용한 공간에서 손을 잡고 속 깊은 대화를 나누는 섬세한 정서적 교감과 안정감을 데이트의 핵심으로 샘', '예상치 못한 데이트 변수가 생겨도 화를 내지 않고 유연하게 상황에 대처하며 연인이 당황하지 않도록 부드럽게 마찰을 흡수하는 완충제 역할을 함', '연인에 대해 지나치게 집착하고 상상의 나래를 펴 잊을 만하면 바람피우는 거 아니냐며 의심하여 서로의 멘탈을 갉아먹는 피곤한 행동을 당장 멈출 것', '연인의 사소한 지적이나 농담에도 세상 무너진 것처럼 상처받고 며칠씩 꽁해있는 과도한 예민함으로 데이트 분위기를 지옥으로 만들지 않도록 주의', '데이트 메뉴 고를 때 매번 "난 다 좋아, 네가 골라"라며 우유부단하게 미루어 연인이 혼자 멱살 잡고 연애를 이끄는 듯한 억울함을 느끼게 하지 말 것', '서운한 게 생기면 그때그때 말하지 않고 보살처럼 참기만 하다가 엉뚱한 날 돌연 이별을 통보하거나 화산처럼 분노를 터뜨려 상대를 아연실색하게 함', '남들이 우리 커플을 어떻게 볼까 하는 타인의 평가와 시선에 지나치게 얽매여 둘만의 온전하고 행복한 관계를 망치고 본질을 잃어버리는 우를 범하지 말 것'],
      '갑진': ['썸 단계의 미적지근함을 견디지 못하고 주도적이고 폭발적인 추진력으로 단숨에 데이트 약속을 잡고 확고한 연인 관계로 밀어붙이는 돌격대장임', '눈앞의 짧은 즐거움보다는 두 사람의 직업, 미래, 결혼 등 묵직하고 현실적인 감각이 뛰어나 관계의 뼈대를 매우 튼튼하고 안정적으로 설계함', '연인이 힘든 일에 처하면 자신이 직접 팔을 걷어붙이고 나서서 듬직하게 방어막을 쳐주는 가장 책임감 있고 의지하기 좋은 보호자 같은 태도를 보임', '뒤에서 호박씨 까거나 돌려 말하는 밀당 따위는 질색하며 솔직하고 당당하게 "나는 네가 좋다"고 겉과 속이 똑같은 투명한 애정 표현을 퍼부음', '아무리 큰 시련이나 주변의 반대가 있어도 자신이 선택한 연인을 굳건하게 보호하며 넉넉한 포용력으로 품고 직진하는 상남자/상여자 스타일임', '자존심이 하늘을 찔러 싸움이 났을 때 자신이 명백히 틀렸어도 절대 굽히거나 먼저 미안하다고 타협하지 않아 연애가 피 말리는 기싸움으로 변질됨', '연인의 데이트 시간, 옷차림, 심지어 진로까지 챙겨준다는 명목하에 통제하려는 지나친 지배욕으로 상대에게 구속과 억압의 감옥을 만들지 않도록 주의', '감정을 몽글몽글하게 어루만져야 할 타이밍에 군대 조교처럼 무뚝뚝하고 뼈 때리는 직설적인 화법을 던져 연인의 눈물샘을 터뜨리지 않도록 입단속 할 것', '데이트 코스를 정할 때 무조건 자신의 취향과 동선만이 가장 완벽한 정답이라고 맹신하여 연인의 소소한 취향 제안을 번번이 깔아뭉개지 말 것', '가끔은 즉흥적인 여행이나 소소한 일탈도 필요한데 융통성 없이 너무 꽉 막힌 루틴만 고집하여 데이트 방식이 군대 행군처럼 경직되고 지루해질 수 있음'],
      '을사': ['사교계의 여우처럼 능수능란하고 부드러운 태도로 첫 데이트부터 상대의 철벽을 가볍게 허물고 친밀한 관계로 훅 치고 들어가는 친화력의 끝판왕임', '데이트 중 예기치 못한 사고나 꼬이는 상황이 발생해도 당황은커녕 빛보다 빠른 상황 판단과 임기응변으로 위기를 로맨틱한 기회로 둔갑시킴', '사랑의 감정에만 눈이 멀어 퍼주기보다는 데이트 비용의 분담이나 서로 간의 조건 등 현실적이고 실용적인 관점을 결코 놓치지 않는 냉철함이 공존함', '유들유들하게 연인의 기분을 한껏 맞춰주면서도 결정적인 순간에는 교묘하게 자신의 이익과 원하는 데이트 코스를 다 챙기는 똑똑한 여우 같은 면모를 뽐냄', '만나면 항상 웃음이 끊이지 않게 대화를 주도하며 긍정적이고 밝은 에너지로 텐션을 팍팍 올려주어 데이트 내내 지루할 틈이 없는 최고의 엔터테이너임', '오전에는 천사였다가 오후에는 돌연 짜증을 내는 롤러코스터 급의 심한 감정 기복 탓에 연인이 데이트 내내 폭탄 제거반처럼 당신의 눈치만 보게 만듦', '속마음은 철저히 숨긴 채 겉보기엔 맞춰주는 척 철저히 계산적으로 행동하다가 연인에게 진정성이 1도 없는 비즈니스 연애라는 치명적인 오해를 살 수 있음', '상대의 성향을 제대로 파악하기도 전에 성급하게 금방 썸을 끝내고 사귀었다가 생각과 다르면 가차 없이 뒤돌아버려 짧은 연애만 반복하는 실수를 주의', '쉽게 끓어오른 만큼 쉽게 식어버려 연애의 깊이가 깊어지기도 전에 짜릿하고 새로운 다른 자극을 찾아 환승이나 이별을 고민하는 가벼운 태도를 뜯어고칠 것', '연인에 대한 기본 탑재값이 의심이어서 카톡 답장 늦는 1분을 못 참고 꼬치꼬치 행적을 캐물어 상대를 피 말리게 하는 의부증/의처증 급의 집착을 버릴 것'],
      '병오': ['마음에 드는 이성을 발견하면 뒤도 돌아보지 않고 직진하며 감정을 숨길 줄 모르는 매우 열정적이고 화산 폭발 같은 화끈한 애정 표현을 과시함', '답답한 썸이나 밀당을 극도로 혐오하며 불도저 같은 엄청난 추진력으로 만남부터 스킨십까지 템포 빠르게 데이트를 주도적으로 이끌어가는 상남자/상여자임', '내숭이나 가식이라고는 1도 찾아볼 수 없는 솔직하고 투명한 성격으로 뒤끝 없이 시원시원하여 연애 과정에서 최소한 음흉한 오해가 생길 일은 절대 없음', '어디를 가나 시선을 즐기고 자신감이 넘치며 특유의 리더십으로 연인의 사소한 일상까지 듬직하게 끌어안고 리드하는 매력적인 마초/걸크러쉬 스타일임', '매번 똑같은 카페나 영화관 데이트는 질색하며 스포츠, 야외 활동, 대형 이벤트 등 에너지가 넘치고 스케일이 크며 화끈한 동적인 만남을 몹시 선호함', '욱하는 성질과 분노 조절 실패로 데이트 중 사소한 말다툼이 길거리 대판 싸움으로 번져 순간의 감정에 이별을 내뱉고 뼈저리게 후회하는 패턴을 매우 조심', '데이트 장소부터 식사 메뉴까지 연인의 의견은 묵살하고 오직 기분 내키는 대로 독단적으로 결정하고 끌고 다녀 상대를 수동적인 인형으로 만들지 말 것', '본인의 불타는 감정 속도를 상대가 못 맞춰주거나 조금만 미적지근한 반응을 보이면 인내심을 잃고 홧김에 이별을 통보하는 최악의 조급함을 버릴 것', '연인에 대한 지나친 소유욕과 독점욕으로 상대의 인간관계 싹을 다 잘라버리려 들고 24시간 연락을 강요하여 숨 막히는 감옥 같은 연애를 만들지 않도록 주의', '화가 났을 때 브레이크 고장 난 트럭처럼 필터 없이 쏟아내는 거칠고 공격적인 말투는 연인의 마음에 씻을 수 없는 큰 상처를 주니 의식적으로 입을 닫고 순화할 것'],
      '정미': ['거창하고 소란스러운 이벤트보다는 섬세하고 다정한 배려로 연인의 아주 작고 사소한 일상까지 놓치지 않고 챙겨주는 보호자 같은 따뜻한 연애를 지향함', '한번 사랑을 시작하면 쉽게 흔들리지 않고 끈기 있고 묵묵하게 성실한 태도로 곁을 지켜주어 연인에게 하늘이 두 쪽 나도 내 편이라는 굳건한 신뢰를 줌', '기가 막힐 정도로 예민한 직관력을 타고나 연인이 말없이 한숨만 쉬어도 지금 기분이 어떤지 단박에 파악하고 맞춤형 위로를 건네는 독심술사 같은 능력을 보임', '핫하고 번잡한 데이트 장소보다는 조명 온도가 따뜻하고 조용히 손을 잡고 둘만의 오붓한 감정을 나눌 수 있는 포근한 분위기의 데이트 공간을 훨씬 사랑함', '가벼운 썸이나 자극적인 단기 연애는 시간 낭비라 여기며 훗날까지 함께 그릴 수 있는 안정적이고 지속적인 깊은 관계 유지를 연애의 가장 핵심 가치로 삼음', '속으로는 사랑하면서도 겉으로는 상대의 일거수일투족에 지나친 질투심과 소유욕의 촉을 세워 연인에게 피곤하고 집착하는 사람이라는 인상을 심어주지 말 것', '데이트 중 서운한 포인트가 있어도 그 자리에서 쿨하게 말하지 못하고 속으로만 음침하게 불만을 쌓아두다 엉뚱한 날 시한폭탄처럼 폭발하는 최악의 버릇을 고칠 것', '자신만의 단단한 가치관과 똥고집이 있어 다툼이 났을 때 상대가 논리적으로 설득해도 끝까지 자기 의견만 우기고 타협점을 절대 찾지 않는 꽉 막힌 태도를 주의', '타고난 예민함이 부정적으로 폭발하면 데이트 중 음식 맛이 조금만 없거나 온도가 안 맞아도 온갖 짜증과 과민 반응을 쏟아내 데이트 분위기를 지옥으로 만들지 말 것', '내심 상대를 열렬히 사랑하면서도 자존심과 소심함 때문에 애정 표현과 스킨십에 인색하게 굴어 연인이 나만 너를 짝사랑하는 것 아니냐는 치명적인 오해를 사지 말 것'],

    const birthForm = document.getElementById('birthForm');
    const errorMessage = document.getElementById('errorMessage');
    const yearSelect = document.getElementById('birthYear');
    const monthSelect = document.getElementById('birthMonth');
    const daySelect = document.getElementById('birthDay');
    const leapRow = document.getElementById('leapRow');
    const isLeapMonth = document.getElementById('isLeapMonth');
    const resultImage = document.getElementById('resultImage');
    const imageFallback = document.getElementById('imageFallback');
    const loadingBarFill = document.getElementById('loadingBarFill');
    let loadingTimer = null;

    function fillDateSelects() {
      const thisYear = new Date().getFullYear();
      for (let year = thisYear; year >= 1900; year--) {
        yearSelect.insertAdjacentHTML('beforeend', `<option value="${year}">${year}년</option>`);
      }
      for (let month = 1; month <= 12; month++) {
        monthSelect.insertAdjacentHTML('beforeend', `<option value="${month}">${month}월</option>`);
      }
      for (let day = 1; day <= 31; day++) {
        daySelect.insertAdjacentHTML('beforeend', `<option value="${day}">${day}일</option>`);
      }
    }

    function showScreen(targetId) {
      const current = document.querySelector('.screen.active');
      const target = document.getElementById(targetId);
      if (!current || current === target) return;
      current.classList.remove('active');
      target.classList.add('active');
    }

    function setCalendarType(type) {
      document.querySelectorAll('.calendar-tabs label').forEach(label => {
        label.classList.toggle('selected', label.querySelector('input').value === type);
      });
      leapRow.classList.toggle('show', type === 'lunar');
      if (type !== 'lunar') isLeapMonth.checked = false;
      errorMessage.textContent = '';
    }

    function validGregorianDate(year, month, day) {
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    function lunarToSolar(year, month, day, leap) {
      let formatter;
      try {
        formatter = new Intl.DateTimeFormat('en-u-ca-dangi', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          timeZone: 'Asia/Seoul'
        });
      } catch (error) {
        return null;
      }

      const start = Date.UTC(year, 0, 1, 3);
      const end = Date.UTC(year + 1, 2, 10, 3);

      for (let time = start; time <= end; time += 86400000) {
        const date = new Date(time);
        const parts = formatter.formatToParts(date);
        const relatedYearPart = parts.find(part => part.type === 'relatedYear' || part.type === 'year');
        const monthPart = parts.find(part => part.type === 'month');
        const dayPart = parts.find(part => part.type === 'day');
        if (!relatedYearPart || !monthPart || !dayPart) continue;

        const lunarYear = Number(relatedYearPart.value.replace(/[^0-9]/g, ''));
        const lunarMonth = Number(monthPart.value.replace(/[^0-9]/g, ''));
        const lunarDay = Number(dayPart.value.replace(/[^0-9]/g, ''));
        const isLeap = /bis|윤/i.test(monthPart.value);

        if (lunarYear === year && lunarMonth === month && lunarDay === day && isLeap === leap) {
          return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
        }
      }
      return null;
    }

    function gregorianJdn(year, month, day) {
      const a = Math.floor((14 - month) / 12);
      const y = year + 4800 - a;
      const m = month + 12 * a - 3;
      return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    }

    function getPillarIndex(year, month, day) {
      const jdn = gregorianJdn(year, month, day);
      return ((jdn + 49) % 60 + 60) % 60;
    }

    function getStemRelationScore(currentStem, candidateStem, type) {
      const currentElement = stemElements[currentStem];
      const candidateElement = stemElements[candidateStem];
      const candidateSupportsCurrent = generatesElement[candidateElement] === currentElement;
      const currentSupportsCandidate = generatesElement[currentElement] === candidateElement;
      const candidateControlsCurrent = controlsElement[candidateElement] === currentElement;
      const currentControlsCandidate = controlsElement[currentElement] === candidateElement;
      const sameElement = currentElement === candidateElement;

      if (type === 'good') {
        if (stemPairs[currentStem].combine === candidateStem) return 100;
        if (candidateSupportsCurrent) return 80;
        if (sameElement) return 60;
        if (currentSupportsCandidate) return 40;
        if (currentControlsCandidate) return 20;
        if (candidateControlsCurrent) return 10;
        return 0;
      }

      if (stemPairs[currentStem].clash === candidateStem) return 100;
      if (candidateControlsCurrent) return 80;
      if (currentControlsCandidate) return 70;
      if (sameElement) return 50;
      if (currentSupportsCandidate) return 30;
      if (candidateSupportsCurrent) return 20;
      return 0;
    }

    function getMatches(pillarIndex, type) {
      const currentName = cycleNames[pillarIndex];
      const currentStem = currentName.slice(0, 1);
      const currentBranch = currentName.slice(1);
      const targetBranch = branchPairs[currentBranch][type];

      return cycleNames
        .filter(name => name.slice(1) === targetBranch)
        .map(name => ({
          name,
          score: getStemRelationScore(currentStem, name.slice(0, 1), type),
          order: cycleNames.indexOf(name)
        }))
        .sort((a, b) => b.score - a.score || a.order - b.order)
        .slice(0, 2)
        .map(item => item.name);
    }

    function addMatchNames(element, names) {
      element.innerHTML = names.map(name => `<span class="match-name">${name}일주</span>`).join('');
    }

    function addDescriptionItems(element, items) {
      element.innerHTML = items.map(item => `<li>${item}</li>`).join('');
    }

    function showResult(index, nickname) {
      const data = pillars[index];
      
      document.getElementById('pillarName').textContent = `${data.name}일주`;
      document.getElementById('summaryText').textContent = data.summary;
      document.getElementById('outerText').textContent = data.outer;
      document.getElementById('innerText').textContent = data.inner;
      document.getElementById('ownerLabel').textContent = `${nickname}님의 일주`;

      addDescriptionItems(document.getElementById('personalityList'), data.personality);
      addDescriptionItems(document.getElementById('relationshipList'), data.relationship);
      addMatchNames(document.getElementById('goodMatches'), getMatches(index, 'good'));
      addMatchNames(document.getElementById('distanceMatches'), getMatches(index, 'distance'));

      imageFallback.classList.remove('show');
      imageFallback.textContent = `${data.name}일주`;
      resultImage.style.display = 'block';
      resultImage.alt = `${data.name}일주 결과 이미지`;
      resultImage.src = `img_${data.name}416.png`;

      showScreen('resultScreen');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function captureResult() {
      if (!window.html2canvas) {
        showToast('저장 기능을 불러오지 못했습니다');
        return null;
      }
      const paper = document.getElementById('resultPaper');
      const scale = Math.min(4, Math.max(3, window.devicePixelRatio || 1));
      try {
        await document.fonts.ready;
        return await html2canvas(paper, {
          scale, useCORS: true, allowTaint: false, backgroundColor: '#ffffff', logging: false, imageTimeout: 15000, scrollX: 0, scrollY: -window.scrollY
        });
      } catch (error) {
        showToast('이미지 저장 중 오류가 발생했습니다');
        return null;
      }
    }

    fillDateSelects();

    document.getElementById('mainImage').addEventListener('error', event => {
      event.currentTarget.style.display = 'none';
      document.getElementById('mainFallback').classList.add('show');
    });

    resultImage.addEventListener('error', () => {
      resultImage.style.display = 'none';
      imageFallback.classList.add('show');
    });

    startButton.addEventListener('click', () => showScreen('inputScreen'));

    document.querySelectorAll('input[name="calendarType"]').forEach(input => {
      input.addEventListener('change', () => setCalendarType(input.value));
    });

    birthForm.addEventListener('submit', event => {
      event.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const year = Number(yearSelect.value);
      const month = Number(monthSelect.value);
      const day = Number(daySelect.value);
      const calendarType = document.querySelector('input[name="calendarType"]:checked').value;

      errorMessage.textContent = '';

      if (!nickname) {
        errorMessage.textContent = '이름 또는 닉네임을 입력해주세요';
        return;
      }
      if (!year || !month || !day) {
        errorMessage.textContent = '생년월일을 모두 선택해주세요';
        return;
      }

      let solarDate;
      if (calendarType === 'solar') {
        if (!validGregorianDate(year, month, day)) {
          errorMessage.textContent = '올바른 생년월일을 선택해주세요';
          return;
        }
        solarDate = { year, month, day };
        const selected = Date.UTC(year, month - 1, day);
        const today = new Date();
        const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
        if (selected > todayUtc) {
          errorMessage.textContent = '오늘보다 이전 날짜를 선택해주세요';
          return;
        }
      } else {
        solarDate = lunarToSolar(year, month, day, isLeapMonth.checked);
        if (!solarDate) {
          errorMessage.textContent = '음력 날짜와 윤달 여부를 다시 확인해주세요';
          return;
        }
      }

      const pillarIndex = getPillarIndex(solarDate.year, solarDate.month, solarDate.day);
      showScreen('loadingScreen');
      loadingBarFill.classList.remove('run');
      void loadingBarFill.offsetWidth;
      loadingBarFill.classList.add('run');

      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(() => {
        loadingBarFill.classList.remove('run');
        showResult(pillarIndex, nickname);
      }, 3000);
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      const button = document.getElementById('saveButton');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '이미지 만드는 중...';
      const canvas = await captureResult();
      button.disabled = false;
      button.textContent = originalText;
      if (!canvas) return;
      const dataUrl = canvas.toDataURL('image/png', 1);
      document.getElementById('savePreview').src = dataUrl;
      document.getElementById('saveModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('saveModal').classList.remove('show');
      document.body.style.overflow = '';
    });

    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') {
        document.getElementById('saveModal').classList.remove('show');
        document.body.style.overflow = '';
      }
    });

    document.getElementById('retryButton').addEventListener('click', () => {
      errorMessage.textContent = '';
      showScreen('startScreen');
    });

    document.getElementById('otherButton').addEventListener('click', () => {
      location.href = 'https://test-it.co.kr/';
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
      const shareData = { title: '테스트잇 사주 책갈피 연애 테스트', text: '나의 일주별 연애 성향을 확인해보세요', url: TEST_URL };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(TEST_URL);
          showToast('링크가 복사되었습니다');
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = TEST_URL;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          showToast('링크가 복사되었습니다');
        }
      } catch (error) {
        if (error.name !== 'AbortError') showToast('공유하지 못했습니다');
      }
    });
  </script>
</body>
</html>
