<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="나와 가장 닮은 가을 아이템을 알아보는 테스트잇 가을 아이템 성격 테스트">
  <meta property="og:title" content="테스트잇 가을 아이템 성격 테스트">
  <meta property="og:description" content="나와 가장 닮은 가을 아이템은 무엇일까?">
  <meta property="og:image" content="https://test-it.co.kr/img_main415.png">
  <title>테스트잇 가을 아이템 성격 테스트</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://ads-partners.coupang.com/g.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #f8f3e8;
      color: #3e2b20;
      font-family: "Galmuri14", "Galmuri11", sans-serif;
      letter-spacing: -0.4px;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .site-header {
      width: 100%;
      height: 58px;
      background: #fffdf8;
      border-bottom: 1px solid #cbbba5;
    }

    .header-inner {
      width: min(100%, 600px);
      height: 100%;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #4b3326;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .nav a {
      color: #594438;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .app {
      width: min(100%, 560px);
      min-height: calc(100vh - 58px);
      margin: 0 auto;
      padding: 22px 14px 50px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .main-card {
      width: 100%;
      padding: 0;
      background: transparent;
      border: 0;
    }

    .main-image {
      display: block;
      width: 100%;
      height: auto;
      background: transparent;
    }

    .primary-btn,
    .action-btn {
      width: 100%;
      min-height: 52px;
      border: 1px solid #6f4b34;
      border-radius: 0;
      font-weight: 700;
    }

    .primary-btn {
      margin-top: 14px;
      background: #6f4b34;
      color: #fffdf8;
      font-size: 16px;
    }

    .primary-btn:active,
    .action-btn:active,
    .answer-btn:active {
      transform: translateY(1px);
    }

    .ad-area {
      width: 350px;
      max-width: 100%;
      min-height: 140px;
      margin: 22px auto 0;
      overflow: hidden;
      text-align: center;
    }

    .coupang-ad {
      width: 350px;
      max-width: 100%;
      min-height: 140px;
      margin: 0 auto;
      overflow: hidden;
    }

    .question-wrap {
      padding-top: 5px;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #765d4c;
      font-size: 12px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      margin-bottom: 38px;
      background: #e5d7c3;
      border: 1px solid #aa9078;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #b45d3d;
      transition: width 0.2s ease;
    }

    .question-number {
      margin-bottom: 12px;
      color: #b45d3d;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .question-text {
      min-height: 76px;
      margin: 0 0 25px;
      font-size: 19px;
      line-height: 1.65;
      text-align: center;
      word-break: keep-all;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      width: 100%;
      min-height: 74px;
      padding: 16px 18px;
      background: #fffdf8;
      color: #3e2b20;
      border: 1px solid #8c6e58;
      border-radius: 0;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      word-break: keep-all;
    }

    .answer-btn.selected {
      background: #ead7ba;
      border-color: #6f4b34;
    }

    .loading-box {
      padding-top: 150px;
      text-align: center;
    }

    .leaf-loader {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 0 auto 26px;
      animation: spin 1.5s linear infinite;
    }

    .leaf-loader span {
      position: absolute;
      width: 25px;
      height: 16px;
      background: #bc6a42;
      border: 1px solid #704833;
      border-radius: 85% 12% 85% 12%;
    }

    .leaf-loader span:nth-child(1) {
      top: 3px;
      left: 17px;
      transform: rotate(45deg);
    }

    .leaf-loader span:nth-child(2) {
      top: 27px;
      left: 3px;
      background: #d49c45;
      transform: rotate(145deg);
    }

    .leaf-loader span:nth-child(3) {
      top: 30px;
      right: 2px;
      background: #8c7c45;
      transform: rotate(245deg);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .loading-text {
      margin: 0;
      color: #765d4c;
      font-size: 13px;
      line-height: 1.7;
    }

    .capture-card {
      position: relative;
      width: 100%;
      padding: 0 20px 20px;
      background: #fffdf8;
      border: 2px solid #5b2c20;
    }

    .test-title-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(100% + 40px);
      min-height: 60px;
      margin: 0 -20px 22px;
      padding: 10px 32px;
      color: #4c3428;
      background: #f1e4cf;
      border-bottom: 2px solid #5b2c20;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      letter-spacing: 1.2px;
    }

    .test-title-box::before,
    .test-title-box::after {
      position: absolute;
      top: 50%;
      width: auto;
      height: auto;
      background: transparent;
      border: 0;
      font-size: 12px;
      line-height: 1;
      transform: translateY(-50%);
    }

    .test-title-box::before {
      content: "🍁";
      left: 15px;
    }

    .test-title-box::after {
      content: "🍂";
      right: 15px;
    }

    .result-label {
      position: relative;
      z-index: 1;
      margin: 0 0 8px;
      color: #8b6a52;
      font-size: 12px;
      text-align: center;
    }

    .result-name {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #542f20;
      font-size: 25px;
      line-height: 1.35;
      text-align: center;
    }

    .result-image-wrap {
      position: relative;
      z-index: 1;
      width: 46%;
      max-width: 190px;
      margin: 16px auto 21px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      overflow: visible;
    }

    .result-image {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .result-summary {
      position: relative;
      z-index: 1;
      margin: 0 0 18px;
      padding: 13px 12px;
      background: #f1e4cf;
      color: #523a2c;
      border: 2px solid #d0b18d;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
      word-break: keep-all;
    }

    .section-title {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 19px 0 11px;
      padding: 0;
      color: #6a3f2c;
      background: transparent;
      border: 0;
      font-size: 14px;
      letter-spacing: 0.7px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      width: auto;
      height: 2px;
      flex: 1;
      background: #bd855d;
      border: 0;
    }

    .trait-list {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
      list-style: none;
    }

    .trait-list li {
      position: relative;
      margin: 0 0 8px;
      padding: 0 2px 0 17px;
      color: #463229;
      border-bottom: 0;
      font-size: 13px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .trait-list li::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 3px;
      width: 5px;
      height: 5px;
      background: #d9572d;
      border: 1px solid #6b2c20;
    }

    .match-box {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      border: 2px solid #6b3426;
      overflow: hidden;
    }

    .match-item {
      min-width: 0;
      padding: 13px 8px;
      background: #e9ecd0;
      text-align: center;
    }

    .match-item:nth-child(2) {
      background: #f7dfcf;
    }

    .match-item + .match-item {
      border-left: 2px solid #6b3426;
    }

    .match-item span {
      display: block;
      margin-bottom: 6px;
      color: #8b6a52;
      font-size: 10px;
    }

    .match-item strong {
      font-size: 13px;
    }

    .capture-footer {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      padding-top: 10px;
      color: #957965;
      border-top: 2px solid #d5ad83;
      font-size: 9px;
      text-align: center;
      letter-spacing: 1.2px;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .action-btn {
      background: #fffdf8;
      color: #533827;
      font-size: 14px;
    }

    .action-btn.save {
      background: #6f4b34;
      color: #fffdf8;
    }

    .save-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(35, 25, 19, 0.7);
    }

    .save-modal.open {
      display: flex;
    }

    .save-modal-box {
      width: min(100%, 370px);
      max-height: 92vh;
      padding: 14px;
      background: #fffdf8;
      border: 1px solid #51392b;
      overflow-y: auto;
    }

    .save-guide {
      margin: 2px 0 11px;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .saved-preview {
      display: block;
      width: min(100%, 300px);
      height: auto;
      margin: 0 auto;
      border: 1px solid #b9a38b;
    }

    .modal-close {
      width: 100%;
      height: 46px;
      margin-top: 10px;
      background: #6f4b34;
      color: #fff;
      border: 0;
      border-radius: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10000;
      display: none;
      padding: 11px 15px;
      background: #3e2b20;
      color: #fff;
      font-size: 12px;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 420px) {
      .nav { gap: 9px; }
      .nav a { font-size: 14px; }
      .app { padding-left: 12px; padding-right: 12px; }
      .capture-card { padding: 0 15px 18px; }
      .test-title-box {
        width: calc(100% + 30px);
        margin-right: -15px;
        margin-left: -15px;
      }
      .result-name { font-size: 23px; }
      .result-image-wrap { width: 48%; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="https://test-it.co.kr/">테스트잇</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="https://test-it.co.kr/category/personality">성격</a>
        <a href="https://test-it.co.kr/category/face">얼굴</a>
        <a href="https://test-it.co.kr/category/etc">그외</a>
        <a href="https://test-it.co.kr/category/saju">사주</a>
      </nav>
    </div>
  </header>

  <main class="app">
    <section id="mainScreen" class="screen active">
      <div class="main-card">
        <img class="main-image" src="img_main415.png" alt="테스트잇 가을 아이템 성격 테스트 메인 이미지">
      </div>
      <button id="startBtn" class="primary-btn" type="button">테스트 시작하기</button>

      <div class="ad-area">
        <article class="coupang-ad">
          <script>
            new PartnersCoupang.G({"id":798186,"template":"carousel","trackingCode":"AF4391881","width":"350","height":"140","tsource":""});
          </script>
        </article>
      </div>
    </section>

    <section id="questionScreen" class="screen">
      <div class="question-wrap">
        <div class="progress-info">
          <span>가을 아이템을 찾는 중</span>
          <span id="progressText">1 / 12</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="questionNumber" class="question-number">Q1</div>
        <h2 id="questionText" class="question-text"></h2>
        <div id="answers" class="answers"></div>
      </div>

      <div class="ad-area">
        <article class="coupang-ad">
          <script>
            new PartnersCoupang.G({"id":798186,"template":"carousel","trackingCode":"AF4391881","width":"350","height":"140","tsource":""});
          </script>
        </article>
      </div>
    </section>

    <section id="loadingScreen" class="screen">
      <div class="loading-box">
        <div class="leaf-loader" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <h2 class="loading-title">가을 아이템을 찾고 있어요</h2>
        <p class="loading-text">선택한 답변을 하나씩 살펴보는 중입니다.</p>
      </div>

      <div class="ad-area">
        <article class="coupang-ad">
          <script>
            new PartnersCoupang.G({"id":798186,"template":"carousel","trackingCode":"AF4391881","width":"350","height":"140","tsource":""});
          </script>
        </article>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div id="captureCard" class="capture-card">
        <div class="test-title-box">테스트잇 가을 아이템 성격 테스트</div>
        <p class="result-label">나와 가장 닮은 가을 아이템은</p>
        <h1 id="resultName" class="result-name"></h1>

        <div class="result-image-wrap">
          <img id="resultImage" class="result-image" src="" alt="">
        </div>

        <p id="resultSummary" class="result-summary"></p>

        <h3 class="section-title">성격 특징</h3>
        <ul id="traitList" class="trait-list"></ul>

        <h3 class="section-title">가을 아이템 궁합</h3>
        <div class="match-box">
          <div class="match-item">
            <span>같이 있으면 편한</span>
            <strong id="goodMatch"></strong>
          </div>
          <div class="match-item">
            <span>서로 다른 매력이 있는</span>
            <strong id="differentMatch"></strong>
          </div>
        </div>

        <div class="capture-footer">테스트잇 가을 아이템 성격 테스트 / TEST415</div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="action-btn save" type="button">결과 이미지 저장하기</button>
        <button id="retryBtn" class="action-btn" type="button">다시 해보기</button>
        <button id="otherBtn" class="action-btn" type="button">다른 테스트 해보기</button>
        <button id="shareBtn" class="action-btn" type="button">테스트 공유하기</button>
      </div>

      <div class="ad-area">
        <article class="coupang-ad">
          <script>
            new PartnersCoupang.G({"id":798186,"template":"carousel","trackingCode":"AF4391881","width":"350","height":"140","tsource":""});
          </script>
        </article>
      </div>
    </section>
  </main>

  <div id="saveModal" class="save-modal" role="dialog" aria-modal="true" aria-label="결과 이미지 저장">
    <div class="save-modal-box">
      <p class="save-guide">아래 이미지를 꾹 눌러 저장해주세요.</p>
      <img id="savedPreview" class="saved-preview" src="" alt="저장할 결과 이미지">
      <button id="modalClose" class="modal-close" type="button">닫기</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const TEST_URL = "https://test-it.co.kr/test415";

    const questions = [
      {
        text: "가을맞이 원데이 클래스를 신청한다면?",
        answers: [
          { text: "여러 사람과 함께하는 단체 수업을 선택", value: "E" },
          { text: "인원이 적고 조용하게 진행되는 수업을 선택", value: "I" }
        ]
      },
      {
        text: "단풍 구경을 갈 장소를 고를 때<br>내 선택 기준은?",
        answers: [
          { text: "거리와 교통편, 실제 방문 후기", value: "S" },
          { text: "사진을 보고 가장 마음이 끌리는 장소", value: "N" }
        ]
      },
      {
        text: "친구가 정성 들여 싼<br>가을 피크닉 도시락을 먹었을 때",
        answers: [
          { text: "간이 딱 맞다, 재료가 신선하다 등<br>구체적인 맛과 퀄리티를 칭찬함", value: "T" },
          { text: "일찍 일어나서 준비하느라 힘들었겠다며<br>친구의 노고와 정성을 칭찬함", value: "F" }
        ]
      },
      {
        text: "이번 주말 일정이 통째로 비어있을 때 나는?",
        answers: [
          { text: "밀린 집안일, 장보기, 운동 등<br>주말 동안 할 일의 순서를 머릿속에 정해둠", value: "J" },
          { text: "알람 없이 푹 자고 일어나서<br>그 순간 하고 싶은 것을 함", value: "P" }
        ]
      },
      {
        text: "사람이 많은 가을 축제에 가면<br>나는 주로",
        answers: [
          { text: "여러 곳을 돌아다니며 북적이는 분위기를 즐김", value: "E" },
          { text: "보고 싶었던 곳만 둘러보고 한적한 곳으로 감", value: "I" }
        ]
      },
      {
        text: "은행이 많이 떨어진 가로수 길을 지나갈 때<br>가장 먼저 드는 생각은",
        answers: [
          { text: "아 절대 안 밟게 발밑 잘 보고 걸어야지", value: "S" },
          { text: "냄새 안 나는 나무도 많은데<br>왜 하필 은행나무를 가로수로 심었을까?", value: "N" }
        ]
      },
      {
        text: "가을 여행 코스를 짜다가<br>일행과 의견이 부딪혔을 때 나는?",
        answers: [
          { text: "각 코스의 장단점, 비용을 비교하여<br>더 효율적인 쪽을 선택함", value: "T" },
          { text: "그냥 적당히 양보하거나 절충안을 찾음", value: "F" }
        ]
      },
      {

          "복잡하고 긴 설명을 듣고 있으면 하품부터 나옴",
          "뒤끝이 전혀 없고 크게 화내도 다음 날이면 쿨하게 잊음"
        ],
        good: "코스모스",
        different: "군고구마"
      },
      ISTP: {
        name: "핑크뮬리",
        summary: "필요한 핵심을 빠르게 파악하고<br>간단하고 현실적인 방법을 선호함",
        traits: [
               "연락하는 걸 귀찮아하고 혼자 있는 시간을 제일 사랑함",
          "무슨 일이 생겨도 그럴 수 있지 하며 덤덤하게 넘김",
          "감정 낭비를 싫어해서 우울할 틈 없이 바로 잊으려 함",
          "내 바운더리 밖의 사람에게는 전혀 관심이 없음",
          "누가 내 영역을 침범하거나 간섭하는 걸 극도로 싫어함",
          "예상 밖의 상황에서도 침착하게 핵심을 파악하는 편",
"말이 짧고 팩트만 전달해서 가끔 차갑다는 소리를 들음",
          "꽂히면 끝장을 보지만 식으면 미련 없이 던져버림"
        ],
        good: "무화과",
        different: "도토리"
      }
    };

    const screens = {
      main: document.getElementById("mainScreen"),
      question: document.getElementById("questionScreen"),
      loading: document.getElementById("loadingScreen"),
      result: document.getElementById("resultScreen")
    };

    const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    let currentQuestion = 0;
    let answerLocked = false;
    let currentResultType = "";

    function showScreen(name) {
      Object.values(screens).forEach(screen => screen.classList.remove("active"));
      screens[name].classList.add("active");
    }

    function startTest() {
      currentQuestion = 0;
      answerLocked = false;
      currentResultType = "";
      Object.keys(scores).forEach(key => scores[key] = 0);
      showScreen("question");
      renderQuestion();
    }

    function renderQuestion() {
      const question = questions[currentQuestion];
      const number = currentQuestion + 1;

      document.getElementById("progressText").textContent = `${number} / ${questions.length}`;
      document.getElementById("progressBar").style.width = `${(number / questions.length) * 100}%`;
      document.getElementById("questionNumber").textContent = `Q${number}`;
      document.getElementById("questionText").innerHTML = question.text;

      const answers = document.getElementById("answers");
      answers.innerHTML = "";

      question.answers.forEach(answer => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-btn";
        button.innerHTML = answer.text;
        button.addEventListener("click", () => selectAnswer(answer.value, button));
        answers.appendChild(button);
      });
    }

    function selectAnswer(value, button) {
      if (answerLocked) return;
      answerLocked = true;
      button.classList.add("selected");
      scores[value] += 1;

      setTimeout(() => {
        currentQuestion += 1;

        if (currentQuestion < questions.length) {
          answerLocked = false;
          renderQuestion();
        } else {
          showLoading();
        }
      }, 180);
    }

    function showLoading() {
      showScreen("loading");
      setTimeout(showResult, 3000);
    }

    function calculateType() {
      return [
        scores.E > scores.I ? "E" : "I",
        scores.S > scores.N ? "S" : "N",
        scores.T > scores.F ? "T" : "F",
        scores.J > scores.P ? "J" : "P"
      ].join("");
    }

    function showResult() {
      currentResultType = calculateType();
      const result = results[currentResultType];

      document.getElementById("resultName").textContent = result.name;
      document.getElementById("resultSummary").innerHTML = result.summary;
      document.getElementById("goodMatch").textContent = result.good;
      document.getElementById("differentMatch").textContent = result.different;

      const resultImage = document.getElementById("resultImage");
      resultImage.style.display = "block";
      resultImage.src = `img_${currentResultType.toLowerCase()}415.png`;
      resultImage.alt = `${result.name} 결과 이미지`;
      resultImage.onerror = function () {
        this.style.display = "none";
      };

      const traitList = document.getElementById("traitList");
      traitList.innerHTML = "";
      result.traits.forEach(trait => {
        const li = document.createElement("li");
        li.textContent = trait;
        traitList.appendChild(li);
      });

      showScreen("result");
    }

    async function saveResult() {
      const saveBtn = document.getElementById("saveBtn");
      const originalText = saveBtn.textContent;
      saveBtn.disabled = true;
      saveBtn.textContent = "이미지 만드는 중...";

      try {
        const canvas = await html2canvas(document.getElementById("captureCard"), {
          scale: 3,
          useCORS: true,
          backgroundColor: "#fffdf8",
          logging: false
        });

        const imageUrl = canvas.toDataURL("image/png", 1);
        document.getElementById("savedPreview").src = imageUrl;
        document.getElementById("saveModal").classList.add("open");
      } catch (error) {
        showToast("이미지를 만들지 못했어요. 다시 시도해주세요.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    }

    async function shareTest() {
      const resultName = currentResultType ? results[currentResultType].name : "";
      const shareData = {
        title: "테스트잇 가을 아이템 성격 테스트",
        text: resultName
          ? `나의 가을 아이템은 ${resultName}! 나와 닮은 가을 아이템을 확인해봐!`
          : "나와 가장 닮은 가을 아이템을 확인해봐!",
        url: TEST_URL
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(TEST_URL);
          showToast("테스트 주소를 복사했어요.");
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          fallbackCopy(TEST_URL);
        }
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast("테스트 주소를 복사했어요.");
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    document.getElementById("startBtn").addEventListener("click", startTest);
    document.getElementById("retryBtn").addEventListener("click", () => showScreen("main"));
    document.getElementById("otherBtn").addEventListener("click", () => {
      location.href = "https://test-it.co.kr/";
    });
    document.getElementById("shareBtn").addEventListener("click", shareTest);
    document.getElementById("saveBtn").addEventListener("click", saveResult);
    document.getElementById("modalClose").addEventListener("click", () => {
      document.getElementById("saveModal").classList.remove("open");
    });
    document.getElementById("saveModal").addEventListener("click", event => {
      if (event.target.id === "saveModal") {
        event.currentTarget.classList.remove("open");
      }
    });
  </script>
</body>
</html>
