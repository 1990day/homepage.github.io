  <meta name="theme-color" content="#fff3dc">
  <meta property="og:type" content="website">
  <meta property="og:title" content="테스트잇 2027년 신년운세 보고서 테스트">

  <style>
    @font-face {
      font-family: 'DeltaDotum';
      src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2611112258@deltadotumkr/deltadotumkr/DeltaDotumKR.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme:light;
      --cream:#fffcf3; --linen:#fff3dc; --ink:#17261c; --muted:#49382f;
      --pine:#08774e; --red:#e32a2e; --line:#e7bd77;
      --font:"DeltaDotum","Malgun Gothic","맑은 고딕",sans-serif;
    }
    *,*::before,*::after { box-sizing:border-box; }
    [hidden] { display:none!important; }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    body { margin:0; background:var(--linen); color:var(--ink); font:400 20px/32px var(--font); font-synthesis:none; letter-spacing:0; word-break:keep-all; overflow-wrap:anywhere; }
    h1,h2,h3,h4,p,ul { margin:0; }
    h1,h2,h3,h4,strong,b { font-weight:400; }
    a { color:inherit; text-decoration:none; }
    button,select,input { color:inherit; font:inherit; letter-spacing:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    :focus-visible { outline:2px solid #a82c35; outline-offset:3px; }
    .site-header { background:var(--cream); border-bottom:1px solid #f4d3a2; }
    .header-inner { width:min(100% - 26px,748px); min-height:53px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .header-inner nav { display:flex; gap:16px; align-items:center; }
    main { width:min(100% - 26px,748px); margin:26px auto 44px; }

    .greeting-cover {
      background:#e72527; border:1px solid #c81b24;
    }
    .greeting-title { container-type:inline-size; min-width:0; padding:13px 5px 11px; }
    .project-title {
      width:100%; text-align:center; text-wrap:balance; color:var(--ink); letter-spacing:0;
      font-size:20px; line-height:30px;
    }
    .greeting-cover .project-title { color:#fffbea; }
    .greeting-main { position:relative; isolation:isolate; }
    .cover-craft { display:block; width:100%; height:auto; }
    .cover-year {
      position:absolute; top:3%; inset-inline:0; text-align:center; color:#fff6cf;
      font:400 80px/80px var(--font); letter-spacing:0; white-space:nowrap;
    }
    .cover-side { background:#e72527; padding:7px 10px 10px; }
    .cover-side .action.primary {
      min-height:45px; background:#ffdf67; color:#62262a; border-color:#e7ad34;
    }
    .cover-side .action.primary:hover { background:#ffeb9a; }
    .action {
      min-height:46px; width:100%; display:grid; place-items:center; padding:7px 9px; text-align:center;
      border:1px solid #d9aa6b; background:var(--cream); font-size:20px;
    }
    .action:hover { background:#fff0bf; }
    .action.primary { background:var(--pine); color:#fffdf1; border-color:#076746; }
    .action.primary:hover { background:#076746; }

    .envelope {
      max-width:484px; margin:auto; padding:9px; border:1px solid #eab14e; background:#ffe389;
      box-shadow:4px 5px #f9d881;
    }
    .envelope-header {
      position:relative; min-height:73px; display:grid; align-items:center; padding:15px 15px 17px;
      background:#fff0a7; border:1px solid #f1ce72; overflow:hidden;
    }
    .envelope-header::before {
      content:""; position:absolute; inset:0; background:#ffd15d;
      clip-path:polygon(0 0,100% 0,50% 93%);
    }
    .envelope-header h2 { position:relative; color:#652323; font-size:20px; line-height:28px; }
    .envelope form { margin-top:6px; padding:14px 12px 10px; border:1px solid #efd297; background:var(--cream); }
    fieldset { min-width:0; border:0; padding:0; margin:0 0 13px; }
    legend,.field-label { display:block; margin:0 0 5px; }
    .choices,.date-fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    .choices.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .choices label { position:relative; min-width:0; }
    .choices input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
    .choices span,select { min-height:43px; border:1px solid #e8cd91; background:#fffdf6; }
    .choices span { display:grid; place-items:center; text-align:center; padding:3px; line-height:26px; }
    .choices input:checked + span { background:#e1f7e4; border-color:#6caf80; color:#156543; }
    .choices input:focus-visible + span { outline:2px solid var(--pine); outline-offset:2px; }
    select { width:100%; padding:7px 5px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .form-end { display:grid; gap:7px; margin-top:14px; }
    .form-error { color:#96372d; }
    .quiet { padding:4px 8px; border:0; background:none; justify-self:center; text-decoration:underline; text-underline-offset:3px; color:var(--muted); }

    .greeting-report {
      background:#fff9e8; padding:12px; border:1px solid #edba78;
    }
    .report-masthead { color:#fff5dc; background:#d8272c; border:1px solid #c9222b; padding:11px 4px; margin-bottom:11px; }
    .report-masthead .project-title { color:inherit; }
    #report-content { display:grid; gap:11px; }
    .lead-card {
      display:grid; grid-template-columns:minmax(0,1fr) 88px; align-items:center; gap:8px;
      padding:13px 12px;
      background:#ffe487; border:1px solid #eeb23c; color:#5f271e;
    }
    .section-title { font-size:20px; line-height:28px; }
    .overview-theme { margin-top:5px; font-size:20px; line-height:30px; }
    .lead-art { display:block; height:67px; width:88px; object-fit:contain; }
    .chart-card { background:#fffaf0; border:1px solid #e6b775; padding:10px; }
    .chart-heading { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:start; gap:5px; color:var(--pine); }
    .saju-badge { flex:none; padding:1px 5px; background:#dcf4db; font-size:20px; }
    .saju-me-line,.saju-note-sub { margin-top:6px; }
    .pillars-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; margin:8px 0; }
    .pillar-box { display:grid; text-align:center; padding:4px 2px; border:1px solid #f0d28a; background:#fff4d1; }
    .pillar-box.is-me { background:#ffe1e2; border-color:#eea4a8; }
    .pillar-label,.pillar-el,.el-caption,.saju-note-sub { font-size:20px; }
    .pillar-han { color:var(--pine); }
    .el-bars { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; }
    .el-item { min-width:0; font-size:20px; }
    .el-bar-track { height:5px; background:#f7e6c0; }
    .el-bar-fill { height:100%; background:#8b7fb3; }
    .el-bar-fill.el-wood { background:#729263; }
    .el-bar-fill.el-fire { background:#bb614d; }
    .el-bar-fill.el-earth { background:#b8873e; }
    .el-bar-fill.el-metal { background:#8e928c; }
    .el-bar-fill.el-water { background:#617e8b; }
    .el-caption { margin-top:6px; color:var(--muted); }

    .story-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .story-card {
      min-width:0; display:flex; flex-direction:column; background:#fffaf0; border:1px solid var(--card-edge,#b4a180);
    }
    .story-card:nth-child(1) { --card:#ffdb69; --card-edge:#efbd47; --card-text:#67311e; }
    .story-card:nth-child(2) { --card:#ffe7a8; --card-edge:#efc772; --card-text:#633322; }
    .story-card:nth-child(3) { --card:#d6f2de; --card-edge:#9ed5ad; --card-text:#245841; }
    .story-card:nth-child(4) { --card:#ffd7da; --card-edge:#eea6af; --card-text:#872e38; }
    .story-card:nth-child(5) { --card:#dff2d0; --card-edge:#b3d894; --card-text:#31543a; }
    .story-card:nth-child(6) { --card:#ffe6a0; --card-edge:#f0bf65; --card-text:#725023; }
    .story-front {
      display:grid; grid-template-columns:minmax(0,1fr) minmax(54px,38%); align-items:center; min-height:108px;
      gap:4px; padding:9px; background:var(--card); color:var(--card-text); border-bottom:1px solid var(--card-edge);
    }
    .story-front h4 { font-size:20px; line-height:28px; }
    .story-art { display:block; width:min(100%,106px); height:82px; object-fit:contain; justify-self:center; }
    .story-copy { font-size:20px; padding:12px; line-height:32px; }
    .story-card:first-child,.story-card:last-child { display:grid; grid-column:1/-1; grid-template-columns:minmax(155px,31%) minmax(0,1fr); }
    .story-card:is(:first-child,:last-child) .story-front { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); align-content:start; border-bottom:0; border-right:1px solid var(--card-edge); }
    .story-card:is(:first-child,:last-child) .story-art { height:91px; }
    .forecast-marker { color:inherit; padding:0 1px; background:#f7e3a4; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
    .forecast-underline { text-decoration:underline; text-decoration-color:#a94a3c; text-underline-offset:.17em; }
    .note-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .small-note { padding:11px 9px; border:1px solid #9fcda4; border-top:5px solid #158959; background:#e9f7d9; }
    .small-note.caution { border-color:#f3ada8; border-top-color:#df2931; background:#ffe5e2; }
    .luck-list,.caution-list { list-style:none; display:grid; gap:3px; padding:4px 0 0; }
    .luck-list { display:flex; flex-wrap:wrap; gap:4px; }
    .luck-list li { border:1px solid #b6b99d; background:#fffaf0; padding:0 5px; }
    .caution-list li { position:relative; padding-left:10px; }
    .caution-list li::before { content:""; position:absolute; left:1px; top:.69em; width:4px; height:4px; background:#a94a3c; }

    .result-actions { max-width:440px; display:grid; gap:7px; margin:13px auto 0; }
    .action-status { text-align:center; color:var(--muted); }
    .ad-slot { width:350px; max-width:100%; margin:16px auto 0; display:flex; justify-content:center; overflow:hidden; }
    .ad-slot iframe { display:block; margin:auto; }
    dialog { width:min(100% - 28px,420px); max-height:calc(100% - 24px); background:var(--cream); color:var(--ink); border:1px solid #a98a63; padding:9px; text-align:center; overflow:auto; }
    dialog::backdrop { background:#252920a0; }
    dialog p { margin-bottom:7px; }
    dialog img { display:block; margin:0 auto 8px; max-width:100%; max-height:62vh; max-height:62dvh; object-fit:contain; -webkit-touch-callout:default; }
    dialog input { width:100%; margin-bottom:8px; padding:5px; border:1px solid var(--line); }
    @media(min-width:640px) {
      .project-title { font-size:40px; line-height:52px; }
    }
    @media(max-width:560px) {
      main { width:calc(100% - 16px); margin-top:13px; }
      .header-inner nav { gap:9px; }
      .greeting-report { padding:7px; }
      .greeting-title { padding:9px 3px 7px; }
      .cover-year { font-size:40px; line-height:40px; }
      .cover-side { padding:5px 7px 7px; }
      .report-masthead { margin-bottom:8px; padding:8px 3px; }
      #report-content { gap:8px; }
      .lead-card { padding:9px 8px; grid-template-columns:minmax(0,1fr) 54px; }
      .lead-art { width:54px; height:54px; }
      .story-grid { grid-template-columns:1fr; gap:8px; }
      .story-card:first-child,.story-card:last-child { display:flex; }
      .story-front,.story-card:is(:first-child,:last-child) .story-front {
        min-height:79px; grid-template-columns:minmax(0,1fr) 77px; grid-template-rows:auto;
        border-right:0; border-bottom:1px solid var(--card-edge); padding:7px 8px;
      }
      .story-art,.story-card:is(:first-child,:last-child) .story-art { height:62px; width:73px; }
    }
    @media(max-width:360px) {
      .header-inner { width:calc(100% - 17px); }
      .header-inner nav { gap:7px; }
      .pillars-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .note-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;

          return NineStar.fromIndex(offset - 1);

              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);

          var start = offset[this.getDayZhiIndex() % 3];

          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

  <script>
  'use strict';
  // 한국 표준시(UTC+9) 기준 만세력 엔진.
  // 24절기(입춘·월절기)는 UTC+8 기준 라이브러리(lunar-javascript)에 -60분 보정해 KST 정확 시점을 사용하며,
  // 00:00~01:29(조자시)와 23:30~23:59(야자시)를 분리해 한국 정통 야자시법(당일 일주 + 익일 자시 천간)으로 계산합니다.
const STEMS = '甲乙丙丁戊己庚辛壬癸';
const KOREAN_STEMS = '갑을병정무기경신임계';
const BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
const KOREAN_BRANCHES = '자축인묘진사오미신유술해';
const ELEMENTS = ['목','화','토','금','수'];
const ELEMENT_KO = ['나무','불','흙','쇠','물'];
const ELEMENT_CLASS = ['el-wood','el-fire','el-earth','el-metal','el-water'];
// 지지별 지장간 [본기, 중기/여기, 여기] 순서 (본기 비중 최우선)
const HIDDEN_STEMS = ['癸','己癸辛','甲丙戊','乙','戊乙癸','丙庚戊','丁己','己丁乙','庚壬戊','辛','戊辛丁','壬甲'];
const BRANCH_ELEMENT = [4,2,0,0,2,1,1,2,3,3,2,4];
const LIFE_AREAS = [
  '주변 사람과 오래된 인맥',
  '직장·학교·사회생활',
  '연애·결혼·가까운 일상',
  '미래 계획과 장기 목표'
];
const HOUR_SLOTS = [
  { label: '00:00~01:29 조자시(새벽)', branch: 0, midpoint: 45, yajasi: false },
  { label: '01:30~03:29 축시', branch: 1, midpoint: 150, yajasi: false },
  { label: '03:30~05:29 인시', branch: 2, midpoint: 270, yajasi: false },
  { label: '05:30~07:29 묘시', branch: 3, midpoint: 390, yajasi: false },
  { label: '07:30~09:29 진시', branch: 4, midpoint: 510, yajasi: false },
  { label: '09:30~11:29 사시', branch: 5, midpoint: 630, yajasi: false },
  { label: '11:30~13:29 오시', branch: 6, midpoint: 750, yajasi: false },
  { label: '13:30~15:29 미시', branch: 7, midpoint: 870, yajasi: false },
  { label: '15:30~17:29 신시', branch: 8, midpoint: 990, yajasi: false },
  { label: '17:30~19:29 유시', branch: 9, midpoint: 1110, yajasi: false },
  { label: '19:30~21:29 술시', branch: 10, midpoint: 1230, yajasi: false },
  { label: '21:30~23:29 해시', branch: 11, midpoint: 1350, yajasi: false },
  { label: '23:30~23:59 야자시(밤)', branch: 0, midpoint: 1425, yajasi: true }
];
const MINUTE = 60000;
const ANNUAL = '丁未'; // 2027년 정미년 (붉은 양의 해: 따뜻한 불 丁 + 마른 흙 未)
const wrap = (n, size) => (n % size + size) % size;
const element = stem => Math.floor(STEMS.indexOf(stem) / 2);
const dateAt = (y,m,d,h=0,min=0,s=0) => new Date(Date.UTC(y,m-1,d,h,min,s));
const julianHour = date => Solar.fromYmdHms(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),
  date.getUTCHours(),date.getUTCMinutes(),date.getUTCSeconds());
const fromSolar = solar => dateAt(solar.getYear(),solar.getMonth(),solar.getDay(),solar.getHour(),solar.getMinute(),solar.getSecond());

function ganjiToKo(pillar) {
  if (!pillar) return '미입력';
  const s = STEMS.indexOf(pillar[0]);
  const b = BRANCHES.indexOf(pillar[1]);
  return KOREAN_STEMS[s] + KOREAN_BRANCHES[b];
}

function pillarElementLabel(pillar) {
  if (!pillar) return '시간 모름';
  const sEl = ELEMENT_KO[element(pillar[0])];
  const bEl = ELEMENT_KO[BRANCH_ELEMENT[BRANCHES.indexOf(pillar[1])]];
  return `${sEl}·${bEl}`;
}

// 10일간(나를 대표하는 타고난 기운) 쉬운 설명 + 2027 정미년 인생 전반 총운
const DAY_MASTER_INFO = {
  甲: {
    nick: '곧게 뻗은 큰 나무',

function tenGod(dayStem, targetStem) {
  const samePolarity = STEMS.indexOf(dayStem) % 2 === STEMS.indexOf(targetStem) % 2;
  const groups = [['비견','겁재'],['식신','상관'],['편재','정재'],['편관','정관'],['편인','정인']];
  return groups[wrap(element(targetStem)-element(dayStem),5)][samePolarity ? 0 : 1];
}

function setKoreanLunarDate(converter,y,m,d,calendar) {
  const leap = calendar === 'leap';
  return converter.setLunarDate(y,m,d,leap) && converter.getLunarCalendar().intercalation === leap;
}

function yangDate(y,m,d,calendar) {
  if (calendar === 'solar') {
    const date = dateAt(y,m,d);
    if (date.getUTCMonth() !== m-1 || date.getUTCDate() !== d) throw new Error('생년월일을 다시 확인해 주세요.');
    return date;
  }
  const lunar = new KoreanLunarCalendar();
  if (!setKoreanLunarDate(lunar,y,m,d,calendar)) throw new Error('선택한 음력 날짜가 없어요. 날짜와 윤달 여부를 확인해 주세요.');
  const converted = lunar.getSolarCalendar();
  return dateAt(converted.year,converted.month,converted.day);
}

function calendarPillars(civil) {
  const termClock = julianHour(new Date(civil.getTime()-60*MINUTE)).getLunar();
  const civilSolar = Solar.fromYmd(civil.getUTCFullYear(),civil.getUTCMonth()+1,civil.getUTCDate());
  return {
    year: termClock.getYearInGanZhiExact(),
    month: termClock.getMonthInGanZhiExact(),
    day: civilSolar.getLunar().getDayInGanZhi(),
    termClock
  };
}

function makeChart(date, hourIndex) {
  const slot = hourIndex === null ? null : HOUR_SLOTS[hourIndex];
  const rangeMidpoint = slot ? slot.midpoint : 12*60;
  const civil = new Date(date.getTime() + rangeMidpoint*MINUTE);
  const mid = calendarPillars(civil);
  let time = null;
  if (slot) {
    const baseDayIdx = STEMS.indexOf(mid.day[0]) + (slot.yajasi ? 1 : 0);
    time = STEMS[(baseDayIdx * 2 + slot.branch) % 10] + BRANCHES[slot.branch];
  }
  return {
    civil,
    hour: hourIndex,
    pillars: [mid.year, mid.month, mid.day, time],
    day: mid.day[0],
    termClock: mid.termClock
  };
}

// 오행 분포 + 내 힘의 세기(신강/중화/신약) + 2027 정미년(화·토) 온도 궁합 정밀 계산
function elementProfile(chart) {
  const weights = [0,0,0,0,0];
  const counts = [0,0,0,0,0];
  chart.pillars.forEach((pillar, index) => {
    if (!pillar) return;
    const stemEl = element(pillar[0]);
    const branchIdx = BRANCHES.indexOf(pillar[1]);
    const branchEl = BRANCH_ELEMENT[branchIdx];
    counts[stemEl] += 1;
    counts[branchEl] += 1;
    weights[stemEl] += [0.9, 1.15, 1.0, 0.9][index];
    Array.from(HIDDEN_STEMS[branchIdx]).forEach((stem, slot) => {
      weights[element(stem)] += [1.0, 0.45, 0.22][slot] * [1.0, 1.8, 1.3, 0.9][index];
    });
  });

  const own = element(chart.day);
  const resource = wrap(own - 1, 5);
  const extWeights = [...weights];
  extWeights[own] -= 1.0;
  const extTotal = extWeights.reduce((a,b) => a + b, 0) || 1;
  const support = (extWeights[own] + extWeights[resource]) / extTotal;

  const totalWeight = weights.reduce((a,b) => a + b, 0) || 1;
  const ratios = weights.map(w => w / totalWeight);

  let strength = 'balanced';
  let strengthLabel = '힘의 균형이 좋은 편';
  if (support >= 0.54) {
    strength = 'strong';
    strengthLabel = '내 힘이 강한 편 (주도형)';
  } else if (support < 0.41) {
    strength = 'weak';
    strengthLabel = '주변 도움이 힘이 되는 편 (신중형)';
  }

  const fireEarthShare = ratios[1] + ratios[2];
  const waterMetalShare = ratios[3] + ratios[4];
  let climate = 'balanced';
  if (fireEarthShare >= 0.52) climate = 'hot';
  else if (ratios[1] < 0.12 && (waterMetalShare >= 0.45 || ratios[4] >= 0.25)) climate = 'cool';

  let minEl = 0;
  let maxEl = 0;
  for (let i = 1; i < 5; i++) {
    if (weights[i] < weights[minEl]) minEl = i;
    if (weights[i] > weights[maxEl]) maxEl = i;
  }

  return { weights, counts, ratios, support, strength, strengthLabel, climate, minEl, maxEl };
}

// 2027 정미년(丁未)과 내 사주 4기둥의 합·충·형·원진·삼합/반합 정밀 계산 (중복 감점 제거)
function connections(incoming, chart) {
  const inStem = incoming[0];
  const inBranch = incoming[1];
  const branches = chart.pillars.filter(Boolean).map(p => p[1]);
  const ties = [];

  chart.pillars.forEach((pillar, index) => {
    if (!pillar) return;
    const pStem = pillar[0];
    const pBranch = pillar[1];
    const posWeight = [0.8, 1.2, 1.3, 0.75][index];

    if ((inStem === '丁' && pStem === '壬') || (inStem === '壬' && pStem === '丁')) {
      ties.push({ name: '천간합', kind: 'good', value: 1.1 * posWeight, index });
    } else if ((inStem === '丁' && pStem === '癸') || (inStem === '癸' && pStem === '丁')) {
      ties.push({ name: '천간충', kind: 'change', value: -0.85 * posWeight, index });
    }

    if (inBranch === '未') {
      if (pBranch === '午') {
        ties.push({ name: '육합', kind: 'good', value: 1.65 * posWeight, index });
      } else if (pBranch === '丑') {
        ties.push({ name: '충', kind: 'change', value: -1.75 * posWeight, index });
      } else if (pBranch === '戌') {
        ties.push({ name: '형', kind: 'caution', value: -1.05 * posWeight, index });
      } else if (pBranch === '子') {
        ties.push({ name: '원진해', kind: 'caution', value: -0.85 * posWeight, index });
      } else if (pBranch === '卯') {
        ties.push({ name: '반합', kind: 'good', value: 1.15 * posWeight, index });
      } else if (pBranch === '亥') {
        ties.push({ name: '가합', kind: 'good', value: 0.75 * posWeight, index });
      }
    }
  });

  const groups = [];
  if (inBranch === '未') {
    if (branches.includes('亥') && branches.includes('卯')) groups.push('삼합');
    if (branches.includes('巳') && branches.includes('午')) groups.push('방합');
  }
  return { ties, groups };
}

function makeCycle(chart, sex) {
  const forward = (STEMS.indexOf(chart.pillars[0][0]) % 2 === 0) === (sex === 'male');
  const term = forward ? chart.termClock.getNextJie() : chart.termClock.getPrevJie();
  const koreanTerm = fromSolar(term.getSolar()).getTime() + 60*MINUTE;
  const birth = chart.civil.getTime();
  const elapsed = Math.floor(Math.abs(koreanTerm - birth) / MINUTE);
  const first = new Date(birth);
  first.setUTCFullYear(first.getUTCFullYear() + Math.floor(elapsed / 4320));
  first.setUTCMonth(first.getUTCMonth() + Math.floor(elapsed % 4320 / 360));
  first.setUTCDate(first.getUTCDate() + Math.floor(elapsed % 360 / 12));
  first.setUTCHours(first.getUTCHours() + (elapsed % 12) * 2);
  const monthStem = STEMS.indexOf(chart.pillars[1][0]);
  const monthBranch = BRANCHES.indexOf(chart.pillars[1][1]);
  return date => {
    let decade = Math.max(0, Math.floor((date.getUTCFullYear() - first.getUTCFullYear()) / 10));
    const start = new Date(first);
    start.setUTCFullYear(first.getUTCFullYear() + decade * 10);
    if (start > date) decade--;
    if (decade < 0) return null;
    const step = (decade + 1) * (forward ? 1 : -1);
    return STEMS[wrap(monthStem + step, 10)] + BRANCHES[wrap(monthBranch + step, 12)];
  };
}

// 2027년 정미년(丁未) 나에게 들어올 운 정확 산출 (쉬운 말, 정확한 운 카테고리만!)
function computeIncomingLucks(chart, sex, profile, relation, stemGod, branchGod, cycleGod) {
  const scores = new Map();
  const add = (label, pts) => scores.set(label, (scores.get(label) || 0) + pts);

  const mapGodToLucks = (god, weight) => {
    if (god === '정재') { add('재물운', weight * 1.4); add('문서·계약운', weight * 0.55); }
    if (god === '편재') { add('재물운', weight * 1.35); add('사업·부업운', weight * 0.85); }
    if (god === '정관') { add('직장·승진운', weight * 1.45); add('명예·인정운', weight * 0.65); }
    if (god === '편관') { add('직장운', weight * 1.15); add('이직·변화운', weight * 0.9); }
    if (god === '정인') { add('학업·시험운', weight * 1.35); add('귀인운', weight * 0.95); add('문서·계약운', weight * 0.75); }
    if (god === '편인') { add('자격증·공부운', weight * 1.25); add('아이디어운', weight * 0.7); }
    if (god === '식신') { add('인기·매력운', weight * 1.1); add('사업·부업운', weight * 0.8); }
    if (god === '상관') { add('이직·변화운', weight * 1.05); add('인기·매력운', weight * 1.0); }
    if (god === '비견') { add('독립운', weight * 1.1); add('인간관계운', weight * 0.7); }
    if (god === '겁재') { add('인간관계운', weight * 1.15); add('협업운', weight * 0.8); }
  };

  mapGodToLucks(stemGod, 1.0);
  mapGodToLucks(branchGod, 1.4);
  if (cycleGod) mapGodToLucks(cycleGod, 0.45);

  let loveScore = 0;
  if (sex === 'male') {
    if (stemGod === '정재' || stemGod === '편재') loveScore += 1.45;
    if (branchGod === '정재' || branchGod === '편재') loveScore += 1.65;
  } else {
    if (stemGod === '정관' || stemGod === '편관') loveScore += 1.45;
    if (branchGod === '정관' || branchGod === '편관') loveScore += 1.65;
  }
  const dayTies = relation.ties.filter(t => t.index === 2);
  if (dayTies.some(t => t.name === '육합' || t.name === '천간합' || t.name === '반합')) {
    loveScore += 1.5;
  }
  if (loveScore >= 1.4) add('연애운', loveScore);

  if ('甲戊庚'.includes(chart.day)) {
    add('귀인운', 1.75);
  }

  if (relation.groups.includes('삼합')) {
    add('인간관계운', 1.2);
    add('귀인운', 0.9);
  }
  if (relation.ties.some(t => t.name === '충' && (t.index === 1 || t.index === 2))) {
    add('이동·이사운', 1.65);
  } else if (relation.ties.some(t => t.name === '충')) {
    add('이동·이사운', 1.25);
  }

  const helpGods = ['정인','편인','비견','겁재'];
  if ((profile.strength === 'weak' && (helpGods.includes(stemGod) || helpGods.includes(branchGod))) || profile.climate === 'cool') {
    add('건강·회복운', 1.05);
  }

  return [...scores.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4)
    .map(([label]) => label);
}

// 2027년 정미년(丁未) 내 사주에 딱 맞는 조심해야 할 것 산출 (간단한 태그형)
function computeCautions(chart, profile, relation, stemGod, branchGod) {
  const scores = new Map();
  const add = (label, pts) => scores.set(label, (scores.get(label) || 0) + pts);

  if (profile.climate === 'hot' || relation.groups.includes('방합')) {
    add('불·열기·화상 주의', 1.6);
    add('성급한 결정', 1.4);
    add('수면 부족·피로', 1.1);
  }
  if (profile.ratios[4] >= 0.28 || relation.ties.some(t => t.name === '천간충' || t.name === '원진해')) {
    add('물가·빗길 안전', 1.5);
  }
  if (profile.ratios[1] < 0.08 && profile.ratios[4] >= 0.22) {
    add('냉방·체온 관리', 0.9);
  }

  if (relation.ties.some(t => t.name === '충')) {
    add('운전·이동 중 안전', 1.75);
    add('갑작스러운 일정 변경', 1.2);
  }
  if (relation.ties.some(t => t.name === '형')) {
    add('계약·서류 꼼꼼히 확인', 1.55);
    add('가까운 사이 다툼', 1.2);
  }
  if (relation.ties.some(t => t.name === '원진해')) {
    add('오해·서운함 쌓아두기', 1.45);
  }
  if (relation.ties.some(t => t.name === '천간충')) {
    add('감정 기복·욱하는 말', 1.35);
  }

  const godCaution = (god, w) => {
    if (god === '겁재') { add('충동 지출·돈 거래', 1.45 * w); add('남과 비교·조급함', 1.0 * w); }
    if (god === '편재') { add('무리한 투자·보증', 1.4 * w); add('충동 지출', 1.0 * w); }
    if (god === '상관') { add('말실수·구설수', 1.5 * w); add('욱해서 자리 옮기기', 1.05 * w); }
    if (god === '편관') { add('과로·체력 저하', 1.45 * w); add('스트레스 누적', 1.1 * w); }
    if (god === '편인') { add('생각 과다·결정 미루기', 1.35 * w); add('달콤한 제안·사기 주의', 1.05 * w); }
    if (god === '정관') { add('무리한 부탁 떠안기', 1.25 * w); add('완벽주의 피로', 0.9 * w); }
    if (god === '정인') { add('준비만 하다 타이밍 놓치기', 1.2 * w); add('계약·서류 꼼꼼히 확인', 0.95 * w); }
    if (god === '정재') { add('지나친 눈치·걱정', 1.1 * w); add('작은 돈 아끼다 큰 기회 놓치기', 0.9 * w); }
    if (god === '비견') { add('고집·독단적 결정', 1.3 * w); add('주변 의견 무시', 0.95 * w); }
    if (god === '식신') { add('소화기·식습관 관리', 1.25 * w); add('마감 미루기', 0.95 * w); }
  };
  godCaution(stemGod, 0.95);
  godCaution(branchGod, 1.15);

  if (profile.strength === 'weak') {
    add('과로·체력 저하', 0.9);
  }

  return [...scores.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4)
    .map(([label]) => label);
}

// 카드 1: 2027년 정미년 총운 (인생 전반 + 신강/중화/신약 × 오행 온도 궁합 세분화)
function buildCoreStory(chart, profile, dayInfo) {
  let detail = '';
  if (profile.strength === 'strong' && profile.climate === 'hot') {
    detail = '원래 사주에 힘과 열기가 넉넉한 편이라 올해는 의욕이 넘치고 생활 속도가 아주 빨라져요. 여러 가지를 한꺼번에 욕심내기보다 진짜 중요한 목표 두 가지만 골라 집중하면 훨씬 크고 만족스러운 결실을 얻습니다.';
  } else if (profile.strength === 'strong' && profile.climate === 'cool') {
    detail = '내 힘은 단단한데 그동안 차분히 눌려 있던 흐름이 2027년의 따뜻한 불빛을 만나 확 트이는 해예요. 망설였던 도전, 새로운 만남, 생활 변화에 과감히 발을 내디디기 아주 좋은 타이밍입니다.';
  } else if (profile.strength === 'strong') {
    detail = '스스로 삶을 이끌어 가는 힘이 강한 사주라, 올해는 가만히 좋은 일이 오길 기다리기보다 먼저 연락하고 움직일수록 행운이 내 쪽으로 크게 기울어요.';
  } else if (profile.strength === 'weak' && profile.climate === 'cool') {
    detail = '그동안 혼자 버티느라 지쳤던 흐름에 2027년의 따뜻한 기운이 들어와 숨통이 트이는 해예요. 무리하게 힘을 쓰기보다 나를 아껴주는 사람과 편안한 환경을 가까이할수록 운이 빠르게 살아납니다.';
  } else if (profile.strength === 'weak' && profile.climate === 'hot') {
    detail = '올해는 주변 분위기가 바쁘고 빠르게 돌아가 체력이나 마음이 쉽게 소진될 수 있어요. 남들 속도에 억지로 맞추기보다 내가 감당할 수 있는 편안한 일상에 집중하는 전략이 가장 현명합니다.';
  } else if (profile.strength === 'weak') {
    detail = '혼자 모든 걸 짊어지기보다 주변의 도움과 응원이 들어올 때 복이 배로 커지는 사주예요. 올해는 체력과 마음의 여유를 지키며 꼭 필요한 기회만 알차게 챙겨 보세요.';
  } else if (profile.climate === 'cool') {
    detail = '전체 균형이 안정적인 사주에 2027년의 따뜻한 활력이 더해져, 그동안 답답했던 마음과 관계가 부드럽게 풀리기 좋은 해예요.';
  } else if (profile.climate === 'hot') {
    detail = '균형 잡힌 사주에 올해 열기가 더해져 활력이 확 올라가는 시기예요. 감정이 앞서지 않게 한 번만 더 숨을 고르고 선택하면 일·돈·관계 모두 깔끔하게 챙길 수 있습니다.';
  } else {
    detail = '사주 균형이 안정적이라 2027년 정미년의 변화를 무리 없이 내 편으로 만들기 좋아요. 무리하지 않고 꾸준히 생활을 가꾸다 보면 연말에 눈에 띄게 편안해진 자신을 만나게 됩니다.';
  }
  return `${dayInfo.year2027Core} ${detail}`;
}

// 카드 2: 상반기 전체 흐름 (2~7월 · 천간 丁 십성 × 천간합충 × 신강/신약 세분화)
function buildFirstHalfStory(chart, profile, relation, stemGod) {
  const base = GOD_PLAIN[stemGod].half1;
  const hasStemMerge = relation.ties.some(t => t.name === '천간합');
  const hasStemClash = relation.ties.some(t => t.name === '천간충');

  let extra = '';
  if (hasStemMerge) {
    extra = '특히 2~6월 사이에는 내 사주와 올해 기운이 반갑게 맞물려, 마음이 통하는 인연이나 기분 좋은 제안이 생각보다 자연스럽게 이어지기 좋아요.';
  } else if (hasStemClash) {
    extra = '다만 봄에서 초여름으로 넘어갈 때 계획이 갑자기 바뀌거나 마음이 급해질 수 있어요. 당황해서 즉흥적으로 결정하기보다 하루만 여유를 두고 판단하면 손해를 막을 수 있어요.';
  } else if (profile.strength === 'strong') {
    extra = '타고난 추진력이 좋은 편이니, 상반기에는 머리로만 고민하지 말고 가볍게라도 직접 움직여 볼수록 반가운 기회가 빨리 찾아와요.';
  } else if (profile.strength === 'weak') {
    extra = '상반기에는 무리해서 지치지 않도록 일정을 여유 있게 잡고, 믿을 만한 가족·지인의 조언을 참고하면 시행착오를 크게 줄일 수 있어요.';
  } else {
    extra = '봄·여름에 가볍게 시작해 둔 습관이나 인연이 하반기 큰 복으로 돌아오니, 4~6월 사이에 꼭 해보고 싶었던 일 하나는 열어 두는 걸 추천해요.';
  }
  return `${base} ${extra}`;
}

// 카드 3: 하반기 전체 흐름 (8~1월 · 지지 未 본기 己 십성 × 지지 합충형해 × 천을귀인 세분화)
function buildSecondHalfStory(chart, profile, relation, branchGod) {
  const base = GOD_PLAIN[branchGod].half2;
  const hasYuk = relation.ties.some(t => t.name === '육합');
  const hasChung = relation.ties.some(t => t.name === '충');
  const hasHyung = relation.ties.some(t => t.name === '형');
  const hasWonjin = relation.ties.some(t => t.name === '원진해');
  const hasTri = relation.groups.includes('삼합') || relation.ties.some(t => t.name === '반합');

  let extra = '';
  if (hasYuk) {
    extra = '가을 이후에는 내 사주와 올해 땅의 기운이 단단히 맞물려, 상반기에 공들인 관계나 목표가 좋은 결실과 안정으로 굳어지기 좋아요.';
  } else if (hasChung) {
    extra = '하반기에는 이사, 이동, 자리 변경처럼 생활 환경의 틀이 한 번 크게 바뀔 수 있어요. 낡은 습관을 정리하고 새 출발을 한다고 생각하면 오히려 훨씬 좋은 자리로 옮겨갈 수 있어요.';
  } else if (hasHyung) {
    extra = '가을~연말에는 사소한 약속이나 조건 차이로 신경전이 생기기 쉬우니, 돈·계약·일정 같은 중요 사항은 대충 넘기지 말고 꼭 글로 남겨 두세요.';
  } else if (hasWonjin) {
    extra = '하반기에는 가까운 사람일수록 작은 말 한마디에 서운해지기 쉬워요. 속으로 묵히지 말고 그날 바로 부드럽게 풀어야 관계가 오래 편안해요.';
  } else if (hasTri) {
    extra = '하반기로 갈수록 혼자 하던 일에 주변의 손길이 더해져 규모가 커지고, 마음 맞는 사람들과 기분 좋은 결과를 함께 나누게 됩니다.';
  } else if ('甲戊庚'.includes(chart.day)) {
    extra = '특히 가을 이후 막히는 순간이 와도 의외의 귀인이 나타나 길을 터주기 좋으니, 혼자 끙끙대지 말고 주변에 먼저 소식을 전해 보세요.';
  } else {
    extra = '연말로 갈수록 불필요한 고민은 덜어내고 내 삶에 진짜 남는 것만 추려 두면, 다음 해를 훨씬 가볍고 든든하게 맞이할 수 있어요.';
  }
  return `${base} ${extra}`;
}

// 카드 4: 재물운 · 연애·인간관계운 (사주 맞춤 돈 + 사랑 + 인맥 종합 풀이)
function buildMoneyLoveStory(chart, sex, profile, relation, stemGod, branchGod, incomingLucks) {
  const parts = [];

  // 1) 재물운
  if (stemGod === '정재' || branchGod === '정재') {
    parts.push('재물운은 땀 흘린 만큼 정직하게 쌓이는 탄탄한 흐름이에요. 한 방을 노리기보다 고정 지출을 줄이고 저축이나 안정적인 수입을 챙길수록 연말 통장이 든든해져요.');
  } else if (stemGod === '편재' || branchGod === '편재') {
    parts.push('재물운은 뜻밖의 부수입, 용돈, 새로운 수익 기회가 들어오기 좋은 활기찬 흐름이에요. 다만 들어오는 만큼 지출도 커지기 쉬우니 충동 소비와 무리한 투자만 조심하면 크게 남아요.');
  } else if (stemGod === '겁재' || branchGod === '겁재') {
    parts.push('재물 쪽은 모임이나 사람 관계로 돈이 나가기 쉬운 해예요. 지인과의 돈 거래나 충동 지출만 잘 막아도 평년보다 훨씬 여유 있게 지낼 수 있어요.');
  } else if (stemGod === '식신' || branchGod === '식신') {
    parts.push('재물운은 내가 잘하는 재능이나 꾸준한 생활 습관이 자연스럽게 수입으로 이어지는 흐름이에요. 당장 큰돈보다 오래 들어오는 수익 통로를 만들기 좋아요.');
  } else {
    parts.push('재물운은 큰 기복 없이 무난하게 흘러가요. 올해는 당장 돈을 불리기보다 지출 습관을 정리하고 내 실력과 자격을 키우는 투자가 나중에 더 큰 돈으로 돌아와요.');
  }

  // 2) 연애·인간관계운
  const hasDayGood = relation.ties.some(t => t.index === 2 && t.kind === 'good');
  const hasDayBad = relation.ties.some(t => t.index === 2 && t.value < 0);
  if (incomingLucks.includes('연애운')) {
    if (hasDayGood) {
      parts.push('연애운은 올해 아주 반갑게 열려 있어요. 솔로라면 자연스러운 소개나 가까운 자리에서 마음이 통하는 인연을 만나기 좋고, 연인이 있다면 관계가 한층 깊어지거나 결혼·미래 이야기가 오가기 좋아요.');
    } else {
      parts.push('올해는 연애운이 또렷하게 들어와 있어요. 새로운 만남의 기회가 늘어나니 집에만 있기보다 모임이나 지인 자리에 가볍게 나가 보시면 좋은 인연이 닿기 쉬워요.');
    }
  } else if (hasDayBad) {
    parts.push('연애나 가까운 사람과의 관계에서는 사소한 오해나 생활 패턴 변화로 예민해질 수 있어요. 서운한 점을 쌓아 두지 말고 바로바로 부드럽게 대화하는 게 관계의 열쇠예요.');
  } else {
    parts.push('연애와 인간관계는 요란하기보다 편안하고 잔잔하게 흘러가요. 억지로 새로운 사람을 찾기보다 지금 곁에 있는 소중한 인연들과 따뜻한 시간을 보내면 마음이 든든해져요.');
  }

  // 귀인운이 실제로 들어오는 사주(천을귀인·정인·삼합)라면 연애운 여부와 무관하게 꼭 짚어줌
  if (incomingLucks.includes('귀인운')) {
    parts.push('특히 올해는 꼭 필요한 순간에 길을 열어 주고 도와주는 고마운 귀인이 들어오는 해예요. 혼자 고민하지 말고 주변에 먼저 소식을 전하면 좋은 소개나 도움을 받기 쉬워요.');
  }

  return parts.join(' ');
}

// 카드 5: 직장·학업운 · 건강·컨디션 (진로/공부/합충 영역 + 오행 온도 건강 풀이)
function buildCareerHealthStory(chart, profile, relation, stemGod, branchGod) {
  const parts = [];

  // 1) 직장·학업·생활 변화
  const changeTie = relation.ties.filter(t => t.kind === 'change').sort((a,b) => a.value - b.value)[0];
  const goodTie = relation.ties.filter(t => t.kind === 'good').sort((a,b) => b.value - a.value)[0];

  if (stemGod === '정관' || branchGod === '정관') {
    parts.push('직장·학업 쪽은 그동안 성실히 쌓아 온 노력을 인정받아 취업, 승진, 합격, 좋은 자리처럼 반가운 평가가 따르기 좋은 해예요.');
  } else if (stemGod === '편관' || branchGod === '편관') {
    parts.push('직장·학업 쪽은 맡은 책임이 커지거나 새로운 도전을 마주하게 돼요. 처음엔 버거워도 끝까지 해내고 나면 내 실력과 입지가 확 올라가요.');
  } else if (stemGod === '정인' || branchGod === '정인' || stemGod === '편인' || branchGod === '편인') {
    parts.push('학업·시험·자격증·문서 운이 아주 좋은 해예요. 새로운 공부나 자격 준비, 계약·이직 준비를 하면 좋은 스승과 자료의 도움을 받아 수월하게 풀려요.');
  } else if (stemGod === '상관' || branchGod === '상관') {
    parts.push('직장이나 공부에서는 기존 방식이 답답하게 느껴져 이직, 전과, 새로운 진로를 고민할 수 있어요. 내 아이디어를 작은 결과물로 먼저 보여주면 좋은 기회가 열려요.');
  } else if (goodTie) {
    parts.push(`특히 ${LIFE_AREAS[goodTie.index]} 쪽에서 마음이 잘 맞는 사람과 손발이 맞아 일이 술술 풀리기 좋은 흐름이에요.`);
  } else {
    parts.push('직장·학업은 급하게 방향을 틀기보다 지금 해오던 일을 차분히 다듬어 갈수록 안정적인 성과가 쌓이는 해예요.');
  }

  if (changeTie) {
    const moveMsg = changeTie.name === '충'
      ? `올해는 ${LIFE_AREAS[changeTie.index]} 쪽으로 이사·이직·부서 이동·여행 같은 뚜렷한 이동운이 들어와 있어요. 묵은 자리를 정리하고 새 환경으로 움직이면 오히려 답답하던 운이 시원하게 트여요.`
      : `올해는 ${LIFE_AREAS[changeTie.index]} 쪽에 일정이나 환경 변화가 들어올 수 있으니, 변화를 두려워하기보다 새 흐름에 맞춰 깔끔히 정리해 보세요.`;
    parts.push(moveMsg);
  }

  // 2) 건강·컨디션 (2027 정미년 불과 마른 흙 온도 궁합 반영)
  if (profile.climate === 'hot') {
    parts.push('건강은 원래 열기가 넉넉한 사주에 2027년 불·흙 기운이 겹쳐 쉽게 피로하거나 잠이 얕아질 수 있어요. 물 자주 마시기, 충분한 수면, 여름철 더위 관리가 컨디션을 지키는 핵심이에요.');
  } else if (profile.climate === 'cool') {
    parts.push('건강은 차분하고 서늘했던 사주에 2027년의 따뜻한 불빛이 들어와 활력과 컨디션이 살아나는 해예요. 가벼운 산책이나 운동을 시작하면 몸도 마음도 한결 가벼워져요.');
  } else {
    parts.push('건강은 전반적으로 무난하지만, 2027년 여름철 체력 저하와 소화기·식습관만 규칙적으로 챙겨 주면 연말까지 거뜬히 보낼 수 있어요.');
  }

  return parts.join(' ');
}

// 카드 6: 10년 큰 흐름과 2027년 개운 팁 (대운 + 부족한 오행 보완 생활 팁)
function buildCycleLuckyStory(profile, earlyCycle, lateCycle, cycleGod) {
  let cyclePart = '';
  if (!lateCycle) {
    cyclePart = '아직 첫 번째 10년 큰 흐름이 시작되기 전이라, 올해는 조급하게 결론 내리기보다 다양한 경험을 쌓으며 내가 좋아하는 방향을 찾아가는 시기예요.';
  } else if (earlyCycle !== lateCycle) {
    cyclePart = '2027년은 10년마다 바뀌는 인생의 큰 계절이 교체되는 중요한 전환점이에요. 연초에 세운 계획이 하반기로 갈수록 새 방향으로 바뀔 수 있으니, 마음이 끌리는 새로운 변화에 유연하게 올라타 보세요.';
  } else if (cycleGod && GOD_PLAIN[cycleGod]) {
    cyclePart = GOD_PLAIN[cycleGod].shift;
  } else {
    cyclePart = '올해의 경험이 앞으로 몇 년을 지탱해 줄 탄탄한 바탕이 됩니다.';
  }

  const luckyTips = [
    '올해 나에게 힘을 보태는 기운은 "나무"예요. 초록색 소품, 식물 가까이하기, 아침 산책이 막힌 운을 시원하게 열어 줘요.',
    '올해 나에게 힘을 보태는 기운은 "불"이에요. 밝은 조명, 따뜻한 색감의 옷, 낮 시간 햇볕 쬐기가 활력과 인연을 불러와요.',
    '올해 나에게 힘을 보태는 기운은 "흙"이에요. 규칙적인 식사, 집안 정리정돈, 베이지·노란 계열 소품이 마음과 재물운을 안정시켜 줘요.',
    '올해 나에게 힘을 보태는 기운은 "쇠"예요. 깔끔한 정리, 흰색·실버 계열 소품, 분명한 일정 관리가 좋은 기회를 딱 잡아 줘요.',
    '올해 나에게 힘을 보태는 기운은 "물"이에요. 물 자주 마시기, 반신욕·충분한 수면, 네이비·블랙 계열 소품이 열기를 식히고 지혜를 채워 줘요.'
  ];
  return `${cyclePart} ${luckyTips[profile.minEl]}`;
}

function yearlyReport(chart, sex) {

  const stemGod = tenGod(chart.day, '丁');

  const dayInfo = DAY_MASTER_INFO[chart.day];

  const cards = [

      text: careerHealthText,
      highlight: ''
    },
    {

      highlight: earlyCycle !== lateCycle ? '10년마다 바뀌는 인생의 큰 계절이 교체되는 중요한 전환점이에요.' : ''
    }

  return {

}

const bornNow = new Date(Date.now()+9*60*MINUTE);

const thisMonth = bornNow.getUTCMonth()+1;

function calendarMaximumDay(year,month,calendar) {
  if (calendar === 'solar') return dateAt(year || 2000,month+1,0).getUTCDate();
  if (!year) return 30;
  const converter = new KoreanLunarCalendar();
  if (setKoreanLunarDate(converter,year,month,30,calendar)) return 30;
  return setKoreanLunarDate(converter,year,month,29,calendar) ? 29 : 0;
}

function updateMonths() {
  const previous = monthSelect.value;
  const year = Number(yearSelect.value);
  const calendar = form.elements.calendar.value;
  monthSelect.length = 1;
  const last = calendar === 'solar' && year === thisYear ? thisMonth : 12;
  for (let month=1;month<=last;month++) {
    if (calendar === 'leap' && year && !calendarMaximumDay(year,month,calendar)) continue;
    monthSelect.add(new Option(`${month}월`,month));
  }
  monthSelect.value = [...monthSelect.options].some(option=>option.value===previous) ? previous : '';
}

function updateDays() {
  const previous = daySelect.value;
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);
  const calendar = form.elements.calendar.value;
  daySelect.length = 1;
  let max = month ? calendarMaximumDay(year,month,calendar) : 0;
  if (calendar === 'solar' && year === thisYear && month === thisMonth) max = Math.min(max,today);
  for (let day=1;day<=max;day++) daySelect.add(new Option(`${day}일`,day));
  daySelect.value = [...daySelect.options].some(option=>option.value===previous) ? previous : '';
}

function formError(message='') {
  errorBox.textContent = message;
  errorBox.hidden = !message;
}

function updateDateFields() {
  updateMonths();
  updateDays();
  const calendar = form.elements.calendar.value;
  const noLeapMonth = yearSelect.value && calendar === 'leap' && monthSelect.length === 1;
  formError(noLeapMonth ? '선택한 해에는 윤달이 없어요.' : '');
  monthSelect.disabled = Boolean(noLeapMonth);
  daySelect.disabled = Boolean(noLeapMonth);
}

function showStage(stage,heading) {
  ['start','details','result'].forEach(name => {byId(name).hidden = name !== stage;});
  byId(heading).focus({preventScroll:true});
}

function markForecast(text, phrase, underline) {
  if (!phrase) return text;
  return text.replace(phrase, match => underline
    ? `<span class="forecast-underline">${match}</span>`
    : `<mark class="forecast-marker">${match}</mark>`);
}

function renderSajuSummary(data) {
  const pillarNames = ['태어난 해', '태어난 달', '태어난 날(나)', '태어난 시간'];
  const pillarBoxes = data.chart.pillars.map((pillar, idx) => `
    <div class="pillar-box${idx === 2 ? ' is-me' : ''}">
      <span class="pillar-label">${pillarNames[idx]}</span>
      <span class="pillar-han">${pillar ? ganjiToKo(pillar) + '(' + pillar + ')' : '모름'}</span>
      <span class="pillar-el">${pillarElementLabel(pillar)}</span>
    </div>`).join('');

  const elBars = ELEMENT_KO.map((name, idx) => {
    const pct = Math.round(data.profile.ratios[idx] * 100);
    return `
      <div class="el-item">
        <span>${name} ${pct}%</span>
        <div class="el-bar-track"><div class="el-bar-fill ${ELEMENT_CLASS[idx]}" style="width:${Math.max(pct, 4)}%"></div></div>
      </div>`;
  }).join('');

  const climateNote = data.profile.climate === 'hot'
    ? '사주에 따뜻한 기운이 넉넉한 편이라, 2027년에는 속도를 조금 조절하며 차분히 움직이면 더 좋아요.'
    : data.profile.climate === 'cool'
      ? '차분하고 서늘한 기운이 많은 사주라, 2027년 정미년의 따뜻한 불빛이 큰 활력을 불어넣어 줘요.'
      : '사주의 온도 균형이 무난한 편이라, 2027년 정미년의 변화를 내 편으로 만들기 좋아요.';

  return `
    <section class="chart-card" aria-label="내 사주 한눈에 보기">
      <div class="chart-heading">
        <h3 class="section-title"><span>내 사주 한눈에 보기</span></h3>
        <span class="saju-badge">${data.profile.strengthLabel}</span>
      </div>
      <p class="saju-me-line">나의 타고난 기운은 <strong>${data.dayInfo.nick}</strong>예요. ${data.dayInfo.summary}이에요.</p>
      <div class="pillars-grid">${pillarBoxes}</div>
      <div class="el-bars">${elBars}</div>
      <p class="el-caption">※ 사주 속에 숨어 있는 기운(지장간)과 태어난 달의 힘까지 함께 반영한 비율이에요.</p>
      <p class="saju-note-sub">${climateNote}</p>
    </section>`;
}

function renderStoryCards(data) {
  return `<div class="story-grid">${data.cards.map((card, index) => `
    <section class="story-card">
      <header class="story-front">
        <h4>${card.label}</h4>
        <img class="story-art" src="${CHRISTMAS_ART[index]}" alt="">
      </header>
      <p class="story-copy">${markForecast(card.text, card.highlight, index === 1 || index === 2)}</p>
    </section>`).join('')}</div>`;
}

function displayReport(data) {
  byId('report-content').innerHTML = `
    <header class="lead-card">
      <div>
        <h3 class="section-title">2027년 정미년 전체 운세</h3>
        <p class="overview-theme">${data.title}</p>
      </div>
      <img class="lead-art" src="${CHRISTMAS_ART[5]}" alt="">
    </header>
    ${renderSajuSummary(data)}
    ${renderStoryCards(data)}
    <div class="note-grid">
      <section class="small-note lucky">
        <h3 class="section-title">나에게 들어올 운</h3>
        <ul class="luck-list">${data.emphasize.map(luck => `<li>${luck}</li>`).join('')}</ul>
      </section>
      <section class="small-note caution">
        <h3 class="section-title">2027년 조심해야 할 것</h3>
        <ul class="caution-list">${data.cautions.map(item => `<li>${item}</li>`).join('')}</ul>
      </section>
    </div>`;
}

form.addEventListener('change',event=>{
  formError();
  if (event.target.name === 'calendar' || event.target.name === 'year') updateDateFields();
  if (event.target.name === 'month') updateDays();
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  const fields = new FormData(form);
  formError();
  try {
    if (monthSelect.disabled) throw new Error('선택한 해에는 윤달이 없어요.');
    const calendar = fields.get('calendar');
    const date = yangDate(Number(fields.get('year')),Number(fields.get('month')),Number(fields.get('day')),calendar);
    if (date > cutoff) throw new Error('오늘 이전의 생년월일을 선택해 주세요.');
    const value = fields.get('hour');
    const chart = makeChart(date,value==='unknown' ? null : Number(value));
    const report = yearlyReport(chart,fields.get('sex'));
    displayReport(report);
    showStage('result','report-title');
  } catch (error) {
    console.error(error);
    formError(error instanceof RangeError || error instanceof TypeError
      ? '보고서를 만들 수 없어요. 날짜와 시간을 다시 확인해 주세요.'
      : error.message);
  }
});
updateDateFields();
byId('start-button').addEventListener('click',()=>showStage('details','form-title'));
byId('back-button').addEventListener('click',()=>showStage('start','main-title'));
byId('restart-button').addEventListener('click',()=>{
  form.reset();
  updateDateFields();
  formError();
  byId('report-content').replaceChildren();
  statusText();
  showStage('start','main-title');
});

const imageDialog = byId('image-dialog');
const shareDialog = byId('share-dialog');
const save = byId('save-button');
function statusText(message='') {
  byId('action-status').textContent = message;
  byId('action-status').hidden = !message;
}
save.addEventListener('click',async()=>{
  statusText();
  save.disabled = true;
  try {
    if (document.fonts) await document.fonts.ready;
    const width = reportPaper.offsetWidth;
    const height = reportPaper.offsetHeight;
    const scale = Math.min(2.5,Math.sqrt(4100000/(width*height)),8000/height);
    const canvas = await html2canvas(reportPaper,{scale,backgroundColor:'#fff9e8',logging:false});
    const blob = await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if (!blob) throw new Error('PNG 생성 실패');
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageUrl = URL.createObjectURL(blob);
    byId('saved-image').src = imageUrl;
    imageDialog.showModal();
  } catch (error) {
    console.error(error);
    statusText('이미지를 만들지 못했어요. 다시 눌러 주세요.');
  } finally {
    save.disabled = false;
  }
});
imageDialog.addEventListener('close',()=>{
  if (!imageUrl) return;
  URL.revokeObjectURL(imageUrl);
  byId('saved-image').removeAttribute('src');
  imageUrl = '';
  save.focus({preventScroll:true});
});
byId('share-button').addEventListener('click',async()=>{
  statusText();
  if (navigator.share) {
    try {
      await navigator.share({title:document.title,text:document.title,url:shareUrl});
      return;
    } catch (error) {
      if (error.name==='AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(`${document.title}\n${shareUrl}`);
    statusText('테스트 링크를 복사했어요.');
  } catch {
    const field = byId('share-address');
    field.value = shareUrl;
    shareDialog.showModal();
    field.select();
  }
});
for (const dialog of [imageDialog,shareDialog]) dialog.addEventListener('click',event=>{
  if (event.target===dialog) dialog.close();
});

  </script>
