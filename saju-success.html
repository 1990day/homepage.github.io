   <div class="success-page">
    <h1 class="success-title">결제 확인 중입니다</h1>
    <p class="success-text">
        결제 승인 상태를 확인하고 있습니다. 잠시만 기다려 주세요.
    </p>
    <a class="success-link" href="https://test-it.co.kr/saju.html">다른 사주 상품 보기</a>
</div>
<script>
  const TOSS_SERVER_URL = "https://script.google.com/macros/s/AKfycbwNo04OutnyZoy6LxzCBXn0ApxfUELXrYm03NJpLABqBmCTPG1R2Nwcw_Xjs6an-oFTMA/exec";
  const successPage = document.querySelector(".success-page");
  const title = successPage.querySelector(".success-title");
  const message = successPage.querySelector(".success-text");
  const params = new URLSearchParams(window.location.search);
  const paymentKey = params.get("paymentKey");
  const orderId = params.get("orderId");
  const amount = Number(params.get("amount"));

  function showStatus(heading, body) {
    title.textContent = heading;
    message.textContent = body;
  }

  async function verifyAndComplete() {
    // 토스에서 돌아왔다는 사실만으로는 결제 완료가 아닙니다.
    showStatus("결제 확인 중입니다", "결제 승인 상태를 확인하고 있습니다. 잠시만 기다려 주세요.");
    if (!paymentKey || !/^saju0[1-7]_[a-f0-9]{32}$/.test(orderId || "") || !Number.isSafeInteger(amount) || amount <= 0) {
      showStatus("결제 정보를 확인할 수 없습니다", "결제 여부를 확인해야 합니다. 중복 결제하지 말고 문의해 주세요.");
      return;
    }
    try {
      const response = await fetch(TOSS_SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "confirmPayment", paymentKey, orderId, amount
        }),
        redirect: "follow"
      });
      if (!response.ok) throw new Error("결제 서버에 연결할 수 없습니다.");
      const result = await response.json();
      if (result.result !== "success" || result.orderId !== orderId || Number(result.amount) !== amount) {
        throw new Error(result.message || "결제 승인 확인이 완료되지 않았습니다.");
      }
      sessionStorage.removeItem("sajuPendingOrderId");
      sessionStorage.removeItem("saju01PendingOrderId");
      showStatus("결제가 성공적으로 완료되었습니다!", "사주 신청이 완료되었습니다. 48시간 내에 이메일로 발송해 드릴게요.");
    } catch (error) {
      console.error("결제 확인 오류:", error);
      showStatus("결제 확인이 필요합니다", "결제가 진행되었을 수 있습니다. 중복 결제하지 말고 주문번호를 보관한 뒤 문의해 주세요. 주문번호: " + orderId);
    }
  }
  verifyAndComplete();
</script>
