    const hue=(CELL_HUES[cellIndex]+DAY_HUE_SHIFTS[pillarIndex])%360;
    return `hsl(${hue.toFixed(3)} 67% ${CELL_LIGHTNESS[cellIndex]}%)`;

  const $=id=>document.getElementById(id);
  const screens=['homeScreen','inputScreen','resultScreen'];
  function showScreen(id){screens.forEach(name=>$(name).classList.toggle('active',name===id))}
  function populateSelect(select,from,to,suffix){for(let n=from;n<=to;n++){const opt=document.createElement('option');opt.value=String(n);opt.textContent=n+suffix;select.append(opt)}}
  const now=new Date();const currentYear=now.getFullYear();populateSelect($('birthYear'),1900,currentYear,'년');$('birthYear').value='1995';populateSelect($('birthMonth'),1,12,'월');$('birthMonth').value='1';
  const yearList=$('yearList'),yearButton=$('birthYearButton');
  for(let year=1900;year<=currentYear;year++){const option=document.createElement('button');option.type='button';option.className='year-option';option.setAttribute('role','option');option.dataset.year=String(year);option.textContent=year+'년';option.setAttribute('aria-selected',year===1995?'true':'false');option.addEventListener('click',()=>{setYear(year);closeYearList();yearButton.focus()});yearList.append(option)}
  function setYear(year){$('birthYear').value=String(year);$('yearLabel').textContent=year+'년';yearList.querySelectorAll('.year-option').forEach(option=>option.setAttribute('aria-selected',String(year)===option.dataset.year?'true':'false'));refreshDays()}
  function closeYearList(){yearList.hidden=true;yearButton.setAttribute('aria-expanded','false')}
  function openYearList(){yearList.hidden=false;yearButton.setAttribute('aria-expanded','true');const selected=yearList.querySelector('[aria-selected="true"]');if(selected)yearList.scrollTop=selected.offsetTop-(yearList.clientHeight-selected.offsetHeight)/2}
  yearButton.addEventListener('click',()=>yearList.hidden?openYearList():closeYearList());
  yearButton.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(yearList.hidden)openYearList();const delta=event.key==='ArrowDown'?1:-1;const year=Math.max(1900,Math.min(currentYear,Number($('birthYear').value)+delta));setYear(year);const selected=yearList.querySelector('[aria-selected="true"]');if(selected)yearList.scrollTop=selected.offsetTop-(yearList.clientHeight-selected.offsetHeight)/2}if(event.key==='Escape')closeYearList()});
  document.addEventListener('click',event=>{if(!event.target.closest('.year-picker'))closeYearList()});
  function daysInMonth(y,m){return new Date(y,m,0).getDate()}
  function refreshDays(){const previousDay=Number($('birthDay').value)||1;const daySelect=$('birthDay');const y=Number($('birthYear').value),m=Number($('birthMonth').value);daySelect.length=1;if(!y||!m)return;const lastDay=daysInMonth(y,m);populateSelect(daySelect,1,lastDay,'일');daySelect.value=String(Math.min(previousDay,lastDay))}
  $('birthYear').addEventListener('change',refreshDays);$('birthMonth').addEventListener('change',refreshDays);
  refreshDays();
  // lunar-javascript가 반환하는 한자 일주를 60갑자 순서의 데이터 인덱스로 연결.
  const HANJA_STEMS='甲乙丙丁戊己庚辛壬癸';
  const HANJA_BRANCHES='子丑寅卯辰巳午未申酉戌亥';
  function dayPillar(year,month,day){
    if(typeof Solar==='undefined')throw new Error('사주 계산 라이브러리를 불러오지 못했습니다.');
    const ganZhi=Solar.fromYmd(year,month,day).getLunar().getDayInGanZhi();
    const index=Array.from({length:60},(_,i)=>HANJA_STEMS[i%10]+HANJA_BRANCHES[i%12]).indexOf(ganZhi);
    if(index<0)throw new Error('일주를 계산하지 못했습니다.');
    return {index,name:STEMS[index%10]+BRANCHES[index%12]+'일주'};
  }
  $('startBtn').addEventListener('click',()=>showScreen('inputScreen'));
  $('restartBtn').addEventListener('click',()=>{closeYearList();$('formError').textContent='';showScreen('homeScreen')});
  $('othersBtn').addEventListener('click',()=>{location.href='https://test-it.co.kr/'});
  $('birthForm').addEventListener('submit',event=>{event.preventDefault();const nickname=$('nickname').value.trim();const y=Number($('birthYear').value),m=Number($('birthMonth').value),d=Number($('birthDay').value);const error=$('formError');error.textContent='';if(!nickname){error.textContent='이름 또는 닉네임을 입력해 주세요.';return}if(!y||!m||!d||d>daysInMonth(y,m)){error.textContent='생년월일을 모두 선택해 주세요.';return}const today=new Date();if(y>today.getFullYear()||(y===today.getFullYear()&&(m>today.getMonth()+1||(m===today.getMonth()+1&&d>today.getDate())))){error.textContent='오늘 이후 날짜는 선택할 수 없어요.';return}let pillar;try{pillar=dayPillar(y,m,d)}catch(e){error.textContent=e.message;return}$('resultTitle').textContent=nickname+'님의 사주 성격 구절판';const grid=$('resultGrid');grid.replaceChildren();TRAITS[pillar.index].forEach((trait,i)=>{const box=document.createElement('div');box.className='cell';box.style.backgroundColor=pillarCellColor(pillar.index,i);const t=document.createElement('span');t.className='cell-text';t.textContent=trait;box.append(t);grid.append(box)});showScreen('resultScreen')});
  function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2500)}
  $('shareBtn').addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:'테스트잇 사주 구절판 성격 테스트',url:TEST_URL})}else if(navigator.clipboard){await navigator.clipboard.writeText(TEST_URL);toast('테스트 주소를 복사했어요.')}else{const temp=document.createElement('textarea');temp.value=TEST_URL;document.body.append(temp);temp.select();document.execCommand('copy');temp.remove();toast('테스트 주소를 복사했어요.')}}catch(error){if(error.name!=='AbortError')toast('공유하지 못했어요. 다시 시도해 주세요.')}});
  function loadHtml2Canvas(){if(window.html2canvas)return Promise.resolve();return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}
  $('saveBtn').addEventListener('click',async()=>{const button=$('saveBtn');button.disabled=true;button.textContent='이미지 만드는 중...';try{await loadHtml2Canvas();const card=$('captureCard');const canvas=await html2canvas(card,{scale:Math.max(2,Math.min(3,window.devicePixelRatio||2)),backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0});const url=canvas.toDataURL('image/png');$('previewImage').src=url;$('saveModal').classList.add('open');$('saveModal').setAttribute('aria-hidden','false')}catch(error){toast('이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.')}finally{button.disabled=false;button.textContent='결과 이미지 저장하기'}});
  function closeModal(){$('saveModal').classList.remove('open');$('saveModal').setAttribute('aria-hidden','true')}
  $('closeModal').addEventListener('click',closeModal);$('saveModal').addEventListener('click',e=>{if(e.target===$('saveModal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
