function result(){view='result';clearTimeout(timer);const end=E.summary(state);state.end=end;write(KEY+'-last',state);try{localStorage.removeItem(KEY)}catch{}let endings=read(KEY+'-endings',[]);if(!Array.isArray(endings))endings=[];const signature=JSON.stringify([state.seed,state.history.filter(x=>x.type==='decision').map(x=>x.text)]);if(!endings.some(x=>x.key===signature)){endings.unshift({key:signature,birth:end.birthYear,status:end.status,job:end.job,assets:end.assets,partner:end.partnerName});write(KEY+'-endings',endings.slice(0,20))}const significant=state.history.filter(h=>!['decision','meeting','behavior'].includes(h.type));app.innerHTML=shell(`<div id="result-card"><div class="result-head"><h1>${TITLE}</h1><span>이번 인생의 최종 기록</span><h2>${esc(state.name)}의 인생 정리</h2><p>${esc(end.line)}</p></div>${map('home')}<div class="report"><dl class="result-grid">${rows(end).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>${end.quality?`<p class="relation-note">마지막 관계 · ${end.quality}</p>`:''}<h3>연애·결혼 기록</h3>${end.romances.length?`<ol class="romances">${end.romances.map(r=>`<li><b>${esc(r.name)}</b><span>${r.from}살에 연애 시작${r.marriedAt===null?'':' · '+r.marriedAt+'살에 결혼'}${r.to===null?' · 현재 함께함':' · '+r.to+'살에 '+r.reason}</span></li>`).join('')}</ol>`:'<p>연애를 시작하지 않고 내 생활을 이어갔다.</p>'}<h3>생활이 바뀐 순간</h3><ol class="timeline">${significant.slice(-10).map(h=>`<li><b>${h.age}살</b> ${esc(h.text)}</li>`).join('')}</ol><p class="footnote">순자산은 게임 속 보유 자산에서 빚을 뺀 금액임.</p></div><div class="result-address">TEST-IT.CO.KR / TEST424</div></div>`)+`<div class="actions"><button id="image">결과 이미지 저장하기</button><button id="retry">다시 해보기</button><a href="https://test-it.co.kr">다른 테스트 해보기</a><button id="share">테스트 공유하기</button></div><button id="same" class="secondary">같은 시작에서 다른 선택 해보기</button><p class="notice" id="notice" role="status"></p><div class="collection"><b>내가 살아본 인생 ${endings.length}개</b>${endings.slice(0,5).map(e=>`<p>${e.birth}년생 · ${esc(e.job)} · ${esc(e.
