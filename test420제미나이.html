<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테스트잇 EI 최종 평가 테스트</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap');

    body {
        background-color: #e9e9e9;
        font-family: 'Noto Serif KR', serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: #333;
    }

    .paper-container {
        background-color: #fcf9f2;
        width: 100%;
        max-width: 450px;
        min-height: 650px;
        border: 2px solid #111;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        padding: 30px 20px;
        box-sizing: border-box;
        position: relative;
    }

    /* 시험지 헤더 스타일 */
    .exam-header {
        border-bottom: 3px double #111;
        padding-bottom: 15px;
        margin-bottom: 30px;
        text-align: center;
    }
    
    .exam-title {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 10px 0;
        letter-spacing: -1px;
    }

    .exam-info-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 14px;
    }
    .exam-info-table th, .exam-info-table td {
        border: 1px solid #111;
        padding: 5px;
        text-align: center;
    }

    /* 화면 전환 클래스 */
    .screen {
        display: none;
        flex-direction: column;
        align-items: center;
    }
    .screen.active {
        display: flex;
    }

    /* 공통 버튼 스타일 */
    .btn {
        background-color: transparent;
        border: 1px solid #111;
        padding: 12px 20px;
        font-family: inherit;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        margin-top: 15px;
    }
    .btn:hover {
        background-color: #111;
        color: #fff;
    }

    /* 시작 화면 */
    .start-wrap {
        text-align: center;
        margin-top: 50px;
    }
    .start-wrap p {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 40px;
    }

    /* 정보 입력 화면 */
    .input-wrap {
        width: 100%;
        margin-top: 50px;
        text-align: center;
    }
    .nickname-input {
        width: 80%;
        padding: 10px;
        font-size: 16px;
        font-family: inherit;
        border: none;
        border-bottom: 2px solid #111;
        background: transparent;
        text-align: center;
        outline: none;
        margin-bottom: 30px;
    }

    /* 질문 화면 */
    .progress-wrap {
        width: 100%;
        margin-bottom: 30px;
    }
    .progress-text {
        text-align: right;
        font-size: 12px;
        margin-bottom: 5px;
    }
    .progress-bar-bg {
        width: 100%;
        height: 8px;
        border: 1px solid #111;
        background-color: transparent;
    }
    .progress-bar-fill {
        height: 100%;
        background-color: #111;
        width: 0%;
        transition: width 0.3s;
    }

    .question-box {
        width: 100%;
        margin-bottom: 40px;
    }
    .q-num {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .q-text {
        font-size: 18px;
        line-height: 1.5;
        word-break: keep-all;
    }

    .answer-btn {
        background-color: transparent;
        border: 1px solid #111;
        padding: 15px;
        margin-bottom: 15px;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        line-height: 1.4;
    }
    .answer-btn:hover {
        background-color: #eee;
    }

    /* 결과 화면 */
    .result-wrap {
        text-align: center;
        width: 100%;
        margin-top: 20px;
    }
    .result-score {
        font-size: 20px;
        margin-bottom: 10px;
        color: #d32f2f;
        border: 2px solid #d32f2f;
        border-radius: 50%;
        width: 80px;
        height: 80px;
        line-height: 80px;
        margin: 0 auto 20px auto;
        transform: rotate(-15deg);
    }
    .result-type {
        font-size: 28px;
        font-weight: bold;
        margin: 20px 0;
        text-decoration: underline;
        text-underline-position: under;
    }
    .result-desc {
        font-size: 15px;
        line-height: 1.6;
        text-align: left;
        border: 1px dashed #111;
        padding: 20px;
        background-color: rgba(255,255,255,0.5);
    }
</style>
</head>
<body>

<div class="paper-container">
    <div class="exam-header">
        <h1 class="exam-title">테스트잇 EI 최종 평가</h1>
        <table class="exam-info-table">
            <tr>
                <th>과목코드</th>
                <th>test420</th>
                <th>수험생 성명</th>
                <td id="header-name">미입력</td>
            </tr>
        </table>
    </div>

    <!-- 1. 시작 화면 -->
    <div id="screen-start" class="screen active start-wrap">
        <h2>2026학년도 EI 성향 평가 영역</h2>
        <p>본 평가는 수험생의 내면적 성질(성)과<br>외부적 행동(향)을 종합적으로 분석하여<br>최종 EI 타입을 판별하는 시험입니다.</p>
        <button class="btn" onclick="nextScreen('screen-info')">시험 시작하기</button>
    </div>

    <!-- 2. 정보 입력 화면 -->
    <div id="screen-info" class="screen input-wrap">
        <h2>수험생 정보 입력</h2>
        <p>답안지에 기재할 성명(닉네임)을 적어주세요.</p>
        <input type="text" id="nickname" class="nickname-input" placeholder="이름 또는 닉네임 입력" autocomplete="off">
        <button class="btn" onclick="startTest()">다음 단계로</button>
    </div>

    <!-- 3. 질문 화면 -->
    <div id="screen-question" class="screen">
        <div class="progress-wrap">
            <div class="progress-text"><span id="curr-q">1</span> / 12</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div class="question-box">
            <div class="q-num" id="q-num-text">문 1.</div>
            <div class="q-text" id="q-text">질문 내용이 들어갑니다.</div>
        </div>

        <button class="answer-btn" onclick="selectAnswer('A')" id="ans-a">① 첫 번째 답변</button>
        <button class="answer-btn" onclick="selectAnswer('B')" id="ans-b">② 두 번째 답변</button>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="screen result-wrap">
        <div class="result-score">합격</div>
        <h2 id="result-name-display">수험생님의 최종 평가 결과</h2>
        <div class="result-type" id="result-type">내성외향</div>
        <div class="result-desc" id="result-desc">
            결과 설명이 이곳에 출력됩니다.
        </div>
        <button class="btn" onclick="location.reload()">다시 응시하기</button>
    </div>
</div>

<script>
    // 질문 데이터 (1~6번은 성(Nature), 7~12번은 향(Direction) 측정)
    const questions = [
        // [내성 vs 외성] 내면의 에너지 방향과 본질
        { q: "아무 일도 없는 주말, 나의 에너지는 어떻게 채워질까?", a: "혼자만의 시간을 가지며 조용히 충전한다. (내성)", b: "누군가를 만나거나 밖으로 나가야 에너지가 돈다. (외성)", type: "nature" },
        { q: "스트레스를 심하게 받았을 때 나의 무의식적 반응은?", a: "혼자 생각을 정리하며 삭히는 편이다. (내성)", b: "누군가에게 털어놓으며 풀어야 속이 시원하다. (외성)", type: "nature" },
        { q: "나의 진짜 속마음이나 깊은 감정은?", a: "정말 가까운 소수의 사람에게만 보여준다. (내성)", b: "비교적 여러 사람에게 편하게 오픈할 수 있다. (외성)", type: "nature" },
        { q: "새로운 관심사가 생겼을 때 나는?", a: "혼자 깊게 파고들며 정보를 수집한다. (내성)", b: "관련 모임에 가입하거나 남들과 공유하고 싶다. (외성)", type: "nature" },
        { q: "멍 때릴 때 내 머릿속은 주로?", a: "내면의 상상이나 과거의 기억들로 가득 찬다. (내성)", b: "내일 만날 사람이나 외부의 이벤트에 대해 생각한다. (외성)", type: "nature" },
        { q: "갑자기 잡혀있던 약속이 취소되었다면 나의 찐 속마음은?", a: "오히려 좋아. 안도하며 혼자만의 시간을 즐긴다. (내성)", b: "아쉽다. 당장 만날 수 있는 다른 사람을 찾아본다. (외성)", type: "nature" },
        
        // [내향 vs 외향] 외부로 드러나는 태도와 행동
        { q: "여러 명이 모인 낯선 술자리, 나는 어떤 모습일까?", a: "주로 남들의 이야기를 듣고 맞장구치는 편이다. (내향)", b: "대화를 주도하거나 먼저 분위기를 띄우는 편이다. (외향)", type: "direction" },
        { q: "처음 보는 사람과 단둘이 남겨졌을 때 나는?", a: "어색해서 상대가 먼저 말을 걸어주길 기다린다. (내향)", b: "침묵을 깨기 위해 먼저 가벼운 질문을 던진다. (외향)", type: "direction" },
        { q: "사람들이 평가하는 나의 첫인상은?", a: "차분하고 조용하며 다소 얌전해 보인다고 한다. (내향)", b: "활발하고 친근하며 다가가기 쉬워 보인다고 한다. (외향)", type: "direction" },
        { q: "길을 잃었거나 모르는 것이 생겼을 때 나의 행동은?", a: "일단 지도 앱이나 검색을 통해 혼자 해결하려 한다. (내향)", b: "근처에 있는 사람에게 바로 다가가 길을 물어본다. (외향)", type: "direction" },
        { q: "단체 대화방이나 SNS에서 나의 포지션은?", a: "주로 눈팅을 하거나 꼭 필요할 때만 대답한다. (내향)", b: "적극적으로 리액션하고 먼저 대화를 시작한다. (외향)", type: "direction" },
        { q: "누군가 재미있는 이야기를 했을 때 나의 리액션은?", a: "소소하게 웃으며 차분하게 반응한다. (내향)", b: "크게 웃거나 오버하며 적극적으로 반응한다. (외향)", type: "direction" }
    ];

    let currentQ = 0;
    let scoreNatureE = 0; // 외성 점수
    let scoreDirectionE = 0; // 외향 점수
    let userName = "";

    function nextScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startTest() {
        const input = document.getElementById('nickname').value.trim();
        if(!input) {
            alert("수험생 성명을 입력해주세요.");
            return;
        }
        userName = input;
        document.getElementById('header-name').innerText = userName;
        currentQ = 0;
        scoreNatureE = 0;
        scoreDirectionE = 0;
        updateQuestion();
        nextScreen('screen-question');
    }

    function updateQuestion() {
        const qData = questions[currentQ];
        document.getElementById('curr-q').innerText = currentQ + 1;
        document.getElementById('progress-fill').style.width = ((currentQ + 1) / questions.length * 100) + '%';
        
        document.getElementById('q-num-text').innerText = `문 ${currentQ + 1}.`;
        document.getElementById('q-text').innerText = qData.q;
        
        document.getElementById('ans-a').innerText = `① ${qData.a.replace(/ \(.+\)/, '')}`;
        document.getElementById('ans-b').innerText = `② ${qData.b.replace(/ \(.+\)/, '')}`;
    }

    function selectAnswer(choice) {
        const qData = questions[currentQ];
        
        // A는 I(내성/내향), B는 E(외성/외향)로 설정했습니다.
        if (choice === 'B') {
            if (qData.type === 'nature') scoreNatureE++;
            if (qData.type === 'direction') scoreDirectionE++;
        }

        currentQ++;
        if (currentQ < questions.length) {
            updateQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        nextScreen('screen-result');
        document.getElementById('result-name-display').innerText = `${userName} 수험생님의 최종 결과`;

        // natureE가 3보다 크면 외성, 아니면 내성
        // directionE가 3보다 크면 외향, 아니면 내향
        const nature = scoreNatureE >= 3 ? "외성" : "내성";
        const direction = scoreDirectionE >= 3 ? "외향" : "내향";
        const finalType = nature + direction;

        document.getElementById('result-type').innerText = finalType;

        let desc = "";
        if (finalType === "내성내향") {
            desc = "본질적인 에너지도 안을 향해 있고, 겉으로 드러나는 모습도 차분한 정통 I 타입입니다. 사람들과 어울리기보다는 혼자만의 시간을 통해 완벽한 에너지를 충전하며, 낯선 환경에서는 신중하게 관찰하는 것을 선호합니다.";
        } else if (finalType === "내성외향") {
            desc = "에너지의 근원은 내면에 있지만, 겉으로는 사람들과 능숙하게 어울리는 사회적 I 타입입니다. 밖에서는 활발하고 사교적으로 보이지만, 집에 돌아오면 방전되어 혼자만의 긴 휴식 시간이 반드시 필요합니다.";
        } else if (finalType === "외성내향") {
            desc = "본질적인 에너지는 사람과 외부에서 얻지만, 겉보기에는 차분하거나 낯을 가리는 샤이 E 타입입니다. 마음속으로는 사람들과 친해지고 싶고 놀고 싶어 하지만, 먼저 다가가기보다는 누군가 다가와 주길 기다리는 편입니다.";
        } else if (finalType === "외성외향") {
            desc = "에너지의 근원도 외부, 겉으로 드러나는 모습도 활발한 정통 E 타입입니다. 혼자 있는 시간보다는 사람들과 함께할 때 살아있음을 느끼며, 어디서든 분위기를 주도하고 처음 보는 사람과도 금방 친해지는 인싸 재질입니다.";
        }

        document.getElementById('result-desc').innerText = desc;
    }
</script>

</body>
</html>
