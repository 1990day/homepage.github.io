:root{color-scheme:light;--night:#31141e;--wine:#581923;--red:#8c2634;--cream:#fff1d3;--gold:#f4d38b;--pine:#285641;--line:#c39b61;--paper:#fff6e3;--body-font:DeltaDotum,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--night);font:400 20px/32px var(--body-font);font-synthesis:none;letter-spacing:0;word-break:keep-all;overflow-wrap:anywhere;background-color:#75232c;background-image:repeating-linear-gradient(90deg,#380f1e66 0 23px,transparent 23px 46px),repeating-linear-gradient(0deg,#cb48434f 0 23px,#2c102633 23px 46px);min-height:100vh}
h1,h2,h3,p{margin:0} h1,h2,h3{line-height:1.4} h1,h2,h3,strong{font-weight:400}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}
:focus-visible{outline:2px solid #efac50;outline-offset:3px}
.top{background:#34131c;color:#fff0ce;border-bottom:1px solid #c1825d}
.top-inner{width:min(100% - 28px,720px);margin:auto;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:400}
nav{display:flex;gap:clamp(7px,2.4vw,22px)}
main{width:min(100% - 30px,516px);margin:clamp(21px,4vw,43px) auto 0}
.shell{background:#481723;border:5px solid var(--gold);padding:11px;box-shadow:5px 5px 0 #244838,inset 0 0 0 1px #9b5b43}
.windowbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 8px;color:var(--gold);font-size:18px}
.bar-wreath{display:block;width:24px;height:auto;image-rendering:pixelated}
.cover-image{display:block;width:100%;height:auto}
.game-button{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;min-height:47px;padding:8px 13px;border:1px solid #a37842;background:#f9dfa2;color:#45221f;box-shadow:inset 0 -3px #d3a864;font-weight:400}
.game-button:hover{background:#ffebbb}
.start-button{width:100%;margin-top:15px}
.paper{background:var(--paper);border:2px solid #ad8557;padding:clamp(13px,4.5vw,24px);box-shadow:inset 0 0 0 3px #ebd6ad}
.headline{text-align:center;margin:4px 0 17px}
.headline h2{font-size:20px;line-height:30px;color:#661f2a}
.headline p{color:#49302a;margin-top:5px}
fieldset{padding:0;border:0;margin:0 0 14px;min-inline-size:0}
legend,.field-label{padding:0;margin-bottom:5px;display:block}
.options{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.options label{position:relative;cursor:pointer;text-align:center;min-width:0}
.options input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.options span{display:grid;place-items:center;min-height:43px;border:1px solid #b49674;background:#fffaf0;line-height:26px;padding:3px}
.options input:checked + span{background:#e5eddb;border-color:#42704f;color:#224732;box-shadow:inset 0 -2px #aac1a1}
.options input:focus-visible + span{outline:2px solid #96323e;outline-offset:2px}
.date-row{display:grid;grid-template-columns:1.23fr 1fr 1fr;gap:5px}
select{width:100%;min-width:0;min-height:43px;border-radius:0;border:1px solid #b49674;padding:4px 3px 4px 6px;background:#fffaf0;line-height:26px}
.submit{width:100%;margin-top:15px}
.form-error,.action-status{font-size:18px;line-height:26px}
.form-error{color:#89252a;margin-top:8px}
.loading-panel{text-align:center;border:2px solid #ac8053;background:#fff4db}
.loading-scene{position:relative;overflow:hidden;aspect-ratio:12/7;background:#451a29;border-bottom:2px solid #ad8557}
.loading-scene canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;image-rendering:pixelated}
.stage-glimmer{position:absolute;inset:0;background:#ffd78b;clip-path:polygon(46% 0,54% 0,72% 72%,28% 72%);pointer-events:none;animation:glimmer 1.6s ease-in-out infinite alternate}
@keyframes glimmer{from{opacity:.04}to{opacity:.13}}
.loading-caption{padding:12px 14px 16px}
.loading-caption h2{font-size:20px;line-height:28px;color:#663039}
.load-track{height:9px;border:1px solid #bc9364;background:#efdfbc;padding:1px;width:min(68%,232px);margin:8px auto 0}
.load-track span{display:block;height:100%;background:#387451;animation:fill 3s linear both}
@keyframes fill{from{width:0}to{width:100%}}
.result-frame{background:#df2b32;border-color:#f6cb65;box-shadow:5px 5px 0 #24533d,inset 0 0 0 1px #9e272d}
.result-card{background:#fff4d8;border:2px solid #9e272d}
.result-brand{padding:6px 4px;background:#173e30;color:#fff4cb;text-align:center;border-bottom:2px solid #a22a29;container-type:inline-size}
.result-brand .test-title{margin:3px 0;padding:5px 2px;border:1px solid #921f25;border-radius:999px;background:#c9252e;letter-spacing:.025em;font-size:clamp(10px,5.65cqi,34px);white-space:nowrap}
.verdict{padding:12px 10px 13px;text-align:center;background:#812735;color:#fff1cf;border-bottom:3px solid #d7ac72}
.result-card.fail .verdict{background:#355446}
.verdict small{display:block;font-size:18px;line-height:1.25}
.verdict h2{font-size:clamp(22px,5.7vw,30px);margin-top:4px;line-height:1.28}
.verdict h2 span{display:block}
.verdict p{font-size:18px;line-height:1.35;margin-top:4px;color:#ffefc7}
.sprite{display:block;width:46px;height:46px;image-rendering:pixelated;margin:0 auto 5px}
.report{display:grid;gap:11px;padding:clamp(9px,3vw,16px)}
.report-box{--tab-paper:#f6d16b;--tab-ink:#583123;border:1px solid #c6a15e;background:#fffaf0;min-width:0}
.report-box h3{display:flex;align-items:baseline;gap:8px;padding:5px 10px;color:var(--tab-ink);background:var(--tab-paper);border-bottom:1px solid #c6a15e;font-size:20px;line-height:28px}
.report-box h3::before{content:'';flex:none;width:5px;height:5px;background:var(--tab-ink);transform:translateY(-2px)}
.report-copy{padding:10px 12px 11px}
.report-box p{font-size:20px;line-height:32px}
.report-copy p+p{margin-top:8px}
.report-box strong{color:#285641}
.report-box.reason{--tab-paper:#25563f;--tab-ink:#fff0c4}
.report-box.fans{--tab-paper:#e7edcd;--tab-ink:#284d39}
.report-box.anti{--tab-paper:#ae2b36;--tab-ink:#fff3cd}
.report-box.caution{--tab-paper:#f8e5a9}
.reason strong{color:#682837}
.actions{display:grid;gap:6px;margin-top:14px}
.actions .game-button{background:#fff2d5;min-height:42px;font-weight:400;box-shadow:inset 0 -2px #e1c48e}
.actions .game-button:first-child{background:#f9dfa2}
.action-status{margin-top:6px;padding:5px 9px;background:#fff2d5;text-align:center}
.ad-slot{display:grid;justify-content:center;margin:24px auto 12px;max-width:100%;overflow:hidden}
.ad-banner{width:350px;height:150px}
dialog{width:min(86vw,345px);padding:12px;border:2px solid #a78253;background:var(--paper);color:var(--night);text-align:center}
dialog::backdrop{background:#260f19b8}
dialog h2{font-size:20px;margin-bottom:8px}
dialog img{display:block;width:auto;max-width:100%;max-height:min(62vh,540px);height:auto;margin:0 auto;-webkit-touch-callout:default;user-select:auto}
dialog input{display:block;width:100%;margin:6px 0 10px;font-size:20px}
dialog form{margin-top:9px}
dialog .game-button{width:100%;min-height:35px}
@media(min-width:600px){.report{grid-template-columns:1fr 1fr}.report-box.full{grid-column:1/-1}}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
  body{font-size:24px;line-height:38px}
  main{width:min(100% - 40px,640px)}
  #start{max-width:570px;margin-inline:auto}
  .result-brand{padding-block:5px}
  .headline h2,.loading-caption h2,dialog h2{font-size:26px;line-height:36px}
  .options span,select{min-height:48px;line-height:32px}
  .windowbar,.verdict small,.verdict p,.form-error,.action-status{font-size:21px}
  .verdict h2{font-size:34px}
  .report-box h3{font-size:24px;line-height:34px}
  .report-box p{font-size:24px;line-height:38px}
}
@media(prefers-reduced-motion:reduce){.load-track span{animation:none;width:100%}.stage-glimmer{animation:none;opacity:.08}}
.report-box.saju-summary{--tab-paper:#e5eddb;--tab-ink:#224732}
.sharp-warn{margin-top:8px;padding:7px 10px;background:#fff0dc;border:1px solid #d48a6a;color:#6b1f2a}
.sharp-warn strong{color:#9c2230}
</style>

        _getYearNineStar:function(yearInGanZhi){
          var indexExact = LunarUtil.getJiaZiIndex(yearInGanZhi) + 1;

          var yearOffset = indexExact - index;
          if (yearOffset > 1) {
            yearOffset -= 60;
          } else if (yearOffset < -1) {
            yearOffset += 60;
          }
          var yuan = Math.floor((this._p.year + yearOffset + 2696) / 60) % 3;
          var offset = (62 + yuan * 3 - indexExact) % 9;
          if(0 === offset){
            offset = 9;
          }
          return NineStar.fromIndex(offset - 1);
        },

              yearInGanZhi = this.getYearInGanZhiExact();

            default:

        getMonthNineStar:function(sect){

          switch (sect) {

              break;
            case 3:
              yearZhiIndex = this._p.yearZhiIndexExact;
              monthZhiIndex = this._p.monthZhiIndexExact;
              break;
            default:
              yearZhiIndex = this._p.yearZhiIndexByLiChun;
              monthZhiIndex = this._p.monthZhiIndex;
          }
          var n = 27 - (yearZhiIndex % 3 * 3);
          if (monthZhiIndex < LunarUtil.BASE_MONTH_ZHI_INDEX) {
            n -= 3;
          }
          return NineStar.fromIndex((n - monthZhiIndex) % 9);

        getDayNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var dongZhi = this._getJieQiSolar(I18n.getMessage('jq.dongZhi'));
          var dongZhi2 = this._getJieQiSolar('DONG_ZHI');
          var xiaZhi = this._getJieQiSolar(I18n.getMessage('jq.xiaZhi'));
          var dongZhiIndex = LunarUtil.getJiaZiIndex(dongZhi.getLunar().getDayInGanZhi());
          var dongZhiIndex2 = LunarUtil.getJiaZiIndex(dongZhi2.getLunar().getDayInGanZhi());
          var xiaZhiIndex = LunarUtil.getJiaZiIndex(xiaZhi.getLunar().getDayInGanZhi());
          var solarShunBai;
          var solarShunBai2;
          var solarNiZi;
          if (dongZhiIndex>29) {
            solarShunBai = dongZhi.next(60 - dongZhiIndex);
          } else {
            solarShunBai = dongZhi.next(-dongZhiIndex);
          }
          var solarShunBaiYmd = solarShunBai.toYmd();
          if (dongZhiIndex2>29) {
            solarShunBai2 = dongZhi2.next(60 - dongZhiIndex2);
          } else {
            solarShunBai2 = dongZhi2.next(-dongZhiIndex2);
          }
          var solarShunBaiYmd2 = solarShunBai2.toYmd();
          if (xiaZhiIndex>29) {
            solarNiZi = xiaZhi.next(60 - xiaZhiIndex);
          } else {
            solarNiZi = xiaZhi.next(-xiaZhiIndex);
          }
          var solarNiZiYmd = solarNiZi.toYmd();
          var offset = 0;
          if (solarYmd >= solarShunBaiYmd && solarYmd < solarNiZiYmd) {
            offset = this._p.solar.subtract(solarShunBai) % 9;
          } else if (solarYmd >= solarNiZiYmd && solarYmd < solarShunBaiYmd2){
            offset = 8 - (this._p.solar.subtract(solarNiZi) % 9);
          } else if (solarYmd >= solarShunBaiYmd2) {
            offset = this._p.solar.subtract(solarShunBai2) % 9;
          } else if (solarYmd < solarShunBaiYmd) {
            offset = (8 + solarShunBai.subtract(this._p.solar)) % 9;
          }
          return NineStar.fromIndex(offset);
        },
        getTimeNineStar:function(){
          var solarYmd = this._p.solar.toYmd();
          var asc = false;
          if((solarYmd >= this._getJieQiSolar(I18n.getMessage('jq.dongZhi')).toYmd() && solarYmd < this._getJieQiSolar(I18n.getMessage('jq.xiaZhi')).toYmd()) || solarYmd >= this._getJieQiSolar('DONG_ZHI').toYmd()){
            asc = true;
          }
          var offset = asc ? [0, 3, 6] : [8, 5, 2];
          var start = offset[this.getDayZhiIndex() % 3];
          var timeZhiIndex = this.getTimeZhiIndex();
          var index = asc ? (start + timeZhiIndex) : (start + 9 - timeZhiIndex);
          return NineStar.fromIndex(index % 9);

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

<script>
'use strict';

// ============================================================================
// 한국 표준시(UTC+9) 기준 정통 만세력 & 세분화 사주 엔진
// - 24절기(입춘·월절기): UTC+8 기준(lunar-javascript)에 -60분 보정해 KST 정확 시점 사용
// - 조자시(00:00~01:29) / 야자시(23:30~23:59) 분리 (한국 정통 야자시법)
// - 한국 명리학 표준 지장간 30일 배분 (지지 1칸 총합 = 1.0 정규화)
// - 시간 모름(3주) vs 시간 있음(4주) 신살 가중치 정규화
// - 일간 10유형 + 신강/신약 + 5대 신살 + 괴강/백호·날카로운 성격 판별 + 성별 기반 대운 반영
// ============================================================================

const STEMS = '甲乙丙丁戊己庚辛壬癸';
const BRANCHES = '子丑寅卯辰巳午未申酉戌亥';

const HIDDEN_STEMS_WEIGHTED = [
  [['癸', 0.67], ['壬', 0.33]],               // 子
  [['己', 0.60], ['癸', 0.30], ['辛', 0.10]], // 丑
  [['甲', 0.54], ['丙', 0.23], ['戊', 0.23]], // 寅
  [['乙', 0.67], ['甲', 0.33]],               // 卯
  [['戊', 0.60], ['乙', 0.30], ['癸', 0.10]], // 辰
  [['丙', 0.54], ['庚', 0.23], ['戊', 0.23]], // 巳
  [['丁', 0.40], ['己', 0.30], ['丙', 0.30]], // 午
  [['己', 0.60], ['丁', 0.30], ['乙', 0.10]], // 未
  [['庚', 0.54], ['壬', 0.23], ['戊', 0.23]], // 申
  [['辛', 0.67], ['庚', 0.33]],               // 酉
  [['戊', 0.60], ['辛', 0.30], ['丁', 0.10]], // 戌
  [['壬', 0.54], ['甲', 0.23], ['戊', 0.23]]  // 亥
];

const BRANCH_ELEMENT = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4]; // 목0 화1 토2 금3 수4
const ELEMENT_INFO = [
  { key: '목', name: '나무 기운', easy: '아이디어를 쑥쑥 키우는 힘' },
  { key: '화', name: '불 기운', easy: '조명 켜지면 시선을 확 끄는 힘' },
  { key: '토', name: '흙 기운', easy: '어디서든 중심을 딱 잡는 힘' },
  { key: '금', name: '쇠 기운', easy: '선이 깔끔하고 디테일을 살리는 힘' },
  { key: '수', name: '물 기운', easy: '감정이 깊고 유연하게 변신하는 힘' }
];

const HOUR_SLOTS = [
  { label: '00:00~01:29 조자시(새벽)', branch: 0, midpoint: 45, yajasi: false },
  { label: '01:30~03:29 축시', branch: 1, midpoint: 150, yajasi: false },
  { label: '03:30~05:29 인시', branch: 2, midpoint: 270, yajasi: false },
  { label: '05:30~07:29 묘시', branch: 3, midpoint: 390, yajasi: false },
  { label: '07:30~09:29 진시', branch: 4, midpoint: 510, yajasi: false },
  { label: '09:30~11:29 사시', branch: 5, midpoint: 630, yajasi: false },
  { label: '11:30~13:29 오시', branch: 6, midpoint: 750, yajasi: false },
  { label: '13:30~15:29 미시', branch: 7, midpoint: 870, yajasi: false },
  { label: '15:30~17:29 신시', branch: 8, midpoint: 990, yajasi: false },
  { label: '17:30~19:29 유시', branch: 9, midpoint: 1110, yajasi: false },
  { label: '19:30~21:29 술시', branch: 10, midpoint: 1230, yajasi: false },
  { label: '21:30~23:29 해시', branch: 11, midpoint: 1350, yajasi: false },
  { label: '23:30~23:59 야자시(밤)', branch: 0, midpoint: 1425, yajasi: true }
];

const MINUTE = 60000;
const wrap = (n, size) => (n % size + size) % size;
const element = stem => Math.floor(STEMS.indexOf(stem) / 2);
const dateAt = (y, m, d, h = 0, min = 0, s = 0) => new Date(Date.UTC(y, m - 1, d, h, min, s));
const julianHour = date => Solar.fromYmdHms(
  date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate(),
  date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()
);

function tenGod(dayStem, targetStem) {
  const samePolarity = STEMS.indexOf(dayStem) % 2 === STEMS.indexOf(targetStem) % 2;
  const groups = [['비견', '겁재'], ['식신', '상관'], ['편재', '정재'], ['편관', '정관'], ['편인', '정인']];
  return groups[wrap(element(targetStem) - element(dayStem), 5)][samePolarity ? 0 : 1];
}

// 한글 조사 자동 판별 ('로'/'으로', '이'/'가')
function withEuro(word) {
  const last = word.charCodeAt(word.length - 1);
  if (last >= 0xAC00 && last <= 0xD7A3) {
    const jong = (last - 0xAC00) % 28;
    return word + (jong === 0 || jong === 8 ? '로' : '으로');
  }
  return word + '로';
}

function withIGa(word) {
  const last = word.charCodeAt(word.length - 1);
  if (last >= 0xAC00 && last <= 0xD7A3) {
    const jong = (last - 0xAC00) % 28;
    return jong === 0 ? '가' : '이';
  }
  return '가';
}

function setKoreanLunarDate(converter, y, m, d, calendar) {
  const leap = calendar === 'leap';
  return converter.setLunarDate(y, m, d, leap) && converter.getLunarCalendar().intercalation === leap;
}

function yangDate(y, m, d, calendar) {
  if (calendar === 'solar') {
    const date = dateAt(y, m, d);
    if (date.getUTCMonth() !== m - 1 || date.getUTCDate() !== d) throw new Error('생년월일을 다시 확인해 주세요.');
    return date;
  }
  const lunar = new KoreanLunarCalendar();
  if (!setKoreanLunarDate(lunar, y, m, d, calendar)) {
    throw new Error('선택한 음력 날짜가 없어요. 날짜와 윤달 여부를 확인해 주세요.');
  }
  const converted = lunar.getSolarCalendar();
  return dateAt(converted.year, converted.month, converted.day);
}

function calendarPillars(civil) {
  const termClock = julianHour(new Date(civil.getTime() - 60 * MINUTE)).getLunar();
  const civilSolar = Solar.fromYmd(civil.getUTCFullYear(), civil.getUTCMonth() + 1, civil.getUTCDate());
  return {
    year: termClock.getYearInGanZhiExact(),
    month: termClock.getMonthInGanZhiExact(),
    day: civilSolar.getLunar().getDayInGanZhi(),
    termClock
  };
}

function makeChart(date, hourIndex, sex = 'female') {
  const slot = hourIndex === null ? null : HOUR_SLOTS[hourIndex];
  const rangeMidpoint = slot ? slot.midpoint : 12 * 60;
  const civil = new Date(date.getTime() + rangeMidpoint * MINUTE);
  const mid = calendarPillars(civil);
  let time = null;
  if (slot) {
    const baseDayIdx = STEMS.indexOf(mid.day[0]) + (slot.yajasi ? 1 : 0);
    time = STEMS[(baseDayIdx * 2 + slot.branch) % 10] + BRANCHES[slot.branch];
  }
  return {
    civil,
    sex,
    hour: hourIndex,
    pillars: [mid.year, mid.month, mid.day, time],
    day: mid.day[0],
    termClock: mid.termClock
  };
}

function elementProfile(chart) {
  const weights = [0, 0, 0, 0, 0];
  const counts = [0, 0, 0, 0, 0];
  const stemPos = [0.9, 1.15, 1.0, 0.9];
  const branchPos = [1.0, 2.0, 1.35, 0.95];

  chart.pillars.forEach((pillar, index) => {
    if (!pillar) return;
    const stemEl = element(pillar[0]);
    const branchIdx = BRANCHES.indexOf(pillar[1]);
    const branchEl = BRANCH_ELEMENT[branchIdx];
    counts[stemEl] += 1;
    counts[branchEl] += 1;
    weights[stemEl] += stemPos[index];
    HIDDEN_STEMS_WEIGHTED[branchIdx].forEach(([stem, ratio]) => {
      weights[element(stem)] += ratio * branchPos[index];
    });
  });

  const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;
  const ratios = weights.map(w => w / totalWeight);
  const ranked = ratios
    .map((value, idx) => ({ idx, value, ...ELEMENT_INFO[idx] }))
    .sort((a, b) => b.value - a.value);
  return { ratios, counts, top: ranked[0], second: ranked[1], weak: ranked[4] };
}

function daeunTrend(chart) {
  const yearStemIdx = STEMS.indexOf(chart.pillars[0][0]);
  const isYangYear = yearStemIdx % 2 === 0;
  const isMale = chart.sex === 'male';
  const forward = (isYangYear && isMale) || (!isYangYear && !isMale);
  const step = forward ? 1 : -1;

  const monthStemIdx = STEMS.indexOf(chart.pillars[1][0]);
  const monthBranchIdx = BRANCHES.indexOf(chart.pillars[1][1]);

  const earlyTenGods = [];
  for (let i = 1; i <= 3; i++) {
    const s = STEMS[wrap(monthStemIdx + step * i, 10)];
    const bIdx = wrap(monthBranchIdx + step * i, 12);
    const bMainStem = HIDDEN_STEMS_WEIGHTED[bIdx][0][0];
    earlyTenGods.push(tenGod(chart.day, s), tenGod(chart.day, bMainStem));
  }
  const hasExpress = earlyTenGods.filter(g => g === '식신' || g === '상관').length;
  const hasCrowd = earlyTenGods.filter(g => g === '편재' || g === '정재').length;
  const hasHonor = earlyTenGods.filter(g => g === '정관' || g === '편관').length;
  const hasStudy = earlyTenGods.filter(g => g === '정인' || g === '편인').length;

  let timingKey = 'steady';
  if (hasExpress >= 2 || (hasExpress >= 1 && hasCrowd >= 2)) timingKey = 'fast';
  else if (hasHonor >= 2) timingKey = 'trust';
  else if (hasStudy >= 2) timingKey = 'late';
  else if (hasCrowd >= 2) timingKey = 'viral';

  return { forward, timingKey };
}

function calendarMaximumDay(year, month, calendar) {
  if (calendar === 'solar') return dateAt(year || 2000, month + 1, 0).getUTCDate();
  if (!year) return 30;
  const converter = new KoreanLunarCalendar();
  if (setKoreanLunarDate(converter, year, month, 30, calendar)) return 30;
  return setKoreanLunarDate(converter, year, month, 29, calendar) ? 29 : 0;
}

function updateMonths() {
  const previous = monthSelect.value;
  const year = Number(yearSelect.value);
  const calendar = form.elements.calendar.value;
  monthSelect.length = 1;
  const last = calendar === 'solar' && year === thisYear ? thisMonth : 12;
  for (let month = 1; month <= last; month++) {
    if (calendar === 'leap' && year && !calendarMaximumDay(year, month, calendar)) continue;
    monthSelect.add(new Option(`${month}월`, month));
  }
  monthSelect.value = [...monthSelect.options].some(option => option.value === previous) ? previous : '';
}

function updateDays() {
  const previous = daySelect.value;
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);
  const calendar = form.elements.calendar.value;
  daySelect.length = 1;
  let max = month ? calendarMaximumDay(year, month, calendar) : 0;
  if (calendar === 'solar' && year === thisYear && month === thisMonth) max = Math.min(max, today);
  for (let day = 1; day <= max; day++) daySelect.add(new Option(`${day}일`, day));
  daySelect.value = [...daySelect.options].some(option => option.value === previous) ? previous : '';
}

function detectSharpPersonality(chart, t, elRatios) {
  const [, fire, , metal] = elRatios;
  const dayPillar = chart.pillars[2];
  const candidates = [];

  if (t.상관 >= 0.21) candidates.push(['blunt', t.상관 * 1.4]);
  if (t.편관 >= 0.19 || (t.편관 >= 0.14 && metal >= 0.25)) candidates.push(['cold', t.편관 * 1.3 + metal * 0.35]);
  if (t.겁재 >= 0.20 || t.비겁 >= 0.40) candidates.push(['pride', t.겁재 * 1.3 + t.비겁 * 0.3]);
  if (STRONG_EDGE_PILLARS.has(dayPillar) && t.selfPower >= 0.42) candidates.push(['fierce', 0.36 + t.selfPower * 0.25]);
  if (fire >= 0.32) candidates.push(['hot', fire * 1.25]);
  if (t.편인 >= 0.23) candidates.push(['picky', t.편인 * 1.25]);

  if (!candidates.length) return null;
  candidates.sort((a, b) => b[1] - a[1]);
  return SHARP_WARNINGS[candidates[0][0]];
}

const TEN_NAMES = ['비견', '겁재', '식신', '상관', '편재', '정재', '편관', '정관', '편인', '정인'];

const PEACH_BY_BRANCH = ['酉', '午', '卯', '子', '酉', '午', '卯', '子', '酉', '午', '卯', '子'];
const HWAGAE_BY_BRANCH = ['辰', '丑', '戌', '未', '辰', '丑', '戌', '未', '辰', '丑', '戌', '未'];
const YEOKMA_BY_BRANCH = ['寅', '亥', '申', '巳', '寅', '亥', '申', '巳', '寅', '亥', '申', '巳'];

const HONGYEOM_BY_DAY = {
  '甲': ['午'], '乙': ['午'], '丙': ['寅'], '丁': ['未'], '戊': ['辰'],
  '己': ['辰'], '庚': ['戌'], '辛': ['酉'], '壬': ['子'], '癸': ['申']
};

const NOBLE_BY_DAY = {
  '甲': ['丑', '未'], '戊': ['丑', '未'], '庚': ['丑', '未'],
  '乙': ['子', '申'], '己': ['子', '申'],
  '丙': ['亥', '酉'], '丁': ['亥', '酉'],
  '壬': ['卯', '巳'], '癸': ['卯', '巳'],
  '辛': ['寅', '午']
};

const CARDINAL_BRANCHES = new Set(['子', '午', '卯', '酉']);

function auditionTraits(chart) {
  const weights = Object.fromEntries(TEN_NAMES.map(name => [name, 0]));
  const stemPos = [0.85, 1.15, 0, 0.90];
  const branchPos = [0.95, 1.85, 1.30, 0.95];

  chart.pillars.forEach((pillar, pos) => {
    if (!pillar) return;
    if (pos !== 2) {
      weights[tenGod(chart.day, pillar[0])] += stemPos[pos];
    }
    const branchIdx = BRANCHES.indexOf(pillar[1]);
    HIDDEN_STEMS_WEIGHTED[branchIdx].forEach(([stem, ratio]) => {
      weights[tenGod(chart.day, stem)] += ratio * branchPos[pos];
    });
  });

  const total = Object.values(weights).reduce((sum, v) => sum + v, 0) || 1;
  for (const name of TEN_NAMES) weights[name] /= total;

  const starPos = [0.80, 1.15, 1.00, 0.85];
  const activePosSum = chart.pillars.reduce((s, p, i) => s + (p ? starPos[i] : 0), 0) || 1;

  const baseBranches = [0, 2].map(i => BRANCHES.indexOf(chart.pillars[i][1]));
  const peachSet = new Set(baseBranches.map(b => PEACH_BY_BRANCH[b]));
  const hwagaeSet = new Set(baseBranches.map(b => HWAGAE_BY_BRANCH[b]));
  const yeokmaSet = new Set(baseBranches.map(b => YEOKMA_BY_BRANCH[b]));
  const hongyeomSet = new Set(HONGYEOM_BY_DAY[chart.day] || []);
  const nobleSet = new Set(NOBLE_BY_DAY[chart.day] || []);

  let peachRaw = 0, hwagaeRaw = 0, yeokmaRaw = 0, hongyeomRaw = 0, nobleRaw = 0;
  chart.pillars.forEach((pillar, i) => {
    if (!pillar) return;
    const b = pillar[1];
    const w = starPos[i];
    if (peachSet.has(b)) peachRaw += w;
    else if (CARDINAL_BRANCHES.has(b)) peachRaw += w * 0.35;
    if (hwagaeSet.has(b)) hwagaeRaw += w;
    if (yeokmaSet.has(b)) yeokmaRaw += w;
    if (hongyeomSet.has(b)) hongyeomRaw += w;
    if (nobleSet.has(b)) nobleRaw += w;
  });

  const 도화 = Math.min(1, peachRaw / activePosSum * 1.65);
  const 화개 = Math.min(1, hwagaeRaw / activePosSum * 1.65);
  const 역마 = Math.min(1, yeokmaRaw / activePosSum * 1.65);
  const 홍염 = Math.min(1, hongyeomRaw / activePosSum * 1.85);
  const 귀인 = Math.min(1, nobleRaw / activePosSum * 1.75);

  const 비겁 = weights.비견 + weights.겁재;
  const 식상 = weights.식신 + weights.상관;
  const 재성 = weights.편재 + weights.정재;
  const 관성 = weights.편관 + weights.정관;
  const 인성 = weights.편인 + weights.정인;

  const selfPower = 비겁 + 인성;
  const energyStyle = selfPower >= 0.56 ? 'strong' : selfPower <= 0.36 ? 'soft' : 'balanced';

  return {
    ...weights,
    비겁, 식상, 재성, 관성, 인성,
    도화, 화개, 역마, 홍염, 귀인,
    selfPower, energyStyle
  };
}

// ============================================================================
// 사주 기반 종합 판정 엔진 (23개 유형 균형 분포 + 5개 탈락 유형 + 날카로운 성격 판별)
// ============================================================================

function judge(chart) {
  const t = auditionTraits(chart);
  const el = elementProfile(chart);
  const [wood, fire, earth, metal, water] = el.ratios;
  const daeun = daeunTrend(chart);

  const dm = chart.day;
  const dmBonus = {
    idolCenter: dm === '丙' ? 0.12 : dm === '乙' ? 0.05 : 0,
    idolLeader: dm === '甲' || dm === '戊' ? 0.11 : 0,
    idolVocal: dm === '癸' || dm === '丁' ? 0.09 : 0,
    idolDance: dm === '丙' || dm === '庚' ? 0.08 : 0,
    idolQuiet: dm === '己' || dm === '癸' ? 0.09 : 0,
    actorCraft: dm === '丁' || dm === '戊' ? 0.10 : 0,
    actorFace: dm === '辛' ? 0.14 : dm === '乙' ? 0.06 : 0,
    actorScene: dm === '丙' || dm === '壬' ? 0.08 : 0,
    actorVillain: dm === '庚' || dm === '辛' ? 0.11 : 0,
    actorMelo: dm === '乙' || dm === '丁' ? 0.12 : 0,
    actorSupport: dm === '己' || dm === '戊' ? 0.11 : 0,
    actorExtra: dm === '己' ? 0.06 : 0,
    singer: dm === '丁' || dm === '癸' ? 0.11 : 0,
    singerSongwriter: dm === '甲' || dm === '乙' || dm === '癸' ? 0.10 : 0,
    musical: dm === '丙' || dm === '丁' ? 0.10 : 0,
    lipsync: dm === '丙' || dm === '辛' ? 0.09 : 0,
    trot: dm === '戊' || dm === '己' ? 0.10 : 0,
    comedy: dm === '己' || dm === '壬' ? 0.08 : 0,
    variety: dm === '壬' || dm === '丙' ? 0.09 : 0,
    mc: dm === '戊' || dm === '甲' ? 0.09 : 0,
    model: dm === '辛' || dm === '庚' ? 0.12 : 0,
    commercial: dm === '乙' || dm === '己' ? 0.09 : 0,
    creator: dm === '壬' || dm === '甲' ? 0.11 : 0
  };

  const z = {
    비견: (t.비견 - 0.104) / 0.104,
    겁재: (t.겁재 - 0.100) / 0.100,
    식신: (t.식신 - 0.103) / 0.110,
    상관: (t.상관 - 0.099) / 0.095,
    편재: (t.편재 - 0.096) / 0.101,
    정재: (t.정재 - 0.094) / 0.097,
    편관: (t.편관 - 0.100) / 0.097,
    정관: (t.정관 - 0.101) / 0.099,
    편인: (t.편인 - 0.107) / 0.105,
    정인: (t.정인 - 0.096) / 0.099,
    도화: (t.도화 - 0.323) / 0.261,
    홍염: (t.홍염 - 0.171) / 0.286,
    화개: (t.화개 - 0.359) / 0.330,
    역마: (t.역마 - 0.199) / 0.284,
    귀인: (t.귀인 - 0.250) / 0.293,
    목: (wood - 0.170) / 0.135,
    화: (fire - 0.164) / 0.107,
    토: (earth - 0.285) / 0.121,
    금: (metal - 0.160) / 0.144,
    수: (water - 0.221) / 0.140
  };

  const isStrong = t.energyStyle === 'strong' ? 0.22 : 0;
  const isSoft = t.energyStyle === 'soft' ? 0.22 : 0;

  const scores = {
    idolCenter:       0.92 * z.도화 + 0.85 * z.상관 + 0.72 * z.화 + 0.35 * z.홍염 + isStrong + dmBonus.idolCenter * 2.0,
    idolLeader:       1.05 * z.정관 + 0.75 * z.비견 + 0.55 * z.정재 + 0.45 * z.토 + isStrong + dmBonus.idolLeader * 2.0,
    idolVocal:        1.14 * z.식신 + 0.86 * z.정인 + 0.62 * z.수 + 0.42 * z.화개 + dmBonus.idolVocal * 2.2,
    idolDance:        0.95 * z.역마 + 0.88 * z.겁재 + 0.70 * z.화 + 0.48 * z.상관 + isStrong + dmBonus.idolDance * 2.0,
    idolQuiet:        0.88 * z.정인 + 0.82 * z.정재 + 0.65 * z.비견 + 0.45 * z.토 - 0.45 * z.도화 - 0.38 * z.상관 + isSoft + dmBonus.idolQuiet * 2.0,

    actorCraft:       1.05 * z.정인 + 0.82 * z.식신 + 0.65 * z.화개 + 0.45 * z.정관 + dmBonus.actorCraft * 2.0,
    actorFace:        0.74 * z.도화 + 0.72 * z.금 + 0.48 * z.홍염 + 0.42 * z.정재 + dmBonus.actorFace * 1.6,
    actorScene:       1.02 * z.상관 + 0.92 * z.편인 + 0.55 * z.화 + 0.45 * z.역마 + dmBonus.actorScene * 2.0,
    actorVillain:     1.08 * z.편관 + 0.88 * z.편인 + 0.62 * z.금 + 0.45 * z.상관 + dmBonus.actorVillain * 2.0,
    actorMelo:        0.92 * z.홍염 + 0.78 * z.수 + 0.55 * z.도화 + 0.58 * z.정인 + isSoft + dmBonus.actorMelo * 2.0,
    actorSupport:     0.98 * z.정재 + 0.82 * z.정관 + 0.65 * z.토 + 0.48 * z.귀인 + dmBonus.actorSupport * 2.0,
    actorExtra:       0.92 * z.비견 + 0.85 * z.정관 + 0.75 * z.토 + 0.58 * z.정인 - 0.42 * z.도화 - 0.40 * z.식신 - 0.40 * z.상관 + isSoft + dmBonus.actorExtra * 2.0,

    singer:           1.05 * z.식신 + 0.85 * z.화개 + 0.65 * z.수 + 0.48 * z.정인 + dmBonus.singer * 2.0,
    singerSongwriter: 1.02 * z.편인 + 0.82 * z.식신 + 0.75 * z.목 + 0.50 * z.화개 + dmBonus.singerSongwriter * 2.0,
    musical:          0.95 * z.식신 + 0.85 * z.화 + 0.72 * z.역마 + 0.52 * z.정인 + isStrong + dmBonus.musical * 2.0,
    lipsync:          0.95 * z.상관 + 0.82 * z.화 + 0.72 * z.도화 + 0.65 * z.겁재 + dmBonus.lipsync * 2.0,
    trot:             0.92 * z.편재 + 0.85 * z.식신 + 0.68 * z.화 + 0.58 * z.토 + dmBonus.trot * 2.0,

    comedy:           1.18 * z.상관 + 0.82 * z.식신 + 0.55 * z.편재 + 0.48 * z.목 + dmBonus.comedy * 2.0,
    variety:          1.02 * z.편재 + 0.88 * z.상관 + 0.68 * z.역마 + 0.52 * z.겁재 + dmBonus.variety * 2.0,
    mc:               0.98 * z.정관 + 0.85 * z.편재 + 0.68 * z.귀인 + 0.45 * z.토 + dmBonus.mc * 2.0,
    model:            0.95 * z.금 + 0.78 * z.도화 + 0.72 * z.비견 + 0.52 * z.화개 + dmBonus.model * 2.0,
    commercial:       0.88 * z.홍염 + 0.78 * z.정재 + 0.75 * z.귀인 + 0.52 * z.도화 + dmBonus.commercial * 2.0,
    creator:          1.02 * z.편인 + 0.88 * z.비견 + 0.68 * z.수 + 0.58 * z.상관 + dmBonus.creator * 2.0
  };

  const rankedRoles = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [variant, topScore] = rankedRoles[0];

  const auditionScore =
    1.15 * t.식상 +
    0.34 * t.도화 +
    0.26 * t.홍염 +
    0.32 * t.재성 +
    0.22 * t.역마 +
    0.18 * t.귀인 +
    0.18 * fire;

  const passed = auditionScore >= 0.425 || (t.식상 >= 0.14 && topScore >= 2.2);

  const supportCandidates = [
    ['인성', t.인성],
    ['관성', t.관성],
    ['재성', t.재성],
    ['비겁', t.비겁]
  ].sort((a, b) => b[1] - a[1]);
  const support = supportCandidates[0][1] < 0.30 ? '균형' : supportCandidates[0][0];

  const popularityScore =
    0.85 * t.식상 +
    0.36 * t.도화 +
    0.32 * t.홍염 +
    0.52 * t.재성 +
    0.30 * t.귀인 +
    0.28 * t.관성 +
    0.14 * fire;

  const popularity = variant === 'actorExtra'
    ? EXTRA_POPULARITY[popularityScore >= 0.72 ? 1 : 0]
    : variant === 'idolQuiet'
    ? QUIET_POPULARITY[popularityScore >= 0.72 ? 1 : 0]
    : POPULARITY[popularityScore >= 0.96 ? 3 : popularityScore >= 0.78 ? 2 : popularityScore >= 0.62 ? 1 : 0];

  const zAll = {
    ...z,
    인성: (t.인성 - 0.203) / 0.14,
    관성: (t.관성 - 0.201) / 0.14,
    재성: (t.재성 - 0.190) / 0.14,
    비겁: (t.비겁 - 0.204) / 0.14,
    식상: (t.식상 - 0.202) / 0.14
  };
  const signalEntries = Object.entries(ROLE_SIGNALS[variant])
    .sort(([a], [b]) => (zAll[b] ?? -9) - (zAll[a] ?? -9));
  const evidence = signalEntries.slice(0, 2);

  const topCharmEntry = [
    ['도화', t.도화],
    ['홍염', t.홍염],
    ['화개', t.화개],
    ['역마', t.역마],
    ['귀인', t.귀인]
  ].sort((a, b) => b[1] - a[1])[0];

  const sharpWarning = detectSharpPersonality(chart, t, el.ratios);

  return {
    dayKey: chart.day,
    variant,
    passed,
    popularity,
    evidence,
    support,
    dayMaster: DAY_MASTER_INFO[chart.day],
    energy: ENERGY_STYLE_INFO[t.energyStyle],
    topElement: el.top,
    topCharmLabel: topCharmEntry[1] >= 0.25 ? CHARM_LABELS[topCharmEntry[0]] : null,
    sharpWarning,
    timingText: TIMING_NOTES[daeun.timingKey]
  };
}

function reportSection(title, content, style = '') {
  return `<section class="report-box ${style}"><h3>${title}</h3><div class="report-copy">${content}</div></section>`;
}

function buildReportHtml(chart) {
  const res = judge(chart);
  const { variant, passed, popularity, evidence, support, dayMaster, energy, topElement, topCharmLabel, sharpWarning, timingText } = res;
  const detail = ROLES[variant];
  const debutAs = withEuro(detail.title);
  const failNote = FAIL_NOTES[support];

  const sajuSummaryHtml = `
    <p>본캐는 <strong>${dayMaster.name}</strong>(${energy.label}). ${dayMaster.summary}</p>
    <p>제일 센 건 <strong>${topElement.name}</strong>(${topElement.easy}).${topCharmLabel ? ` 여기에 <strong>${topCharmLabel}</strong>까지 장착됨.` : ''}</p>
  `;

  const [, [ev0Label, ev0Clause]] = evidence[0];
  const [, [ev1Label, ev1Clause]] = evidence[1];
  const reasonHtml = `
    <p>${detail.debut}</p>
    <p>사주에 <strong>${ev0Label}</strong>${withIGa(ev0Label)} 강해서 ${ev0Clause} 여기에 <strong>${ev1Label}</strong>까지 더해져 ${ev1Clause}</p>
  `;

  const sharpHtml = sharpWarning
    ? `<p class="sharp-warn"><strong>${sharpWarning.title}</strong> — ${sharpWarning.text}</p>`
    : '';

  return {
    passed,
    html: `
    <header class="result-brand">
      <h1 class="test-title">테스트잇 사주로 보는 연예인 데뷔 테스트</h1>
    </header>
    <header class="verdict">
      <img class="sprite" src="${resultIcon(passed ? variant : 'hold')}" alt="">
      <small>${passed ? '최종 합격' : '최종 탈락'}</small>
      <h2 id="report-title" tabindex="-1">${passed ? debutAs + ' 데뷔!' : '<span>죄송합니다…</span><span>당신은 데뷔를 하지 못하셨습니다.</span>'}</h2>
      ${passed ? `<p>${detail.slot}</p>` : ''}
    </header>
    <div class="report">
      ${reportSection('내 사주 한눈에 보기', sajuSummaryHtml, 'full saju-summary')}
      ${passed ? `
      ${reportSection(`내가 ${debutAs} 데뷔한 이유`, reasonHtml, 'full reason')}
      ${reportSection('데뷔 후 인기 & 타이밍', `<p><strong>${popularity.label}</strong> — ${popularity.text}</p>
        <p>${timingText}</p>`, 'full')}
      ${reportSection('팬들이 좋아하는 이유', `<p>${detail.hook}</p>`, 'full fans')}
      ${reportSection('안티들이 싫어하는 이유', `<p>${detail.anti}</p>`, 'full anti')}
      ${reportSection('활동하면서 조심할 점', `<p>${detail.risk}</p><p>${energy.tip}</p>${sharpHtml}`, 'full caution')}
    ` : `
      ${reportSection('오디션을 통과하지 못한 이유', `<p>${failNote.reason}</p>`, 'full reason')}
      ${reportSection('내가 더 빛나는 자리', `<p>${failNote.edge}</p>`, 'full fans')}
      ${reportSection('심사위원이 남긴 한마디', `<p>굳이 한 분야를 꼽자면 <strong>${detail.title}</strong> 쪽 가능성이 제일 눈에 띄었음.</p><p>${timingText}</p>${sharpHtml}`, 'full caution')}
    `}
    </div>`
  };
}

function displayReport(chart) {
  const { passed, html } = buildReportHtml(chart);
  const report = byId('report-content');
  report.classList.toggle('fail', !passed);
  report.innerHTML = html;
}

form.addEventListener('change', event => {
  if (event.target.name === 'calendar' || event.target.name === 'year') updateDateFields();
  if (event.target.name === 'month') updateDays();
  if (!monthSelect.disabled) formError();
});

form.addEventListener('submit', event => {
  event.preventDefault();
  if (byId('details').hidden) return;
  const fields = new FormData(form);
  if (monthSelect.disabled) {
    formError('선택한 해에는 윤달이 없어요.');
    return;
  }
  try {
    const date = yangDate(
      Number(fields.get('year')),
      Number(fields.get('month')),
      Number(fields.get('day')),
      fields.get('calendar')
    );
    if (date > cutoff) throw new Error('오늘 이전의 생년월일을 선택해 주세요.');
    const hour = fields.get('hour');
    const sex = fields.get('sex') || 'female';
    displayReport(makeChart(date, hour === 'unknown' ? null : Number(hour), sex));
    showStage('loading', 'loading-title');
    window.setTimeout(() => showStage('result', 'report-title'), 3000);
  } catch (error) {
    console.error(error);
    formError(error instanceof RangeError || error instanceof TypeError
      ? '생년월일과 시간을 다시 확인해 주세요.'
      : error.message);
  }
});

updateDateFields();
drawStage(byId('loading-stage-art'), true);
byId('start-button').addEventListener('click', () => showStage('details', 'form-title'));
byId('restart-button').addEventListener('click', () => {
  form.reset();
  updateDateFields();
  byId('report-content').replaceChildren();
  statusText();
  showStage('start', 'main-title');
});

const imageDialog = byId('image-dialog');
const shareDialog = byId('share-dialog');
const save = byId('save-button');
const savedImage = byId('saved-image');

function statusText(message = '') {
  const status = byId('action-status');
  status.textContent = message;
  status.hidden = !message;
}

save.addEventListener('click', async () => {
  statusText();
  save.disabled = true;
  let imageTimeout;
  try {
    if (document.fonts) await document.fonts.ready;
    const width = reportPaper.offsetWidth;
    const height = reportPaper.offsetHeight;
    const canvas = await html2canvas(reportPaper, {
      width, height,
      scale: Math.min(2.3, Math.sqrt(3000000 / (width * height))),
      backgroundColor: '#481723',
      logging: false,
      onclone: (_document, clone) => { clone.style.boxShadow = 'inset 0 0 0 1px #9b5b43'; }
    });
    savedImage.src = canvas.toDataURL('image/png');
    await Promise.race([
      savedImage.decode(),
      new Promise((_, reject) => { imageTimeout = setTimeout(() => reject(new Error('PNG 시간 초과')), 5000); })
    ]);
    if (!byId('result').hidden) imageDialog.showModal();
  } catch (error) {
    console.error(error);
    statusText('이미지를 만들지 못했어요. 다시 눌러 주세요.');
  } finally {
    clearTimeout(imageTimeout);
    save.disabled = false;
  }
});

imageDialog.addEventListener('close', () => {
  savedImage.removeAttribute('src');
  save.focus({ preventScroll: true });
});
shareDialog.addEventListener('close', () => byId('share-button').focus({ preventScroll: true }));

byId('share-button').addEventListener('click', async () => {
  statusText();
  if (navigator.share) {
    try {
      await navigator.share({ text: document.title, url: shareUrl });
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  const shareText = `${document.title}
${shareUrl}`;
  try {
    await navigator.clipboard.writeText(shareText);
    statusText('테스트 링크를 복사했어요.');
  } catch {
    const field = byId('share-address');
    field.value = `${document.title} ${shareUrl}`;
    shareDialog.showModal();
    field.select();
  }
});

for (const dialog of [imageDialog, shareDialog]) {
  dialog.addEventListener('click', event => {
    if (event.target === dialog) dialog.close();
  });
}

</script>
</body>
</html>
