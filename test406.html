    .loading-panel {
      width: 100%;

    .loading-heading {
      min-height: 56px;
      padding: 13px 15px;
      border-bottom: 1px solid var(--ink);
      background: var(--paper-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1.35;
      text-align: center;
    }

    .loading-content {
      min-height: 360px;
      padding: 36px 24px 31px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .loading-grid {
      width: 190px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--ink);
      border-left: 1px solid var(--ink);
      background: var(--paper-light);
    }

    .loading-grid-cell {
      aspect-ratio: 1 / 1;
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      background: var(--paper-light);
      animation: loadingCell 1.35s infinite steps(1, end);
    }

    .loading-grid-cell:nth-child(1) {
      animation-delay: 0s;
    }

    .loading-grid-cell:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-grid-cell:nth-child(3) {
      animation-delay: 0.3s;
    }

    .loading-grid-cell:nth-child(4) {
      animation-delay: 0.45s;
    }

    .loading-grid-cell:nth-child(5) {
      animation-delay: 0.6s;
    }

    .loading-grid-cell:nth-child(6) {
      animation-delay: 0.75s;
    }

    .loading-grid-cell:nth-child(7) {
      animation-delay: 0.9s;
    }

    .loading-grid-cell:nth-child(8) {
      animation-delay: 1.05s;
    }

    .loading-grid-cell:nth-child(9) {
      animation-delay: 1.2s;
    }

    @keyframes loadingCell {
      0%,
      18% {
        background: var(--yellow);
      }

      19%,
      100% {
        background: var(--paper-light);
      }
    }

      margin: 25px 0 0;
      font-size: 22px;
      line-height: 1.45;
      font-weight: normal;
    }

    }

      const progress =
        Math.round(
          (current / questions.length) * 100
        );

      progressNumber.textContent =
        `${current} / ${questions.length}`;

      questionNumber.textContent =
        String(current).padStart(2, '0');

      progressFill.style.width =
        `${progress}%`;

      progressFill.parentElement.setAttribute(
        'aria-valuenow',
        String(progress)
      );

      questionText.innerHTML =
        question.text;

      answerList.innerHTML = '';
      answerLocked = false;

      question.answers.forEach((answer, index) => {
        const button =
          document.createElement('button');

        const number =
          document.createElement('span');

        const copy =
          document.createElement('span');

        const checkWrap =
          document.createElement('span');

        const check =
          document.createElement('span');

        button.type = 'button';
        button.className = 'answer-button';

        number.className = 'answer-number';
        number.textContent = String(index + 1);

        copy.className = 'answer-copy';
        copy.innerHTML = answer.text;

        checkWrap.className = 'answer-check-wrap';
        check.className = 'answer-check';

        checkWrap.appendChild(check);

        button.appendChild(number);
        button.appendChild(copy);
        button.appendChild(checkWrap);

        button.addEventListener('click', () => {
          selectAnswer(answer.letter);
        });

        answerList.appendChild(button);
      });
    }

    function selectAnswer(letter) {
      if (answerLocked) {
        return;
      }

      if (
        !Object.prototype.hasOwnProperty.call(
          scores,
          letter
        )
      ) {
        return;
      }

      answerLocked = true;

      const buttons =
        answerList.querySelectorAll('.answer-button');

      buttons.forEach((button) => {
        button.disabled = true;
      });

      scores[letter] += 1;
      currentQuestionIndex += 1;

      setTimeout(() => {
        if (
          currentQuestionIndex <
          questions.length
        ) {
          renderQuestion();

          /* 질문이 바뀔 때 현재 스크롤 위치를 유지합니다. */
          return;
        }

        showLoadingScreen();
      }, 160);
    }

    function showLoadingScreen() {
      clearTimeout(resultLoadingTimer);

      showScreen('loadingScreen');

      resultLoadingTimer = setTimeout(() => {
        resultLoadingTimer = null;
        showResult();
      }, 3000);
    }

    function calculateInternalType() {
      const first =
        scores.E > scores.I ? 'E' : 'I';

      const second =
        scores.S > scores.N ? 'S' : 'N';

      const third =
        scores.T > scores.F ? 'T' : 'F';

      const fourth =
        scores.J > scores.P ? 'J' : 'P';

      return first + second + third + fourth;
    }

    function createTextAbilityCell(
      label,
      description
    ) {
      const cell =
        document.createElement('div');

      const labelClass =
        label === '사회적배터리'
          ? 'ability-label long-label'
          : 'ability-label';

      cell.className = 'ability-cell';

      cell.innerHTML = `
        <div class="${labelClass}">
          ${label}
        </div>

        <div class="ability-result">
          <div class="ability-description main-description">
            ${description}
          </div>
        </div>
      `;

      return cell;
    }

    function createScoreAbilityCell(
      label,
      resultData
    ) {
      const cell =
        document.createElement('div');

      const labelClass =
        label === '사회적배터리'
          ? 'ability-label long-label'
          : 'ability-label';

      cell.className = 'ability-cell';

      cell.innerHTML = `
        <div class="${labelClass}">
          ${label}
        </div>

        <div class="ability-result">
          <div class="ability-description">
            ${resultData.text}
          </div>

          <div class="ability-score">
            ${resultData.score}점
          </div>

          <div
            class="ability-bar"
            aria-hidden="true"
          >
            <div
              class="ability-bar-fill"
              style="width: ${resultData.score}%"
            ></div>
          </div>
        </div>
      `;

      return cell;
    }

    function buildResultGrid(profile) {
      abilityGrid.innerHTML = '';

      abilityGrid.appendChild(
        createTextAbilityCell(
          '성격',
          profile.personality
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '통제성향',
          profile.control
        )
      );

      abilityGrid.appendChild(
        createTextAbilityCell(
          '연애스타일',
          profile.love
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '예민미',
          profile.sensitivity
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '공격력',
          profile.aggression
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '다정함',
          profile.kindness
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '멘탈',
          profile.mental
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '공감력',
          profile.empathy
        )
      );

      abilityGrid.appendChild(
        createScoreAbilityCell(
          '사회적배터리',
          profile.battery
        )
      );
    }

    function showResult() {
      const internalType =
        calculateInternalType();

      const profile =
        profiles[internalType];

      if (!profile) {
        showToast(
          '결과를 불러오지 못했습니다.'
        );

        return;
      }

      resultNickname.textContent =
        nickname;

      buildResultGrid(profile);
      showScreen('resultScreen');
    }

    async function createResultImage() {
      const resultCard =
        document.getElementById('resultCard');

      const originalText =
        saveResultButton.textContent;

      saveResultButton.disabled = true;
      saveResultButton.textContent =
        '이미지 만드는 중...';

      try {
        if (
          document.fonts &&
          document.fonts.ready
        ) {
          await document.fonts.ready;
        }

        const canvas =
          await html2canvas(resultCard, {
            backgroundColor: '#efe1ca',
            scale: 2,
            useCORS: true,
            allowTaint: false,
            logging: false,
            scrollX: 0,
            scrollY: -window.scrollY
          });

        savePreviewImage.src =
          canvas.toDataURL('image/png', 1);

        saveModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      } catch (error) {
        console.error(error);

        showToast(
          '이미지를 만들지 못했습니다. 다시 시도해주세요.'
        );
      } finally {
        saveResultButton.disabled = false;
        saveResultButton.textContent =
          originalText;
      }
    }

    function closeSaveModal() {
      saveModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function restartTest() {
      clearTimeout(resultLoadingTimer);
      resultLoadingTimer = null;

      nickname = '';
      currentQuestionIndex = 0;
      answerLocked = false;

      nicknameInput.value = '';
      inputMessage.textContent = '';
      abilityGrid.innerHTML = '';

      resetScores();
      showScreen('startScreen');
    }

    async function shareTest() {
      const shareText =
        `${TEST_TITLE}\n${TEST_URL}`;

      if (navigator.share) {
        try {
          await navigator.share({
            text: shareText
          });

          return;
        } catch (error) {
          if (error.name === 'AbortError') {
            return;
          }
        }
      }

      try {
        await copyText(shareText);

        showToast(
          '테스트 제목과 주소가 복사되었습니다.'
        );
      } catch (error) {
        console.error(error);

        showToast(
          '주소를 복사하지 못했습니다.'
        );
      }
    }

    async function copyText(text) {
      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea =
        document.createElement('textarea');

      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      textarea.style.pointerEvents = 'none';

      document.body.appendChild(textarea);
      textarea.select();

      const copied =
        document.execCommand('copy');

      textarea.remove();

      if (!copied) {
        throw new Error('복사 실패');
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    startButton.addEventListener(
      'click',
      () => {
        showScreen('infoScreen');

        setTimeout(() => {
          nicknameInput.focus();
        }, 100);
      }
    );

    infoNextButton.addEventListener(
      'click',
      beginQuestions
    );

    nicknameInput.addEventListener(
      'input',
      () => {
        if (nicknameInput.value.trim()) {
          inputMessage.textContent = '';
        }
      }
    );

    nicknameInput.addEventListener(
      'keydown',
      (event) => {
        if (event.key === 'Enter') {
          beginQuestions();
        }
      }
    );

    saveResultButton.addEventListener(
      'click',
      createResultImage
    );

    restartButton.addEventListener(
      'click',
      restartTest
    );

    otherTestButton.addEventListener(
      'click',
      () => {
        window.location.href =
          'https://test-it.co.kr/';
      }
    );

    shareButton.addEventListener(
      'click',
      shareTest
    );

    modalCloseButton.addEventListener(
      'click',
      closeSaveModal
    );

    saveModal.addEventListener(
      'click',
      (event) => {
        if (event.target === saveModal) {
          closeSaveModal();
        }
      }
    );

    document.addEventListener(
      'keydown',
      (event) => {
        if (
          event.key === 'Escape' &&
          saveModal.classList.contains('active')
        ) {
          closeSaveModal();
        }
      }
    );
  </script>
</body>
</html>
