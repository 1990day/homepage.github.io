<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>테스트잇 사주 책갈피 성격 테스트</title>
  <meta name="description" content="생년월일로 확인하는 나의 60갑자 사주 책갈피 성격 테스트">
  <meta property="og:title" content="테스트잇 사주 책갈피 성격 테스트">
  <meta property="og:description" content="나의 일주와 성격 유형을 확인해보세요">
  <meta property="og:url" content="https://test-it.co.kr/test413">
  <meta property="og:type" content="website">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: 'Galmuri14';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri14.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --accent: #000;
      --accent-2: #000;
      --accent-soft: #fff;
      --ink: #000;
      --muted: #000;
      --line: #000;
      --paper: #fff;
      --page-width: 590px;
      --highlight-main: #fff36d;
      --highlight-outer: #8ff0c7;
      --highlight-inner: #ff9fc1;
      --book-brown: #3b2520;
      --book-brown-deep: #2b1814;
      --book-gold: #d6aa65;
      --book-paper: #fff9f0;
      --book-paper-deep: #f4e8d8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: 'Galmuri14', monospace;
      word-break: keep-all;
      letter-spacing: -0.35px;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: none;
      font-synthesis: none;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      width: min(100%, var(--page-width));
      height: 58px;
      margin: 0 auto;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #000;
      background: #fff;
    }

    .logo {
      font-size: 19px;
      font-weight: normal;
      letter-spacing: -0.8px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 15px;
      font-weight: normal;
    }

    .site-nav a:last-child {
      background: #fff;
      color: #000;
    }

    .app {
      width: min(100%, var(--page-width));
      min-height: calc(100vh - 58px);
      margin: 0 auto;
      padding: 24px 14px 48px;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    .start-screen {
      position: relative;
      width: min(100%, 480px);
      margin: 0 auto;
      text-align: center;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .start-card {
      width: 374px;
      max-width: 100%;
      margin: 0 auto;
      border: 0;
      background: #fff;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 14px;
      padding: 5px 9px;
      background: #fff;
      color: #000;
      border: 1px solid #000;
      font-size: 12px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .main-title {
      margin: 0;
      font-family: 'Galmuri14', monospace;
      font-size: 34px;
      font-weight: normal;
      line-height: 1.45;
      letter-spacing: -0.5px;
    }

    .main-subtitle {
      margin: 13px 0 20px;
      color: #000;
      font-size: 14px;
      line-height: 1.65;
    }

    .main-visual {
      position: relative;
      width: 374px;
      max-width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      overflow: hidden;
      background: #fff;
    }

    .main-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;
    }

    .main-fallback {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      gap: 17px;
    }

    .main-fallback.show {
      display: flex;
    }

    .start-screen > .primary-button {
      width: min(100%, 374px);
      margin-top: 12px;
    }

    .primary-button,
    .action-button {
      width: min(100%, 430px);
      min-height: 52px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: normal;
      transition: background .18s ease, color .18s ease;
    }

    .primary-button:active,
    .action-button:active {
      background: #000;
      color: #fff;
    }

    .input-wrap {
      position: relative;
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 32px 25px 24px 25px;
      border: 1px solid #000;
      background: #fff;
    }

    .section-title {
      margin: 0;
      padding: 0 0 12px;
      border-bottom: 1px solid #000;
      font-family: 'Galmuri14', monospace;
      font-size: 25px;
      font-weight: normal;
      letter-spacing: -0.4px;
      text-align: center;
    }

    .section-desc {
      margin: 11px 0 20px;
      color: #000;
      font-size: 13px;
      text-align: center;
    }

    .input-card {
      padding: 18px 0 0;
      border: 0;
      background: #fff;
      position: relative;
    }

    .field {
      margin-bottom: 21px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      margin: 0 0 9px;
      font-size: 13px;
      font-weight: normal;
    }

    .text-input,
    .date-select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #000;
      border-radius: 0;
      outline: none;
      background: #fff;
      color: #000;
    }

    .text-input:focus,
    .date-select:focus {
      border-color: #000;
      outline: 1px solid #000;
    }

    .calendar-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #000;
    }

    .calendar-tabs label {
      position: relative;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .calendar-tabs label + label {
      border-left: 1px solid #000;
    }

    .calendar-tabs input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .calendar-tabs label.selected {
      background: #000;
      color: #fff;
      font-weight: normal;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 8px;
    }

    .leap-row {
      display: none;
      margin-top: 11px;
      color: #000;
      font-size: 13px;
      align-items: center;
      gap: 7px;
    }

    .leap-row.show {
      display: flex;
    }

    .leap-row input {
      width: 17px;
      height: 17px;
      accent-color: #000;
    }

    .input-note {
      margin: 14px 0 0;
      color: #000;
      font-size: 11px;
      line-height: 1.6;
    }

    .error-message {
      min-height: 20px;
      margin: 13px 0 4px;
      color: #000;
      font-size: 12px;
      text-align: center;
    }

    .input-wrap .primary-button {
      width: 100%;
    }

    .result-section {
      width: 100%;
    }

    .result-paper {
      width: 100%;
      border: 1px solid #000;
      background: #fff;
      padding: 0 14px 14px;
      position: relative;
    }

    .result-title {
      min-height: 50px;
      margin: 0 -14px 12px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #000;
      font-family: 'Galmuri14', monospace;
      font-size: clamp(20px, 4.8vw, 26px);
      font-weight: normal;
      letter-spacing: -0.3px;
      text-align: center;
      white-space: nowrap;
    }

    /* 결과 상단 좌우 높이 맞춤 */
    .result-top {
      display: grid;
      grid-template-columns: 36% 1fr;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 12px;
    }

    .result-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-image-box {
      width: 100%;
      height: auto;
      aspect-ratio: 374 / 502;
      border: 1px solid #000;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .result-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0;
      display: block;
    }

    .image-fallback {
      display: none;
      position: absolute;
      inset: 0;
      padding: 14px;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-family: 'Galmuri14', monospace;
      font-size: 24px;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
    }

    .image-fallback.show {
      display: flex;
    }

    .owner-box {
      border: 1px solid #000;
      background: #fff;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
    }

    .owner-label {
      display: block;
      margin-bottom: 4px;
      color: #000;
      font-size: 11px;
      font-weight: normal;
      letter-spacing: .2px;
    }

    .owner-value {
      display: block;
      color: #000;
      font-family: 'Galmuri14', monospace;
      font-size: 18px;
      font-weight: normal;
    }

    .top-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-box {
      border: 1px solid #000;
      border-radius: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fff;
      overflow: hidden;
      flex: 1;
    }

    .info-label {
      display: block;
      position: relative;
      z-index: 0;
      margin-bottom: 4px;
      padding: 0 3px;
      color: #000;
      font-size: 11px;
      font-weight: normal;
      letter-spacing: .2px;
    }

    .info-label::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -3px;
      right: -3px;
      top: -2px;
      bottom: -2px;
      height: auto;
      background: var(--highlight-main);
      transform: rotate(-1deg);
    }

    .top-info .info-box:nth-child(2) .info-label::before {
      background: var(--highlight-outer);
      transform: rotate(.7deg);
    }

    .top-info .info-box:nth-child(3) .info-label::before {
      background: var(--highlight-inner);
      transform: rotate(-.5deg);
    }

    .info-value {
      display: block;
      color: #000;
      font-size: 13px;
      font-weight: normal;
      line-height: 1.4;
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      gap: 8px;
    }

    .content-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      align-items: stretch !important;
      gap: 8px;
      margin-bottom: 8px;
    }

    .content-box {
      width: auto;
      min-height: 0 !important;
      height: auto !important;
      align-self: stretch !important;
      padding: 17px 15px;
      border: 1px solid #000;
      background: #fff;
    }

    .box-heading {
      margin: -17px -15px 16px;
      padding: 10px 8px;
      border-bottom: 1px solid #000;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: normal;
      text-align: center;
    }

    .description-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .description-list li {
      position: relative;
      margin-bottom: 15px;
      padding-left: 15px;
      font-size: 13px;
      line-height: 1.65;
    }

    .description-list li:last-child {
      margin-bottom: 0;
    }

    .description-list li::before {
      content: "■";
      position: absolute;
      left: 0;
      top: .72em;
      width: auto;
      height: auto;
      color: #000;
      background: transparent;
      font-size: 7px;
    }

    .match-box {
      min-height: 0;
      height: auto;
      padding: 10px 8px 8px;
      border: 1px solid #000;
      text-align: center;
    }

    .match-heading {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: normal;
    }

    .match-names {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .match-name {
      padding: 4px 7px;
      border: 1px solid #000;
      color: #000;
      background: #fff;
      font-size: 12px;
      font-weight: normal;
    }

    .actions {
      width: min(100%, 440px);
      margin: 18px auto 0;
      display: grid;
      gap: 9px;
    }

    .coupang-ad {
      width: 350px;
      max-width: 100%;
      min-height: 140px;
      margin: 22px auto 0;
      overflow: hidden;
      text-align: center;
    }

    .action-button {
      width: 100%;
      min-height: 50px;
    }

    .save-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 18px;
      background: rgba(0, 0, 0, .72);
      align-items: center;
      justify-content: center;
    }

    .save-modal.show {
      display: flex;
    }

    .save-modal-inner {
      width: min(78vw, 280px);
      max-height: 92vh;
      overflow: auto;
      padding: 13px;
      background: #fff;
      text-align: center;
    }

    .save-modal-inner p {
      margin: 2px 0 11px;
      font-size: 13px;
      font-weight: 600;
    }

    .save-preview {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #000;
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
      touch-action: auto;
    }

    .modal-close {
      width: 100%;
      height: 45px;
      margin-top: 10px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 1100;
      transform: translateX(-50%) translateY(20px);
      padding: 10px 15px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 메인 표지와 맞춘 고동색 책 테마 */
    #inputScreen,
    #resultScreen {
      color: var(--book-brown-deep);
    }

    .input-wrap {
      border-color: var(--book-gold);
      background: var(--book-brown);
      color: var(--book-paper);
    }

    .input-wrap::before,
    .result-paper::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid var(--book-gold);
      pointer-events: none;
    }

    .input-wrap > *,
    .result-paper > * {
      position: relative;
      z-index: 1;
    }

    .section-title {
      border-bottom-color: var(--book-gold);
      color: var(--book-gold);
    }

    .section-desc,
    .field-label,
    .input-note,
    .leap-row,
    .error-message {
      color: var(--book-paper);
    }

    .input-card {
      background: transparent;
    }

    .text-input,
    .date-select,
    .calendar-tabs {
      border-color: var(--book-gold);
      background: var(--book-paper);
      color: var(--book-brown-deep);
    }

    .calendar-tabs label + label {
      border-left-color: var(--book-gold);
    }

    .calendar-tabs label.selected {
      background: var(--book-gold);
      color: var(--book-brown-deep);
    }

    .text-input:focus,
    .date-select:focus {
      border-color: var(--book-gold);
      outline-color: var(--book-gold);
    }

    .leap-row input {
      accent-color: var(--book-gold);
    }

    .input-wrap .primary-button {
      border-color: var(--book-gold);
      background: var(--book-brown-deep);
      color: var(--book-gold);
    }

    .input-wrap .primary-button:active {
      background: var(--book-gold);
      color: var(--book-brown-deep);
    }

    .result-paper {
      border-color: var(--book-gold);
      background: var(--book-brown);
    }

    .result-title {
      border-bottom-color: var(--book-gold);
      color: var(--book-gold);
    }

    .result-image-box,
    .owner-box,
    .info-box,
    .content-box,
    .match-box {
      border-color: var(--book-gold);
      background: var(--book-paper);
      color: var(--book-brown-deep);
    }

    .image-fallback {
      background: var(--book-paper);
      color: var(--book-brown);
    }

    .owner-label,
    .owner-value,
    .info-label,
    .info-value,
    .description-list,
    .match-heading {
      color: var(--book-brown-deep);
    }

    .box-heading {
      border-bottom-color: var(--book-gold);
      background: var(--book-brown-deep);
      color: var(--book-gold);
    }

    .description-list li::before {
      color: var(--book-brown);
    }

    .match-name {
      border-color: var(--book-gold);
      background: var(--book-brown-deep);
      color: var(--book-gold);
    }

    .result-section .action-button {
      border-color: var(--book-gold);
      background: var(--book-brown);
      color: var(--book-gold);
    }

    .result-section .action-button:active {
      background: var(--book-gold);
      color: var(--book-brown-deep);
    }

    @media (max-width: 520px) {
      .start-screen {
        padding: 0;
      }
      .site-header {
        height: 54px;
        padding: 0 12px;
      }
      .logo {
        font-size: 18px;
      }
      .site-nav {
        gap: 12px;
        font-size: 14px;
      }
      .app {
        min-height: calc(100vh - 54px);
        padding: 19px 8px 42px;
      }
      .input-wrap {
        padding: 27px 14px 20px 14px;
      }
      .result-paper {
        padding: 0 9px 9px;
      }
      .result-title {
        margin: 0 -9px 9px;
        min-height: 44px;
        padding: 0 10px;
        font-size: 18px;
      }
      .result-top {
        grid-template-columns: 37% 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .result-left, .top-info {
        gap: 6px;
      }
      .owner-box, .info-box {
        padding: 8px 6px;
      }
      .owner-value {
        font-size: 16px;
      }
      .info-value {
        font-size: 11.5px;
      }
      .match-grid {
        gap: 6px;
      }
      .content-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        align-items: stretch !important;
        gap: 6px;
        margin-bottom: 6px;
      }
      .content-box {
        min-height: 0 !important;
        height: auto !important;
        align-self: stretch !important;
        padding: 14px 10px;
      }
      .box-heading {
        margin: -14px -10px 13px;
        font-size: 13px;
      }
      .description-list li {
        margin-bottom: 13px;
        padding-left: 10px;
        font-size: 11.5px;
        line-height: 1.58;
      }
      .match-box {
        min-height: 0;
        height: auto;
        padding: 9px 6px 7px;
      }
      .match-heading {
        margin-bottom: 7px;
        font-size: 12px;
      }
      .match-name {
        padding: 4px 6px;
        font-size: 10.5px;
      }
    }

    @media (max-width: 370px) {
      .site-nav {
        gap: 10px;
        font-size: 13px;
      }
      .result-title {
        font-size: 16px;
      }
      .info-value {
        font-size: 9.5px;
      }
      .content-box {
        min-height: 0 !important;
        height: auto !important;
        align-self: stretch !important;
        padding-left: 8px;
        padding-right: 8px;
      }
      .description-list li {
        font-size: 10.5px;
      }
    }

    /* 결과 화면 글자 위치와 책갈피 크기 미세 조정 */
    .input-wrap::before,
    .result-paper::before {
      display: none;
    }

    .result-title {
      font-size: clamp(14px, 3.6vw, 17px);
      letter-spacing: 1.35px;
      line-height: 1;
    }

    .result-title span {
      display: inline-block;
      transform: translateY(2px);
    }

    .box-heading span,
    .match-heading span {
      display: inline-block;
      transform: translateY(-2px);
    }

    .info-box > .info-label,
    .info-box > .info-value,
    .owner-box > .owner-label,
    .owner-box > .owner-value {
      transform: translateY(-3px);
    }

    .box-heading {
      display: flex;
      align-items: center;
      justify-content: center;

    function setCalendarType(type) {
      document.querySelectorAll('.calendar-tabs label').forEach(label => {
        label.classList.toggle('selected', label.querySelector('input').value === type);
      });
      leapRow.classList.toggle('show', type === 'lunar');
      if (type !== 'lunar') isLeapMonth.checked = false;
      errorMessage.textContent = '';
    }

    function validGregorianDate(year, month, day) {
      const date = new Date(Date.UTC(year, month - 1, day));
      return date.getUTCFullYear() === year && date.getUTCMonth() === month - 1 && date.getUTCDate() === day;
    }

    function lunarToSolar(year, month, day, leap) {
      let formatter;
      try {
        formatter = new Intl.DateTimeFormat('en-u-ca-dangi', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          timeZone: 'Asia/Seoul'
        });
      } catch (error) {
        return null;
      }

      const start = Date.UTC(year, 0, 1, 3);
      const end = Date.UTC(year + 1, 2, 10, 3);

      for (let time = start; time <= end; time += 86400000) {
        const date = new Date(time);
        const parts = formatter.formatToParts(date);
        const relatedYearPart = parts.find(part => part.type === 'relatedYear' || part.type === 'year');
        const monthPart = parts.find(part => part.type === 'month');
        const dayPart = parts.find(part => part.type === 'day');
        if (!relatedYearPart || !monthPart || !dayPart) continue;

        const lunarYear = Number(relatedYearPart.value.replace(/[^0-9]/g, ''));
        const lunarMonth = Number(monthPart.value.replace(/[^0-9]/g, ''));
        const lunarDay = Number(dayPart.value.replace(/[^0-9]/g, ''));
        const isLeap = /bis|윤/i.test(monthPart.value);

        if (lunarYear === year && lunarMonth === month && lunarDay === day && isLeap === leap) {
          return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
        }
      }
      return null;
    }

    function gregorianJdn(year, month, day) {
      const a = Math.floor((14 - month) / 12);
      const y = year + 4800 - a;
      const m = month + 12 * a - 3;
      return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    }

    function getPillarIndex(year, month, day) {
      const jdn = gregorianJdn(year, month, day);
      return ((jdn + 49) % 60 + 60) % 60;
    }

    function getStemRelationScore(currentStem, candidateStem, type) {
      const currentElement = stemElements[currentStem];
      const candidateElement = stemElements[candidateStem];
      const candidateSupportsCurrent = generatesElement[candidateElement] === currentElement;
      const currentSupportsCandidate = generatesElement[currentElement] === candidateElement;
      const candidateControlsCurrent = controlsElement[candidateElement] === currentElement;
      const currentControlsCandidate = controlsElement[currentElement] === candidateElement;
      const sameElement = currentElement === candidateElement;

      if (type === 'good') {
        if (stemPairs[currentStem].combine === candidateStem) return 100;
        if (candidateSupportsCurrent) return 80;
        if (sameElement) return 60;
        if (currentSupportsCandidate) return 40;
        if (currentControlsCandidate) return 20;
        if (candidateControlsCurrent) return 10;
        return 0;
      }

      if (stemPairs[currentStem].clash === candidateStem) return 100;
      if (candidateControlsCurrent) return 80;
      if (currentControlsCandidate) return 70;
      if (sameElement) return 50;
      if (currentSupportsCandidate) return 30;
      if (candidateSupportsCurrent) return 20;
      return 0;
    }

    function getMatches(pillarIndex, type) {
      const currentName = cycleNames[pillarIndex];
      const currentStem = currentName.slice(0, 1);
      const currentBranch = currentName.slice(1);
      const targetBranch = branchPairs[currentBranch][type];

      return cycleNames
        .filter(name => name.slice(1) === targetBranch)
        .map(name => ({
          name,
          score: getStemRelationScore(currentStem, name.slice(0, 1), type),
          order: cycleNames.indexOf(name)
        }))
        .sort((a, b) => b.score - a.score || a.order - b.order)
        .slice(0, 2)
        .map(item => item.name);
    }

    function addMatchNames(element, names) {
      element.innerHTML = names.map(name => `<span class="match-name">${name}일주</span>`).join('');
    }

    function addDescriptionItems(element, items) {
      element.innerHTML = items.map(item => `<li>${item}</li>`).join('');
    }

    function showResult(index, nickname) {
      const data = pillars[index];
      
      document.getElementById('pillarName').textContent = `${data.name}일주`;
      document.getElementById('summaryText').textContent = data.summary;
      document.getElementById('outerText').textContent = data.outer;
      document.getElementById('innerText').textContent = data.inner;
      document.getElementById('ownerLabel').textContent = `${nickname}님의 일주`;

      addDescriptionItems(document.getElementById('personalityList'), data.personality);
      addDescriptionItems(document.getElementById('relationshipList'), data.relationship);
      addMatchNames(document.getElementById('goodMatches'), getMatches(index, 'good'));
      addMatchNames(document.getElementById('distanceMatches'), getMatches(index, 'distance'));

      imageFallback.classList.remove('show');
      imageFallback.textContent = `${data.name}일주`;
      resultImage.style.display = 'block';
      resultImage.alt = `${data.name}일주 결과 이미지`;
      resultImage.src = `img_${data.name}413.png`;

      showScreen('resultScreen');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function captureResult() {
      if (!window.html2canvas) {
        showToast('저장 기능을 불러오지 못했습니다');
        return null;
      }
      const paper = document.getElementById('resultPaper');
      const scale = Math.min(4, Math.max(3, window.devicePixelRatio || 1));
      try {
        await document.fonts.ready;
        return await html2canvas(paper, {
          scale, useCORS: true, allowTaint: false, backgroundColor: '#ffffff', logging: false, imageTimeout: 15000, scrollX: 0, scrollY: -window.scrollY
        });
      } catch (error) {
        showToast('이미지 저장 중 오류가 발생했습니다');
        return null;
      }
    }

    fillDateSelects();

    document.getElementById('mainImage').addEventListener('error', event => {
      event.currentTarget.style.display = 'none';
      document.getElementById('mainFallback').classList.add('show');
    });

    resultImage.addEventListener('error', () => {
      resultImage.style.display = 'none';
      imageFallback.classList.add('show');
    });

    startButton.addEventListener('click', () => showScreen('inputScreen'));

    document.querySelectorAll('input[name="calendarType"]').forEach(input => {
      input.addEventListener('change', () => setCalendarType(input.value));
    });

    birthForm.addEventListener('submit', event => {
      event.preventDefault();
      const nickname = document.getElementById('nickname').value.trim();
      const year = Number(yearSelect.value);
      const month = Number(monthSelect.value);
      const day = Number(daySelect.value);
      const calendarType = document.querySelector('input[name="calendarType"]:checked').value;

      errorMessage.textContent = '';

      if (!nickname) {
        errorMessage.textContent = '이름 또는 닉네임을 입력해주세요';
        return;
      }
      if (!year || !month || !day) {
        errorMessage.textContent = '생년월일을 모두 선택해주세요';
        return;
      }

      let solarDate;
      if (calendarType === 'solar') {
        if (!validGregorianDate(year, month, day)) {
          errorMessage.textContent = '올바른 생년월일을 선택해주세요';
          return;
        }
        solarDate = { year, month, day };
        const selected = Date.UTC(year, month - 1, day);
        const today = new Date();
        const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
        if (selected > todayUtc) {
          errorMessage.textContent = '오늘보다 이전 날짜를 선택해주세요';
          return;
        }
      } else {
        solarDate = lunarToSolar(year, month, day, isLeapMonth.checked);
        if (!solarDate) {
          errorMessage.textContent = '음력 날짜와 윤달 여부를 다시 확인해주세요';
          return;
        }
      }

      const pillarIndex = getPillarIndex(solarDate.year, solarDate.month, solarDate.day);
      showScreen('loadingScreen');
      loadingBarFill.classList.remove('run');
      void loadingBarFill.offsetWidth;
      loadingBarFill.classList.add('run');

      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(() => {
        loadingBarFill.classList.remove('run');
        showResult(pillarIndex, nickname);
      }, 3000);
    });

    document.getElementById('saveButton').addEventListener('click', async () => {
      const button = document.getElementById('saveButton');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '이미지 만드는 중...';
      const canvas = await captureResult();
      button.disabled = false;
      button.textContent = originalText;
      if (!canvas) return;
      const dataUrl = canvas.toDataURL('image/png', 1);
      document.getElementById('savePreview').src = dataUrl;
      document.getElementById('saveModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('saveModal').classList.remove('show');
      document.body.style.overflow = '';
    });

    document.getElementById('saveModal').addEventListener('click', event => {
      if (event.target.id === 'saveModal') {
        document.getElementById('saveModal').classList.remove('show');
        document.body.style.overflow = '';
      }
    });

    document.getElementById('retryButton').addEventListener('click', () => {
      errorMessage.textContent = '';
      showScreen('startScreen');
    });

    document.getElementById('otherButton').addEventListener('click', () => {
      location.href = 'https://test-it.co.kr/';
    });

    document.getElementById('shareButton').addEventListener('click', async () => {
      const shareData = { title: '테스트잇 사주 책갈피 성격 테스트', text: '나의 일주와 성격 유형을 확인해보세요', url: TEST_URL };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(TEST_URL);
          showToast('링크가 복사되었습니다');
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = TEST_URL;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
          showToast('링크가 복사되었습니다');
        }
      } catch (error) {
        if (error.name !== 'AbortError') showToast('공유하지 못했습니다');
      }
    });
  </script>
</body>
